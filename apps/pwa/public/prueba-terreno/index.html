<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Prueba de terreno · Pizarra</title>
<style>
/* Tokens de Pizarra (valores finales del jurado) y del control grafito medio.
   Del control, solo fondo, tarjeta y textos vienen de estilo24h.py (iv-c);
   borde y acento son supuestos de esta página. */
[data-v="dia"]{--bg:#F2F1EC;--s1:#FFFFFF;--bd:#D4D3CF;--t1:#1D1D1C;--t2:#4E4D4A;--t3:#6A6966;--ac:#2A6BA6;--onac:#FFFFFF;--wa:#F2B400;--onwa:#1D1D1C;--fa:#B1272D;--onfa:#FFFFFF}
[data-v="pen"]{--bg:#171614;--s1:#222120;--bd:#3E3D3A;--t1:#E8E2D7;--t2:#BDB6AA;--t3:#A8A195;--ac:#7DB4EE;--onac:#171614;--wa:#F2B400;--onwa:#171614;--fa:#B1272D;--onfa:#E8E2D7}
[data-v="ctl"]{--bg:#8A857D;--s1:#9A958C;--bd:#6B675F;--t1:#161513;--t2:#23211E;--t3:#3A3732;--ac:#0E2B4A;--onac:#FFFFFF;--wa:#F2B400;--onwa:#161513;--fa:#B1272D;--onfa:#FFFFFF}

:root{--f-sys:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  /* cuatro cuerpos */
  --fs1:28px;--fs2:17px;--fs3:15px;--fs4:13px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#F2F1EC}
#app{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--t1);
  font:400 var(--fs2)/1.4 var(--f-sys);-webkit-font-smoothing:antialiased;text-align:left}
#app.deut{filter:url(#deut)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:var(--fs1);font-weight:600;line-height:1.15;margin:8px 0 8px}
h2{font-size:var(--fs2);font-weight:600;margin:28px 0 8px}
p{margin:0 0 12px}
.sub{font-size:var(--fs4);color:var(--t2);margin:0 0 12px;line-height:1.4}
.meta{font-size:var(--fs4);color:var(--t3)}
.t2{color:var(--t2)}
b{font-weight:600}

/* controles */
button,input{font-family:var(--f-sys)}
.btn,.btn-t,.opt{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;width:100%;
  border-radius:999px;font:600 var(--fs2) var(--f-sys);cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0 16px}
.btn{border:0;background:var(--ac);color:var(--onac)}
.btn-t{border:1px solid var(--bd);background:var(--s1);color:var(--ac)}
.opt{border:1px solid var(--bd);background:var(--s1);color:var(--t1);font-weight:400}
.opt[aria-pressed="true"]{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.stack>*+*{margin-top:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lb{display:block;font-size:var(--fs4);font-weight:600;color:var(--t2);margin:20px 4px 8px}
.in{display:block;width:100%;min-height:56px;border-radius:999px;border:1px solid var(--bd);background:var(--s1);
  color:var(--t1);font-size:var(--fs2);padding:0 20px}
.in::placeholder{color:var(--t3)}
.in.big{min-height:64px;font:600 var(--fs1) var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0;padding:0 20px}
.err{font-size:var(--fs3);font-weight:600;margin:12px 4px 0}

/* grupo de filas, como Pizarra */
.grp{background:var(--s1);border:1px solid var(--bd);border-radius:26px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 20px}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:20px;border-top:1px solid var(--bd)}
.row .rx{flex:1;min-width:0}
.row .k{font-size:var(--fs4);color:var(--t2);line-height:1.3}
.row .v{font-size:var(--fs2);color:var(--t1);line-height:1.25}
.code{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}

/* estados: reposo sin color; aviso y falla en relleno */
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:var(--fs4);font-weight:600;white-space:nowrap;flex:none}
.st svg{width:16px;height:16px;flex:none}
.st.fa{background:var(--fa);color:var(--onfa);padding:5px 12px 5px 9px}
.st.wa{background:var(--wa);color:var(--onwa);padding:5px 12px 5px 9px}
.st.ok{color:var(--t2);font-weight:400;padding:5px 0}
.st.nt{padding:5px 12px}

.prog{height:6px;border-radius:999px;background:var(--s1);border:1px solid var(--bd);overflow:hidden;margin:4px 0 16px}
.prog i{display:block;height:100%;background:var(--ac)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.head .meta{white-space:nowrap}

/* lectura */
.codebox{padding:20px;min-height:72px;display:flex;align-items:center;font-size:var(--fs3)}
.codebox .code{font-size:var(--fs3)}

/* estados */
.stage{min-height:96px;padding:20px;display:flex;align-items:center}
.stage .wait{font-size:var(--fs3);color:var(--t3)}

/* tabla de resultados */
.tw{background:var(--s1);border:1px solid var(--bd);border-radius:26px;overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:var(--fs3)}
th{font-size:var(--fs4);font-weight:600;color:var(--t2);text-align:left;background:var(--bg);padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:bottom}
td{padding:12px 8px;vertical-align:top;border-top:1px solid var(--bd);line-height:1.3}
tr:first-child td{border-top:0}
th:first-child,td:first-child{padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
td small{display:block;font-size:var(--fs4);color:var(--t2);margin-top:2px}
.sin{font-weight:600}
.aviso-m{font-size:var(--fs3);margin:16px 4px 0}

/* muestras */
.mu{background:var(--bg);color:var(--t1);padding:20px 16px 28px}
.mu+.mu{border-top:1px solid var(--bd)}
.mu h2{margin-top:0}
.mu .grp+.grp{margin-top:20px}

#svgdeut{position:absolute;width:0;height:0;overflow:hidden}
</style>
</head>
<body>
<svg id="svgdeut" aria-hidden="true" focusable="false">
  <!-- Deuteranopia, Machado 2009, severidad 1,0 (matriz en RGB lineal) -->
  <filter id="deut" color-interpolation-filters="linearRGB">
    <feColorMatrix type="matrix" values="0.367322 0.860646 -0.227968 0 0  0.280085 0.672501 0.047413 0 0  -0.011820 0.042940 0.968881 0 0  0 0 0 1 0"/>
  </filter>
</svg>
<div id="app" data-v="dia"><main class="wrap" id="main"></main></div>

<script>
(function(){
'use strict';

var NOMBRE={dia:'Pizarra Día',pen:'Pizarra Penumbra',ctl:'Control grafito medio'};
var FIJO=['dia','pen','ctl'];
var LUGARES=['Línea','Sala tenue','Camioneta noche','Otro'];
var N_COD=20,N_EST=12,T_MOSTRAR=1000,T_VENTANA=4500,T_PAUSA=600;
var LET='ABCDEFGHJKMNPRTUVWXY';
var LS_KEY='pt_pizarra_corridas_v1';
var MAX_ERR=1,MAX_CONF=0;

var ICO={
  ok:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M5.2 8.2l2 2 3.6-4"/></svg>',
  wa:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.2l6 10.6H2z"/><path d="M8 6.6v3M8 11.6v.1"/></svg>',
  fa:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4"/></svg>'
};

/* ---------- utilidades ---------- */
function mkRng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){for(var i=arr.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var x=arr[i];arr[i]=arr[j];arr[j]=x}return arr}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function fechaTxt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function seg(ms){return Math.round(ms/1000)+' s'}
function norm(s){return String(s).replace(/\s+/g,'').toUpperCase()}

function codigos(r){
  var out=[],i,k;
  for(i=0;i<14;i++){var c=String(1+Math.floor(r()*9));for(k=0;k<9;k++)c+=Math.floor(r()*10);out.push(c)}
  for(i=0;i<6;i++){
    var nL=2+Math.floor(r()*4),ch=[];
    for(k=0;k<nL;k++)ch.push(LET.charAt(Math.floor(r()*LET.length)));
    for(k=0;k<8-nL;k++)ch.push(String(Math.floor(r()*10)));
    out.push(shuffle(ch,r).join(''));
  }
  return shuffle(out,r);
}
function estados(r){
  var a=[],i;
  for(i=0;i<N_EST/3;i++){a.push('ok');a.push('wa');a.push('fa')}
  shuffle(a,r);
  var tags=[];
  return a.map(function(e){var t;do{t=1+Math.floor(r()*99)}while(tags.indexOf(t)>=0);tags.push(t);return {e:e,tag:'Equipo '+pad(t)}});
}

/* ---------- almacenamiento ---------- */
var memoria=[],storageOk=true;
function cargar(){
  try{var s=localStorage.getItem(LS_KEY);var a=s?JSON.parse(s):[];return Array.isArray(a)?a:[]}
  catch(e){storageOk=false;return memoria.slice()}
}
function guardarTodo(a){
  memoria=a.slice();
  try{localStorage.setItem(LS_KEY,JSON.stringify(a));return true}
  catch(e){storageOk=false;return false}
}

/* ---------- estado ---------- */
var S;
function nuevo(){
  var q=new URLSearchParams(location.search),sd=parseInt(q.get('seed'),10);
  var seed=isFinite(sd)?sd:(Date.now()%2147483647);
  var r=mkRng(seed);
  var orden=shuffle(FIJO.slice(),r);
  return {screen:'inicio',datos:{tec:'',lugar:'',lux:'',guante:''},deut:S?S.deut:false,seed:seed,orden:orden,
    vi:0,res:{},msg:'',aviso:'',guardada:null,lec:null,est:null,fecha:null};
}
S=nuevo();
var $app=document.getElementById('app'),$main=document.getElementById('main');
var timers=[];
function limpiar(){timers.forEach(clearTimeout);timers=[]}
function later(fn,ms){var t=setTimeout(fn,ms);timers.push(t);return t}

function render(){
  limpiar();
  var enTest=S.screen==='intro'||S.screen==='lectura'||S.screen==='estados';
  var tema=(enTest||S.screen==='fin_variante')?S.orden[S.vi]:'dia';
  $app.setAttribute('data-v',tema);
  $app.classList.toggle('deut',S.deut);
  var fn={inicio:vInicio,intro:vIntro,lectura:vLectura,estados:vEstados,muestras:vMuestras,resultados:vResultados}[S.screen];
  $main.innerHTML=fn();
  window.scrollTo(0,0);
  var after={lectura:aLectura,estados:aEstados}[S.screen];
  if(after)after();
}
function go(s){S.screen=s;render()}

/* ---------- componentes ---------- */
function btnDeut(){
  return '<button class="btn-t" type="button" data-act="deut" aria-pressed="'+S.deut+'">Simular deuteranopia: '+(S.deut?'activada':'apagada')+'</button>';
}
function pill(e,txt){
  if(e==='ok')return '<span class="st ok">'+ICO.ok+'Normal</span>';
  if(e==='wa')return '<span class="st wa">'+ICO.wa+(txt||'Aviso')+'</span>';
  return '<span class="st fa">'+ICO.fa+(txt||'Falla')+'</span>';
}
function opts(name,vals,cur){
  return vals.map(function(v){return '<button type="button" class="opt" data-act="'+name+'" data-val="'+esc(v)+'" aria-pressed="'+(cur===v)+'">'+esc(v)+'</button>'}).join('');
}

/* ---------- pantallas ---------- */
function vInicio(){
  var d=S.datos,n=cargar().length;
  return '<h1>Prueba de terreno</h1>'+
  '<p class="sub">Unos 20 minutos. Tres variantes de pantalla en orden al azar; cada una tiene una tarea de lectura y una de estados. Sin conexión no hace falta.</p>'+
  '<label class="lb" for="tec">Técnico (iniciales, opcional)</label>'+
  '<input class="in" id="tec" maxlength="6" autocomplete="off" autocapitalize="characters" value="'+esc(d.tec)+'">'+
  '<div class="lb" id="lbl-lugar">Lugar</div>'+
  '<div class="g2" role="group" aria-labelledby="lbl-lugar">'+opts('lugar',LUGARES,d.lugar)+'</div>'+
  '<label class="lb" for="lux">Lux medido (opcional)</label>'+
  '<input class="in" id="lux" type="number" inputmode="decimal" min="0" step="any" value="'+esc(d.lux)+'">'+
  '<p class="sub" style="margin:8px 4px 0">Léelo en la app del luxómetro, con el celular donde se usará.</p>'+
  '<div class="lb" id="lbl-gu">Con guantes</div>'+
  '<div class="g2" role="group" aria-labelledby="lbl-gu">'+opts('guante',['Sí','No'],d.guante)+'</div>'+
  (S.aviso?'<p class="err" role="alert">'+esc(S.aviso)+'</p>':'')+
  '<div class="stack" style="margin-top:24px">'+
    '<button class="btn" type="button" data-act="empezar">Empezar la prueba</button>'+
    '<button class="btn-t" type="button" data-act="muestras">Ver las muestras</button>'+
    btnDeut()+
  '</div>'+
  '<p class="sub" style="margin-top:24px"><b>Aprueba</b> con '+MAX_ERR+' error o menos en '+N_COD+' códigos y '+MAX_CONF+' confusiones entre aviso y falla. Segunda pasada: activar la deuteranopia y repetir.</p>'+
  '<p class="sub">Corridas guardadas en este celular: <b class="num">'+n+'</b>'+(storageOk?'':'. Este navegador no deja guardar: se pierden al cerrar.')+'</p>'+
  (n?'<div class="g2"><button class="btn-t" type="button" data-act="csvtodo">Descargar CSV</button><button class="btn-t" type="button" data-act="borrar">Borrar corridas</button></div>':'')+
  (S.msg?'<p class="sub" role="status" style="margin-top:12px">'+esc(S.msg)+'</p>':'');
}

function vIntro(){
  var n=S.vi+1;
  return '<p class="meta">Variante '+n+' de 3</p>'+
  '<h1>Tarea de lectura</h1>'+
  '<p>Verás '+N_COD+' códigos, uno por vez. Escribe lo que lees y toca Siguiente. Si dudas, escribe lo que te parezca.</p>'+
  '<p class="sub">Mantén el celular a 35 o 40 cm. El tiempo corre desde que empiezas.</p>'+
  '<div class="stack" style="margin-top:24px"><button class="btn" type="button" data-act="ini_lectura">Empezar lectura</button>'+btnDeut()+'</div>';
}

function vLectura(){
  var L=S.lec,i=L.i,c=L.codes[i],tipo=/[A-Z]/.test(c)?'text':'numeric';
  return '<div class="head"><h1 style="margin:0">Código '+(i+1)+'</h1><span class="meta num">'+(i+1)+' de '+N_COD+'</span></div>'+
  '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="'+N_COD+'" aria-valuenow="'+i+'"><i style="width:'+(i/N_COD*100)+'%"></i></div>'+
  '<div class="grp codebox"><span class="code" id="cod" aria-label="código">'+esc(c)+'</span></div>'+
  '<form id="fl" autocomplete="off" class="stack" style="margin-top:16px">'+
    '<input class="in big" id="resp" name="r" inputmode="'+tipo+'" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-label="Escribe el código que lees">'+
    '<button class="btn" type="submit">'+(i===N_COD-1?'Terminar':'Siguiente')+'</button>'+
  '</form>';
}
function aLectura(){
  var f=document.getElementById('fl'),inp=document.getElementById('resp');
  inp.focus();
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    var L=S.lec,now=performance.now(),c=L.codes[L.i],r=inp.value;
    L.det.push({c:c,r:r,ok:norm(r)===norm(c),ms:Math.round(now-L.tPrev)});
    L.tPrev=now;L.i++;
    if(L.i>=N_COD){
      L.ms=Math.round(now-L.t0);
      go_estados_intro();
    }else render();
  });
}

function go_estados_intro(){S.screen='estados';S.est={fase:'intro'};render()}

function vEstados(){
  var E=S.est;
  if(E.fase==='intro'){
    return '<p class="meta">Variante '+(S.vi+1)+' de 3</p>'+
    '<h1>Tarea de estados</h1>'+
    '<p>Aparecerán '+N_EST+' indicadores, cada uno durante 1 segundo. Toca <b>Normal</b>, <b>Aviso</b> o <b>Falla</b> según lo que viste.</p>'+
    '<p class="sub">Si no alcanzas a verlo, toca igual lo que creas. Si no tocas nada, se cuenta como omisión.</p>'+
    '<div class="stack" style="margin-top:24px"><button class="btn" type="button" data-act="ini_estados">Empezar estados</button>'+btnDeut()+'</div>';
  }
  return '<div class="head"><h1 style="margin:0">Indicador <span class="num" id="ei">'+(E.i+1)+'</span></h1><span class="meta num">de '+N_EST+'</span></div>'+
  '<div class="prog"><i id="ep" style="width:'+(E.i/N_EST*100)+'%"></i></div>'+
  '<div class="grp stage" id="stage"><span class="wait">Atento al indicador</span></div>'+
  '<div class="g3" style="margin-top:16px">'+
    ['ok:Normal','wa:Aviso','fa:Falla'].map(function(x){var p=x.split(':');return '<button type="button" class="opt" style="font-weight:600;padding:0 4px;min-height:56px" data-act="resp" data-val="'+p[0]+'">'+p[1]+'</button>'}).join('')+
  '</div>';
}
function aEstados(){
  if(S.est.fase==='intro')return;
  later(mostrar,1000);
}
function mostrar(){
  var E=S.est;
  if(E.i>=N_EST){fin_estados();return}
  var it=E.items[E.i],st=document.getElementById('stage');
  if(!st)return;
  E.vivo=true;E.t0=performance.now();E.resp=null;
  st.innerHTML='<span data-estado="'+it.e+'">'+(it.e==='ok'?pill('ok'):'<span class="st '+it.e+' nt">'+esc(it.tag)+'</span>')+'</span>';
  document.getElementById('ei').textContent=E.i+1;
  document.getElementById('ep').style.width=(E.i/N_EST*100)+'%';
  later(function(){
    var s=document.getElementById('stage');
    if(s&&E.vivo)s.innerHTML='<span class="wait">Elige lo que viste</span>';
  },T_MOSTRAR);
  later(function(){cerrar(null)},T_VENTANA);
}
function cerrar(resp){
  var E=S.est;
  if(!E.vivo)return;
  E.vivo=false;
  var it=E.items[E.i];
  E.det.push({e:it.e,r:resp,rt:resp?Math.round(performance.now()-E.t0):null});
  limpiar();
  var st=document.getElementById('stage');
  if(st)st.innerHTML='<span class="wait">Atento al indicador</span>';
  E.i++;
  later(mostrar,T_PAUSA);
}
function fin_estados(){
  var L=S.lec,E=S.est,k=S.orden[S.vi],conf=0,omis=0,otros=0;
  E.det.forEach(function(d){
    if(d.r===null)omis++;
    else if(d.r!==d.e){
      if((d.e==='wa'&&d.r==='fa')||(d.e==='fa'&&d.r==='wa'))conf++;else otros++;
    }
  });
  var err=L.det.filter(function(d){return !d.ok}).length;
  S.res[k]={k:k,pos:S.vi+1,deut:L.deut,err:err,total:N_COD,ms:L.ms,conf:conf,omis:omis,otros:otros,
    aprueba:err<=MAX_ERR&&conf<=MAX_CONF,lec:L.det,est:E.det};
  S.lec=null;S.est=null;
  S.vi++;
  if(S.vi>=3){finalizar()}else{S.screen='intro';render()}
}

function finalizar(){
  var corrida={id:S.seed+'-'+Date.now(),fecha:fechaTxt(new Date()),datos:S.datos,orden:S.orden,seed:S.seed,res:S.res};
  var a=cargar();a.push(corrida);
  S.guardada=guardarTodo(a);
  S.screen='resultados';render();
}

/* ---------- muestras ---------- */
function muestra(k){
  var mq=[['Baader 142','ok'],['Baader 200','wa'],['Grader MS4/12','ok'],['Marel A600 HG','fa'],['GEA PowerPak','ok']];
  return '<section class="mu" data-v="'+k+'" aria-label="Muestra '+esc(NOMBRE[k])+'">'+
  '<h2>'+esc(NOMBRE[k])+'</h2>'+
  '<div class="grp">'+
    '<div class="row"><div class="rx"><div class="k">Código B5</div><div class="v code">42303109</div></div></div>'+
    '<div class="row"><div class="rx"><div class="k">Código SAP</div><div class="v code">3300012350</div></div></div>'+
    '<div class="row"><div class="rx"><div class="k">Bodega</div><div class="v">C-3</div></div></div>'+
  '</div>'+
  '<p class="sub" style="margin:20px 4px 8px">1 en falla · 1 en aviso · 3 normales</p>'+
  '<div class="grp">'+mq.map(function(m){return '<div class="row"><div class="rx"><div class="v">'+esc(m[0])+'</div></div>'+pill(m[1])+'</div>'}).join('')+'</div>'+
  '</section>';
}
function vMuestras(){
  return '<h1>Muestras</h1>'+
  '<p class="sub">Ficha de repuesto y lista de estado de las tres variantes. Los estados de las máquinas son de ejemplo, no son datos de planta.</p>'+
  '<div class="stack"><button class="btn" type="button" data-act="volver">Volver</button>'+btnDeut()+'</div>'+
  '<div style="margin:24px -16px 0">'+FIJO.map(muestra).join('')+'</div>'+
  '<div class="stack" style="margin-top:24px"><button class="btn-t" type="button" data-act="volver">Volver</button></div>';
}

/* ---------- resultados ---------- */
function fila(k,R){
  var r=R[k];
  if(!r)return '<tr><td>'+esc(NOMBRE[k])+'<small>sin datos</small></td><td colspan="3" class="meta">No se corrió</td></tr>';
  return '<tr><td><span class="sin">'+esc(NOMBRE[k])+'</span><small>Orden '+r.pos+(r.deut?' · deuteranopia':'')+'</small>'+
    '<small>'+(r.aprueba?'<span class="st ok" style="padding:2px 0;color:var(--t1);font-weight:600">'+ICO.ok+'Aprueba</span>':'<span class="st fa nt" style="margin-top:4px">No aprueba</span>')+'</small></td>'+
    '<td class="num"><span class="sin">'+r.err+'</span> de '+r.total+'</td>'+
    '<td class="num">'+seg(r.ms)+'</td>'+
    '<td class="num"><span class="sin">'+r.conf+'</span><small>omisiones '+r.omis+'</small><small>otros '+r.otros+'</small></td></tr>';
}
function modeloAviso(c){
  var r=c.res.ctl;
  if(!r||!r.aprueba||c.datos.lugar!=='Línea')return '';
  var lux=parseFloat(c.datos.lux);
  var extra=(isFinite(lux)&&lux<500)?' El lux medido ('+lux+') está bajo 500: confirma que de verdad era la línea.':'';
  return 'El control (grafito medio) aprobó en la Línea: el modelo está equivocado: revisar.'+extra;
}
function vResultados(){
  var c=cur(),a=modeloAviso(c);
  return '<h1>Resultados</h1>'+
  '<p class="sub">'+esc(resumenDatos(c))+'</p>'+
  '<div class="tw"><table><thead><tr><th>Variante</th><th>Lectura</th><th>Tiempo</th><th>Aviso↔falla</th></tr></thead><tbody>'+FIJO.map(function(k){return fila(k,c.res)}).join('')+'</tbody></table></div>'+
  '<p class="sub" style="margin:12px 4px 0">Criterio: '+MAX_ERR+' error o menos en '+N_COD+' códigos y '+MAX_CONF+' confusiones entre aviso y falla.</p>'+
  (a?'<p class="aviso-m"><b>Revisar el modelo.</b> '+esc(a)+'</p>':'')+
  '<div class="stack" style="margin-top:24px">'+
    '<button class="btn" type="button" data-act="copiar">Copiar resultados</button>'+
    '<button class="btn-t" type="button" data-act="csvtodo">Descargar CSV</button>'+
    '<button class="btn-t" type="button" data-act="muestras">Ver las muestras</button>'+
    btnDeut()+
    '<button class="btn-t" type="button" data-act="nueva">Nueva corrida</button>'+
  '</div>'+
  '<p class="sub" role="status" style="margin-top:16px">'+esc(S.msg||(S.guardada===false?'No se pudo guardar en este navegador. Copia los resultados ahora.':'Corrida guardada en este celular.'))+'</p>';
}
function cur(){return {fecha:S.fecha||fechaTxt(new Date()),datos:S.datos,orden:S.orden,seed:S.seed,res:S.res}}
function resumenDatos(c){
  var d=c.datos;
  return 'Técnico '+(d.tec||'sin iniciales')+' · '+d.lugar+' · '+(d.lux!==''?d.lux+' lux':'lux sin medir')+' · guantes: '+d.guante.toLowerCase();
}

/* ---------- texto y CSV ---------- */
function textoCorrida(c){
  var l=['Prueba de terreno Pizarra · '+c.fecha,resumenDatos(c),'Orden: '+c.orden.map(function(k){return NOMBRE[k]}).join(', ')];
  FIJO.forEach(function(k){
    var r=c.res[k];
    if(!r){l.push(NOMBRE[k]+': sin datos');return}
    l.push(NOMBRE[k]+': lectura '+r.err+' errores de '+r.total+' en '+seg(r.ms)+'; aviso↔falla '+r.conf+'; omisiones '+r.omis+'; otros errores '+r.otros+(r.deut?'; con deuteranopia':'')+' -> '+(r.aprueba?'aprueba':'no aprueba'));
  });
  l.push('Criterio: '+MAX_ERR+' error o menos en '+N_COD+' y '+MAX_CONF+' confusiones aviso↔falla.');
  var a=modeloAviso(c);if(a)l.push('Revisar el modelo: '+a);
  return l.join('\n');
}
function csvDe(arr){
  var h=['fecha','tecnico','lugar','lux','guante','orden_corrida','variante','posicion','deuteranopia','errores_lectura','codigos','tiempo_lectura_ms','confusiones_aviso_falla','omisiones','otros_errores_estados','aprueba','semilla'];
  var rows=[h];
  arr.forEach(function(c){
    FIJO.forEach(function(k){
      var r=c.res[k];if(!r)return;
      rows.push([c.fecha,c.datos.tec,c.datos.lugar,c.datos.lux,c.datos.guante,c.orden.map(function(x){return NOMBRE[x]}).join(' > '),NOMBRE[k],r.pos,r.deut?'si':'no',r.err,r.total,r.ms,r.conf,r.omis,r.otros,r.aprueba?'si':'no',c.seed]);
    });
  });
  return '﻿'+rows.map(function(r){return r.map(function(v){v=String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')}).join('\r\n');
}
function descargar(arr){
  var blob=new Blob([csvDe(arr)],{type:'text/csv;charset=utf-8'});
  var u=URL.createObjectURL(blob),a=document.createElement('a'),d=new Date();
  a.href=u;a.download='prueba-terreno-pizarra-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+'.csv';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},4000);
}
function copiar(txt,ok){
  function fb(){
    var t=document.createElement('textarea');t.value=txt;t.setAttribute('readonly','');t.style.cssText='position:absolute;left:-9999px;top:0';
    document.body.appendChild(t);t.select();var r=false;try{r=document.execCommand('copy')}catch(e){}t.remove();ok(r);
  }
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){ok(true)},fb)}else fb();
}
function setMsg(m){
  S.msg=m;
  var el=document.querySelector('[role="status"]');
  if(el)el.textContent=m;else render();
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),val=b.getAttribute('data-val');
  if(act==='deut'){S.deut=!S.deut;$app.classList.toggle('deut',S.deut);b.setAttribute('aria-pressed',S.deut);b.textContent='Simular deuteranopia: '+(S.deut?'activada':'apagada');return}
  if(act==='lugar'||act==='guante'){leerCampos();S.datos[act]=val;S.aviso='';render();return}
  if(act==='empezar'){
    leerCampos();
    if(!S.datos.lugar||!S.datos.guante){S.aviso='Falta elegir el lugar y si usas guantes.';render();return}
    if(S.datos.lux!==''&&!(parseFloat(S.datos.lux)>=0)){S.aviso='El lux debe ser un número, o déjalo vacío.';render();return}
    S.aviso='';S.msg='';S.fecha=fechaTxt(new Date());S.vi=0;S.res={};go('intro');return;
  }
  if(act==='muestras'){S.volver=S.screen;go('muestras');return}
  if(act==='volver'){go(S.volver||'inicio');return}
  if(act==='ini_lectura'){
    var r=mkRng(S.seed+(S.vi+1)*7919),now=performance.now();
    S.lec={codes:codigos(r),i:0,det:[],t0:now,tPrev:now,deut:S.deut};
    S.screen='lectura';render();return;
  }
  if(act==='ini_estados'){
    var r2=mkRng(S.seed+(S.vi+1)*104729);
    S.est={fase:'corre',items:estados(r2),i:0,det:[],vivo:false,t0:0,resp:null};
    render();return;
  }
  if(act==='resp'){
    if(S.screen==='estados'&&S.est&&S.est.vivo)cerrar(val);
    return;
  }
  if(act==='copiar'){copiar(textoCorrida(cur()),function(ok){setMsg(ok?'Resultados copiados.':'No se pudo copiar. Mantén pulsado el texto de arriba para copiarlo a mano.')});return}
  if(act==='csvtodo'){
    var arr=cargar();
    if(S.screen==='resultados'&&S.guardada===false)arr=arr.concat([cur()]);
    if(!arr.length){setMsg('No hay corridas para descargar.');return}
    descargar(arr);setMsg('CSV descargado, '+arr.length+' corrida'+(arr.length===1?'':'s')+'.');return;
  }
  if(act==='borrar'){
    if(window.confirm('Se borran todas las corridas guardadas en este celular. ¿Seguir?')){guardarTodo([]);S.msg='Corridas borradas.';render()}
    return;
  }
  if(act==='nueva'){S=nuevo();go('inicio');return}
});
function leerCampos(){
  var t=document.getElementById('tec'),l=document.getElementById('lux');
  if(t)S.datos.tec=t.value.trim().toUpperCase();
  if(l)S.datos.lux=l.value.trim();
}

render();
})();
</script>
</body>
</html>
