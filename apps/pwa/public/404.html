<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mantenimiento Industrial</title>
  <script>
    // SPA redirect para GitHub Pages
    // Guarda la URL completa (path + search + hash) en sessionStorage
    // para que index.html la restaure antes de que React monte.
    var base = '/mantenimiento-planta';
    var fullPath = window.location.pathname + window.location.search + window.location.hash;
    if (window.location.pathname !== base && window.location.pathname !== base + '/') {
      sessionStorage.setItem('spa-redirect', fullPath);
    }
    window.location.replace(base + '/');
  </script>
</head>
<body>
  Redirigiendo...
</body>
</html>
