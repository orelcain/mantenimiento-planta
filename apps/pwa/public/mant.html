<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Repuestos · Antarfood</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:      var(--tg-theme-bg-color,#17212b);
  --bg2:     var(--tg-theme-secondary-bg-color,#232e3c);
  --text:    var(--tg-theme-text-color,#f5f5f5);
  --hint:    var(--tg-theme-hint-color,#7d8b99);
  --accent:  var(--tg-theme-button-color,#5288c1);
  --acctxt:  var(--tg-theme-button-text-color,#ffffff);
  --link:    var(--tg-theme-link-color,#6ab3f3);
  --danger:  #e53935;
  --green:   #4fae4e;
  --warn:    #f5a623;
  --divider: rgba(255,255,255,.07);
  --hover:   rgba(255,255,255,.04);
  --press:   rgba(255,255,255,.08);
  --vh:      100dvh;
  /* aliases usados en HTML generado por JS */
  --border:  var(--divider);
  --card:    var(--bg2);
  --sub:     var(--hint);
}

html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.4;overflow:hidden;overscroll-behavior:none}

#app{display:flex;flex-direction:column;height:var(--vh);width:100%;overflow:hidden}

/* ── Header ─────────────────────────────────────────────────────────── */
.app-header{height:54px;min-height:54px;display:flex;align-items:center;
  padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--divider);
  flex-shrink:0;gap:6px}
.app-header .back-btn{width:40px;height:40px;border-radius:50%;border:none;
  background:transparent;color:var(--text);font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.app-header .back-btn:active{background:var(--press)}
.app-header .title-block{flex:1;min-width:0;padding:0 6px}
.app-header .title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.app-header .subtitle{font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.app-header .status{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;
  padding:3px 9px;border-radius:99px;flex-shrink:0;margin-right:6px}
.app-header .status::before{content:'';width:6px;height:6px;border-radius:50%}
.s-ok{background:rgba(79,174,78,.15);color:var(--green)}
.s-ok::before{background:var(--green)}
.s-err{background:rgba(229,57,53,.15);color:var(--danger)}
.s-err::before{background:var(--danger)}
.s-loading{background:rgba(125,139,153,.12);color:var(--hint)}
.s-loading::before{background:var(--hint);animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

/* ── Content ────────────────────────────────────────────────────────── */
#content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{display:none;min-height:100%;padding-bottom:24px}
.view.active{display:block}
#view-home{padding-top:2px}

/* ── Bottom nav ─────────────────────────────────────────────────────── */
.bottom-nav{height:58px;min-height:58px;display:flex;background:var(--bg2);
  border-top:1px solid var(--divider);flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;color:var(--hint);font-size:11px;font-weight:500;
  cursor:pointer;transition:color .15s;position:relative;padding:0}
.nav-btn .icon{font-size:22px;line-height:1}
.nav-btn.active{color:var(--accent)}

/* ── Loading ────────────────────────────────────────────────────────── */
#loading{position:fixed;inset:0;background:var(--bg);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.loader{width:32px;height:32px;border:3px solid rgba(255,255,255,.1);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-msg{color:var(--hint);font-size:14px;padding:0 24px;text-align:center;max-width:340px}
#loading-retry{display:none;margin-top:10px;padding:10px 22px;background:var(--accent);
  color:var(--acctxt);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}

/* ── Search bar ─────────────────────────────────────────────────────── */
.search-bar{padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--divider)}
.search-wrap{position:relative}
.search-input{width:100%;height:38px;padding:0 36px 0 36px;background:var(--bg2);
  border:1px solid transparent;border-radius:10px;color:var(--text);
  font-size:15px;outline:none;transition:border-color .15s}
.search-input::placeholder{color:var(--hint)}
.search-input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:15px;pointer-events:none;color:var(--hint)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:none;background:rgba(255,255,255,.08);color:var(--hint);font-size:14px;
  cursor:pointer;width:22px;height:22px;border-radius:50%;
  display:none;align-items:center;justify-content:center;padding:0;line-height:1}
.search-clear.show{display:flex}
mark{background:rgba(var(--accent-rgb,82,136,193),.25);color:inherit;border-radius:2px;padding:0 1px}

/* ── Section header ─────────────────────────────────────────────────── */
.section{padding:16px 16px 6px;display:flex;align-items:center;justify-content:space-between}
.section-title{font-size:13px;font-weight:600;color:var(--hint);
  text-transform:uppercase;letter-spacing:.5px}
.section-count{font-size:12px;color:var(--hint);font-weight:500}

/* ── Cell (Telegram-style list row) ─────────────────────────────────── */
.cell{display:flex;align-items:center;padding:11px 16px;gap:12px;
  cursor:pointer;transition:background .12s;background:var(--bg2);
  position:relative}
.cell:active{background:var(--press)}
.cell + .cell::before{content:'';position:absolute;top:0;left:60px;right:0;
  height:1px;background:var(--divider)}
.cell-icon{width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.cell-body{flex:1;min-width:0}
.cell-title{font-weight:500;font-size:15px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.cell-sub{font-size:12px;color:var(--hint);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-meta{font-size:11px;color:var(--link);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
.cell-trailing{color:var(--hint);font-size:14px;flex-shrink:0;display:flex;align-items:center;gap:6px}
.cell-chevron{color:var(--hint);font-size:18px;flex-shrink:0;line-height:1;margin-left:6px}
.cell-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;
  background:rgba(82,136,193,.18);color:var(--link);flex-shrink:0;white-space:nowrap;margin-right:2px}
.cell-badge.muted{background:rgba(255,255,255,.06);color:var(--hint)}
.cell-badge.warn{background:rgba(245,166,35,.15);color:var(--warn)}

.cell-group{background:var(--bg2);margin:0 0 8px;overflow:hidden}
.cell-group + .section{padding-top:10px}

/* Card compuesta: cell + chips de subitems debajo (Repuestos guardados) */
.compound-card{background:var(--bg2);margin:0 0 8px;overflow:hidden}
.compound-card + .compound-card{margin-top:0}
.cell-chips{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap}
.cell-chip{padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:500;
  background:rgba(255,255,255,.07);color:var(--text);cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;line-height:1.3;
  border:1px solid rgba(255,255,255,.05);transition:background .12s}
.cell-chip:active{background:rgba(255,255,255,.14)}
.cell-chip .n{opacity:.6;font-size:11px;font-weight:400}

/* ── Chips ──────────────────────────────────────────────────────────── */
.chips{display:flex;gap:7px;padding:10px 12px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;background:var(--bg);
  /* fade-out a la derecha como indicador de scroll horizontal */
  mask-image:linear-gradient(to right, black calc(100% - 18px), transparent 100%);
  -webkit-mask-image:linear-gradient(to right, black calc(100% - 18px), transparent 100%)}
.chips::-webkit-scrollbar{display:none}
.chips.sticky-top{position:sticky;top:0;z-index:5;
  border-bottom:1px solid var(--divider)}
.chip{padding:7px 14px;border-radius:99px;font-size:13px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;
  border:1px solid var(--divider);color:var(--text);background:var(--bg2)}
.chip:active{background:var(--press)}
.chip.active{background:var(--accent);color:var(--acctxt);border-color:var(--accent)}
.chip .count{opacity:.65;margin-left:5px;font-weight:400}
.chip.active .count{opacity:.85}

/* ── Info card ─────────────────────────────────────────────────────── */
.info-card{background:var(--bg2);margin:0 0 8px;overflow:hidden}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;
  padding:11px 16px;gap:14px;position:relative}
.info-row + .info-row::before{content:'';position:absolute;top:0;left:16px;right:16px;
  height:1px;background:var(--divider)}
.info-label{font-size:13px;color:var(--hint);flex-shrink:0;min-width:90px}
.info-value{font-size:14px;text-align:right;word-break:break-word;font-weight:500;flex:1}
.info-value.code{font-family:ui-monospace,Menlo,monospace;color:var(--link);font-size:13px}
.info-value.obs{text-align:left;color:var(--text);font-size:13.5px;line-height:1.5;font-weight:400}

/* ── Empty / error states ───────────────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 32px;gap:10px;text-align:center;min-height:240px}
.empty-icon{font-size:54px;opacity:.35;line-height:1}
.empty-title{font-weight:600;font-size:15px}
.empty-sub{font-size:13px;color:var(--hint);line-height:1.5;max-width:280px}

/* ── Greeting ──────────────────────────────────────────────────────── */
.hello{padding:18px 16px 8px}
.hello-text{font-size:20px;font-weight:600;line-height:1.2}
.hello-sub{font-size:13px;color:var(--hint);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px}
.tag.green{background:rgba(79,174,78,.15);color:var(--green)}
.tag.warn{background:rgba(245,166,35,.15);color:var(--warn)}

/* ── Photo gallery ─────────────────────────────────────────────────── */
.gallery{display:flex;gap:8px;padding:10px 14px 14px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--bg2)}
.gallery::-webkit-scrollbar{display:none}
.gallery-img{width:130px;height:96px;border-radius:9px;object-fit:cover;
  flex-shrink:0;background:var(--bg);cursor:pointer}
.gallery-img:active{opacity:.85}

/* ── Photo hero ────────────────────────────────────────────────────── */
.photo-hero{width:100%;aspect-ratio:16/10;background:var(--bg2);
  display:flex;align-items:center;justify-content:center;
  font-size:64px;color:var(--hint);overflow:hidden;cursor:pointer}
.photo-hero img{width:100%;height:100%;object-fit:cover}

/* ── Lightbox ──────────────────────────────────────────────────────── */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:300;
  display:none;align-items:center;justify-content:center;flex-direction:column;
  padding:env(safe-area-inset-top,12px) 0 env(safe-area-inset-bottom,12px)}
#lightbox.open{display:flex}
#lightbox img{max-width:96vw;max-height:72vh;border-radius:8px;object-fit:contain}
#lightbox .lbx-close{position:absolute;top:env(safe-area-inset-top,12px);right:14px;
  color:#fff;background:rgba(0,0,0,.4);border-radius:50%;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;border:none;
  font-size:22px;cursor:pointer}
#lightbox .lbx-cap{color:rgba(255,255,255,.75);font-size:12px;margin-top:10px;padding:0 18px;text-align:center}
#lbx-actions{display:none;gap:8px;margin-top:14px;padding:0 14px}
#lbx-actions.show{display:flex}
.lbx-btn{padding:10px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:6px}
.lbx-btn:active{background:rgba(255,255,255,.16)}
.lbx-btn:disabled{opacity:.5;cursor:not-allowed}
.lbx-btn.principal{background:rgba(245,166,35,.18);border-color:#f5a623;color:#f5a623}
.lbx-btn.principal.is-active{background:#f5a623;color:#000}
.lbx-btn.danger{background:rgba(229,57,53,.15);border-color:#e53935;color:#e53935}

/* ── Skeleton ──────────────────────────────────────────────────────── */
@keyframes shimmer{0%{background-position:-300px 0}100%{background-position:300px 0}}
.skel{background:linear-gradient(90deg,var(--bg2) 0%,rgba(255,255,255,.06) 50%,var(--bg2) 100%);
  background-size:600px 100%;animation:shimmer 1.4s infinite linear;border-radius:6px}
.skel-cell{display:flex;align-items:center;padding:11px 16px;gap:12px;background:var(--bg2)}
.skel-icon{width:38px;height:38px;border-radius:9px}
.skel-line{height:13px;flex:1}
.skel-line.short{max-width:120px;margin-top:6px}

/* ── Inline notice ─────────────────────────────────────────────────── */
.notice{padding:12px 16px;font-size:13px;color:var(--hint);background:var(--bg2);
  margin:0 0 8px;border-left:3px solid var(--warn)}
.notice b{color:var(--text)}

/* ── Header action buttons (edit / fav) ────────────────────────────── */
.edit-btn{width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(82,136,193,.14);color:var(--text);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;
  margin:0 3px;padding:0;font-family:inherit}
.edit-btn:active{background:rgba(82,136,193,.28);transform:scale(.92)}
.edit-btn:disabled{opacity:.5}
.edit-btn.fav-on{background:rgba(245,166,35,.2);color:#f5a623}

/* ── Form (edición de repuesto) ─────────────────────────────────────── */
.form-card{background:var(--bg2);margin:0 0 8px;padding:0 0 4px}
.form-row{display:flex;flex-direction:column;padding:10px 16px;gap:5px;position:relative}
.form-row + .form-row::before{content:'';position:absolute;top:0;left:16px;right:16px;
  height:1px;background:var(--divider)}
.form-label{font-size:11px;color:var(--hint);font-weight:600;
  text-transform:uppercase;letter-spacing:.4px}
.form-input,.form-textarea{width:100%;background:var(--bg);
  border:1px solid var(--divider);border-radius:8px;padding:9px 11px;
  color:var(--text);font-size:14.5px;outline:none;font-family:inherit;
  transition:border-color .15s}
.form-input:focus,.form-textarea:focus{border-color:var(--accent)}
.form-input.code{font-family:ui-monospace,Menlo,monospace;color:var(--link)}
.form-textarea{resize:none;min-height:78px;line-height:1.4}
.form-actions{display:flex;gap:8px;padding:14px 14px 18px;background:var(--bg)}
.btn-save{flex:2;padding:12px;border-radius:10px;border:none;background:var(--accent);
  color:var(--acctxt);font-size:15px;font-weight:600;cursor:pointer}
.btn-save:active{opacity:.85}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.btn-cancel{flex:1;padding:12px;border-radius:10px;border:1px solid var(--divider);
  background:transparent;color:var(--text);font-size:15px;font-weight:500;cursor:pointer}
.btn-cancel:active{background:var(--press)}

/* ── Upload buttons (admin only) ────────────────────────────────────── */
.upload-row{display:flex;gap:8px;padding:10px 14px 14px;background:var(--bg2)}
.upload-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 10px;border-radius:10px;border:1px dashed rgba(82,136,193,.45);
  background:rgba(82,136,193,.08);color:var(--accent);
  font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;line-height:1}
.upload-btn:active{background:rgba(82,136,193,.16);transform:scale(.98)}
.upload-btn:disabled{opacity:.5;cursor:not-allowed}
.upload-btn .ico{font-size:18px}

/* ── Upload progress overlay ────────────────────────────────────────── */
#uploading{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:250;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#uploading.open{display:flex}
#uploading .loader{width:40px;height:40px}
#uploading-msg{color:#fff;font-size:14px;text-align:center;padding:0 24px;max-width:300px}

/* ── Bottom sheet ───────────────────────────────────────────────────── */
#sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:160;
  display:none;opacity:0;transition:opacity .22s}
#sheet-overlay.open{display:block;opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);
  border-radius:16px 16px 0 0;z-index:170;
  padding-bottom:env(safe-area-inset-bottom);transform:translateY(100%);
  transition:transform .25s ease;max-height:78vh;overflow-y:auto;
  display:flex;flex-direction:column}
#sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);
  margin:10px auto 4px;flex-shrink:0}
.sheet-title{font-size:16px;font-weight:700;padding:6px 16px 12px;
  border-bottom:1px solid var(--divider);flex-shrink:0}
.sheet-list{padding:4px 0}
.sheet-row{display:flex;align-items:center;padding:13px 16px;gap:12px;
  cursor:pointer;transition:background .12s;position:relative}
.sheet-row:active{background:var(--press)}
.sheet-row + .sheet-row::before{content:'';position:absolute;top:0;left:50px;right:16px;
  height:1px;background:var(--divider)}
.sheet-row .ico{font-size:20px;width:32px;flex-shrink:0;text-align:center;line-height:1}
.sheet-row .body{flex:1;min-width:0}
.sheet-row .name{font-size:14.5px;font-weight:500;line-height:1.3}
.sheet-row .sub{font-size:11px;color:var(--hint);margin-top:2px}
.sheet-row .check{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:transparent;transition:all .15s}
.sheet-row.on .check{background:var(--accent);border-color:var(--accent);color:var(--acctxt)}
.sheet-row.disabled{opacity:.5;pointer-events:none}
.sheet-new{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;
  color:var(--accent);font-size:14.5px;font-weight:500;
  border-top:1px solid var(--divider)}
.sheet-new:active{opacity:.7}
.sheet-empty{padding:22px 16px;text-align:center;color:var(--hint);font-size:13px}
.sheet-foot{padding:0 16px env(safe-area-inset-bottom,12px)}

/* ── Modal (input) ───────────────────────────────────────────────────── */
#input-modal{position:fixed;inset:0;z-index:230;display:none;
  align-items:center;justify-content:center;padding:24px}
#input-modal.open{display:flex}
#input-modal .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#input-modal .box{position:relative;background:var(--bg2);border-radius:14px;
  padding:18px;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#input-modal .ttl{font-size:16px;font-weight:700;margin-bottom:12px}
#input-modal input{width:100%;padding:10px 12px;background:var(--bg);
  border:1px solid var(--divider);border-radius:8px;color:var(--text);
  font-size:15px;outline:none;margin-bottom:14px;font-family:inherit}
#input-modal input:focus{border-color:var(--accent)}
#input-modal .btns{display:flex;gap:8px;justify-content:flex-end}

/* ── Toast ──────────────────────────────────────────────────────────── */
#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg2);color:var(--text);padding:11px 18px;border-radius:99px;
  font-size:13px;font-weight:500;z-index:240;opacity:0;pointer-events:none;
  transition:opacity .25s, transform .25s;border:1px solid var(--divider);
  box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════
const CF_BASE = 'https://us-central1-mantenimiento-planta-771a3.cloudfunctions.net'

// ── Modo preview (desarrollo en browser sin Telegram) ─────────────────

if (IS_PREVIEW) {

firebase.initializeApp({

// ═══════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
let uid = null, userRole = 'usuario', isAuthorized = false, isLinked = false, firstName = ''
let currentTab = 'home'
let navStack = []   // [{viewId, title, subtitle, scrollTop}]

let machines = [], machineMap = {}
let categories = [], allCategoriesMap = {}, categoryDescendants = {}
let repCache = {}              // machineId → repuesto[]
let prefs = { favoriteLists: [], repuestoFavLists: {} }
let machineLinkedNodes = {}    // machineId → [hierarchyNodeId]
let nodeNameCache = {}         // nodeId → resolved name

let activeCatFilter = 'all'
let activeMachineRepFilter = null
let repSearchTimer = null
let recentIds = []
let recentsPage = 0
let searchTimer = null
let prevTabBeforeSearch = 'home'

// F3 — Global search state
let __repuestosCache = null   // flat [{repuesto, machineId, machineName}]
let __repuestosCacheTs = 0
let searchTabActive = 'repuestos'
let searchFavFilter = 'all'  // 'all' | '*' (cualquier favorito) | nombre de lista
let searchSapOnly = false
let __globalLoadInProgress = false

const SYNONYM_GROUPS = [
  ['motor','motriz','motores'],
  ['bomba','pump','bombas'],
  ['reductor','motorreductor','gearbox'],
  ['cinta','transportadora','conveyor','banda'],

  ['rodamiento','bearing','ruleman'],
  ['sello','reten','retenedor'],
]
const SYNONYM_LOOKUP = SYNONYM_GROUPS.reduce((acc, grp) => {
  const norm = grp.map(s => normalizeSearch(s))
  for (const t of norm) acc[t] = norm.filter(x => x !== t)
  return acc
}, {})

// F2 — Hierarchy state
let hierarchyNodesMap   = {}   // nodeId → node
let hierarchyChildrenMap = {}  // parentId → node[]
let hierarchyRoots      = []   // top-level nodes
let hierarchyStack      = []   // [{id, nombre}] nav stack
let __hierarchyCache    = null // {nodes, ts}
let hierSheetNodeId     = null // nodeId being added to list
let hierSheetIsEquip    = false
let tgBackBtnHandler    = null // current Telegram BackButton handler

const HIERARCHY_CACHE_TTL = 5 * 60 * 1000
const LEVEL_LABELS = {1:'Empresa',2:'Planta',3:'Área',4:'Sub-área',5:'Sistema',6:'Sub-sistema',7:'Equipo',8:'Elemento'}
const LEVEL_COLORS = {1:'#5288c1',2:'#5288c1',3:'#4fae4e',4:'#4fae4e',5:'#e88a00',6:'#e88a00',7:'#9c6bb8',8:'#9c6bb8'}

// ─── localStorage cache (persiste entre sesiones, ahorra reads Firebase) ───
const LS_KEY_REPUESTOS = 'mant_repuestos_v2'
const LS_KEY_MANUALES  = 'mant_manuales_v2'
const LS_KEY_HIERARCHY = 'mant_hierarchy_v2'
const LS_TTL_HIER  =  6 * 60 * 60 * 1000   //  6h — jerarquía cambia raro
const LS_TTL_REP   =  5 * 60 * 1000        //  5min — sincronización rápida con PWA
const LS_TTL_MAN   = 24 * 60 * 60 * 1000   // 24h — manuales casi no cambian

function lsGet(key, maxAgeMs){
  try {
    const raw = localStorage.getItem(key)
    if (!raw) return null
    const obj = JSON.parse(raw)
    if (!obj?.ts) return null
    if (maxAgeMs && Date.now() - obj.ts > maxAgeMs) return null
    return obj.data ?? null
  } catch { return null }
}
function lsSet(key, data){
  try {
    localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }))
  } catch(e){
    // Cuota llena → liberar y reintentar
    try {
      localStorage.removeItem(LS_KEY_REPUESTOS)
      localStorage.removeItem(LS_KEY_MANUALES)
      localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }))
    } catch { console.warn('localStorage quota exceeded for', key) }
  }
}
function lsClearAll(){
  for (const k of [LS_KEY_REPUESTOS, LS_KEY_MANUALES, LS_KEY_HIERARCHY]) {
    try { localStorage.removeItem(k) } catch {}
  }
}
// Convierte Firestore Timestamps a millis para serialización JSON
function normalizeForCache(obj){
  if (obj == null || typeof obj !== 'object') return obj
  if (typeof obj.toDate === 'function') return obj.toDate().getTime()
  if (Array.isArray(obj)) return obj.map(normalizeForCache)
  const out = {}
  for (const [k, v] of Object.entries(obj)) out[k] = normalizeForCache(v)
  return out
}

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
async function init(){
  tgApp?.ready()
  tgApp?.expand()
  loadRecents()

  // ── Rama preview (browser sin Telegram) ───────────────────────────
  if (IS_PREVIEW) {
    setLoadingMsg('Modo preview…')
    try {
      await auth.signInAnonymously()
      const previewUid = new URLSearchParams(location.search).get('uid')
      uid = previewUid || auth.currentUser?.uid || 'preview'
      userRole = 'admin'
      isAuthorized = true
      isLinked = true
      firstName = previewUid ? 'Preview (real)' : 'Preview'
      setLoadingMsg('Cargando datos…')
      await Promise.all([loadCategories(), loadMachines()])

      if (previewUid) {
        // Datos reales del usuario de Telegram
        await loadPrefs()
        startPrefsListener()
      } else {
        // Sin UID → prefs de demostración con equipos reales
        const firstIds  = machines.slice(0, 9).map(m => m.id)
        const secondIds = machines.slice(9, 24).map(m => m.id)
        prefs = {
          favoriteLists: [
            { name: 'Equipos Planta Principal', machineIds: firstIds  },
            { name: 'Cintas Planta Principal',  machineIds: secondIds },
          ],
          repuestoFavLists: {},
        }
        if (machines.length >= 2) {
          recentIds = [
            { machineId: machines[0].id, repuestoId: 'preview-rep-1',
              name: 'Rodamiento SKF 6205',   code: '1000001234', ts: Date.now() - 3600000 },
            { machineId: machines[1].id, repuestoId: 'preview-rep-2',
              name: 'Sello mecánico 40mm',   code: '1000005678', ts: Date.now() - 54000000 },
            { machineId: machines[0].id, repuestoId: 'preview-rep-3',
              name: 'Correa dentada T5-450', code: '',           ts: Date.now() - 61200000 },
          ]
        }
      }
      showApp()
    } catch(err) {
      setLoadingError('Preview error: ' + (err.code || err.message))
    }
    return
  }
  // ─────────────────────────────────────────────────────────────────

  setLoadingMsg('Autenticando…')

  const initData = tgApp?.initData
  if (!initData) {
    setLoadingError('Abrí esta app desde el bot @antarfood_mant_bot.')
    return
  }
  try {
    const resp = await fetch(`${CF_BASE}/mintTelegramAuthToken`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData }),
    })
    if (!resp.ok) {
      const err = await resp.json().catch(()=>({}))
      setLoadingError(err.error || `Error ${resp.status}`)
      return
    }
    const data = await resp.json()
    setLoadingMsg('Iniciando sesión…')
    await auth.signInWithCustomToken(data.token)
    uid = data.uid
    userRole = data.role || 'usuario'
    isAuthorized = data.authorized
    isLinked = data.isLinked || false
    firstName = data.firstName || tgApp?.initDataUnsafe?.user?.first_name || ''

    if (!isAuthorized) {
      setLoadingError('Tu grupo de Telegram no está autorizado. Contactá al administrador.')
      return
    }
    setLoadingMsg('Cargando datos…')
    await Promise.all([loadCategories(), loadMachines(), loadPrefs()])
    showApp()
  } catch (err) {
    console.error('init error', err)
    setLoadingError('Error de conexión: ' + (err.message || 'desconocido'))
  }
}

function setLoadingMsg(m){ document.getElementById('loading-msg').textContent = m
  document.getElementById('loading-retry').style.display='none' }
function setLoadingError(m){ document.getElementById('loading-msg').textContent = m
  document.getElementById('loading-retry').style.display='block' }

function showApp(){
  document.getElementById('loading').style.display = 'none'
  setStatus('ok', isAuthorized ? 'conectado' : 'sólo lectura')
  // Restaurar tab activo de sesión anterior (default: home)
  const savedTab = localStorage.getItem('mant_active_tab') || 'home'
  const validTabs = ['home', 'search', 'hierarchy', 'manuales']
  switchTab(validTabs.includes(savedTab) ? savedTab : 'home')
  renderSearchEmpty()
  // Pre-cargar repCache en background
  preloadRepCounts()
  // Listeners real-time (sync con PWA y otros dispositivos)
  startPrefsListener()
  startMachinesListener()
}

/** Listener real-time de la colección machines.
 *  Si admin edita un equipo en la PWA, los cambios aparecen acá sin reload. */
let machinesUnsub = null
function startMachinesListener(){
  if (machinesUnsub) return
  machinesUnsub = db.collection('machines').onSnapshot(snap => {
    machines = snap.docs.map(d => ({id:d.id, ...d.data()}))
      .sort((a,b) => (a.orden||0) - (b.orden||0))
    machineMap = Object.fromEntries(machines.map(m => [m.id, m]))
    if (currentTab === 'home') renderHomeCatalog()
  }, err => console.warn('machines listener error', err))
}

async function preloadRepCounts(){
  // Cargar conteos de repuestos para los primeros equipos sin bloquear
  const targets = machines.slice(0, 12)  // top 12 para no abrumar
  for (const m of targets){
    if (repCache[m.id]) continue
    try { await loadRepuestos(m.id) } catch {}
    // Re-renderizar el catalog si está visible (poco frecuente, batched)
    if (currentTab === 'home') renderHomeCatalog()
  }
}

function setStatus(type, label){
  const el = document.getElementById('status')
  el.className = 'status ' + (type==='ok'?'s-ok':type==='err'?'s-err':'s-loading')
  el.textContent = label
}

// ═══════════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════════
async function loadCategories(){
  const snap = await db.collection('machineCategories').get()
  const all = snap.docs.map(d => ({id:d.id, ...d.data()}))
    .filter(c => c.activa !== false && c.visible !== false)
  allCategoriesMap = Object.fromEntries(all.map(c => [c.id, c]))
  categories = all.filter(c => !c.parentId).sort((a,b) => (a.orden||0) - (b.orden||0))
  categoryDescendants = {}
  for (const top of categories) {
    const set = new Set([top.id])
    const stack = [top.id]
    while (stack.length){
      const p = stack.pop()
      for (const c of all) if (c.parentId === p && !set.has(c.id)){ set.add(c.id); stack.push(c.id) }
    }
    categoryDescendants[top.id] = set
  }
}

async function loadMachines(){
  const snap = await db.collection('machines').get()
  machines = snap.docs.map(d => ({id:d.id, ...d.data()}))
    .sort((a,b) => (a.orden||0) - (b.orden||0))
  machineMap = Object.fromEntries(machines.map(m => [m.id, m]))
}

async function loadRepuestos(machineId){
  // Solo cachear arrays NO vacíos: un cache vacío puede venir de una resolución
  // de path incorrecta (ej: hierarchy aún no cargado) y bloquear ediciones futuras.
  if (repCache[machineId]?.length > 0) return repCache[machineId]
  const collPath = getRepuestoCollPath(machineId)
  let docs = []
  try {
    const snap = await db.collection(collPath).orderBy('codigoSAP').get()
    docs = snap.docs
  } catch(e){
    // Algunos repuestos en hierarchy/ pueden no tener codigoSAP — fallback sin orderBy
    const snap = await db.collection(collPath).get()
    docs = snap.docs
  }
  repCache[machineId] = docs.map(d => ({id:d.id, ...d.data()}))
  return repCache[machineId]
}

/**
 * Normaliza favoriteLists para que list.machineIds sea siempre la UNIÓN
 * de todos los equipos de la lista (raíz + sub-listas + sub-sub-listas).
 * Esto garantiza compatibilidad con la PWA que solo lee list.machineIds.
 * Retorna true si se realizó algún cambio.
 */
function _normalizeFavLists(lists){
  let changed = false
  for (const list of lists || []) {
    const allIds = new Set(list.machineIds || [])
    for (const sl of list.subLists || []) {
      for (const id of sl.machineIds || []) {
        if (!allIds.has(id)){ allIds.add(id); changed = true }
      }
      for (const ssl of sl.subLists || []) {
        for (const id of ssl.machineIds || []) {
          if (!allIds.has(id)){ allIds.add(id); changed = true }
        }
      }
    }
    if (changed) list.machineIds = [...allIds]
  }
  return changed
}

async function loadPrefs(){
  if (!uid) return
  const doc = await db.collection('user_preferences').doc(uid).get()
  if (doc.exists) {
    const d = doc.data()
    prefs = {
      favoriteLists:    d.favoriteLists    || [],
      repuestoFavLists: d.repuestoFavLists || {},
    }
    // Fix one-shot: restaurar list.machineIds si datos fueron corrompidos
    const fixed = _normalizeFavLists(prefs.favoriteLists)
    if (fixed) saveAllPrefs().catch(() => {})  // fire-and-forget
  }
}

/** Listener real-time: cambios hechos en la PWA o desde otro dispositivo se reflejan acá */
let prefsUnsub = null
let _ignoreNextPrefsUpdate = false  // flag para evitar re-render circular tras savePrefs local
function startPrefsListener(){
  if (!uid || prefsUnsub) return
  prefsUnsub = db.collection('user_preferences').doc(uid).onSnapshot(snap => {
    if (!snap.exists) return
    const d = snap.data()
    const next = {
      favoriteLists:    d.favoriteLists    || [],
      repuestoFavLists: d.repuestoFavLists || {},
    }
    // Normalizar: asegurar list.machineIds = unión de todos los equipos
    _normalizeFavLists(next.favoriteLists)
    // Si las prefs no cambiaron (mismo writer somos nosotros), evitar re-render
    if (JSON.stringify(next) === JSON.stringify(prefs)) return
    prefs = next
    // Re-renderear home si está activa
    if (currentTab === 'home') renderHome()
    // Refresh fav button si estamos en detalle
    const repView = document.getElementById('view-repuesto')
    if (repView?.classList.contains('active') && activeUploadCtx){
      updateFavBtnState(activeUploadCtx.machineId, activeUploadCtx.repuestoId)
    }
    // Si el sheet de favoritos está abierto, re-renderearlo
    if (favSheetCtx){
      openFavListsSheet(favSheetCtx.machineId, favSheetCtx.repuestoId)
    }
  }, err => console.warn('prefs listener error', err))
}

async function getLinkedNodeIds(machineId){
  if (machineLinkedNodes[machineId]) return machineLinkedNodes[machineId]
  try {
    const snap = await db.collection('hierarchy').where('linkedMachineId','==',machineId).get()
    const ids = snap.docs.map(d => d.id)
    machineLinkedNodes[machineId] = ids
    return ids
  } catch(e){ machineLinkedNodes[machineId] = []; return [] }
}

async function getMachineFavListsMerged(machineId){
  const repFavLists = prefs.repuestoFavLists || {}
  const nodeIds = await getLinkedNodeIds(machineId)
  const keys = [...nodeIds, machineId]
  const merged = new Map()
  for (const k of keys){
    for (const l of (repFavLists[k] || [])) {
      if (!merged.has(l.name)) merged.set(l.name, new Set())
      ;(l.repuestoIds || []).forEach(id => merged.get(l.name).add(id))
    }
  }
  return Array.from(merged.entries()).map(([name, set]) => ({name, repuestoIds: Array.from(set)}))
}

function matchesRepFavList(rep, idSet){
  if (idSet.has(rep.id)) return true
  if (rep.codigoSAP && idSet.has(`inv-${rep.codigoSAP}`)) return true
  if (rep.codigoSAP && idSet.has(rep.codigoSAP)) return true
  return false
}

async function resolveNodeName(nodeId){
  if (nodeNameCache[nodeId]) return nodeNameCache[nodeId]
  try {
    const snap = await db.collection('hierarchy').doc(nodeId).get()
    if (snap.exists){
      const d = snap.data()
      const name = (d.linkedMachineId && machineMap[d.linkedMachineId]?.nombre)
        || d.nombre || d.name || nodeId
      nodeNameCache[nodeId] = name
      return name
    }
  } catch {}
  nodeNameCache[nodeId] = nodeId
  return nodeId
}

async function loadManuales(){
  if (__manualesCache && Date.now() - __manualesCacheTs < HIERARCHY_CACHE_TTL) return __manualesCache

  // 1) localStorage hit (TTL 24h — los manuales casi no cambian)
  if (!__manualesCache){
    const cached = lsGet(LS_KEY_MANUALES, LS_TTL_MAN)
    if (cached){
      __manualesCache = cached
      __manualesCacheTs = Date.now()
      return cached
    }
  }

  const results = []
  const setManualesProgress = (msg, loaded, total) => {
    const el = document.getElementById('manuales-progress')
    if (!el) return
    if (!msg){ el.style.display = 'none'; return }
    el.style.display = 'block'
    const pct = (total && loaded != null) ? Math.round((loaded/total)*100) : null
    el.innerHTML = `
      <div style="font-size:12px;color:var(--sub)">${escHtml(msg)}${pct!=null?` · ${pct}%`:''}</div>
      ${pct!=null?`<div style="height:3px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:var(--accent);transition:width .25s"></div>
      </div>`:''}`
  }

  // 2) Firestore manuales/ (rápido, single query)
  try {
    const snap = await db.collection('manuales').orderBy('createdAt','desc').limit(100).get()
    snap.docs.forEach(d => results.push({ id: d.id, source: 'firestore', ...d.data() }))
  } catch(e){ console.warn('manuales firestore failed', e) }

  // 3) Legacy Storage paths del PWA — escaneo paralelo con progress
  await loadHierarchyTree().catch(() => {})
  const eqNodes = Object.values(hierarchyNodesMap || {}).filter(n => isEquipNode(n))
  const total = machines.length + eqNodes.length
  let done = 0
  setManualesProgress(`Buscando manuales del PWA… 0 / ${total}`, 0, total)

  const BATCH = 12  // listAll es más rápido que getDocs, podemos paralelizar más

  // 3a) Por máquina legacy
  for (let i = 0; i < machines.length; i += BATCH){
    const batch = machines.slice(i, i + BATCH)
    await Promise.all(batch.map(async m => {
      try {
        const list = await storage.ref(`machines/${m.id}/manuales`).listAll()
        for (const item of list.items){
          const url = await item.getDownloadURL().catch(() => null)
          if (!url) continue
          results.push({
            id: `legacy_m_${m.id}_${item.name}`,
            source: 'storage_legacy',
            ownerType: 'equipo', ownerId: m.id,
            ownerPath: [m.nombre || m.id],
            titulo: item.name.replace(/^\d+_/,'').replace(/_\d+\.pdf$/i,'.pdf').replace(/_/g,' ').replace(/\.pdf$/i,''),
            tipo: 'pdf', url,
            storagePath: item.fullPath,
            createdAt: null,
          })
        }
      } catch { /* carpeta no existe — OK */ }
    }))
    done += batch.length
    setManualesProgress(`Buscando manuales del PWA… ${done} / ${total}`, done, total)
  }

  // 3b) Por nodo equipo SAP (hierarchy)
  for (let i = 0; i < eqNodes.length; i += BATCH){
    const batch = eqNodes.slice(i, i + BATCH)
    await Promise.all(batch.map(async n => {
      try {
        const list = await storage.ref(`equipment/${n.id}/manuales`).listAll()
        for (const item of list.items){
          const url = await item.getDownloadURL().catch(() => null)
          if (!url) continue
          results.push({
            id: `legacy_e_${n.id}_${item.name}`,
            source: 'storage_legacy',
            ownerType: 'equipo', ownerId: n.id,
            ownerPath: [n.nombre || n.id],
            titulo: item.name.replace(/^\d+_/,'').replace(/_\d+\.pdf$/i,'.pdf').replace(/_/g,' ').replace(/\.pdf$/i,''),
            tipo: 'pdf', url,
            storagePath: item.fullPath,
            createdAt: null,
          })
        }
      } catch { /* carpeta no existe — OK */ }
    }))
    done += batch.length
    setManualesProgress(`Buscando manuales del PWA… ${done} / ${total}`, done, total)
  }

  setManualesProgress(null)
  __manualesCache   = results
  __manualesCacheTs = Date.now()
  lsSet(LS_KEY_MANUALES, normalizeForCache(results))
  return results
}

function renderManualesBody(manuales){
  const listEl  = document.getElementById('manuales-list')
  const chipsEl = document.getElementById('manuales-type-chips')
  if (!listEl) return

  if (manuales.length === 0){
    if (chipsEl) chipsEl.innerHTML = ''
    listEl.innerHTML = emptyHtml('📚','Sin documentos',
      (userRole==='admin'||userRole==='supervisor')
        ? 'Sube el primer manual con el botón + Subir'
        : 'Aún no hay documentos cargados')
    return
  }

  const tipos = [...new Set(manuales.map(m => m.tipo).filter(Boolean))]
  if (chipsEl && tipos.length > 1){
    chipsEl.innerHTML = `<div class="chips" style="padding:0 12px 6px">
      <div class="chip ${manualesTypeFilter===null?'active':''}" onclick="setManualesTypeFilter(null)">
        Todos <span class="count">${manuales.length}</span></div>
      ${tipos.map(t => {
        const cnt = manuales.filter(m => m.tipo===t).length
        return `<div class="chip ${manualesTypeFilter===t?'active':''}"
                     onclick="setManualesTypeFilter('${escHtmlAttr(t)}')">
          ${manualIcon(t)} ${escHtml(t[0].toUpperCase()+t.slice(1))}
          <span class="count">${cnt}</span></div>`
      }).join('')}
    </div>`
  } else if (chipsEl){ chipsEl.innerHTML = '' }

  const searchQ = normalizeSearch(document.getElementById('manuales-search')?.value || '')
  let filtered = manualesTypeFilter ? manuales.filter(m => m.tipo===manualesTypeFilter) : manuales
  if (searchQ){
    filtered = filtered.filter(m =>
      normalizeSearch(m.titulo).includes(searchQ)
      || normalizeSearch((m.ownerPath||[]).join(' ')).includes(searchQ)
      || normalizeSearch(m.descripcion).includes(searchQ)
    )
  }
  if (filtered.length === 0){
    listEl.innerHTML = emptyHtml('🔍','Sin resultados','Ningún documento coincide con el filtro')
    return
  }

  // Agrupar por equipo (ownerId) — secciones alfabéticas
  const groups = {}
  for (const m of filtered){
    const key = m.ownerId || '__sin'
    const name = (m.ownerPath && m.ownerPath[0]) || m.ownerId || 'Sin equipo asociado'
    if (!groups[key]) groups[key] = { name, items: [] }
    groups[key].items.push(m)
  }
  const sorted = Object.entries(groups).sort(([,a],[,b]) => a.name.localeCompare(b.name, 'es'))

  listEl.innerHTML = sorted.map(([key, g]) => `
    <div class="section">
      <span class="section-title">${escHtml(g.name)}</span>
      <span class="section-count">${g.items.length}</span>
    </div>
    <div class="cell-group">${g.items.map(manualCellHtml).join('')}</div>
  `).join('')
}

function manualIcon(tipo){

function manualCellHtml(m){
  const owner = (m.ownerPath||[]).join(' › ') || m.ownerId || ''
  const size  = m.fileSize ? ` · ${(m.fileSize/1048576).toFixed(1)} MB` : ''
  // createdAt puede ser Timestamp Firestore o millis (cuando viene de localStorage)
  const ts = typeof m.createdAt === 'number'
    ? m.createdAt
    : (m.createdAt?.toDate ? m.createdAt.toDate().getTime() : null)
  const when = ts ? relativeTime(ts) : ''
  const mData = escHtmlAttr(JSON.stringify({id:m.id,url:m.url,tipo:m.tipo,titulo:m.titulo}))
  return `<div class="cell" onclick="openManualViewer(${mData})">
    <div class="cell-icon" style="font-size:20px">${manualIcon(m.tipo)}</div>
    <div class="cell-body">
      <div class="cell-title">${escHtml(m.titulo||'Sin título')}</div>
      ${owner ? `<div class="cell-meta">${escHtml(owner)}</div>` : ''}
      <div class="cell-sub">${escHtml((m.tipo||'').toUpperCase())}${size}${when?` · ${when}`:''}</div>
    </div>
    <div class="cell-chevron">›</div>
  </div>`
}

function openManualViewer(mData){
  const m = typeof mData === 'string' ? JSON.parse(mData) : mData
  if (!m?.url) return
  tgApp?.HapticFeedback?.selectionChanged?.()
  // PDF e imagen → visor inline; link/video → externo (Telegram openLink)
  if (m.tipo === 'pdf' || m.tipo === 'imagen'){
    showInlineDocOverlay(m.url, m.titulo, m.tipo)
    return
  }
  if (tgApp?.openLink) tgApp.openLink(m.url)
  else window.open(m.url, '_blank')
}

function mupOwnerSearch(){
  const q = normalizeSearch(document.getElementById('mup-owner-search')?.value || '')
  const ownerType = document.getElementById('mup-owner-type')?.value
  const results   = document.getElementById('mup-owner-results')
  if (!q || !results) return

  let candidates = []
  if (ownerType === 'equipo'){
    machines.filter(m => normalizeSearch(m.nombre).includes(q)).slice(0,5)
      .forEach(m => candidates.push({ id: m.id, name: m.nombre }))
    Object.values(hierarchyNodesMap)
      .filter(n => isEquipNode(n) && normalizeSearch(n.nombre).includes(q)).slice(0,4)
      .forEach(n => candidates.push({ id: n.id, name: n.nombre }))
  } else {
    const levelMap = { planta: 2, area: 3 }
    const lvl = levelMap[ownerType]
    Object.values(hierarchyNodesMap)
      .filter(n => (!lvl || n.nivel===lvl) && normalizeSearch(n.nombre).includes(q)).slice(0,8)
      .forEach(n => candidates.push({ id: n.id, name: n.nombre }))
  }

  results.innerHTML = candidates.length === 0
    ? `<div style="font-size:12px;color:var(--hint);padding:4px 0">Sin resultados</div>`
    : `<div class="cell-group" style="margin-top:4px">
        ${candidates.map(c => `
          <div class="cell" style="padding:6px 12px"
               onclick="mupSelectOwner('${escHtmlAttr(c.id)}','${escHtmlAttr(c.name)}')">
            <div class="cell-body">
              <div class="cell-title" style="font-size:13px">${escHtml(c.name)}</div>

async function saveManual(){
  const btn      = document.getElementById('btn-save-manual')
  const titulo   = document.getElementById('mup-titulo')?.value?.trim()
  const ownerType= document.getElementById('mup-owner-type')?.value
  const ownerId  = document.getElementById('mup-owner-id')?.value?.trim()
  const ownerName= document.getElementById('mup-owner-name')?.value?.trim()
  const tipo     = document.getElementById('mup-tipo')?.value
  const desc     = document.getElementById('mup-desc')?.value?.trim()

  if (!titulo)  { showToast('El título es obligatorio', 'err'); return }
  if (!ownerId) { showToast('Seleccioná un propietario', 'err'); return }

  btn.disabled = true; btn.textContent = 'Subiendo…'

  const isFile = tipo === 'pdf' || tipo === 'imagen'
  let url = '', storagePath = null, fileSize = null, mimeType = null

  if (isFile){
    const file = document.getElementById('mup-file')?.files?.[0]
    if (!file){ showToast('Seleccioná un archivo', 'err'); btn.disabled=false; btn.textContent='Subir'; return }
    if (file.size > 50*1024*1024){ showToast('Archivo demasiado grande (máx. 50 MB)', 'err'); btn.disabled=false; btn.textContent='Subir'; return }
    fileSize = file.size; mimeType = file.type
    const fname = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`
    storagePath = `manuales/${ownerType}/${ownerId}/${fname}`
    document.getElementById('mup-progress').style.display = 'block'
    try {
      const ref = storage.ref(storagePath)
      const task = ref.put(file)
      await new Promise((res, rej) => {
        task.on('state_changed',
          s => {
            const pct = Math.round(s.bytesTransferred / s.totalBytes * 100)
            const bar = document.getElementById('mup-progress-bar')
            const txt = document.getElementById('mup-progress-text')
            if (bar) bar.style.width = pct + '%'
            if (txt) txt.textContent = `Subiendo… ${pct}%`
          },
          rej, res)
      })
      url = await ref.getDownloadURL()
    } catch(e){
      showToast('Error al subir: ' + (e.message||''), 'err')
      btn.disabled=false; btn.textContent='Subir'
      document.getElementById('mup-progress').style.display='none'
      return
    }
  } else {
    url = document.getElementById('mup-url')?.value?.trim()
    if (!url){ showToast('Ingresá una URL válida', 'err'); btn.disabled=false; btn.textContent='Subir'; return }
  }

  try {
    const doc = {
      ownerType, ownerId,
      ownerPath: ownerName ? [ownerName] : [],
      titulo, tipo, url,
      ...(storagePath && { storagePath }),
      ...(fileSize   && { fileSize }),
      ...(mimeType   && { mimeType }),
      descripcion: desc || '',
      createdBy: uid || '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      source: 'miniapp',
    }
    const ref = await db.collection('manuales').add(doc)
    await logAudit('create','manuales',ref.id,null,doc,`Subir manual: ${titulo}`)
    __manualesCache = null; __manualesCacheTs = 0
    try { localStorage.removeItem(LS_KEY_MANUALES) } catch {}
    showToast(`"${titulo}" subido ✓`, 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    setTgBack(null)
    renderManualesTab()
  } catch(e){
    showToast('Error al guardar: ' + (e.message||''), 'err')
    btn.disabled=false; btn.textContent='Subir'
  }
}

function pushView(viewId, title, subtitle){
  const c = getContent()
  const prevId = document.querySelector('.view.active')?.id || `view-${currentTab}`
  // Si vamos de view-machine a view-machine (listas anidadas), guardamos snapshot
  // del HTML + header para restaurarlo correctamente al volver
  let snapshot = null
  if (prevId === 'view-machine' && viewId === 'view-machine'){
    const prevEl = document.getElementById('view-machine')
    snapshot = {
      html:     prevEl?.innerHTML || '',
      title:    document.getElementById('hdr-title')?.textContent || '',
      subtitle: document.getElementById('hdr-sub')?.textContent  || '',
    }
  }
  navStack.push({viewId: prevId, scrollTop: c.scrollTop, snapshot})
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'))
  document.getElementById(viewId).classList.add('active')
  setHeader(title, subtitle, true)
  c.scrollTop = 0
}

function goBack(){
  // Si estamos editando un repuesto, back = cancelar edición (no salir del detalle)
  if (editingRepuestoCtx){
    const { machineId, repuestoId } = editingRepuestoCtx
    editingRepuestoCtx = null
    openRepuesto(machineId, repuestoId, { fromSave: true })
    return
  }
  if (navStack.length === 0) return
  const prev = navStack.pop()
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'))
  document.getElementById(prev.viewId).classList.add('active')
  // Si hay snapshot guardado, restaurar HTML + header de view-machine
  if (prev.snapshot && prev.viewId === 'view-machine'){
    document.getElementById('view-machine').innerHTML = prev.snapshot.html
    setHeader(prev.snapshot.title, prev.snapshot.subtitle, navStack.length > 0)
  } else if (navStack.length === 0){
    tabHeader(currentTab)
  }
  activeUploadCtx = null
  // Ocultar botones ✏️ ⭐ si volvemos a una vista que no es de repuesto
  if (prev.viewId !== 'view-repuesto'){
    document.getElementById('hdr-edit').style.display = 'none'
    document.getElementById('hdr-fav').style.display = 'none'
  }
  // Restore scroll
  requestAnimationFrame(() => { getContent().scrollTop = prev.scrollTop || 0 })
}

function relativeTime(ts){
  if (!ts) return ''
  const diff = Date.now() - ts
  const min = Math.floor(diff / 60000)
  if (min < 1) return 'ahora mismo'
  if (min < 60) return `hace ${min} min`
  const h = Math.floor(min / 60)
  if (h < 24) return `hace ${h} h`
  const d = Math.floor(h / 24)
  if (d < 7) return `hace ${d} día${d > 1 ? 's' : ''}`
  return new Date(ts).toLocaleDateString('es-CL', {day:'numeric', month:'short'})
}

async function renderHomeRepFav(){
  const el = document.getElementById('home-repfav')
  if (!el) return
  const { repuestoFavLists } = prefs
  const repKeys = Object.keys(repuestoFavLists || {}).filter(k => repuestoFavLists[k]?.length > 0)
  if (repKeys.length === 0){ el.innerHTML = ''; return }

  // Resolver cada key a su machineId destino y consolidar duplicados.
  // Múltiples hierarchy nodeIds pueden apuntar al mismo equipo (linkedMachineId)
  // → mergear en una sola card por equipo.
  await Promise.all(repKeys.filter(k => !machineMap[k]).map(resolveNodeName))
  const machineIdsSet = new Set()
  for (const k of repKeys){
    if (machineMap[k]) machineIdsSet.add(k)
    else {
      const mid = await getMachineIdFromNode(k)
      machineIdsSet.add(mid && machineMap[mid] ? mid : k)
    }
  }
  const machineIds = Array.from(machineIdsSet)

  // Para cada machineId, calcular listas mergeadas (merge by name across keys)
  const cards = []
  for (const mid of machineIds){
    const m = machineMap[mid]
    const machineName = m?.nombre || nodeNameCache[mid] || mid
    const lists = m
      ? await getMachineFavListsMerged(mid)
      : (repuestoFavLists[mid] || [])
    const total = lists.reduce((s,l) => s + (l.repuestoIds?.length || 0), 0)
    if (total > 0) cards.push({ mid, machineName, m, lists, total })
  }

  if (cards.length === 0){ el.innerHTML = ''; return }

  el.innerHTML = `
    <div class="section">
      <span class="section-title">Repuestos guardados</span>
      <span class="section-count">${cards.length}</span>
    </div>
    ${cards.map(({mid, machineName, m, lists, total}) => `
      <div class="compound-card">
        <div class="cell" onclick="openMachine('${escHtmlAttr(mid)}')">
          <div class="cell-icon" style="background:${m?.color || '#5288c1'}22;color:${m?.color || '#5288c1'}">🔩</div>
          <div class="cell-body">
            <div class="cell-title">${escHtml(machineName)}</div>
            <div class="cell-sub">${pl(total, 'repuesto', 'repuestos')} · ${pl(lists.length, 'lista', 'listas')}</div>
          </div>
          <div class="cell-chevron">›</div>
        </div>
        ${lists.length > 0 ? `
          <div class="cell-chips">
            ${lists.map(l => `
              <span class="cell-chip" onclick="event.stopPropagation();openMachineWithFilter('${escHtmlAttr(mid)}', ${escHtmlAttr(JSON.stringify(l.name))})">
                📋 ${escHtml(l.name)} <span class="n">${l.repuestoIds.length}</span>
              </span>`).join('')}
          </div>` : ''}
      </div>`).join('')}`
}

// Dispatcher: el bar persistente cambia de comportamiento según dónde estás
function onPersistentSearchTap(){
  const activeViewId = document.querySelector('.view.active')?.id
  // 1) Estás en un equipo abierto → focusear su búsqueda interna
  if (activeViewId === 'view-machine'){
    const inp = document.getElementById('rep-search-input')
    if (inp){ inp.focus(); inp.scrollIntoView({behavior:'smooth', block:'center'}); return }
  }
  // 2) Estás en Manuales (no en sub-vista) → focusear su búsqueda interna
  if (activeViewId === 'view-manuales'){
    const inp = document.getElementById('manuales-search')
    if (inp){ inp.focus(); inp.scrollIntoView({behavior:'smooth', block:'center'}); return }
  }
  // 3) Estás en Jerarquía → overlay tree-wide
  if (activeViewId === 'view-hierarchy'){
    openHierSearchOverlay()
    return
  }
  // 4) Estás en una sub-vista profunda (repuesto, etc) → overlay global
  // (no usamos switchTab porque perdería la pila de navegación)
  if (navStack.length > 0){
    openSearchOverlay()
    return
  }
  // 5) Default (Home a nivel raíz) → ir a la pestaña Buscar
  switchTab('search')
}

function renderHierSearchBody(){
  const inp = document.getElementById('hier-search-input')
  const body = document.getElementById('hier-search-body')
  if (!body) return
  const raw = inp?.value || ''
  const q = normalizeSearch(raw).trim()

  if (!q){
    body.innerHTML = `<div style="padding:24px 16px;text-align:center;color:var(--hint);font-size:13px">
      Escribí el nombre o código de un nodo, equipo o área.<br>
      Buscamos en todos los niveles de la jerarquía.
    </div>`
    return
  }
  if (q.length < 2) return

  // Búsqueda in-memory sobre hierarchyNodesMap (ya cargado y cacheado)
  const matches = []
  for (const n of Object.values(hierarchyNodesMap)){
    if (n.activo === false) continue
    if (normalizeSearch(n.nombre).includes(q) || normalizeSearch(n.codigo).includes(q)){
      matches.push(n)
    }
    if (matches.length >= 80) break
  }
  // Orden: primero hojas (equipos), luego por nivel
  matches.sort((a, b) => {
    const aLeaf = isEquipNode(a), bLeaf = isEquipNode(b)
    if (aLeaf !== bLeaf) return aLeaf ? -1 : 1
    return (a.nivel || 0) - (b.nivel || 0)
  })

  if (matches.length === 0){
    body.innerHTML = `<div style="padding:24px 16px">
      ${emptyHtml('🔍','Sin coincidencias',`Ningún nodo coincide con "<b>${escHtml(raw)}</b>"`)}
    </div>`
    return
  }

  body.innerHTML = `<div class="cell-group" style="margin:8px 0">
    ${matches.slice(0, 50).map(n => {
      const isEquip = isEquipNode(n)
      const lvl = n.nivel || 1
      const lvlLabel = LEVEL_LABELS[lvl] || `N${lvl}`
      const lvlColor = LEVEL_COLORS[lvl] || '#888'
      const linkedMachine = machines.find(m => m.hierarchyNodeId === n.id)
      const path = (n.path || []).slice(0, -1).join(' › ')
      const handler = isEquip
        ? `hierSearchOpenEquip('${escHtmlAttr(n.id)}','${escHtmlAttr(linkedMachine?.id||'')}')`
        : `hierSearchNavigate('${escHtmlAttr(n.id)}')`
      return `<div class="cell" onclick="${handler}">
        <div class="cell-icon" style="background:${lvlColor}22;color:${lvlColor}">
          ${isEquip?'⚙️':'📁'}
        </div>
        <div class="cell-body">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <div class="cell-title">${highlightMatch(n.nombre || 'Sin nombre', raw)}</div>
            <span class="level-chip" style="background:${lvlColor}22;color:${lvlColor}">${lvlLabel}</span>
          </div>
          ${path ? `<div class="cell-sub" style="opacity:.7">${escHtml(path)}</div>` : ''}
        </div>
        <div class="cell-chevron">›</div>
      </div>`
    }).join('')}
    ${matches.length > 50 ? `<div style="padding:10px 16px;font-size:11px;color:var(--hint);text-align:center">+${matches.length-50} más — refiná la búsqueda</div>` : ''}
  </div>`
}

// Helper: reconstruye el stack desde un nodo cualquiera (vía parentId)
function buildHierStackForNode(node){
  const stack = []
  let cur = node
  while (cur){
    stack.unshift({ id: cur.id, nombre: cur.nombre })
    cur = cur.parentId ? hierarchyNodesMap[cur.parentId] : null
  }
  return stack
}

function hierSearchNavigate(nodeId){
  const node = hierarchyNodesMap[nodeId]
  if (!node) return
  closeHierSearchOverlay()
  if (currentTab !== 'hierarchy') switchTab('hierarchy')
  hierarchyStack = buildHierStackForNode(node)
  setTgBack(hierarchyStack.length ? hierarchyGoBack : null)
  renderHierarchyLevel()
  getContent().scrollTop = 0
}

function hierSearchOpenEquip(nodeId, machineId){
  const node = hierarchyNodesMap[nodeId]
  if (!node) return
  closeHierSearchOverlay()
  if (currentTab !== 'hierarchy') switchTab('hierarchy')
  // Stack = ancestros (sin incluir el equipo, que se abre como vista)
  const stack = []
  let cur = node.parentId ? hierarchyNodesMap[node.parentId] : null
  while (cur){
    stack.unshift({ id: cur.id, nombre: cur.nombre })
    cur = cur.parentId ? hierarchyNodesMap[cur.parentId] : null
  }
  hierarchyStack = stack
  setTgBack(hierarchyStack.length ? hierarchyGoBack : null)
  renderHierarchyLevel()
  hierarchyOpenEquip(nodeId, machineId)
}

// F3 — GLOBAL SEARCH ALGORITHMS
// ═══════════════════════════════════════════════════════════════════
function editDistanceAtMostOne(a, b){
  if (a === b) return true
  const la = a.length, lb = b.length
  if (Math.abs(la - lb) > 1) return false
  let i = 0, j = 0, edits = 0
  while (i < la && j < lb){
    if (a[i] === b[j]){ i++; j++; continue }
    if (++edits > 1) return false
    if (la > lb) i++; else if (lb > la) j++; else { i++; j++ }
  }
  if (i < la || j < lb) edits++
  return edits <= 1
}

function tokenMatchesText(token, searchable, words){
  if (searchable.includes(token)) return true
  const syns = SYNONYM_LOOKUP[token]
  if (syns?.some(s => searchable.includes(s))) return true
  if (token.length >= 4 && words.some(w => w.length >= 4 && editDistanceAtMostOne(token, w))) return true
  return false
}

function scoreRepResult(r, machineName, nq, tokens){
  const name    = normalizeSearch(r.textoBreve || '')
  const alias   = normalizeSearch(r.alias || '')
  const sap     = normalizeSearch(r.codigoSAP || '')
  const fab     = normalizeSearch(r.codigoFabricante || r.codigoBaader || '')
  const desc    = normalizeSearch(r.descripcion || '')
  const ubic    = normalizeSearch(r.ubicacionEnPlanta || '')
  const mname   = normalizeSearch(machineName || '')
  const searchable = `${name} ${alias} ${sap} ${fab} ${desc} ${ubic} ${mname}`
  const words = searchable.split(' ').filter(Boolean)

  for (const t of tokens) if (t && !tokenMatchesText(t, searchable, words)) return 0

  let score = 1
  if (sap === nq)  score += 220
  if (fab === nq)  score += 180
  if (name === nq) score += 170
  if (sap.startsWith(nq))  score += 120
  if (fab.startsWith(nq))  score += 95
  if (name.startsWith(nq)) score += 90
  if (name.includes(nq))   score += 65
  if (alias.includes(nq))  score += 80
  if (fab.includes(nq))    score += 50
  if (desc.includes(nq))   score += 35
  if (mname.includes(nq))  score += 25
  if (ubic.includes(nq))   score += 20
  for (const t of tokens){
    if (!t) continue
    if (name.includes(t))  score += 25
    if (alias.includes(t)) score += 30
    if (sap.includes(t))   score += 22
    if (fab.includes(t))   score += 18
    if (desc.includes(t))  score += 10
    if (mname.includes(t)) score += 9
  }
  return score
}

async function loadAllRepuestos(){
  if (__repuestosCache && Date.now() - __repuestosCacheTs < HIERARCHY_CACHE_TTL) return
  // 1) localStorage hit → no Firestore reads (sólo para búsqueda global,
  // repCache por equipo se llena on-demand vía loadRepuestos para evitar
  // problemas con la dedup global por SAP)
  if (!__repuestosCache){
    const cached = lsGet(LS_KEY_REPUESTOS, LS_TTL_REP)
    if (cached){
      __repuestosCache = cached
      __repuestosCacheTs = Date.now()
      return
    }
  }
  if (__globalLoadInProgress) return
  __globalLoadInProgress = true

  const results = []
  const existingKeys = new Set()
  function addRep(r, machineId, machineName){
    const k = `${r.codigoSAP||''}|${r.codigoFabricante||r.codigoBaader||''}|${r.textoBreve||''}`
    if (k !== '||' && existingKeys.has(k)) return
    existingKeys.add(k)
    results.push({ repuesto: {...r, codigoFabricante: r.codigoFabricante || r.codigoBaader || ''}, machineId, machineName })
  }

  try {
    // Asegurar jerarquía cargada para conocer total de unidades a escanear
    await loadHierarchyTree()
    // No filtramos por activa: equipos archivados igual contienen repuestos válidos.
    // En hierarchy escaneamos TODOS los nodos activos (no solo leaf): un nodo
    // intermedio puede tener repuestos propios (ej: 'CINTA ACELERACION 1 GRADER'
    // tiene un MOTOREDUCTOR como subnodo y aún así tiene su propio repuesto SAP).
    const activeMachines = machines
    const leafNodes = Object.values(hierarchyNodesMap).filter(n => n.activo !== false)
    const totalUnits = activeMachines.length + leafNodes.length
    let done = 0
    const BATCH = 16

    updateSearchProgress(`Cargando repuestos… 0 / ${totalUnits}`, 0, totalUnits)

    // FASE 1: máquinas legacy
    for (let i = 0; i < activeMachines.length; i += BATCH){
      const batch = activeMachines.slice(i, i + BATCH)
      await Promise.all(batch.map(async m => {
        const reps = await loadRepuestos(m.id).catch(() => [])
        for (const r of reps) addRep(r, m.id, m.nombre)
      }))
      done += batch.length
      updateSearchProgress(`Cargando repuestos… ${done} / ${totalUnits}`, done, totalUnits)
    }

    // FASE 2: hierarchy own-repuestos
    for (let i = 0; i < leafNodes.length; i += BATCH){
      const batch = leafNodes.slice(i, i + BATCH)
      await Promise.all(batch.map(async node => {
        const snap = await db.collection('hierarchy').doc(node.id).collection('repuestos').get().catch(() => null)
        if (!snap) return
        snap.docs.forEach(d => addRep({id: d.id, ...d.data()}, node.id, node.nombre))
      }))
      done += batch.length
      updateSearchProgress(`Cargando repuestos… ${done} / ${totalUnits}`, done, totalUnits)
    }
  } catch(e){ console.warn('loadAllRepuestos error', e) }

  __repuestosCache = results
  __repuestosCacheTs = Date.now()
  lsSet(LS_KEY_REPUESTOS, normalizeForCache(results))
  __globalLoadInProgress = false
  updateSearchProgress(null)
}

function invalidateRepuestosCache(){
  __repuestosCache = null
  __repuestosCacheTs = 0
  try { localStorage.removeItem(LS_KEY_REPUESTOS) } catch {}
}

function updateSearchProgress(msg, loaded, total){
  const el = document.getElementById('search-progress')
  if (!el) return
  // Carga terminada → mostrar resumen del catálogo cargado
  if (!msg){ renderSearchStats(); return }
  el.style.display = 'block'

// Pre-calcula campos normalizados una sola vez para evitar normalizar en cada keystroke
function ensureSearchableHaystacks(){
  if (!__repuestosCache) return
  for (const item of __repuestosCache){
    if (item._hay) continue
    const r = item.repuesto
    item._hay = ' '
      + normalizeSearch(r.codigoSAP || '') + ' '
      + normalizeSearch(r.textoBreve || '') + ' '
      + normalizeSearch(r.alias || '') + ' '
      + normalizeSearch(r.codigoFabricante || r.codigoBaader || '') + ' '
      + normalizeSearch(r.descripcion || '') + ' '
      + normalizeSearch(r.nombreManual || '') + ' '
      + normalizeSearch(r.tipo || '') + ' '
      + normalizeSearch(r.ubicacionEnPlanta || '') + ' '
      + normalizeSearch(item.machineName || '') + ' '
  }
}

function searchGlobal(queryText){
  if (!__repuestosCache) return { repHits: [], machHits: [] }
  ensureSearchableHaystacks()
  const nq = normalizeSearch(queryText)
  if (!nq) return { repHits: [], machHits: [] }
  const tokens = nq.split(' ').filter(Boolean)

  // FASE 1: filtro rápido — descartar items donde NINGÚN token aparece como
  // substring (incluyendo sinónimos). Bajamos de ~4684 → ~50-300 candidatos.
  const candidates = []
  outer: for (const item of __repuestosCache){
    const hay = item._hay
    for (const t of tokens){
      if (hay.includes(t)) continue
      const syns = SYNONYM_LOOKUP[t]
      if (syns && syns.some(s => hay.includes(s))) continue
      // Token no encontrado y sin sinónimo → descartar (edit-distance fallback luego)
      continue outer
    }
    candidates.push(item)
  }

  // FASE 2 (fallback): si hay pocos candidatos, expandir con edit-distance
  // Esto es caro pero solo se hace cuando hay <3 matches y hay tokens largos
  if (candidates.length < 3 && tokens.some(t => t.length >= 4)){
    const seen = new Set(candidates)
    for (const item of __repuestosCache){
      if (seen.has(item)) continue
      const words = item._hay.split(' ').filter(w => w.length >= 4)
      const allMatch = tokens.every(t => {
        if (item._hay.includes(t)) return true
        if (t.length < 4) return false
        return words.some(w => editDistanceAtMostOne(t, w))
      })
      if (allMatch){
        candidates.push(item)
        if (candidates.length >= 30) break
      }
    }
  }

  // FASE 3: scoring solo de candidatos (fast)
  const repHits = candidates
    .map(item => ({ item, score: scoreRepResult(item.repuesto, item.machineName, nq, tokens) }))
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 50)
    .map(x => x.item)

  const machHits = machines.filter(m => matchesMachine(m, nq)).slice(0, 20)
  return { repHits, machHits }
}

function highlightMatch(text, rawQuery){
  if (!rawQuery || !text) return escHtml(String(text || ''))
  const norm = normalizeSearch(text)
  const nq   = normalizeSearch(rawQuery)
  const idx  = norm.indexOf(nq)
  if (idx === -1 || nq.length === 0) return escHtml(String(text))
  return escHtml(text.slice(0, idx))
    + '<mark>' + escHtml(text.slice(idx, idx + nq.length)) + '</mark>'
    + escHtml(text.slice(idx + nq.length))
}

function saveSearchHistory(query){
  if (!query?.trim()) return
  let hist = JSON.parse(localStorage.getItem('mant_search_history') || '[]')
  hist = [query.trim(), ...hist.filter(q => q !== query.trim())].slice(0, 20)
  localStorage.setItem('mant_search_history', JSON.stringify(hist))
}

function getSearchHistory(){
  return JSON.parse(localStorage.getItem('mant_search_history') || '[]')
}

function renderSearchBody(query){
  const body   = document.getElementById('search-body')
  const tabsEl = document.getElementById('search-sub-tabs')
  if (!body) return

  if (!query){
    if (tabsEl) tabsEl.innerHTML = ''
    body.innerHTML = renderSearchHistoryHtml()
    return
  }

  let repHits, machHits

  if (__repuestosCache){
    // Global scored search
    const res = searchGlobal(query)
    repHits  = res.repHits
    machHits = res.machHits
  } else {
    // Fallback: repuestos ya en repCache, carga el resto en background
    const q = normalizeSearch(query)
    machHits = machines.filter(m => matchesMachine(m, q))
    repHits  = []
    for (const [mId, reps] of Object.entries(repCache)){
      for (const r of reps)
        if (matchesRepuesto(r, q))
          repHits.push({ repuesto: r, machineId: mId, machineName: machineMap[mId]?.nombre || '' })
    }
    loadAllRepuestos().then(() => {
      const cur = document.getElementById('search-input')?.value?.trim()
      if (cur === query) renderSearchBody(query)
    })
  }

  // Filtro por lista de favoritos
  if (searchFavFilter === '*'){
    repHits  = repHits.filter(isRepuestoFavorite)
    machHits = machHits.filter(m => isMachineFavorite(m.id))
  } else if (searchFavFilter !== 'all'){
    const list = (prefs.favoriteLists || []).find(l => l.name === searchFavFilter)
    // Expansión jerárquica: si la lista tiene un nodo padre, matchear también
    // todos sus descendientes (ej: lista 'Cintas' con 'Eviscerado' debe traer
    // repuestos de cualquier cinta dentro de esa rama).
    const idSet = expandListIdsHierarchically(list?.machineIds || [])
    repHits  = repHits.filter(it => idSet.has(it.machineId))
    machHits = machHits.filter(m => idSet.has(m.id))
  }

  // Filtro "Solo con SAP" (aplica solo a repuestos)
  if (searchSapOnly){
    repHits = repHits.filter(it => (it.repuesto.codigoSAP || '').trim().length > 0)
  }

  if (repHits.length === 0 && machHits.length === 0){
    if (tabsEl) tabsEl.innerHTML = ''
    const filterHint = (searchFavFilter !== 'all' || searchSapOnly)
      ? ` con los filtros activos. Probá quitar filtros.` : ''
    body.innerHTML = emptyHtml('🔍','Sin resultados',
      `Sin coincidencias para "<b>${escHtml(query)}</b>"${filterHint}`)
    return
  }

  // Sub-tabs con conteos
  if (tabsEl){
    tabsEl.innerHTML = `<div class="chips" style="padding:6px 12px 2px">
      <div class="chip ${searchTabActive==='repuestos'?'active':''}"
           onclick="setSearchTab('repuestos','${escHtmlAttr(query)}')">
        Repuestos <span class="count">${repHits.length}</span>
      </div>
      <div class="chip ${searchTabActive==='equipos'?'active':''}"
           onclick="setSearchTab('equipos','${escHtmlAttr(query)}')">
        Equipos <span class="count">${machHits.length}</span>
      </div>
    </div>`
  }

  if (searchTabActive === 'repuestos'){
    if (repHits.length === 0){
      body.innerHTML = emptyHtml('📦','Sin repuestos','Prueba la pestaña Equipos')
      return
    }
    body.innerHTML = `<div class="cell-group">
      ${repHits.map(({repuesto: r, machineId, machineName}) => `
        <div class="cell" onclick="openRepuesto('${escHtmlAttr(machineId)}','${escHtmlAttr(r.id)}')">
          <div class="cell-icon">${repIcon(r.tipo)}</div>
          <div class="cell-body">
            <div class="cell-title">${highlightMatch(r.textoBreve || r.alias || 'Sin nombre', query)}</div>
            ${r.codigoSAP
              ? `<div class="cell-meta">SAP ${highlightMatch(r.codigoSAP, query)}</div>` : ''}
            <div class="cell-sub">${escHtml(machineName || '')}${r.tipo
              ? ` · <span style="color:var(--accent-dim,var(--accent))">${escHtml(r.tipo)}</span>` : ''}</div>
          </div>
          <div class="cell-chevron">›</div>
        </div>`).join('')}
    </div>`
  } else {
    if (machHits.length === 0){
      body.innerHTML = emptyHtml('🏭','Sin equipos','Prueba la pestaña Repuestos')
      return
    }
    body.innerHTML = `<div class="cell-group">
      ${machHits.map(m => machineCellHtml(m)).join('')}
    </div>`
  }
}

function renderSearchFilterChips(){
  const lists = prefs.favoriteLists || []
  const chip = (key, label, active) =>
    `<div class="chip ${active?'active':''}" onclick="setSearchFavFilter('${escHtmlAttr(key)}')">${label}</div>`
  let html = chip('all', 'Todos', searchFavFilter === 'all')
  if (lists.length > 0){
    html += chip('*', '★ Cualquier favorito', searchFavFilter === '*')
    for (const l of lists){
      html += chip(l.name, escHtml(l.name), searchFavFilter === l.name)
    }
  }
  html += `<div class="chip ${searchSapOnly?'active':''}" onclick="toggleSearchSapOnly()" style="margin-left:6px">
    🏷️ Solo con SAP</div>`
  return html
}

  const chipsEl = document.getElementById('search-filter-chips')
  if (chipsEl) chipsEl.innerHTML = renderSearchFilterChips()
  const inp = document.getElementById('search-input')

}

function isMachineFavorite(machineId){
  return (prefs.favoriteLists || []).some(l =>
    (l.equipmentIds || []).includes(machineId)
    || (l.machineIds || []).includes(machineId)
  )
}

function isRepuestoFavorite(item){
  if (isMachineFavorite(item.machineId)) return true
  const subLists = prefs.repuestoFavLists?.[item.machineId] || []
  if (subLists.length === 0) return false
  for (const l of subLists){
    const idSet = new Set(l.repuestoIds || [])
    if (idSet.has(item.repuesto.id)) return true
    if (matchesRepFavList(item.repuesto, idSet)) return true
  }
  return false
}

function matchesMachine(m, normQ){
  return normalizeSearch(m.nombre).includes(normQ)
    || normalizeSearch(m.marca).includes(normQ)
    || normalizeSearch(m.modelo).includes(normQ)
    || normalizeSearch(m.descripcion).includes(normQ)
    || normalizeSearch(m.seccion).includes(normQ)
}


function normalizeSearch(s){
  if (!s) return ''
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()
}

function matchesRepuesto(r, normQ){
  return normalizeSearch(r.codigoSAP).includes(normQ)
    || normalizeSearch(r.textoBreve).includes(normQ)
    || normalizeSearch(r.descripcion).includes(normQ)
    || normalizeSearch(r.alias).includes(normQ)
    || normalizeSearch(r.codigoFabricante).includes(normQ)
    || normalizeSearch(r.nombreManual).includes(normQ)
    || normalizeSearch(r.tipo).includes(normQ)
    || normalizeSearch(r.ubicacionEnPlanta).includes(normQ)
}

    }).catch(() => {})

  const m = machineMap[machineId]

function renderMachineBody(machineId, reps, favLists){
  const m = machineMap[machineId]
  const countEl    = document.getElementById('rep-count')
  const chipsEl    = document.getElementById('rep-chips')
  const listEl     = document.getElementById('rep-list')
  if (!listEl) return  // user navigated away

  if (reps.length === 0){
    if (countEl)   countEl.textContent = '0'
    if (chipsEl)   chipsEl.innerHTML = ''
    listEl.innerHTML = emptyHtml('📭','Sin repuestos','Este equipo no tiene repuestos cargados aún')
    return
  }

  // Search query from DOM
  const searchQ = normalizeSearch(document.getElementById('rep-search-input')?.value || '')

  // Filter chain: favList → search
  let filtered = reps
  if (activeMachineRepFilter){
    const list = favLists.find(l => l.name === activeMachineRepFilter)
    if (list){
      const idSet = new Set(list.repuestoIds)
      filtered = filtered.filter(r => matchesRepFavList(r, idSet))
    }
  }
  if (searchQ){
    filtered = filtered.filter(r =>
      normalizeSearch(r.textoBreve || '').includes(searchQ) ||
      normalizeSearch(r.codigoSAP || '').includes(searchQ) ||
      normalizeSearch(r.alias || '').includes(searchQ) ||
      normalizeSearch(r.descripcion || '').includes(searchQ)
    )
  }

  // FavList chips
  if (chipsEl){
    if (favLists.length > 0){
      chipsEl.innerHTML = `<div class="chips">
        <div class="chip ${activeMachineRepFilter===null?'active':''}"
             onclick="setMachineRepFilter('${escHtmlAttr(machineId)}', null)">
          Todos <span class="count">${reps.length}</span>
        </div>
        ${favLists.map(l => {
          const cnt = reps.filter(r => matchesRepFavList(r, new Set(l.repuestoIds))).length
          return `<div class="chip ${activeMachineRepFilter===l.name?'active':''}"
                   onclick="setMachineRepFilter('${escHtmlAttr(machineId)}', ${escHtmlAttr(JSON.stringify(l.name))})">
            ${escHtml(l.name)} <span class="count">${cnt}</span>
          </div>`
        }).join('')}
      </div>`
    } else {

    }
  }

  if (countEl) countEl.textContent = filtered.length < reps.length ? `${filtered.length}/${reps.length}` : `${reps.length}`

function showMoveToSubListSheet(listName, machineId, fromIdx){
  const list = prefs.favoriteLists.find(l => l.name === listName)

  }

async function executeMoveToSubList(listName, machineId, fromIdx, toIdx){
  closeSheet()
  const list = prefs.favoriteLists.find(l => l.name === listName)
  if (!list) return
  const subLists = list.subLists || []

  // list.machineIds es la UNIÓN de todos los equipos: no se toca aquí.
  // Solo gestionamos la membresía en sl.machineIds (dentro de qué sub-lista cae).

  // 1. Quitar de la sub-lista origen (si venía de una sub-lista)
  if (fromIdx >= 0){
    const src = subLists[fromIdx]
    if (src) src.machineIds = (src.machineIds || []).filter(id => id !== machineId)
  }
  // Si fromIdx === -1 el equipo estaba "sin categoría" (no en ninguna sl.machineIds) → nada que quitar

  // 2. Agregar a la sub-lista destino (si va a una sub-lista)
  if (toIdx >= 0){
    const dst = subLists[toIdx]
    if (dst && !(dst.machineIds || []).includes(machineId)){
      dst.machineIds = [...(dst.machineIds || []), machineId]
    }
  }
  // Si toIdx === -1 el equipo queda "sin categoría" → ya está en list.machineIds, no hay sl destino

  // Siempre re-renderizar en memoria (datos ya actualizados)
  const destName = toIdx === -1 ? 'Sin categoría' : subLists[toIdx]?.name || ''
  if (fromIdx >= 0){
    openSubList(listName, fromIdx, { push: false })
  } else {
    _renderMachineListView(list, { push: false })
  }

  // Persistir en Firestore (falla silenciosamente en preview)
  saveAllPrefs().then(() => {
    showToast(`Movido a "${destName}" ✓`, 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
  }).catch(err => {
    if (IS_PREVIEW) showToast(`Movido a "${destName}" (preview)`, 'ok')
    else showToast('Error al guardar: ' + (err.message || ''), 'err')
  })
}
