<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Repuestos · Antarfood</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:      var(--tg-theme-bg-color,#17212b);
  --bg2:     var(--tg-theme-secondary-bg-color,#232e3c);
  --text:    var(--tg-theme-text-color,#f5f5f5);
  --hint:    var(--tg-theme-hint-color,#7d8b99);
  --accent:  var(--tg-theme-button-color,#5288c1);
  --acctxt:  var(--tg-theme-button-text-color,#ffffff);
  --link:    var(--tg-theme-link-color,#6ab3f3);
  --danger:  #e53935;
  --green:   #4fae4e;
  --warn:    #f5a623;
  --divider: rgba(255,255,255,.07);
  --hover:   rgba(255,255,255,.04);
  --press:   rgba(255,255,255,.08);
  --vh:      100dvh;
}

html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.4;overflow:hidden;overscroll-behavior:none}

#app{display:flex;flex-direction:column;height:var(--vh);width:100%;overflow:hidden}

/* ── Header ─────────────────────────────────────────────────────────── */
.app-header{height:54px;min-height:54px;display:flex;align-items:center;
  padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--divider);
  flex-shrink:0;gap:6px}
.app-header .back-btn{width:40px;height:40px;border-radius:50%;border:none;
  background:transparent;color:var(--text);font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.app-header .back-btn:active{background:var(--press)}
.app-header .title-block{flex:1;min-width:0;padding:0 6px}
.app-header .title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.app-header .subtitle{font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.app-header .status{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;
  padding:3px 9px;border-radius:99px;flex-shrink:0;margin-right:6px}
.app-header .status::before{content:'';width:6px;height:6px;border-radius:50%}
.s-ok{background:rgba(79,174,78,.15);color:var(--green)}
.s-ok::before{background:var(--green)}
.s-err{background:rgba(229,57,53,.15);color:var(--danger)}
.s-err::before{background:var(--danger)}
.s-loading{background:rgba(125,139,153,.12);color:var(--hint)}
.s-loading::before{background:var(--hint);animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

/* ── Content ────────────────────────────────────────────────────────── */
#content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{display:none;min-height:100%;padding-bottom:24px}
.view.active{display:block}
#view-home{padding-top:2px}

/* ── Bottom nav ─────────────────────────────────────────────────────── */
.bottom-nav{height:58px;min-height:58px;display:flex;background:var(--bg2);
  border-top:1px solid var(--divider);flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;color:var(--hint);font-size:11px;font-weight:500;
  cursor:pointer;transition:color .15s;position:relative;padding:0}
.nav-btn .icon{font-size:22px;line-height:1}
.nav-btn.active{color:var(--accent)}

/* ── Loading ────────────────────────────────────────────────────────── */
#loading{position:fixed;inset:0;background:var(--bg);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.loader{width:32px;height:32px;border:3px solid rgba(255,255,255,.1);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-msg{color:var(--hint);font-size:14px;padding:0 24px;text-align:center;max-width:340px}
#loading-retry{display:none;margin-top:10px;padding:10px 22px;background:var(--accent);
  color:var(--acctxt);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}

/* ── Search bar ─────────────────────────────────────────────────────── */
.search-bar{padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--divider)}
.search-wrap{position:relative}
.search-input{width:100%;height:38px;padding:0 36px 0 36px;background:var(--bg2);
  border:1px solid transparent;border-radius:10px;color:var(--text);
  font-size:15px;outline:none;transition:border-color .15s}
.search-input::placeholder{color:var(--hint)}
.search-input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:15px;pointer-events:none;color:var(--hint)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:none;background:rgba(255,255,255,.08);color:var(--hint);font-size:14px;
  cursor:pointer;width:22px;height:22px;border-radius:50%;
  display:none;align-items:center;justify-content:center;padding:0;line-height:1}
.search-clear.show{display:flex}

/* ── Section header ─────────────────────────────────────────────────── */
.section{padding:16px 16px 6px;display:flex;align-items:center;justify-content:space-between}
.section-title{font-size:13px;font-weight:600;color:var(--hint);
  text-transform:uppercase;letter-spacing:.5px}
.section-count{font-size:12px;color:var(--hint);font-weight:500}

/* ── Cell (Telegram-style list row) ─────────────────────────────────── */
.cell{display:flex;align-items:center;padding:11px 16px;gap:12px;
  cursor:pointer;transition:background .12s;background:var(--bg2);
  position:relative}
.cell:active{background:var(--press)}
.cell + .cell::before{content:'';position:absolute;top:0;left:60px;right:0;
  height:1px;background:var(--divider)}
.cell-icon{width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.cell-body{flex:1;min-width:0}
.cell-title{font-weight:500;font-size:15px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.cell-sub{font-size:12px;color:var(--hint);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-meta{font-size:11px;color:var(--link);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
.cell-trailing{color:var(--hint);font-size:14px;flex-shrink:0;display:flex;align-items:center;gap:6px}
.cell-chevron{color:var(--hint);font-size:18px;flex-shrink:0;line-height:1;margin-left:6px}
.cell-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;
  background:rgba(82,136,193,.18);color:var(--link);flex-shrink:0;white-space:nowrap;margin-right:2px}
.cell-badge.muted{background:rgba(255,255,255,.06);color:var(--hint)}
.cell-badge.warn{background:rgba(245,166,35,.15);color:var(--warn)}

.cell-group{background:var(--bg2);margin:0 0 8px;overflow:hidden}
.cell-group + .section{padding-top:10px}

/* Card compuesta: cell + chips de subitems debajo (Repuestos guardados) */
.compound-card{background:var(--bg2);margin:0 0 8px;overflow:hidden}
.compound-card + .compound-card{margin-top:0}
.cell-chips{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap}
.cell-chip{padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:500;
  background:rgba(255,255,255,.07);color:var(--text);cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;line-height:1.3;
  border:1px solid rgba(255,255,255,.05);transition:background .12s}
.cell-chip:active{background:rgba(255,255,255,.14)}
.cell-chip .n{opacity:.6;font-size:11px;font-weight:400}

/* ── Chips ──────────────────────────────────────────────────────────── */
.chips{display:flex;gap:7px;padding:10px 12px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;background:var(--bg);
  /* fade-out a la derecha como indicador de scroll horizontal */
  mask-image:linear-gradient(to right, black calc(100% - 18px), transparent 100%);
  -webkit-mask-image:linear-gradient(to right, black calc(100% - 18px), transparent 100%)}
.chips::-webkit-scrollbar{display:none}
.chips.sticky-top{position:sticky;top:0;z-index:5;
  border-bottom:1px solid var(--divider)}
.chip{padding:7px 14px;border-radius:99px;font-size:13px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;
  border:1px solid var(--divider);color:var(--text);background:var(--bg2)}
.chip:active{background:var(--press)}
.chip.active{background:var(--accent);color:var(--acctxt);border-color:var(--accent)}
.chip .count{opacity:.65;margin-left:5px;font-weight:400}
.chip.active .count{opacity:.85}

/* ── Info card ─────────────────────────────────────────────────────── */
.info-card{background:var(--bg2);margin:0 0 8px;overflow:hidden}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;
  padding:11px 16px;gap:14px;position:relative}
.info-row + .info-row::before{content:'';position:absolute;top:0;left:16px;right:16px;
  height:1px;background:var(--divider)}
.info-label{font-size:13px;color:var(--hint);flex-shrink:0;min-width:90px}
.info-value{font-size:14px;text-align:right;word-break:break-word;font-weight:500;flex:1}
.info-value.code{font-family:ui-monospace,Menlo,monospace;color:var(--link);font-size:13px}
.info-value.obs{text-align:left;color:var(--text);font-size:13.5px;line-height:1.5;font-weight:400}

/* ── Empty / error states ───────────────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 32px;gap:10px;text-align:center;min-height:240px}
.empty-icon{font-size:54px;opacity:.35;line-height:1}
.empty-title{font-weight:600;font-size:15px}
.empty-sub{font-size:13px;color:var(--hint);line-height:1.5;max-width:280px}

/* ── Greeting ──────────────────────────────────────────────────────── */
.hello{padding:18px 16px 8px}
.hello-text{font-size:20px;font-weight:600;line-height:1.2}
.hello-sub{font-size:13px;color:var(--hint);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px}
.tag.green{background:rgba(79,174,78,.15);color:var(--green)}
.tag.warn{background:rgba(245,166,35,.15);color:var(--warn)}

/* ── Photo gallery ─────────────────────────────────────────────────── */
.gallery{display:flex;gap:8px;padding:10px 14px 14px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--bg2)}
.gallery::-webkit-scrollbar{display:none}
.gallery-img{width:130px;height:96px;border-radius:9px;object-fit:cover;
  flex-shrink:0;background:var(--bg);cursor:pointer}
.gallery-img:active{opacity:.85}

/* ── Photo hero ────────────────────────────────────────────────────── */
.photo-hero{width:100%;aspect-ratio:16/10;background:var(--bg2);
  display:flex;align-items:center;justify-content:center;
  font-size:64px;color:var(--hint);overflow:hidden;cursor:pointer}
.photo-hero img{width:100%;height:100%;object-fit:cover}

/* ── Lightbox ──────────────────────────────────────────────────────── */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:300;
  display:none;align-items:center;justify-content:center;flex-direction:column;
  padding:env(safe-area-inset-top,12px) 0 env(safe-area-inset-bottom,12px)}
#lightbox.open{display:flex}
#lightbox img{max-width:96vw;max-height:72vh;border-radius:8px;object-fit:contain}
#lightbox .lbx-close{position:absolute;top:env(safe-area-inset-top,12px);right:14px;
  color:#fff;background:rgba(0,0,0,.4);border-radius:50%;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;border:none;
  font-size:22px;cursor:pointer}
#lightbox .lbx-cap{color:rgba(255,255,255,.75);font-size:12px;margin-top:10px;padding:0 18px;text-align:center}
#lbx-actions{display:none;gap:8px;margin-top:14px;padding:0 14px}
#lbx-actions.show{display:flex}
.lbx-btn{padding:10px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:6px}
.lbx-btn:active{background:rgba(255,255,255,.16)}
.lbx-btn:disabled{opacity:.5;cursor:not-allowed}
.lbx-btn.principal{background:rgba(245,166,35,.18);border-color:#f5a623;color:#f5a623}
.lbx-btn.principal.is-active{background:#f5a623;color:#000}
.lbx-btn.danger{background:rgba(229,57,53,.15);border-color:#e53935;color:#e53935}

/* ── Skeleton ──────────────────────────────────────────────────────── */
@keyframes shimmer{0%{background-position:-300px 0}100%{background-position:300px 0}}
.skel{background:linear-gradient(90deg,var(--bg2) 0%,rgba(255,255,255,.06) 50%,var(--bg2) 100%);
  background-size:600px 100%;animation:shimmer 1.4s infinite linear;border-radius:6px}
.skel-cell{display:flex;align-items:center;padding:11px 16px;gap:12px;background:var(--bg2)}
.skel-icon{width:38px;height:38px;border-radius:9px}
.skel-line{height:13px;flex:1}
.skel-line.short{max-width:120px;margin-top:6px}

/* ── Inline notice ─────────────────────────────────────────────────── */
.notice{padding:12px 16px;font-size:13px;color:var(--hint);background:var(--bg2);
  margin:0 0 8px;border-left:3px solid var(--warn)}
.notice b{color:var(--text)}

/* ── Header action buttons (edit / fav) ────────────────────────────── */
.edit-btn{width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(82,136,193,.14);color:var(--text);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;
  margin:0 3px;padding:0;font-family:inherit}
.edit-btn:active{background:rgba(82,136,193,.28);transform:scale(.92)}
.edit-btn:disabled{opacity:.5}
.edit-btn.fav-on{background:rgba(245,166,35,.2);color:#f5a623}

/* ── Form (edición de repuesto) ─────────────────────────────────────── */
.form-card{background:var(--bg2);margin:0 0 8px;padding:0 0 4px}
.form-row{display:flex;flex-direction:column;padding:10px 16px;gap:5px;position:relative}
.form-row + .form-row::before{content:'';position:absolute;top:0;left:16px;right:16px;
  height:1px;background:var(--divider)}
.form-label{font-size:11px;color:var(--hint);font-weight:600;
  text-transform:uppercase;letter-spacing:.4px}
.form-input,.form-textarea{width:100%;background:var(--bg);
  border:1px solid var(--divider);border-radius:8px;padding:9px 11px;
  color:var(--text);font-size:14.5px;outline:none;font-family:inherit;
  transition:border-color .15s}
.form-input:focus,.form-textarea:focus{border-color:var(--accent)}
.form-input.code{font-family:ui-monospace,Menlo,monospace;color:var(--link)}
.form-textarea{resize:none;min-height:78px;line-height:1.4}
.form-actions{display:flex;gap:8px;padding:14px 14px 18px;background:var(--bg)}
.btn-save{flex:2;padding:12px;border-radius:10px;border:none;background:var(--accent);
  color:var(--acctxt);font-size:15px;font-weight:600;cursor:pointer}
.btn-save:active{opacity:.85}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.btn-cancel{flex:1;padding:12px;border-radius:10px;border:1px solid var(--divider);
  background:transparent;color:var(--text);font-size:15px;font-weight:500;cursor:pointer}
.btn-cancel:active{background:var(--press)}

/* ── Upload buttons (admin only) ────────────────────────────────────── */
.upload-row{display:flex;gap:8px;padding:10px 14px 14px;background:var(--bg2)}
.upload-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 10px;border-radius:10px;border:1px dashed rgba(82,136,193,.45);
  background:rgba(82,136,193,.08);color:var(--accent);
  font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;line-height:1}
.upload-btn:active{background:rgba(82,136,193,.16);transform:scale(.98)}
.upload-btn:disabled{opacity:.5;cursor:not-allowed}
.upload-btn .ico{font-size:18px}

/* ── Upload progress overlay ────────────────────────────────────────── */
#uploading{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:250;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#uploading.open{display:flex}
#uploading .loader{width:40px;height:40px}
#uploading-msg{color:#fff;font-size:14px;text-align:center;padding:0 24px;max-width:300px}

/* ── Bottom sheet ───────────────────────────────────────────────────── */
#sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:160;
  display:none;opacity:0;transition:opacity .22s}
#sheet-overlay.open{display:block;opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);
  border-radius:16px 16px 0 0;z-index:170;
  padding-bottom:env(safe-area-inset-bottom);transform:translateY(100%);
  transition:transform .25s ease;max-height:78vh;overflow-y:auto;
  display:flex;flex-direction:column}
#sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);
  margin:10px auto 4px;flex-shrink:0}
.sheet-title{font-size:16px;font-weight:700;padding:6px 16px 12px;
  border-bottom:1px solid var(--divider);flex-shrink:0}
.sheet-list{padding:4px 0}
.sheet-row{display:flex;align-items:center;padding:13px 16px;gap:12px;
  cursor:pointer;transition:background .12s;position:relative}
.sheet-row:active{background:var(--press)}
.sheet-row + .sheet-row::before{content:'';position:absolute;top:0;left:50px;right:16px;
  height:1px;background:var(--divider)}
.sheet-row .ico{font-size:20px;width:32px;flex-shrink:0;text-align:center;line-height:1}
.sheet-row .body{flex:1;min-width:0}
.sheet-row .name{font-size:14.5px;font-weight:500;line-height:1.3}
.sheet-row .sub{font-size:11px;color:var(--hint);margin-top:2px}
.sheet-row .check{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:transparent;transition:all .15s}
.sheet-row.on .check{background:var(--accent);border-color:var(--accent);color:var(--acctxt)}
.sheet-row.disabled{opacity:.5;pointer-events:none}
.sheet-new{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;
  color:var(--accent);font-size:14.5px;font-weight:500;
  border-top:1px solid var(--divider)}
.sheet-new:active{opacity:.7}
.sheet-empty{padding:22px 16px;text-align:center;color:var(--hint);font-size:13px}
.sheet-foot{padding:0 16px env(safe-area-inset-bottom,12px)}

/* ── Modal (input) ───────────────────────────────────────────────────── */
#input-modal{position:fixed;inset:0;z-index:230;display:none;
  align-items:center;justify-content:center;padding:24px}
#input-modal.open{display:flex}
#input-modal .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#input-modal .box{position:relative;background:var(--bg2);border-radius:14px;
  padding:18px;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#input-modal .ttl{font-size:16px;font-weight:700;margin-bottom:12px}
#input-modal input{width:100%;padding:10px 12px;background:var(--bg);
  border:1px solid var(--divider);border-radius:8px;color:var(--text);
  font-size:15px;outline:none;margin-bottom:14px;font-family:inherit}
#input-modal input:focus{border-color:var(--accent)}
#input-modal .btns{display:flex;gap:8px;justify-content:flex-end}

/* ── Toast ──────────────────────────────────────────────────────────── */
#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg2);color:var(--text);padding:11px 18px;border-radius:99px;
  font-size:13px;font-weight:500;z-index:240;opacity:0;pointer-events:none;
  transition:opacity .25s, transform .25s;border:1px solid var(--divider);
  box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>

<div id="app">
  <header class="app-header">

<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════
const CF_BASE = 'https://us-central1-mantenimiento-planta-771a3.cloudfunctions.net'
const MAX_RECENTS = 10

firebase.initializeApp({
  apiKey: "AIzaSyBsJSh6x3ZGEyuXsM18dSWsJKyU7--KJss",
  authDomain: "mantenimiento-planta-771a3.firebaseapp.com",
  projectId: "mantenimiento-planta-771a3",
  storageBucket: "mantenimiento-planta-771a3.firebasestorage.app",
})
const db      = firebase.firestore()
const auth    = firebase.auth()
const storage = firebase.storage()
const tgApp   = window.Telegram?.WebApp

// ═══════════════════════════════════════════════════════════════════
// VIEWPORT — fix scroll en Telegram WebView
// ═══════════════════════════════════════════════════════════════════
function setVH(){
  const h = tgApp?.viewportStableHeight || tgApp?.viewportHeight || window.innerHeight
  document.documentElement.style.setProperty('--vh', h + 'px')
}
setVH()
tgApp?.onEvent?.('viewportChanged', setVH)
window.addEventListener('resize', setVH)

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
let uid = null, userRole = 'usuario', isAuthorized = false, isLinked = false, firstName = ''
let currentTab = 'home'
let navStack = []   // [{viewId, title, subtitle, scrollTop}]

let machines = [], machineMap = {}
let categories = [], allCategoriesMap = {}, categoryDescendants = {}
let repCache = {}              // machineId → repuesto[]
let prefs = { favoriteLists: [], repuestoFavLists: {} }
let machineLinkedNodes = {}    // machineId → [hierarchyNodeId]
let nodeNameCache = {}         // nodeId → resolved name

let activeCatFilter = 'all'
let activeMachineRepFilter = null
let recentIds = []
let searchTimer = null

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
async function init(){
  tgApp?.ready()
  tgApp?.expand()

  loadRecents()
  setLoadingMsg('Autenticando…')

  const initData = tgApp?.initData
  if (!initData) {
    setLoadingError('Abrí esta app desde el bot @antarfood_mant_bot.')
    return
  }
  try {
    const resp = await fetch(`${CF_BASE}/mintTelegramAuthToken`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData }),
    })
    if (!resp.ok) {
      const err = await resp.json().catch(()=>({}))
      setLoadingError(err.error || `Error ${resp.status}`)
      return
    }
    const data = await resp.json()
    setLoadingMsg('Iniciando sesión…')
    await auth.signInWithCustomToken(data.token)
    uid = data.uid
    userRole = data.role || 'usuario'
    isAuthorized = data.authorized
    isLinked = data.isLinked || false
    firstName = data.firstName || tgApp?.initDataUnsafe?.user?.first_name || ''

    if (!isAuthorized) {
      setLoadingError('Tu grupo de Telegram no está autorizado. Contactá al administrador.')
      return
    }
    setLoadingMsg('Cargando datos…')
    await Promise.all([loadCategories(), loadMachines(), loadPrefs()])
    showApp()
  } catch (err) {
    console.error('init error', err)
    setLoadingError('Error de conexión: ' + (err.message || 'desconocido'))
  }
}

function setLoadingMsg(m){ document.getElementById('loading-msg').textContent = m
  document.getElementById('loading-retry').style.display='none' }
function setLoadingError(m){ document.getElementById('loading-msg').textContent = m
  document.getElementById('loading-retry').style.display='block' }

function showApp(){
  document.getElementById('loading').style.display = 'none'
  setStatus('ok', isAuthorized ? 'conectado' : 'sólo lectura')
  renderHome()
  renderSearchEmpty()
  // Pre-cargar repCache en background (mejora: muestra counts en cards)
  preloadRepCounts()
  // Listeners real-time (sync con PWA y otros dispositivos)
  startPrefsListener()
  startMachinesListener()
}

/** Listener real-time de la colección machines.
 *  Si admin edita un equipo en la PWA, los cambios aparecen acá sin reload. */
let machinesUnsub = null
function startMachinesListener(){
  if (machinesUnsub) return
  machinesUnsub = db.collection('machines').onSnapshot(snap => {
    machines = snap.docs.map(d => ({id:d.id, ...d.data()}))
      .sort((a,b) => (a.orden||0) - (b.orden||0))
    machineMap = Object.fromEntries(machines.map(m => [m.id, m]))
    if (currentTab === 'home') renderHomeCatalog()
  }, err => console.warn('machines listener error', err))
}

async function preloadRepCounts(){
  // Cargar conteos de repuestos para los primeros equipos sin bloquear
  const targets = machines.slice(0, 12)  // top 12 para no abrumar
  for (const m of targets){
    if (repCache[m.id]) continue
    try { await loadRepuestos(m.id) } catch {}
    // Re-renderizar el catalog si está visible (poco frecuente, batched)
    if (currentTab === 'home') renderHomeCatalog()
  }
}

function setStatus(type, label){
  const el = document.getElementById('status')
  el.className = 'status ' + (type==='ok'?'s-ok':type==='err'?'s-err':'s-loading')
  el.textContent = label
}

// ═══════════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════════
async function loadCategories(){
  const snap = await db.collection('machineCategories').get()
  const all = snap.docs.map(d => ({id:d.id, ...d.data()}))
    .filter(c => c.activa !== false && c.visible !== false)
  allCategoriesMap = Object.fromEntries(all.map(c => [c.id, c]))
  categories = all.filter(c => !c.parentId).sort((a,b) => (a.orden||0) - (b.orden||0))
  categoryDescendants = {}
  for (const top of categories) {
    const set = new Set([top.id])
    const stack = [top.id]
    while (stack.length){
      const p = stack.pop()
      for (const c of all) if (c.parentId === p && !set.has(c.id)){ set.add(c.id); stack.push(c.id) }
    }
    categoryDescendants[top.id] = set
  }
}

async function loadMachines(){
  const snap = await db.collection('machines').get()
  machines = snap.docs.map(d => ({id:d.id, ...d.data()}))
    .sort((a,b) => (a.orden||0) - (b.orden||0))
  machineMap = Object.fromEntries(machines.map(m => [m.id, m]))
}

async function loadRepuestos(machineId){
  if (repCache[machineId]) return repCache[machineId]
  const snap = await db.collection(`machines/${machineId}/repuestos`).orderBy('codigoSAP').get()
  repCache[machineId] = snap.docs.map(d => ({id:d.id, ...d.data()}))
  return repCache[machineId]
}

async function loadPrefs(){
  if (!uid) return
  const doc = await db.collection('user_preferences').doc(uid).get()
  if (doc.exists) {
    const d = doc.data()
    prefs = {
      favoriteLists:    d.favoriteLists    || [],
      repuestoFavLists: d.repuestoFavLists || {},
    }
  }
}

/** Listener real-time: cambios hechos en la PWA o desde otro dispositivo se reflejan acá */
let prefsUnsub = null
let _ignoreNextPrefsUpdate = false  // flag para evitar re-render circular tras savePrefs local
function startPrefsListener(){
  if (!uid || prefsUnsub) return
  prefsUnsub = db.collection('user_preferences').doc(uid).onSnapshot(snap => {
    if (!snap.exists) return
    const d = snap.data()
    const next = {
      favoriteLists:    d.favoriteLists    || [],
      repuestoFavLists: d.repuestoFavLists || {},
    }
    // Si las prefs no cambiaron (mismo writer somos nosotros), evitar re-render
    if (JSON.stringify(next) === JSON.stringify(prefs)) return
    prefs = next
    // Re-renderear home si está activa
    if (currentTab === 'home') renderHome()
    // Refresh fav button si estamos en detalle
    const repView = document.getElementById('view-repuesto')
    if (repView?.classList.contains('active') && activeUploadCtx){
      updateFavBtnState(activeUploadCtx.machineId, activeUploadCtx.repuestoId)
    }
    // Si el sheet de favoritos está abierto, re-renderearlo
    if (favSheetCtx){
      openFavListsSheet(favSheetCtx.machineId, favSheetCtx.repuestoId)
    }
  }, err => console.warn('prefs listener error', err))
}

async function getLinkedNodeIds(machineId){
  if (machineLinkedNodes[machineId]) return machineLinkedNodes[machineId]
  try {
    const snap = await db.collection('hierarchy').where('linkedMachineId','==',machineId).get()
    const ids = snap.docs.map(d => d.id)
    machineLinkedNodes[machineId] = ids
    return ids
  } catch(e){ machineLinkedNodes[machineId] = []; return [] }
}

async function getMachineFavListsMerged(machineId){
  const repFavLists = prefs.repuestoFavLists || {}
  const nodeIds = await getLinkedNodeIds(machineId)
  const keys = [...nodeIds, machineId]
  const merged = new Map()
  for (const k of keys){
    for (const l of (repFavLists[k] || [])) {
      if (!merged.has(l.name)) merged.set(l.name, new Set())
      ;(l.repuestoIds || []).forEach(id => merged.get(l.name).add(id))
    }
  }
  return Array.from(merged.entries()).map(([name, set]) => ({name, repuestoIds: Array.from(set)}))
}

function matchesRepFavList(rep, idSet){
  if (idSet.has(rep.id)) return true
  if (rep.codigoSAP && idSet.has(`inv-${rep.codigoSAP}`)) return true
  if (rep.codigoSAP && idSet.has(rep.codigoSAP)) return true
  return false
}

async function resolveNodeName(nodeId){
  if (nodeNameCache[nodeId]) return nodeNameCache[nodeId]
  try {
    const snap = await db.collection('hierarchy').doc(nodeId).get()
    if (snap.exists){
      const d = snap.data()
      const name = (d.linkedMachineId && machineMap[d.linkedMachineId]?.nombre)
        || d.nombre || d.name || nodeId
      nodeNameCache[nodeId] = name
      return name
    }
  } catch {}
  nodeNameCache[nodeId] = nodeId
  return nodeId
}

// ═══════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════
function getContent(){ return document.getElementById('content') }

function setHeader(title, subtitle, withBack){
  document.getElementById('hdr-title').textContent = title
  document.getElementById('hdr-sub').textContent = subtitle || ''
  document.getElementById('hdr-back').style.display = withBack ? 'flex' : 'none'
  document.getElementById('hdr-sub').style.display = subtitle ? 'block' : 'none'
}

function tabHeader(tab){
  if (tab === 'home') setHeader('Repuestos', '@antarfood_mant_bot', false)
  else if (tab === 'search') setHeader('Buscar', 'SAP, nombre, equipo…', false)
}

function switchTab(tab){
  navStack = []
  currentTab = tab
  activeUploadCtx = null
  document.getElementById('hdr-edit').style.display = 'none'
  document.getElementById('hdr-fav').style.display = 'none'
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'))
  document.getElementById(`nav-${tab}`).classList.add('active')
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'))
  document.getElementById(`view-${tab}`).classList.add('active')
  tabHeader(tab)
  getContent().scrollTop = 0
  if (tab === 'home') renderHome()
  // Autofocus en input de búsqueda
  if (tab === 'search'){
    setTimeout(() => document.getElementById('search-input')?.focus(), 60)
  }
}

function pushView(viewId, title, subtitle){
  const c = getContent()
  const prevId = document.querySelector('.view.active')?.id || `view-${currentTab}`
  navStack.push({viewId: prevId, scrollTop: c.scrollTop})
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'))
  document.getElementById(viewId).classList.add('active')
  setHeader(title, subtitle, true)
  c.scrollTop = 0
}

function goBack(){
  // Si estamos editando un repuesto, back = cancelar edición (no salir del detalle)
  if (editingRepuestoCtx){
    const { machineId, repuestoId } = editingRepuestoCtx
    editingRepuestoCtx = null
    openRepuesto(machineId, repuestoId, { fromSave: true })
    return
  }
  if (navStack.length === 0) return
  const prev = navStack.pop()
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'))
  document.getElementById(prev.viewId).classList.add('active')
  if (navStack.length === 0) tabHeader(currentTab)
  activeUploadCtx = null
  // Ocultar botones ✏️ ⭐ si volvemos a una vista que no es de repuesto
  if (prev.viewId !== 'view-repuesto'){
    document.getElementById('hdr-edit').style.display = 'none'
    document.getElementById('hdr-fav').style.display = 'none'
  }
  // Restore scroll
  requestAnimationFrame(() => { getContent().scrollTop = prev.scrollTop || 0 })
}

// Telegram BackButton
tgApp?.BackButton?.onClick(() => { if (navStack.length) goBack() })

// ═══════════════════════════════════════════════════════════════════
// FAVORITES VIEW
// ═══════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════
// HOME VIEW (unifica saludo + listas + catálogo)
// ═══════════════════════════════════════════════════════════════════

/** Pluralización inteligente: pl(1,'equipo','equipos') → "1 equipo" */
function pl(n, sing, plur){ return `${n} ${n === 1 ? sing : plur}` }

function renderHome(){
  const el = document.getElementById('view-home')
  el.innerHTML = `
    <div id="home-greeting"></div>
    <div id="home-mylists"></div>
    <div id="home-repfav"></div>
    <div id="home-recents"></div>
    <div id="home-catalog"></div>
  `
  renderHomeGreeting()
  renderHomeMyLists()
  renderHomeRepFav()    // async — resuelve nodeIds
  renderHomeRecents()
  renderHomeCatalog()
}

function renderHomeRecents(){
  const el = document.getElementById('home-recents')
  if (!el) return
  if (recentIds.length === 0){ el.innerHTML = ''; return }
  // Solo top 5 en home (los más recientes)
  const top = recentIds.slice(0, 5)
  el.innerHTML = `
    <div class="section">
      <span class="section-title">Vistos recientemente</span>
      <span class="section-count">${recentIds.length}</span>
    </div>
    <div class="cell-group">
      ${top.map(rec => `
        <div class="cell" onclick="openRepuesto('${escHtmlAttr(rec.machineId)}','${escHtmlAttr(rec.repuestoId)}')">
          <div class="cell-icon">🕘</div>
          <div class="cell-body">
            <div class="cell-title">${escHtml(rec.name || 'Sin nombre')}</div>
            <div class="cell-sub">${rec.code ? `SAP ${escHtml(rec.code)} · ` : ''}${escHtml(machineMap[rec.machineId]?.nombre || '')}</div>
          </div>
          <div class="cell-chevron">›</div>
        </div>`).join('')}
    </div>`
}

function renderHomeGreeting(){
  const rawName = firstName || tgApp?.initDataUnsafe?.user?.first_name || ''
  const name = String(rawName).trim().replace(/^[.,;:\s]+|[.,;:\s]+$/g, '')
  const hello = name ? `Hola, ${escHtml(name)} 👋` : 'Hola 👋'
  const role = ({admin:'Admin', supervisor:'Supervisor', tecnico:'Técnico', usuario:'Solo lectura'})[userRole] || userRole
  const linkTag = isLinked
    ? `<span class="tag green">vinculado</span>`
    : `<span class="tag warn">solo Telegram</span>`
  document.getElementById('home-greeting').innerHTML = `
    <div class="hello">
      <div class="hello-text">${hello}</div>
      <div class="hello-sub">${escHtml(role)} ${linkTag}</div>
    </div>`
}

function renderHomeMyLists(){
  const el = document.getElementById('home-mylists')
  const { favoriteLists, repuestoFavLists } = prefs
  const hasLists = favoriteLists && favoriteLists.length > 0
  const hasRepFavs = Object.keys(repuestoFavLists || {}).filter(k => repuestoFavLists[k]?.length > 0).length > 0
  if (!hasLists){
    // Onboarding suave si nunca guardó nada
    if (!hasRepFavs){
      el.innerHTML = `
        <div class="notice" style="border-left-color:var(--accent)">
          💡 <b>Tip:</b> tocá ⭐ en cualquier repuesto para guardarlo en una lista (Cuchillos, Sensores, Resortes…). Aparecerán acá.
        </div>`
    } else {
      el.innerHTML = ''
    }
    return
  }
  el.innerHTML = `
    <div class="section">
      <span class="section-title">Mis listas</span>
      <span class="section-count">${favoriteLists.length}</span>
    </div>
    <div class="cell-group">
      ${favoriteLists.map(list => {
        const ids = list.machineIds || []
        return `<div class="cell" onclick="openMachineList(${escHtmlAttr(JSON.stringify(list.name))})">
          <div class="cell-icon">📋</div>
          <div class="cell-body">
            <div class="cell-title">${escHtml(list.name)}</div>
            <div class="cell-sub">${pl(ids.length, 'equipo', 'equipos')}</div>
          </div>
          <div class="cell-chevron">›</div>
        </div>`
      }).join('')}
    </div>`
}

async function renderHomeRepFav(){
  const el = document.getElementById('home-repfav')
  const { repuestoFavLists } = prefs
  const repKeys = Object.keys(repuestoFavLists || {}).filter(k => repuestoFavLists[k]?.length > 0)
  if (repKeys.length === 0){ el.innerHTML = ''; return }

  // Resolver cada key a su machineId destino y consolidar duplicados.
  // Múltiples hierarchy nodeIds pueden apuntar al mismo equipo (linkedMachineId)
  // → mergear en una sola card por equipo.
  await Promise.all(repKeys.filter(k => !machineMap[k]).map(resolveNodeName))
  const machineIdsSet = new Set()
  for (const k of repKeys){
    if (machineMap[k]) machineIdsSet.add(k)
    else {
      const mid = await getMachineIdFromNode(k)
      machineIdsSet.add(mid && machineMap[mid] ? mid : k)
    }
  }
  const machineIds = Array.from(machineIdsSet)

  // Para cada machineId, calcular listas mergeadas (merge by name across keys)
  const cards = []
  for (const mid of machineIds){
    const m = machineMap[mid]
    const machineName = m?.nombre || nodeNameCache[mid] || mid
    const lists = m
      ? await getMachineFavListsMerged(mid)
      : (repuestoFavLists[mid] || [])
    const total = lists.reduce((s,l) => s + (l.repuestoIds?.length || 0), 0)
    if (total > 0) cards.push({ mid, machineName, m, lists, total })
  }

  if (cards.length === 0){ el.innerHTML = ''; return }

  el.innerHTML = `
    <div class="section">
      <span class="section-title">Repuestos guardados</span>
      <span class="section-count">${cards.length}</span>
    </div>
    ${cards.map(({mid, machineName, m, lists, total}) => `
      <div class="compound-card">
        <div class="cell" onclick="openMachine('${escHtmlAttr(mid)}')">
          <div class="cell-icon" style="background:${m?.color || '#5288c1'}22;color:${m?.color || '#5288c1'}">🔩</div>
          <div class="cell-body">
            <div class="cell-title">${escHtml(machineName)}</div>
            <div class="cell-sub">${pl(total, 'repuesto', 'repuestos')} · ${pl(lists.length, 'lista', 'listas')}</div>
          </div>
          <div class="cell-chevron">›</div>
        </div>
        ${lists.length > 0 ? `
          <div class="cell-chips">
            ${lists.map(l => `
              <span class="cell-chip" onclick="event.stopPropagation();openMachineWithFilter('${escHtmlAttr(mid)}', ${escHtmlAttr(JSON.stringify(l.name))})">
                📋 ${escHtml(l.name)} <span class="n">${l.repuestoIds.length}</span>
              </span>`).join('')}
          </div>` : ''}
      </div>`).join('')}`
}

function openMachineWithFilter(machineId, listName){
  // openMachine respeta opts.preFilter para abrir con un chip pre-activado
  openMachine(machineId, { preFilter: listName })
}

function renderHomeCatalog(){
  const el = document.getElementById('home-catalog')
  // Chips: Todos + categorías con count > 0
  const visibleCats = categories
    .map(c => {
      const desc = categoryDescendants[c.id] || new Set([c.id])
      return { ...c, _count: machines.filter(m => m.categoryId && desc.has(m.categoryId)).length }
    })
    .filter(c => c._count > 0)

  const chipsHtml = `
    <div class="chips sticky-top">
      <div class="chip ${activeCatFilter==='all'?'active':''}" onclick="setCatFilter('all')">Todos <span class="count">${machines.length}</span></div>
      ${visibleCats.map(c => `
        <div class="chip ${activeCatFilter===c.id?'active':''}" onclick="setCatFilter('${escHtmlAttr(c.id)}')">
          ${escHtml(c.nombre)} <span class="count">${c._count}</span>
        </div>`).join('')}
    </div>`

  let filtered

function renderSearchEmpty(){
  const el = document.getElementById('view-search')
  el.innerHTML = `
    <div class="search-bar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="search-input" class="search-input" type="search" autocomplete="off"
          autocorrect="off" spellcheck="false" placeholder="SAP, nombre, código fabricante…">
        <button id="search-clear" class="search-clear">✕</button>
      </div>
    </div>
    <div id="search-body"></div>`

  const inp = document.getElementById('search-input')
  const clr = document.getElementById('search-clear')
  inp.addEventListener('input', () => {
    const q = inp.value.trim()
    clr.classList.toggle('show', q.length > 0)
    clearTimeout(searchTimer)
    if (q.length === 0) { renderSearchBody(''); return }
    if (q.length < 2) return
    searchTimer = setTimeout(() => renderSearchBody(q), 280)
  })
  clr.addEventListener('click', () => { inp.value=''; clr.classList.remove('show'); renderSearchBody('') })
  renderSearchBody('')
}

function renderSearchBody(query){
  const body = document.getElementById('search-body')
  if (!body) return
  if (!query){
    body.innerHTML = renderRecentsHtml()
    return
  }
  const q = normalizeSearch(query)

  // Equipos que matchean
  const machineHits = machines.filter(m => matchesMachine(m, q))

  // Repuestos que matchean (entre los cargados)
  const repHits = []
  for (const [machineId, reps] of Object.entries(repCache)){
    const m = machineMap[machineId]
    for (const r of reps) if (matchesRepuesto(r, q)) repHits.push({r, m, machineId})
  }

  // Si aún no cargamos todos los repuestos, completar en background
  if (Object.keys(repCache).length < machines.length){
    loadAllAndSearch(query)  // dispara fetch + re-render cuando termine
  }

  if (machineHits.length === 0 && repHits.length === 0){
    body.innerHTML = emptyHtml('🔍','Sin resultados',`No hay equipos ni repuestos para "<b>${escHtml(query)}</b>"`)
    return
  }

  repHits.sort((a,b) => {
    if (normalizeSearch(a.r.codigoSAP) === q) return -1
    if (normalizeSearch(b.r.codigoSAP) === q) return 1
    return 0
  })

  body.innerHTML = `
    ${machineHits.length > 0 ? `
      <div class="section">
        <span class="section-title">Equipos</span>
        <span class="section-count">${machineHits.length}</span>
      </div>
      <div class="cell-group">
        ${machineHits.map(machineCellHtml).join('')}
      </div>` : ''}
    ${repHits.length > 0 ? `
      <div class="section">
        <span class="section-title">Repuestos</span>
        <span class="section-count">${repHits.length}</span>
      </div>
      <div class="cell-group">
        ${repHits.map(({r,m,machineId}) => repCellHtml(r, machineId, m?.nombre)).join('')}
      </div>` : ''}
    ${Object.keys(repCache).length < machines.length ? `
      <div class="empty" style="padding:20px"><div class="empty-sub">Buscando en más equipos…</div></div>` : ''}`
}

function matchesMachine(m, normQ){
  return normalizeSearch(m.nombre).includes(normQ)
    || normalizeSearch(m.marca).includes(normQ)
    || normalizeSearch(m.modelo).includes(normQ)
    || normalizeSearch(m.descripcion).includes(normQ)
    || normalizeSearch(m.seccion).includes(normQ)
}

async function loadAllAndSearch(query){
  const unloaded = machines.filter(m => !repCache[m.id])
  await Promise.all(unloaded.map(m => loadRepuestos(m.id).catch(()=>null)))
  const inp = document.getElementById('search-input')
  if (inp && normalizeSearch(inp.value).includes(normalizeSearch(query))) renderSearchBody(query)
}

function normalizeSearch(s){
  if (!s) return ''
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()
}

function matchesRepuesto(r, normQ){
  return normalizeSearch(r.codigoSAP).includes(normQ)
    || normalizeSearch(r.textoBreve).includes(normQ)
    || normalizeSearch(r.descripcion).includes(normQ)
    || normalizeSearch(r.alias).includes(normQ)
    || normalizeSearch(r.codigoFabricante).includes(normQ)
    || normalizeSearch(r.nombreManual).includes(normQ)
    || normalizeSearch(r.tipo).includes(normQ)
    || normalizeSearch(r.ubicacionEnPlanta).includes(normQ)
}

function renderRecentsHtml(){
  if (recentIds.length === 0){
    return emptyHtml('🔍','Buscá repuestos','Por código SAP, nombre, alias o código de fabricante')
  }
  return `
    <div class="section">
      <span class="section-title">Vistos recientemente</span>
      <span class="section-count">${recentIds.length}</span>
    </div>
    <div class="cell-group">
      ${recentIds.map(rec => `
        <div class="cell" onclick="openRepuesto('${escHtmlAttr(rec.machineId)}','${escHtmlAttr(rec.repuestoId)}')">
          <div class="cell-icon">🕘</div>
          <div class="cell-body">
            <div class="cell-title">${escHtml(rec.name || 'Sin nombre')}</div>
            <div class="cell-sub">${rec.code ? `SAP: ${escHtml(rec.code)} · ` : ''}${escHtml(machineMap[rec.machineId]?.nombre || rec.machineId)}</div>
          </div>
          <div class="cell-chevron">›</div>
        </div>`).join('')}
    </div>`
}

function loadRecents(){
  try { recentIds = JSON.parse(localStorage.getItem('mant_recents') || '[]') } catch { recentIds = [] }
}
function saveRecent(machineId, repuestoId, name, code){
  recentIds = recentIds.filter(r => !(r.machineId === machineId && r.repuestoId === repuestoId))
  recentIds.unshift({machineId, repuestoId, name, code, ts: Date.now()})
  recentIds = recentIds.slice(0, MAX_RECENTS)
  localStorage.setItem('mant_recents', JSON.stringify(recentIds))
  // Si home está montada, refrescar recientes (no costoso)
  if (document.getElementById('home-recents')) renderHomeRecents()
}

function renderMachineBody(machineId, reps, favLists){
  const m = machineMap[machineId]
  const countEl = document.getElementById('rep-count')
  const chipsEl = document.getElementById('rep-chips')
  const listEl  = document.getElementById('rep-list')
  if (!listEl) return  // user navigated away

  if (reps.length === 0){
    countEl.textContent = '0'
    chipsEl.innerHTML = ''
    listEl.innerHTML = emptyHtml('📭','Sin repuestos','Este equipo no tiene repuestos cargados aún')
    return
  }

  // Filter
  let filtered = reps
  if (activeMachineRepFilter){
    const list = favLists.find(l => l.name === activeMachineRepFilter)
    if (list){
      const idSet = new Set(list.repuestoIds)
      filtered = reps.filter(r => matchesRepFavList(r, idSet))
    }
  }

  // Chips
  if (favLists.length > 0){
    chipsEl.innerHTML = `<div class="chips">
      <div class="chip ${activeMachineRepFilter===null?'active':''}" onclick="setMachineRepFilter('${escHtmlAttr(machineId)}', null)">
        Todos <span class="count">${reps.length}</span>
      </div>
      ${favLists.map(l => {
        const cnt = reps.filter(r => matchesRepFavList(r, new Set(l.repuestoIds))).length
        return `<div class="chip ${activeMachineRepFilter===l.name?'active':''}"
                 onclick="setMachineRepFilter('${escHtmlAttr(machineId)}', ${escHtmlAttr(JSON.stringify(l.name))})">
          ${escHtml(l.name)} <span class="count">${cnt}</span>
        </div>`
      }).join('')}
    </div>`
  } else {
    chipsEl.innerHTML = ''
  }

  countEl.textContent = activeMachineRepFilter ? `${filtered.length}/${reps.length}` : `${reps.length}`

  if (filtered.length === 0){
    listEl.innerHTML = emptyHtml('🔍','Lista vacía','Ningún repuesto coincide con esta lista')
  } else {
    listEl.innerHTML = `<div class="cell-group">
      ${filtered.map(r => repCellHtml(r, machineId, m.nombre)).join('')}
    </div>`
  }
}

function setMachineRepFilter(machineId, listName){
  activeMachineRepFilter = listName
  Promise.all([
    Promise.resolve(repCache[machineId] || []),
    getMachineFavListsMerged(machineId),
  ]).then(([reps, favLists]) => renderMachineBody(machineId, reps, favLists))
}

function repCellHtml(r, machineId, machineName){
  const icon = repIcon(r.tipo)
  const name = r.textoBreve || r.descripcion || r.alias || 'Sin nombre'
  const sub = [r.tipo, machineName].filter(Boolean).join(' · ')
  return `<div class="cell" onclick="openRepuesto('${escHtmlAttr(machineId)}','${escHtmlAttr(r.id)}')">
    <div class="cell-icon">${icon}</div>
    <div class="cell-body">
      <div class="cell-title">${escHtml(name)}</div>
      ${r.codigoSAP ? `<div class="cell-meta">SAP ${escHtml(r.codigoSAP)}</div>` : ''}
      ${sub ? `<div class="cell-sub">${escHtml(sub)}</div>` : ''}
    </div>
    <div class="cell-chevron">›</div>
  </div>`
}

function repIcon(tipo){
  const map = {
    'RODAMIENTO':'⚙️','SELLO':'🔵','JUNTA':'🔵','SENSOR':'📡','MOTOR':'⚡',
    'CORREA':'〰️','CADENA':'🔗','VALVULA':'🔧','FILTRO':'🔳','CUCHILLA':'🔪',
    'CUCHILLO':'🔪','RESORTE':'🌀','ENGRANAJE':'⚙️','BOMBA':'💧',
  }
  if (!tipo) return '🔩'
  const u = tipo.toUpperCase()
  for (const [k,v] of Object.entries(map)) if (u.includes(k)) return v
  return '🔩'
}

async function updateFavBtnState(machineId, repuestoId){

  const lists = await getMachineFavListsMerged(machineId)
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  const isInAny = lists.some(l => {
    const set = new Set(l.repuestoIds || [])
    return r ? matchesRepFavList(r, set) : set.has(repuestoId)
  })

let lbxPhotoCtx = null  // {machineId, repuestoId, photoId, isPrincipal}

function openLightboxRep(machineId, repuestoId, photoId){
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  if (!r) return
  const photos = [...(r.fotosReales || []), ...(r.imagenesManual || [])]
  const ph = photos.find(p => p.id === photoId)
  if (!ph) return
  // Solo permitir editar fotos reales (no las del manual original)
  const isReal = (r.fotosReales || []).some(p => p.id === photoId)
  const ctx = isReal ? { machineId, repuestoId, photoId, isPrincipal: !!ph.esPrincipal } : null
  openLightbox(ph.url, ph.descripcion || ph.tipo || '', ctx)
}

function openLightbox(url, caption, ctx){
  document.getElementById('lbx-img').src = url
  document.getElementById('lbx-cap').textContent = caption || ''
  const actions = document.getElementById('lbx-actions')
  if (userRole === 'admin' && ctx){
    lbxPhotoCtx = ctx
    actions.classList.add('show')
    const pBtn = document.getElementById('lbx-principal')
    if (ctx.isPrincipal){
      pBtn.classList.add('is-active')
      pBtn.textContent = '⭐ Principal'
      pBtn.disabled = true
    } else {
      pBtn.classList.remove('is-active')
      pBtn.textContent = '⭐ Hacer principal'
      pBtn.disabled = false
    }
  } else {
    lbxPhotoCtx = null
    actions.classList.remove('show')
  }
  document.getElementById('lightbox').classList.add('open')
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open')
  document.getElementById('lbx-img').src = ''
  lbxPhotoCtx = null
}

async function onLbxMarkPrincipal(){
  if (!lbxPhotoCtx || userRole !== 'admin') return
  const { machineId, repuestoId, photoId } = lbxPhotoCtx
  const btn = document.getElementById('lbx-principal')
  btn.disabled = true; btn.textContent = '⭐ Aplicando…'
  try {
    const docRef = db.collection(`machines/${machineId}/repuestos`).doc(repuestoId)
    const snap = await docRef.get()
    const fotos = (snap.exists ? snap.data().fotosReales : []) || []
    const newFotos = fotos.map(f => ({ ...f, esPrincipal: f.id === photoId }))
    await docRef.update({
      fotosReales: newFotos,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    })
    // Actualizar cache
    const reps = repCache[machineId] || []
    const idx = reps.findIndex(x => x.id === repuestoId)
    if (idx >= 0) reps[idx] = { ...reps[idx], fotosReales: newFotos }

    showToast('Foto principal actualizada ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    closeLightbox()
    openRepuesto(machineId, repuestoId, { fromSave: true })
  } catch(err){
    console.error('mark principal error', err)
    showToast('Error: ' + (err.message || 'No se pudo aplicar'), 'err')
    btn.disabled = false; btn.textContent = '⭐ Hacer principal'
  }
}

async function onLbxDelete(){
  if (!lbxPhotoCtx || userRole !== 'admin') return
  const ok = confirm('¿Borrar esta foto? No se puede deshacer.')
  if (!ok) return
  const { machineId, repuestoId, photoId } = lbxPhotoCtx
  const btn = document.getElementById('lbx-delete')
  btn.disabled = true; btn.textContent = '🗑️ Borrando…'
  try {
    const docRef = db.collection(`machines/${machineId}/repuestos`).doc(repuestoId)
    const snap = await docRef.get()
    const fotos = (snap.exists ? snap.data().fotosReales : []) || []
    const target = fotos.find(f => f.id === photoId)
    const newFotos = fotos.filter(f => f.id !== photoId)
    await docRef.update({
      fotosReales: newFotos,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    })
    // Borrar el archivo de Storage (best-effort)
    if (target?.url){
      try {
        await storage.refFromURL(target.url).delete()
      } catch(e){
        console.warn('no se pudo borrar storage object (puede no existir)', e)
      }
    }
    // Actualizar cache
    const reps = repCache[machineId] || []
    const idx = reps.findIndex(x => x.id === repuestoId)
    if (idx >= 0) reps[idx] = { ...reps[idx], fotosReales: newFotos }

    showToast('Foto borrada ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    closeLightbox()
    openRepuesto(machineId, repuestoId, { fromSave: true })
  } catch(err){
    console.error('delete photo error', err)
    showToast('Error: ' + (err.message || 'No se pudo borrar'), 'err')
    btn.disabled = false; btn.textContent = '🗑️ Borrar'
  }
}

// ═══════════════════════════════════════════════════════════════════
// FAV LISTS — gestión de listas de repuestos por equipo
// ═══════════════════════════════════════════════════════════════════
let favSheetCtx = null  // {machineId, repuestoId}

/** Key canónico para escribir las listas de un equipo:
 *  primer hierarchy nodeId vinculado, o machineId si no hay vinculación. */
async function getCanonicalRepFavKey(machineId){
  const nodeIds = await getLinkedNodeIds(machineId)
  return nodeIds[0] || machineId
}

/** Devuelve los keys posibles donde puede haber listas para esa máquina */
async function getRelatedRepFavKeys(machineId){
  const nodeIds = await getLinkedNodeIds(machineId)
  return Array.from(new Set([...nodeIds, machineId]))
}

/** Persiste prefs.repuestoFavLists (y favoriteLists) en Firestore. */
async function saveAllPrefs(){
  if (!uid) throw new Error('No hay sesión')
  await db.collection('user_preferences').doc(uid).set({
    favoriteLists:    prefs.favoriteLists    || [],
    repuestoFavLists: prefs.repuestoFavLists || {},
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  }, { merge: true })
}

/** Abre el sheet para gestionar listas de favoritos del repuesto */
async function openFavListsSheet(machineId, repuestoId){
  favSheetCtx = { machineId, repuestoId }
  const lists = await getMachineFavListsMerged(machineId)

  const sheet = document.getElementById('sheet')
  const overlay = document.getElementById('sheet-overlay')
  const title = document.getElementById('sheet-title')
  const content = document.getElementById('sheet-content')

  title.textContent = 'Guardar en lista'

  if (lists.length === 0){
    content.innerHTML = `<div class="sheet-empty">Aún no tenés listas para este equipo.<br>Creá la primera abajo.</div>`
  } else {
    content.innerHTML = lists.map(l => {
      const set = new Set(l.repuestoIds)
      const reps = repCache[machineId] || []
      const r = reps.find(x => x.id === repuestoId)
      const isIn = r ? matchesRepFavList(r, set) : set.has(repuestoId)
      return `<div class="sheet-row ${isIn ? 'on' : ''}" onclick="toggleRepInFavList(${escHtmlAttr(JSON.stringify(l.name))})">
        <div class="ico">📋</div>
        <div class="body">
          <div class="name">${escHtml(l.name)}</div>
          <div class="sub">${l.repuestoIds.length} repuesto(s)</div>
        </div>
        <button class="edit-btn" style="display:flex;width:30px;height:30px;font-size:13px"
          onclick="event.stopPropagation();renameRepFavList(${escHtmlAttr(JSON.stringify(l.name))})" aria-label="Renombrar">✏️</button>
        <button class="edit-btn" style="display:flex;width:30px;height:30px;font-size:13px;background:rgba(229,57,53,.14)"
          onclick="event.stopPropagation();deleteRepFavList(${escHtmlAttr(JSON.stringify(l.name))})" aria-label="Borrar">🗑️</button>
        <div class="check">✓</div>
      </div>`
    }).join('')
  }

  // Botón "Nueva lista"
  content.innerHTML += `<div class="sheet-new" onclick="createRepFavList()">
    <span style="font-size:20px">＋</span> Nueva lista de repuestos
  </div>`

  overlay.classList.add('open')
  requestAnimationFrame(() => sheet.classList.add('open'))
}

function closeSheet(){
  const ctx = favSheetCtx
  document.getElementById('sheet-overlay').classList.remove('open')
  document.getElementById('sheet').classList.remove('open')
  favSheetCtx = null
  if (ctx) updateFavBtnState(ctx.machineId, ctx.repuestoId)
}

async function toggleRepInFavList(listName){
  if (!favSheetCtx) return
  const { machineId, repuestoId } = favSheetCtx
  const canonicalKey = await getCanonicalRepFavKey(machineId)
  const relatedKeys = await getRelatedRepFavKeys(machineId)
  const allLists = prefs.repuestoFavLists || {}

  // ¿Está actualmente?
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  let alreadyIn = false
  for (const k of relatedKeys){
    const list = (allLists[k] || []).find(l => l.name === listName)
    if (list){
      const set = new Set(list.repuestoIds || [])
      if (r ? matchesRepFavList(r, set) : set.has(repuestoId)){ alreadyIn = true; break }
    }
  }

  // Trabajar sobre el canonical: traer/crear la lista ahí
  if (!allLists[canonicalKey]) allLists[canonicalKey] = []
  let list = allLists[canonicalKey].find(l => l.name === listName)
  if (!list){
    // Si existe en otro key, mover al canonical (consolida)
    for (const k of relatedKeys){
      if (k === canonicalKey) continue
      const idx = (allLists[k] || []).findIndex(l => l.name === listName)
      if (idx >= 0){
        list = allLists[k][idx]
        allLists[k].splice(idx, 1)
        if (allLists[k].length === 0) delete allLists[k]
        allLists[canonicalKey].push(list)
        break
      }
    }
    if (!list){
      list = { name: listName, repuestoIds: [] }
      allLists[canonicalKey].push(list)
    }
  }
  list.repuestoIds = list.repuestoIds || []

  if (alreadyIn){
    // Quitar de TODAS las apariciones (consolidación)
    for (const k of relatedKeys){
      const lst = (allLists[k] || []).find(l => l.name === listName)
      if (!lst) continue
      lst.repuestoIds = (lst.repuestoIds || []).filter(id => {
        if (id === repuestoId) return false
        if (r?.codigoSAP && (id === `inv-${r.codigoSAP}` || id === r.codigoSAP)) return false
        return true
      })
    }
  } else {
    if (!list.repuestoIds.includes(repuestoId)) list.repuestoIds.push(repuestoId)
  }

  prefs.repuestoFavLists = allLists
  try {
    await saveAllPrefs()
    showToast(alreadyIn ? 'Quitado de la lista' : 'Agregado ✓', 'ok')
    tgApp?.HapticFeedback?.selectionChanged?.()
    // Re-render sheet (refresh estado)
    openFavListsSheet(machineId, repuestoId)
    // Re-render machine view si está visible (chips de fav)
    refreshMachineDetailIfActive(machineId)
  } catch(err){
    console.error('toggle fav error', err)
    showToast('Error: ' + (err.message || ''), 'err')
  }
}

async function createRepFavList(){
  if (!favSheetCtx) return
  const { machineId, repuestoId } = favSheetCtx
  showInputModal('Nueva lista', '', 'Ej. Cuchillos, Sensores, Resortes…', async (name) => {
    name = (name || '').trim()
    if (!name) return
    const canonicalKey = await getCanonicalRepFavKey(machineId)
    const allLists = prefs.repuestoFavLists || {}
    if (!allLists[canonicalKey]) allLists[canonicalKey] = []
    if (allLists[canonicalKey].some(l => l.name === name)){
      showToast('Ya existe una lista con ese nombre', 'err')
      return
    }
    allLists[canonicalKey].push({ name, repuestoIds: repuestoId ? [repuestoId] : [] })
    prefs.repuestoFavLists = allLists
    try {
      await saveAllPrefs()
      showToast('Lista creada ✓', 'ok')
      tgApp?.HapticFeedback?.notificationOccurred('success')
      openFavListsSheet(machineId, repuestoId)
      refreshMachineDetailIfActive(machineId)
    } catch(err){
      showToast('Error: ' + (err.message || ''), 'err')
    }
  })
}

async function renameRepFavList(listName){
  if (!favSheetCtx) return
  const { machineId, repuestoId } = favSheetCtx
  showInputModal('Renombrar lista', listName, 'Nuevo nombre', async (newName) => {
    newName = (newName || '').trim()
    if (!newName || newName === listName) return
    const relatedKeys = await getRelatedRepFavKeys(machineId)
    const allLists = prefs.repuestoFavLists || {}
    // Verificar que el nuevo nombre no exista en ninguno de los keys
    for (const k of relatedKeys){
      if ((allLists[k] || []).some(l => l.name === newName)){
        showToast('Ya existe una lista con ese nombre', 'err')
        return
      }
    }
    // Renombrar en TODOS los keys (consolidación silenciosa)
    let renamed = false
    for (const k of relatedKeys){
      const list = (allLists[k] || []).find(l => l.name === listName)
      if (list){ list.name = newName; renamed = true }
    }
    if (!renamed) return
    prefs.repuestoFavLists = allLists
    try {
      await saveAllPrefs()
      showToast('Lista renombrada ✓', 'ok')
      openFavListsSheet(machineId, repuestoId)
      refreshMachineDetailIfActive(machineId)
    } catch(err){
      showToast('Error: ' + (err.message || ''), 'err')
    }
  })
}

async function deleteRepFavList(listName){
  if (!favSheetCtx) return
  const ok = confirm(`¿Borrar la lista "${listName}"? Los repuestos seguirán existiendo.`)
  if (!ok) return
  const { machineId, repuestoId } = favSheetCtx
  const relatedKeys = await getRelatedRepFavKeys(machineId)
  const allLists = prefs.repuestoFavLists || {}
  for (const k of relatedKeys){
    if (!allLists[k]) continue
    allLists[k] = allLists[k].filter(l => l.name !== listName)
    if (allLists[k].length === 0) delete allLists[k]
  }
  prefs.repuestoFavLists = allLists
  try {
    await saveAllPrefs()
    showToast('Lista borrada ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('warning')
    openFavListsSheet(machineId, repuestoId)
    refreshMachineDetailIfActive(machineId)
  } catch(err){
    showToast('Error: ' + (err.message || ''), 'err')
  }
}

/** Re-renderiza el detalle de máquina si está visible — actualiza chips de favoritos */
function refreshMachineDetailIfActive(machineId){
  const view = document.getElementById('view-machine')
  if (!view.classList.contains('active')) return
  // Reusar el flujo existente: abrir de nuevo con fromSave para no apilar
  const reps = repCache[machineId] || []
  Promise.all([Promise.resolve(reps), getMachineFavListsMerged(machineId)])
    .then(([reps, favLists]) => renderMachineBody(machineId, reps, favLists))
}

  // [key, label, type, opts]

  ['ubicacionEnPlanta',  'Ubicación en planta',   'text',     {}],
  ['cantidadPorMaquina', 'Cantidad por equipo',   'number',   {}],

function openRepuestoEdit(machineId, repuestoId){
  if (userRole !== 'admin') return
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  if (!r) return

  editingRepuestoCtx = { machineId, repuestoId }
  const title = r.textoBreve || r.alias || r.descripcion || 'Repuesto'
  setHeader('Editar repuesto', title, true)
  // Ocultar botón ✏️ mientras editamos
  document.getElementById('hdr-edit').style.display = 'none'

  const el = document.getElementById('view-repuesto')
  el.innerHTML = `
    <div class="form-card">
      ${EDIT_FIELDS.map(([key, label, type, opts]) => {
        const val = r[key] != null ? String(r[key]) : ''
        if (type === 'textarea'){
          return `<div class="form-row">
            <label class="form-label" for="ef-${key}">${escHtml(label)}</label>
            <textarea id="ef-${key}" class="form-textarea" rows="4">${escHtml(val)}</textarea>
          </div>`
        }
        const codeCls = opts.code ? ' code' : ''
        const hintHtml = opts.hint ? `<div style="font-size:11px;color:var(--warn);margin-top:4px">⚠ ${escHtml(opts.hint)}</div>` : ''
        return `<div class="form-row">
          <label class="form-label" for="ef-${key}">${escHtml(label)}${opts.required ? ' *' : ''}</label>
          <input id="ef-${key}" class="form-input${codeCls}" type="${type}" value="${escHtml(val)}"
            ${type === 'number' ? 'inputmode="numeric" step="any"' : ''}
            ${opts.required ? 'required' : ''}>
          ${hintHtml}
        </div>`
      }).join('')}
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="cancelRepuestoEdit('${escHtmlAttr(machineId)}','${escHtmlAttr(repuestoId)}')">Cancelar</button>
      <button class="btn-save" id="btn-save-rep" onclick="saveRepuestoEdit('${escHtmlAttr(machineId)}','${escHtmlAttr(repuestoId)}')">Guardar</button>
    </div>
  `
  // Scroll a top
  getContent().scrollTop = 0
}

function cancelRepuestoEdit(machineId, repuestoId){
  editingRepuestoCtx = null
  openRepuesto(machineId, repuestoId, { fromSave: true })
}

async function saveRepuestoEdit(machineId, repuestoId){
  if (userRole !== 'admin') return
  const btn = document.getElementById('btn-save-rep')
  btn.disabled = true
  btn.textContent = 'Guardando…'

  const updates = {}
  for (const [key, label, type] of EDIT_FIELDS){
    const inp = document.getElementById(`ef-${key}`)
    if (!inp) continue
    let v = inp.value
    if (type === 'number'){
      if (v === '' || v == null){ updates[key] = null; continue }
      const n = Number(v)
      if (Number.isNaN(n)){
        showToast(`${label}: número inválido`, 'err')
        btn.disabled = false; btn.textContent = 'Guardar'
        return
      }
      updates[key] = n
    } else {
      updates[key] = v.trim()
    }
  }

  // Validación mínima
  if (!updates.textoBreve){
    showToast('El nombre no puede estar vacío', 'err')
    btn.disabled = false; btn.textContent = 'Guardar'
    return
  }

  try {
    const docRef = db.collection(`machines/${machineId}/repuestos`).doc(repuestoId)
    await docRef.update({
      ...updates,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    })

    // Actualizar cache local
    const reps = repCache[machineId] || []
    const idx = reps.findIndex(x => x.id === repuestoId)
    if (idx >= 0) reps[idx] = { ...reps[idx], ...updates }

    showToast('Cambios guardados ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')

    // Volver al detalle (in-place, sin apilar)
    editingRepuestoCtx = null
    openRepuesto(machineId, repuestoId, { fromSave: true })
  } catch(err){
    console.error('save error', err)
    showToast('Error al guardar: ' + (err.message || ''), 'err')
    tgApp?.HapticFeedback?.notificationOccurred('error')
    btn.disabled = false; btn.textContent = 'Guardar'
  }
}

let activeUploadCtx = null  // {machineId, repuestoId} mientras detalle abierto
let editingRepuestoCtx = null  // {machineId, repuestoId} mientras formulario edición abierto

function compressImage(file, maxW = 1200, maxH = 1200, quality = 0.85){
  return new Promise((resolve, reject) => {
    const img = new Image()
    img.onload = () => {
      let { width, height } = img
      const ratio = Math.min(maxW/width, maxH/height, 1)
      width  = Math.round(width  * ratio)
      height = Math.round(height * ratio)
      const canvas = document.createElement('canvas')
      canvas.width = width
      canvas.height = height
      const ctx = canvas.getContext('2d')
      ctx.drawImage(img, 0, 0, width, height)
      canvas.toBlob(blob => {
        if (!blob) return reject(new Error('Compresión falló'))
        resolve({ blob, width, height })
      }, 'image/jpeg', quality)
    }
    img.onerror = () => reject(new Error('No se pudo leer la imagen'))
    const reader = new FileReader()
    reader.onload = e => { img.src = e.target.result }
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'))
    reader.readAsDataURL(file)
  })
}

async function uploadRepuestoPhoto(file, machineId, repuestoId){
  if (userRole !== 'admin') throw new Error('Solo admin puede subir fotos')
  if (!file.type.startsWith('image/')) throw new Error('Solo imágenes')
  if (file.size > 15 * 1024 * 1024) throw new Error('Imagen demasiado grande (>15MB)')

  showUploading('Optimizando imagen…')

  // Comprimir (skip GIF/SVG)
  let blob = file, width, height
  const skipOpt = ['image/gif','image/svg+xml'].includes(file.type)
  if (!skipOpt){
    try {
      const r = await compressImage(file, 1200, 1200, 0.85)
      blob = r.blob; width = r.width; height = r.height
    } catch(e){ console.warn('compress failed, using original', e) }
  }

  showUploading('Subiendo foto…')

  const timestamp = Date.now()
  const safeName = (file.name || 'photo.jpg').replace(/[^\w.\-]+/g, '_')
  const fileName = `${timestamp}_${safeName.endsWith('.jpg') || safeName.endsWith('.jpeg') ? safeName : safeName.replace(/\.[^.]+$/,'') + '.jpg'}`
  const path = `machines/${machineId}/repuestos/${repuestoId}/real/${fileName}`

  const ref = storage.ref(path)
  await ref.put(blob, { contentType: 'image/jpeg' })
  const url = await ref.getDownloadURL()

  const newImg = {
    id: String(timestamp),
    url,
    descripcion: '',
    orden: 0,
    esPrincipal: false,
    tipo: 'real',
    createdAt: new Date(),
    sizeOriginal: file.size,
    sizeFinal: blob.size,
    formatFinal: skipOpt ? 'original' : 'jpeg',
    qualityFinal: skipOpt ? undefined : 0.85,
    width, height,
  }

  showUploading('Guardando…')

  // Re-leer doc + escribir array completo (consistente con la PWA)
  const docRef = db.collection(`machines/${machineId}/repuestos`).doc(repuestoId)
  const snap = await docRef.get()
  const cur = snap.exists ? (snap.data().fotosReales || []) : []
  await docRef.update({
    fotosReales: [...cur, newImg],
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  })

  // Actualizar cache local
  const reps = repCache[machineId] || []
  const idx = reps.findIndex(x => x.id === repuestoId)
  if (idx >= 0){
    reps[idx] = { ...reps[idx], fotosReales: [...(reps[idx].fotosReales || []), newImg] }
  }

  return newImg
}

function pickPhoto(source){
  if (!activeUploadCtx) return
  const inp = document.getElementById(source === 'camera' ? 'file-camera' : 'file-gallery')
  inp.value = ''
  inp.click()
}

async function onPhotoSelected(ev){
  const file = ev.target.files?.[0]
  ev.target.value = ''
  if (!file || !activeUploadCtx) return
  const { machineId, repuestoId } = activeUploadCtx
  try {
    await uploadRepuestoPhoto(file, machineId, repuestoId)
    hideUploading()
    showToast('Foto agregada ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    // Re-renderizar el detalle para mostrar la nueva foto
    openRepuesto(machineId, repuestoId, { fromUpload: true })
  } catch(err){
    console.error('upload error', err)
    hideUploading()
    showToast('Error: ' + (err.message || 'No se pudo subir'), 'err')
    tgApp?.HapticFeedback?.notificationOccurred('error')
  }
}

document.getElementById('file-camera').addEventListener('change', onPhotoSelected)
document.getElementById('file-gallery').addEventListener('change', onPhotoSelected)

function showUploading(msg){
  document.getElementById('uploading-msg').textContent = msg || 'Subiendo…'
  document.getElementById('uploading').classList.add('open')
}
function hideUploading(){
  document.getElementById('uploading').classList.remove('open')
}

let toastTimer = null
function showToast(msg, type){
  const el = document.getElementById('toast')
  el.textContent = msg
  el.className = type ? type : ''
  el.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400)
}

function emptyHtml(icon, title, sub){
  return `<div class="empty">
    <div class="empty-icon">${icon}</div>
    <div class="empty-title">${title}</div>
    <div class="empty-sub">${sub}</div>
  </div>`
}

function skeletonCells(n){
  return Array.from({length:n}, () => `
    <div class="skel-cell">
      <div class="skel-icon skel"></div>
      <div style="flex:1">
        <div class="skel-line skel"></div>
        <div class="skel-line short skel"></div>
      </div>
    </div>`).join('')
}

function escHtml(s){
  if (s == null) return ''
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}
function escHtmlAttr(s){
  return escHtml(s).replace(/`/g,'&#96;')
}
