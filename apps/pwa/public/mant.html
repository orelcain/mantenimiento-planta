// MOVER equipo entre sub-sub-listas
// fromIdx: -1 = Sin categoría de la sub-lista  |  ≥0 = índice de sub-sub-lista
// toIdx:   -1 = Sin categoría                  |  ≥0 = índice de sub-sub-lista destino
// ──────────────────────────────────────────────────────────────────────
function showMoveToSubSubListSheet(listName, subListIdx, machineId, fromSubSubIdx){
  const list = prefs.favoriteLists.find(l => l.name === listName)
  const sl   = list?.subLists?.[subListIdx]
  if (!sl) return
  const subSubLists = sl.subLists || []
  const m = machineMap[machineId] || {}
  const machineName = m.nombre || machineId

  const options = []
  if (fromSubSubIdx >= 0) options.push({ label: 'Sin categoría', toIdx: -1, ico: '📋' })
  subSubLists.forEach((ssl, i) => {
    if (i !== fromSubSubIdx) options.push({ label: ssl.name, toIdx: i, ico: '📂' })
  })
  if (options.length === 0){ showToast('No hay otras sub-sub-listas', 'info'); return }

  const lnAttr  = escHtmlAttr(JSON.stringify(listName))
  const midAttr = escHtmlAttr(machineId)

  document.getElementById('sheet-title').textContent = `Mover "${machineName}" a…`
  document.getElementById('sheet-content').innerHTML = `
    <div class="cell-group" style="margin:0">
      ${options.map(o => `
        <div class="sheet-row" onclick="executeMoveToSubSubList(${lnAttr},${subListIdx},'${midAttr}',${fromSubSubIdx},${o.toIdx})">
          <div class="ico">${o.ico}</div>
          <div class="body"><div class="name">${escHtml(o.label)}</div></div>
        </div>`).join('')}
    </div>`

  favSheetCtx = null
  document.getElementById('sheet-overlay').classList.add('open')
  requestAnimationFrame(() => document.getElementById('sheet').classList.add('open'))
  tgApp?.HapticFeedback?.impactOccurred('light')
}

async function executeMoveToSubSubList(listName, subListIdx, machineId, fromSubSubIdx, toSubSubIdx){
  closeSheet()
  const list = prefs.favoriteLists.find(l => l.name === listName)
  const sl   = list?.subLists?.[subListIdx]
  if (!sl) return
  const subSubLists = sl.subLists || []

  // sl.machineIds es la UNIÓN de todos los equipos de la sub-lista: no se toca aquí.
  // Solo gestionamos la membresía en ssl.machineIds.

  // 1. Quitar de la sub-sub-lista origen (si venía de una ssl)
  if (fromSubSubIdx >= 0){
    const src = subSubLists[fromSubSubIdx]
    if (src) src.machineIds = (src.machineIds || []).filter(id => id !== machineId)
  }
  // Si fromSubSubIdx === -1 estaba "sin categoría" dentro de la sub-lista → nada que quitar

  // 2. Agregar a la sub-sub-lista destino (si va a una ssl)
  if (toSubSubIdx >= 0){
    const dst = subSubLists[toSubSubIdx]
    if (dst && !(dst.machineIds || []).includes(machineId))
      dst.machineIds = [...(dst.machineIds || []), machineId]
  }
  // Si toSubSubIdx === -1 queda "sin categoría" dentro de la sub-lista → ya en sl.machineIds

  const destName = toSubSubIdx === -1 ? 'Sin categoría' : subSubLists[toSubSubIdx]?.name || ''
  // Re-renderizar la vista actual
  if (fromSubSubIdx >= 0){
    openSubSubList(listName, subListIdx, fromSubSubIdx, { push: false })
  } else {
    openSubList(listName, subListIdx, { push: false })
  }

  saveAllPrefs().then(() => {
    showToast(`Movido a "${destName}" ✓`, 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
  }).catch(err => {
    if (IS_PREVIEW) showToast(`Movido a "${destName}" (preview)`, 'ok')
    else showToast('Error al guardar: ' + (err.message || ''), 'err')
  })
}

function repCellHtml(r, machineId, machineName){
  const icon = repIcon(r.tipo)
  const name = r.textoBreve || r.descripcion || r.alias || 'Sin nombre'
  const sub = [r.tipo, machineName].filter(Boolean).join(' · ')
  return `<div class="cell" onclick="openRepuesto('${escHtmlAttr(machineId)}','${escHtmlAttr(r.id)}')">
    <div class="cell-icon">${icon}</div>
    <div class="cell-body">
      <div class="cell-title">${escHtml(name)}</div>
      ${r.codigoSAP ? `<div class="cell-meta">SAP ${escHtml(r.codigoSAP)}</div>` : ''}
      ${sub ? `<div class="cell-sub">${escHtml(sub)}</div>` : ''}
    </div>
    <div class="cell-chevron">›</div>
  </div>`
}

function repIcon(tipo){
  const map = {
    'RODAMIENTO':'⚙️','SELLO':'🔵','JUNTA':'🔵','SENSOR':'📡','MOTOR':'⚡',
    'CORREA':'〰️','CADENA':'🔗','VALVULA':'🔧','FILTRO':'🔳','CUCHILLA':'🔪',
    'CUCHILLO':'🔪','RESORTE':'🌀','ENGRANAJE':'⚙️','BOMBA':'💧',
  }
  if (!tipo) return '🔩'
  const u = tipo.toUpperCase()
  for (const [k,v] of Object.entries(map)) if (u.includes(k)) return v
  return '🔩'
}

  if (r.codigoSAP) renderRepCrossEquipo(r.codigoSAP, machineId)
  // Manuales del equipo padre — reutiliza __manualesCache si está, lazy load si no
  renderRepEquipoManuales(machineId, equipoPath.name)
}

function shareRepuesto(machineId, repuestoId){
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  if (!r) return
  const title = r.textoBreve || r.alias || 'Repuesto'
  const sap = r.codigoSAP ? `\nSAP: ${r.codigoSAP}` : ''

  const others = all.filter(x => x.machineId !== currentMachineId)
  if (others.length === 0) return
  const el = document.getElementById('rep-cross-equipo')
  if (!el) return

  // Nombre del repuesto para openCrossEquipoView
  const repName = all[0]?.repuesto.textoBreve || codigoSAP

  const PREVIEW_MAX = 4
  const preview = others.slice(0, PREVIEW_MAX)
  el.innerHTML = `
    <div class="section" onclick="openCrossEquipoView('${escHtmlAttr(codigoSAP)}','${escHtmlAttr(repName)}','${escHtmlAttr(currentMachineId)}')"

        const stockBadge = hasStock
          ? `<span style="font-size:11px;font-weight:700;color:${isLow?'#ef4444':'var(--green)'}">
               ${isLow?'⚠️':'📦'} ${r.stockFisico}${r.stockMinimo != null ? '/' + r.stockMinimo : ''}
             </span>`
          : ''
        return `<div class="cell" onclick="openRepuesto('${escHtmlAttr(x.machineId)}','${escHtmlAttr(r.id)}')">
          <div class="cell-icon">🏭</div>
          <div class="cell-body">
            <div class="cell-title">${escHtml(x.machineName)}</div>

          </div>

        <div class="cell" onclick="openCrossEquipoView('${escHtmlAttr(codigoSAP)}','${escHtmlAttr(repName)}','${escHtmlAttr(currentMachineId)}')">
          <div class="cell-icon" style="color:var(--accent)">📋</div>

function renderCrossEquipoView(codigoSAP, repName, currentMachineId){
  const el = document.getElementById('view-cross-equipo')
  if (!el) return

  if (!__repuestosCache){
    el.innerHTML = `<div class="notice" style="margin:16px;text-align:center;padding:24px">
      <div style="font-size:32px;margin-bottom:8px">⏳</div>
      <div style="font-weight:600">Catálogo no cargado</div>
      <div style="font-size:13px;color:var(--hint);margin-top:4px">Ve a Buscar y carga el catálogo primero</div>
    </div>`
    return
  }

  const norm = normalizeSearch(codigoSAP)
  const all = __repuestosCache
    .filter(x => normalizeSearch(x.repuesto.codigoSAP) === norm)
    .sort((a, b) => {
      // Equipo actual primero
      if (a.machineId === currentMachineId) return -1
      if (b.machineId === currentMachineId) return 1
      // Luego más críticos (bajo mínimo)
      const aLow = a.repuesto.stockMinimo != null && Number(a.repuesto.stockFisico) < Number(a.repuesto.stockMinimo)
      const bLow = b.repuesto.stockMinimo != null && Number(b.repuesto.stockFisico) < Number(b.repuesto.stockMinimo)
      if (aLow && !bLow) return -1
      if (!aLow && bLow) return 1
      return (a.machineName || '').localeCompare(b.machineName || '')
    })

  if (all.length === 0){
    el.innerHTML = `<div style="text-align:center;padding:48px 24px;color:var(--hint)">Sin resultados en catálogo</div>`
    return
  }

  const totalStock = all.reduce((s, x) => s + (Number(x.repuesto.stockFisico) || 0), 0)
  const withMin = all.filter(x => x.repuesto.stockMinimo != null)
  const bajoMin = withMin.filter(x => Number(x.repuesto.stockFisico) < Number(x.repuesto.stockMinimo))
  const canAdmin = userRole === 'admin' || userRole === 'supervisor'

  el.innerHTML = `
    <div style="padding:12px 14px 8px">
      <div style="font-size:12px;color:var(--hint);margin-bottom:6px">SAP ${escHtml(codigoSAP)}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div style="background:var(--card);border-radius:10px;padding:8px 14px;text-align:center;flex:1;min-width:80px">
          <div style="font-size:20px;font-weight:700">${all.length}</div>
          <div style="font-size:10px;color:var(--hint)">equipos</div>
        </div>
        <div style="background:var(--card);border-radius:10px;padding:8px 14px;text-align:center;flex:1;min-width:80px">
          <div style="font-size:20px;font-weight:700">${totalStock}</div>
          <div style="font-size:10px;color:var(--hint)">stock total</div>
        </div>
        ${bajoMin.length > 0 ? `
        <div style="background:rgba(239,68,68,.12);border-radius:10px;padding:8px 14px;text-align:center;flex:1;min-width:80px">
          <div style="font-size:20px;font-weight:700;color:#ef4444">${bajoMin.length}</div>
          <div style="font-size:10px;color:#ef4444">bajo mínimo</div>
        </div>` : ''}
      </div>
    </div>
    <div class="cell-group" style="margin-top:4px">
      ${all.map(x => {
        const r = x.repuesto
        const isCurrent = x.machineId === currentMachineId
        const hasStock = r.stockFisico != null
        const isLow = hasStock && r.stockMinimo != null && Number(r.stockFisico) < Number(r.stockMinimo)
        const stockColor = isLow ? '#ef4444' : hasStock ? 'var(--green)' : 'var(--hint)'
        const stockTxt = hasStock
          ? `${r.stockFisico}${r.stockMinimo != null ? ' / ' + r.stockMinimo : ''}`
          : '—'
        return `<div class="cell" onclick="openRepuesto('${escHtmlAttr(x.machineId)}','${escHtmlAttr(r.id)}')">
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
            width:40px;height:40px;border-radius:10px;flex-shrink:0;font-size:11px;font-weight:700;
            color:${stockColor};line-height:1.2;text-align:center;
            background:${isLow?'rgba(239,68,68,.12)':hasStock?'rgba(79,174,78,.1)':'var(--card)'}">
            ${isLow ? '⚠️' : hasStock ? '📦' : '·'}
            <span style="font-size:10px">${hasStock ? r.stockFisico : ''}</span>
          </div>
          <div class="cell-body">
            <div class="cell-title" style="${isCurrent?'color:var(--accent)':''}">${escHtml(x.machineName)}${isCurrent?' ✦':''}</div>
            <div style="display:flex;gap:6px;align-items:center;margin-top:2px">
              <span style="font-size:11px;color:${stockColor};font-weight:600">${stockTxt}</span>
              ${r.ubicacionEnPlanta ? `<span style="font-size:11px;color:var(--hint)">· ${escHtml(r.ubicacionEnPlanta)}</span>` : ''}
            </div>
          </div>
          ${canAdmin ? `<button onclick="event.stopPropagation();openStockConteoModal('${escHtmlAttr(x.machineId)}','${escHtmlAttr(r.id)}')"
            style="background:rgba(79,174,78,.15);border:none;border-radius:8px;color:var(--green);
              font-size:11px;font-weight:600;cursor:pointer;padding:5px 8px;flex-shrink:0">
            📦
          </button>` : ''}
          <div class="cell-chevron">›</div>
        </div>`
      }).join('')}
    </div>
    <div style="padding:16px 12px 8px;text-align:center;font-size:11px;color:var(--hint)">

function openLightboxRep(machineId, repuestoId, photoId){
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  if (!r) return
  const photos = [...(r.fotosReales || []), ...(r.imagenesManual || [])]
  const ph = photos.find(p => p.id === photoId)
  if (!ph) return
  // Solo permitir editar fotos reales (no las del manual original)
  const isReal = (r.fotosReales || []).some(p => p.id === photoId)
  const ctx = isReal ? { machineId, repuestoId, photoId, isPrincipal: !!ph.esPrincipal } : null
  openLightbox(ph.url, ph.descripcion || ph.tipo || '', ctx)

function openLightbox(url, caption, ctx){

  if (userRole === 'admin' && ctx){

      pBtn.disabled = true
    } else {
      pBtn.classList.remove('is-active')
      pBtn.textContent = '⭐ Hacer principal'
      pBtn.disabled = false
    }

    lbxPhotoCtx = null

  document.getElementById('lightbox').classList.add('open')
}

  document.getElementById('lightbox').classList.remove('open')

async function onLbxMarkPrincipal(){
  if (!lbxPhotoCtx || userRole !== 'admin') return
  const { machineId, repuestoId, photoId } = lbxPhotoCtx
  const btn = document.getElementById('lbx-principal')
  btn.disabled = true; btn.textContent = '⭐ Aplicando…'
  try {
    const docRef = db.collection(getRepuestoCollPath(machineId)).doc(repuestoId)
    const snap = await docRef.get()
    const fotos = (snap.exists ? snap.data().fotosReales : []) || []
    const newFotos = fotos.map(f => ({ ...f, esPrincipal: f.id === photoId }))
    await docRef.update({
      fotosReales: newFotos,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    })
    // Actualizar cache
    const reps = repCache[machineId] || []
    const idx = reps.findIndex(x => x.id === repuestoId)
    if (idx >= 0) reps[idx] = { ...reps[idx], fotosReales: newFotos }

    showToast('Foto principal actualizada ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    closeLightbox()
    openRepuesto(machineId, repuestoId, { fromSave: true })
  } catch(err){
    console.error('mark principal error', err)
    showToast('Error: ' + (err.message || 'No se pudo aplicar'), 'err')
    btn.disabled = false; btn.textContent = '⭐ Hacer principal'
  }
}

async function onLbxDelete(){
  if (!lbxPhotoCtx || userRole !== 'admin') return
  const ok = confirm('¿Borrar esta foto? No se puede deshacer.')
  if (!ok) return
  const { machineId, repuestoId, photoId } = lbxPhotoCtx
  const btn = document.getElementById('lbx-delete')
  btn.disabled = true; btn.textContent = '🗑️ Borrando…'
  try {
    const docRef = db.collection(getRepuestoCollPath(machineId)).doc(repuestoId)
    const snap = await docRef.get()
    const fotos = (snap.exists ? snap.data().fotosReales : []) || []
    const target = fotos.find(f => f.id === photoId)
    const newFotos = fotos.filter(f => f.id !== photoId)
    await docRef.update({
      fotosReales: newFotos,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    })
    // Borrar el archivo de Storage (best-effort)
    if (target?.url){
      try {
        await storage.refFromURL(target.url).delete()
      } catch(e){
        console.warn('no se pudo borrar storage object (puede no existir)', e)
      }
    }
    // Actualizar cache
    const reps = repCache[machineId] || []
    const idx = reps.findIndex(x => x.id === repuestoId)
    if (idx >= 0) reps[idx] = { ...reps[idx], fotosReales: newFotos }

    showToast('Foto borrada ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    closeLightbox()
    openRepuesto(machineId, repuestoId, { fromSave: true })
  } catch(err){
    console.error('delete photo error', err)
    showToast('Error: ' + (err.message || 'No se pudo borrar'), 'err')
    btn.disabled = false; btn.textContent = '🗑️ Borrar'
  }
}

/** Key canónico para escribir las listas de un equipo:
 *  primer hierarchy nodeId vinculado, o machineId si no hay vinculación. */
async function getCanonicalRepFavKey(machineId){
  const nodeIds = await getLinkedNodeIds(machineId)
  return nodeIds[0] || machineId
}

/** Devuelve los keys posibles donde puede haber listas para esa máquina */
async function getRelatedRepFavKeys(machineId){
  const nodeIds = await getLinkedNodeIds(machineId)
  return Array.from(new Set([...nodeIds, machineId]))
}

/** Persiste prefs.repuestoFavLists (y favoriteLists) en Firestore. */
async function saveAllPrefs(){
  // En IS_PREVIEW no escribir en Firestore: el SDK haría un optimistic-write que
  // dispararía el onSnapshot listener y revertiría prefs con los datos del servidor.
  if (IS_PREVIEW) return
  if (!uid) throw new Error('No hay sesión')
  await trackWrite(db.collection('user_preferences').doc(uid).set({
    favoriteLists:    prefs.favoriteLists    || [],
    repuestoFavLists: prefs.repuestoFavLists || {},
    insumoFavLists:   prefs.insumoFavLists   || [],
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  }, { merge: true }))
}

async function toggleRepInFavList(listName){
  if (!favSheetCtx) return
  const { machineId, repuestoId } = favSheetCtx
  const canonicalKey = await getCanonicalRepFavKey(machineId)
  const relatedKeys = await getRelatedRepFavKeys(machineId)
  const allLists = prefs.repuestoFavLists || {}

  // ¿Está actualmente?
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  let alreadyIn = false
  for (const k of relatedKeys){
    const list = (allLists[k] || []).find(l => l.name === listName)
    if (list){
      const set = new Set(list.repuestoIds || [])
      if (r ? matchesRepFavList(r, set) : set.has(repuestoId)){ alreadyIn = true; break }
    }
  }

  // Trabajar sobre el canonical: traer/crear la lista ahí
  if (!allLists[canonicalKey]) allLists[canonicalKey] = []
  let list = allLists[canonicalKey].find(l => l.name === listName)
  if (!list){
    // Si existe en otro key, mover al canonical (consolida)
    for (const k of relatedKeys){
      if (k === canonicalKey) continue
      const idx = (allLists[k] || []).findIndex(l => l.name === listName)
      if (idx >= 0){
        list = allLists[k][idx]
        allLists[k].splice(idx, 1)
        if (allLists[k].length === 0) delete allLists[k]
        allLists[canonicalKey].push(list)
        break
      }
    }
    if (!list){
      list = { name: listName, repuestoIds: [] }
      allLists[canonicalKey].push(list)
    }
  }
  list.repuestoIds = list.repuestoIds || []

  if (alreadyIn){
    // Quitar de TODAS las apariciones (consolidación)
    for (const k of relatedKeys){
      const lst = (allLists[k] || []).find(l => l.name === listName)
      if (!lst) continue
      lst.repuestoIds = (lst.repuestoIds || []).filter(id => {
        if (id === repuestoId) return false
        if (r?.codigoSAP && (id === `inv-${r.codigoSAP}` || id === r.codigoSAP)) return false
        return true
      })
    }
  } else {
    if (!list.repuestoIds.includes(repuestoId)) list.repuestoIds.push(repuestoId)
  }

  prefs.repuestoFavLists = allLists
  try {
    await saveAllPrefs()
    showToast(alreadyIn ? 'Quitado de la lista' : 'Agregado ✓', 'ok')
    tgApp?.HapticFeedback?.selectionChanged?.()
    // Re-render sheet (refresh estado)
    openFavListsSheet(machineId, repuestoId)
    // Re-render machine view si está visible (chips de fav)
    refreshMachineDetailIfActive(machineId)
  } catch(err){

async function createRepFavList(){
  if (!favSheetCtx) return
  const { machineId, repuestoId } = favSheetCtx
  showInputModal('Nueva lista', '', 'Ej. Cuchillos, Sensores, Resortes…', async (name) => {
    name = (name || '').trim()
    if (!name) return
    const canonicalKey = await getCanonicalRepFavKey(machineId)
    const allLists = prefs.repuestoFavLists || {}
    if (!allLists[canonicalKey]) allLists[canonicalKey] = []
    if (allLists[canonicalKey].some(l => l.name === name)){

      return
    }
    allLists[canonicalKey].push({ name, repuestoIds: repuestoId ? [repuestoId] : [] })
    prefs.repuestoFavLists = allLists
    try {
      await saveAllPrefs()
      showToast('Lista creada ✓', 'ok')
      tgApp?.HapticFeedback?.notificationOccurred('success')
      openFavListsSheet(machineId, repuestoId)
      refreshMachineDetailIfActive(machineId)
    } catch(err){
      showToast('Error: ' + (err.message || ''), 'err')
    }
  })
}

async function renameRepFavList(listName){
  if (!favSheetCtx) return
  const { machineId, repuestoId } = favSheetCtx
  showInputModal('Renombrar lista', listName, 'Nuevo nombre', async (newName) => {
    newName = (newName || '').trim()
    if (!newName || newName === listName) return
    const relatedKeys = await getRelatedRepFavKeys(machineId)
    const allLists = prefs.repuestoFavLists || {}
    // Verificar que el nuevo nombre no exista en ninguno de los keys
    for (const k of relatedKeys){
      if ((allLists[k] || []).some(l => l.name === newName)){
        showToast('Ya existe una lista con ese nombre', 'err')
        return
      }
    }
    // Renombrar en TODOS los keys (consolidación silenciosa)
    let renamed = false
    for (const k of relatedKeys){
      const list = (allLists[k] || []).find(l => l.name === listName)
      if (list){ list.name = newName; renamed = true }
    }
    if (!renamed) return
    prefs.repuestoFavLists = allLists
    try {
      await saveAllPrefs()
      showToast('Lista renombrada ✓', 'ok')
      openFavListsSheet(machineId, repuestoId)
      refreshMachineDetailIfActive(machineId)
    } catch(err){
      showToast('Error: ' + (err.message || ''), 'err')
    }
  })
}

async function deleteRepFavList(listName){
  if (!favSheetCtx) return
  const ok = confirm(`¿Borrar la lista "${listName}"? Los repuestos seguirán existiendo.`)
  if (!ok) return
  const { machineId, repuestoId } = favSheetCtx
  const relatedKeys = await getRelatedRepFavKeys(machineId)
  const allLists = prefs.repuestoFavLists || {}
  for (const k of relatedKeys){
    if (!allLists[k]) continue
    allLists[k] = allLists[k].filter(l => l.name !== listName)
    if (allLists[k].length === 0) delete allLists[k]
  }
  prefs.repuestoFavLists = allLists
  try {
    await saveAllPrefs()
    showToast('Lista borrada ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('warning')
    openFavListsSheet(machineId, repuestoId)
    refreshMachineDetailIfActive(machineId)
  } catch(err){
    showToast('Error: ' + (err.message || ''), 'err')
  }
}

let _modalCb = null
function showInputModal(title, defaultValue, placeholder, onOk, { withObs = false } = {}){
  const modal = document.getElementById('input-modal')
  document.getElementById('modal-title').textContent = title
  const inp = document.getElementById('modal-input')
  inp.value = defaultValue || ''
  inp.placeholder = placeholder || ''
  const obsEl = document.getElementById('modal-obs')
  obsEl.value = ''
  if (withObs) modal.classList.add('with-obs'); else modal.classList.remove('with-obs')
  modal.classList.add('open')
  setTimeout(() => inp.focus(), 80)
  _modalCb = onOk
  document.getElementById('modal-ok').onclick = () => {
    const v = inp.value
    const obs = withObs ? obsEl.value.trim() : ''
    const cb = _modalCb   // guardar ref ANTES de closeInputModal que la anula
    closeInputModal()
    if (cb) cb(v, obs)
  }
  inp.onkeydown = (e) => { if (e.key === 'Enter' && !withObs) document.getElementById('modal-ok').click() }
}
function closeInputModal(){
  const modal = document.getElementById('input-modal')
  modal.classList.remove('open', 'with-obs')
  _modalCb = null
}

// bodega_inventarios de la PWA principal). Guarda 3 campos en el doc:
//   stockFisico, stockContadoEn (ms), stockContadoPor (nombre)
// ═══════════════════════════════════════════════════════════════════
function openStockConteoModal(machineId, repuestoId){
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  if (!r) return
  const current = r.stockFisico != null ? String(r.stockFisico) : ''
  showInputModal(
    `Stock físico — ${r.textoBreve || 'Repuesto'}`,
    current,
    'Cantidad en bodega',
    async (val, obs) => {
      if (val == null || val === '') return
      const n = Number(String(val).replace(',', '.'))
      if (!Number.isFinite(n) || n < 0){
        showToast('Cantidad inválida', 'err'); return
      }
      await saveStockConteo(machineId, repuestoId, Math.round(n), { observaciones: obs || '' })
    },
    { withObs: true }
  )
  // Mejor UX en mobile: input numérico
  const inp = document.getElementById('modal-input')
  if (inp){ inp.type = 'number'; inp.inputMode = 'numeric'; inp.min = '0'; inp.step = '1' }
}

// silent=true: no navegar al detalle (usado por modo conteo rápido)
async function saveStockConteo(machineId, repuestoId, cantidad, { silent = false, observaciones = '' } = {}){
  const path = getRepuestoCollPath(machineId)
  const who = firstName || tgApp?.initDataUnsafe?.user?.first_name || 'usuario'
  const ts = Date.now()
  const r = (repCache[machineId] || []).find(x => x.id === repuestoId)
  // Historial: mantener últimos 10 conteos
  const prevHist = Array.isArray(r?.stockHistorial) ? r.stockHistorial : []
  const newEntry = { cantidad, ts, por: who, ...(observaciones ? { obs: observaciones } : {}) }
  const stockHistorial = [newEntry, ...prevHist].slice(0, 10)
  const update = { stockFisico: cantidad, stockContadoEn: ts, stockContadoPor: who, stockHistorial }
  if (r) Object.assign(r, update)
  const inGlobal = __repuestosCache?.find(x => x.repuesto.id === repuestoId && x.machineId === machineId)
  if (inGlobal) Object.assign(inGlobal.repuesto, update)
  if (!silent) openRepuesto(machineId, repuestoId, { fromSave: true })
  // Refrescar reporte de stock si está abierto, y badge en home
  if (document.getElementById('view-stock-report')?.classList.contains('active')) renderStockReport()
  renderHomeStockAlert()
  tgApp?.HapticFeedback?.notificationOccurred?.('success')
  // Audit log: registrar en Firestore (fire-and-forget, no bloquea UX)
  const machineName = machineMap[machineId]?.nombre || hierarchyNodesMap?.[machineId]?.nombre || machineId
  logStockConteo(machineId, machineName, repuestoId, r?.textoBreve || '', r?.codigoSAP || '', cantidad, r?.stockMinimo ?? null, observaciones)
  try {
    await trackWrite(db.doc(`${path}/${repuestoId}`).update(update))
    showToast('Stock actualizado ✓', 'ok')
  } catch (err) {
    if (IS_PREVIEW){ showToast('Stock guardado (solo preview)', 'ok'); return }
    showToast('Error: ' + (err.message || ''), 'err')
  }
}

function openStockMinimoModal(machineId, repuestoId){
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  if (!r) return
  showInputModal(
    `Stock mínimo — ${r.textoBreve || 'Repuesto'}`,
    r.stockMinimo != null ? String(r.stockMinimo) : '',
    'Cantidad mínima en bodega',
    async (val) => {
      if (val == null) return
      const trimmed = String(val).trim()
      const path = getRepuestoCollPath(machineId)
      const update = trimmed === ''
        ? { stockMinimo: firebase.firestore.FieldValue.delete() }
        : (() => {
            const n = Number(trimmed.replace(',', '.'))
            if (!Number.isFinite(n) || n < 0){ showToast('Cantidad inválida', 'err'); return null }
            return { stockMinimo: Math.round(n) }
          })()
      if (!update) return
      const localUpdate = trimmed === '' ? { stockMinimo: undefined } : update
      Object.assign(r, localUpdate)
      const inGlobal = __repuestosCache?.find(x => x.repuesto.id === repuestoId && x.machineId === machineId)
      if (inGlobal) Object.assign(inGlobal.repuesto, localUpdate)
      openRepuesto(machineId, repuestoId, { fromSave: true })
      if (document.getElementById('view-stock-report')?.classList.contains('active')) renderStockReport()
      renderHomeStockAlert()
      try {
        await db.doc(`${path}/${repuestoId}`).update(update)
        showToast('Stock mínimo actualizado ✓', 'ok')
      } catch (err) {
        if (IS_PREVIEW){ showToast('Guardado (solo preview)', 'ok'); return }
        showToast('Error: ' + (err.message || ''), 'err')
      }
    }
  )
  const inp = document.getElementById('modal-input')
  if (inp){ inp.type = 'number'; inp.inputMode = 'numeric'; inp.min = '0'; inp.step = '1' }
}

async function saveRepuestoEdit(machineId, repuestoId){
  if (userRole !== 'admin') return
  const btn = document.getElementById('btn-save-rep')
  btn.disabled = true
  btn.textContent = 'Guardando…'

  const updates = {}
  for (const [key, label, type] of EDIT_FIELDS){
    const inp = document.getElementById(`ef-${key}`)
    if (!inp) continue
    let v = inp.value
    if (type === 'number'){
      if (v === '' || v == null){ updates[key] = null; continue }
      const n = Number(v)
      if (Number.isNaN(n)){
        showToast(`${label}: número inválido`, 'err')
        btn.disabled = false; btn.textContent = 'Guardar'
        return
      }
      updates[key] = n
    } else {
      updates[key] = v.trim()
    }
  }

  // Validación mínima
  if (!updates.textoBreve){
    showToast('El nombre no puede estar vacío', 'err')
    btn.disabled = false; btn.textContent = 'Guardar'
    return
  }

  try {
    const docRef = db.collection(getRepuestoCollPath(machineId)).doc(repuestoId)
    const reps = repCache[machineId] || []
    const idx = reps.findIndex(x => x.id === repuestoId)
    const before = idx >= 0 ? { ...reps[idx] } : null

    await docRef.update({
      ...updates,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    })

    // Actualizar cache local + invalidar búsqueda global
    if (idx >= 0) reps[idx] = { ...reps[idx], ...updates }
    invalidateRepuestosCache()

    await logAudit('update', getRepuestoCollPath(machineId), repuestoId, before, updates,
      `Editar repuesto ${updates.textoBreve || repuestoId}`)

    showToast('Cambios guardados ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')

    // Volver al detalle (in-place, sin apilar)
    editingRepuestoCtx = null
    openRepuesto(machineId, repuestoId, { fromSave: true })
  } catch(err){
    console.error('save error', err)
    showToast('Error al guardar: ' + (err.message || ''), 'err')
    tgApp?.HapticFeedback?.notificationOccurred('error')
    btn.disabled = false; btn.textContent = 'Guardar'
  }
}

async function saveNewRepuesto(machineId){
  if (userRole !== 'admin') return
  const btn = document.getElementById('btn-save-rep')
  btn.disabled = true; btn.textContent = 'Creando…'

  const updates = {}
  for (const [key, label, type] of EDIT_FIELDS){
    const inp = document.getElementById(`ef-${key}`)
    if (!inp) continue
    let v = inp.value
    if (type === 'number'){
      if (v === '' || v == null) continue   // skip vacíos en creación
      const n = Number(v)
      if (Number.isNaN(n)){
        showToast(`${label}: número inválido`, 'err')
        btn.disabled = false; btn.textContent = 'Crear'
        return
      }
      updates[key] = n
    } else {
      const trimmed = v.trim()
      if (trimmed) updates[key] = trimmed
    }
  }

  if (!updates.textoBreve){
    showToast('El nombre es obligatorio', 'err')
    btn.disabled = false; btn.textContent = 'Crear'
    return
  }
  if (!updates.codigoSAP){
    showToast('El código SAP es obligatorio', 'err')
    btn.disabled = false; btn.textContent = 'Crear'
    return
  }
  // Validar SAP único en este equipo
  const reps = repCache[machineId] || []
  if (reps.some(r => r.codigoSAP === updates.codigoSAP)){
    showToast(`SAP ${updates.codigoSAP} ya existe en este equipo`, 'err')
    btn.disabled = false; btn.textContent = 'Crear'
    return
  }

  try {
    const collPath = getRepuestoCollPath(machineId)
    const doc = {
      ...updates,
      createdBy: uid || '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      source: 'miniapp',
    }
    const ref = await db.collection(collPath).add(doc)
    if (!repCache[machineId]) repCache[machineId] = []
    repCache[machineId].push({ id: ref.id, ...updates })
    invalidateRepuestosCache()
    await logAudit('create', collPath, ref.id, null, doc, `Crear repuesto ${updates.textoBreve}`)
    showToast(`Repuesto "${updates.textoBreve}" creado ✓`, 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    editingRepuestoCtx = null
    openRepuesto(machineId, ref.id, { fromSave: true })
  } catch(err){
    console.error('create error', err)
    showToast('Error al crear: ' + (err.message || ''), 'err')
    tgApp?.HapticFeedback?.notificationOccurred('error')
    btn.disabled = false; btn.textContent = 'Crear'
  }
}

function compressImage(file, maxW = 1200, maxH = 1200, quality = 0.85){
  return new Promise((resolve, reject) => {
    const img = new Image()
    img.onload = () => {
      let { width, height } = img
      const ratio = Math.min(maxW/width, maxH/height, 1)
      width  = Math.round(width  * ratio)
      height = Math.round(height * ratio)
      const canvas = document.createElement('canvas')
      canvas.width = width
      canvas.height = height
      const ctx = canvas.getContext('2d')
      ctx.drawImage(img, 0, 0, width, height)
      canvas.toBlob(blob => {
        if (!blob) return reject(new Error('Compresión falló'))
        resolve({ blob, width, height })
      }, 'image/jpeg', quality)
    }
    img.onerror = () => reject(new Error('No se pudo leer la imagen'))
    const reader = new FileReader()
    reader.onload = e => { img.src = e.target.result }
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'))
    reader.readAsDataURL(file)
  })
}

async function uploadRepuestoPhoto(file, machineId, repuestoId){
  if (userRole !== 'admin') throw new Error('Solo admin puede subir fotos')
  if (!file.type.startsWith('image/')) throw new Error('Solo imágenes')
  if (file.size > 15 * 1024 * 1024) throw new Error('Imagen demasiado grande (>15MB)')

  showUploading('Optimizando imagen…')

  // Comprimir (skip GIF/SVG)
  let blob = file, width, height
  const skipOpt = ['image/gif','image/svg+xml'].includes(file.type)
  if (!skipOpt){
    try {
      const r = await compressImage(file, 1200, 1200, 0.85)
      blob = r.blob; width = r.width; height = r.height
    } catch(e){ console.warn('compress failed, using original', e) }
  }

  showUploading('Subiendo foto…')

  const timestamp = Date.now()
  const safeName = (file.name || 'photo.jpg').replace(/[^\w.\-]+/g, '_')
  const fileName = `${timestamp}_${safeName.endsWith('.jpg') || safeName.endsWith('.jpeg') ? safeName : safeName.replace(/\.[^.]+$/,'') + '.jpg'}`
  // Determinar ruta correcta según si el repuesto está en machines/ o hierarchy/
  const collPath = getRepuestoCollPath(machineId)
  const storagePath = `${collPath}/${repuestoId}/real/${fileName}`

  const ref = storage.ref(storagePath)
  await ref.put(blob, { contentType: 'image/jpeg' })
  const url = await ref.getDownloadURL()

  const newImg = {
    id: String(timestamp),
    url,
    descripcion: '',
    orden: 0,
    esPrincipal: false,
    tipo: 'real',
    createdAt: new Date(),
    sizeOriginal: file.size,
    sizeFinal: blob.size,
    formatFinal: skipOpt ? 'original' : 'jpeg',
    qualityFinal: skipOpt ? undefined : 0.85,
    width, height,
  }

  showUploading('Guardando…')

  const docRef = db.collection(collPath).doc(repuestoId)
  const snap = await docRef.get()
  const cur = snap.exists ? (snap.data().fotosReales || []) : []
  await docRef.update({
    fotosReales: [...cur, newImg],
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  })

  // Actualizar cache local
  const reps = repCache[machineId] || []
  const idx = reps.findIndex(x => x.id === repuestoId)
  if (idx >= 0){
    reps[idx] = { ...reps[idx], fotosReales: [...(reps[idx].fotosReales || []), newImg] }
  }
  const gItem = __repuestosCache?.find(x => x.repuesto.id === repuestoId && x.machineId === machineId)
  if (gItem) gItem.repuesto.fotosReales = [...(gItem.repuesto.fotosReales || []), newImg]

  return newImg
}

async function loadHierarchyTree(){
  const now = Date.now()
  if (__hierarchyCache && (now - __hierarchyCache.ts) < HIERARCHY_CACHE_TTL) return

  // 1) localStorage (sobrevive sesiones, evita read Firebase en cada apertura)
  const cached = lsGet(LS_KEY_HIERARCHY, LS_TTL_HIER)
  if (cached){
    rebuildHierarchyFromNodes(cached)
    __hierarchyCache = { ts: now }
    return
  }

  // 2) Firestore (con índice activo+nivel+orden)
  const snap = await db.collection('hierarchy')
    .where('activo','==',true)
    .orderBy('nivel','asc')
    .orderBy('orden','asc')
    .get()
  const nodes = snap.docs.map(d => ({ id: d.id, ...d.data() }))
  rebuildHierarchyFromNodes(nodes)
  lsSet(LS_KEY_HIERARCHY, normalizeForCache(nodes))
  __hierarchyCache = { ts: now }
}

function rebuildHierarchyFromNodes(nodes){
  hierarchyNodesMap = {}
  hierarchyChildrenMap = {}
  hierarchyRoots = []

  for (const n of nodes) hierarchyNodesMap[n.id] = n
  for (const n of nodes){
    const pid = n.parentId
    if (!pid || !hierarchyNodesMap[pid]) hierarchyRoots.push(n)
    else {
      if (!hierarchyChildrenMap[pid]) hierarchyChildrenMap[pid] = []
      hierarchyChildrenMap[pid].push(n)
    }
  }

  // Sintetizar machineMap para hojas sin máquina vinculada
  for (const n of nodes){
    const isLeaf = !(hierarchyChildrenMap[n.id]?.length > 0)
    if (!isLeaf || n.linkedMachineId || machineMap[n.id]) continue
    machineMap[n.id] = {
      id: n.id,
      nombre: n.nombre || 'Equipo',
      seccion: LEVEL_LABELS[n.nivel||7] || 'Equipo',
      hierarchyPath: Array.isArray(n.path) ? n.path.join(' › ') : '',
      descripcion: n.descripcion || '',
      _isHierarchyOnly: true,
      activa: true,
    }
  }
}

// Expande IDs de lista de favoritos hacia descendientes hierarchy.
// Si la lista contiene un machine con hierarchyNodeId, agrega también sus
// descendientes. Si contiene un nodo hierarchy, agrega sus descendientes.
function expandListIdsHierarchically(ids){
  const out = new Set(ids || [])
  if (!hierarchyNodesMap || !hierarchyChildrenMap) return out
  const seedNodeIds = []
  for (const id of ids || []){
    if (hierarchyNodesMap[id]) seedNodeIds.push(id)
    const m = machineMap[id]
    if (m?.hierarchyNodeId && hierarchyNodesMap[m.hierarchyNodeId]){
      seedNodeIds.push(m.hierarchyNodeId)
      out.add(m.hierarchyNodeId)
    }
  }
  // BFS desde cada seed: agrega todos los descendientes y los machines vinculados
  const queue = [...seedNodeIds]
  const visited = new Set(seedNodeIds)
  while (queue.length){
    const nodeId = queue.shift()
    out.add(nodeId)
    // Machines vinculadas al nodeId
    for (const mid of Object.keys(machineMap)){
      if (machineMap[mid]?.hierarchyNodeId === nodeId) out.add(mid)
    }
    const children = hierarchyChildrenMap[nodeId] || []
    for (const child of children){
      if (visited.has(child.id)) continue
      visited.add(child.id)
      queue.push(child.id)
    }
  }
  return out
}

// Path jerárquico de un equipo: "PROCESO › EVISCERADO › CINTAS PP › ..."
// Retorna { path: string, nodeId: string|null } — nodeId solo si está en hierarchy
function getEquipoPath(machineId){
  const m = machineMap[machineId]
  // Caso 1: machine con hierarchyPath cacheado
  if (m?.hierarchyPath){
    return { path: m.hierarchyPath, nodeId: m.hierarchyNodeId || null, name: m.nombre }
  }
  // Caso 2: nodo hierarchy puro
  const node = hierarchyNodesMap?.[machineId]
  if (node){
    const stack = buildHierStackForNode(node)
    return { path: stack.map(s => s.nombre).join(' › '), nodeId: node.id, name: node.nombre }
  }
  // Caso 3: machine vinculada a hierarchy via hierarchyNodeId
  if (m?.hierarchyNodeId && hierarchyNodesMap?.[m.hierarchyNodeId]){
    const stack = buildHierStackForNode(hierarchyNodesMap[m.hierarchyNodeId])
    return { path: stack.map(s => s.nombre).join(' › '), nodeId: m.hierarchyNodeId, name: m.nombre }
  }
  return { path: m?.nombre || '', nodeId: null, name: m?.nombre || '' }
}

function getRepuestoCollPath(machineId){
  const m = machineMap[machineId]
  // Si el id corresponde a un nodo hierarchy (puro o vinculado), los repuestos
  // propios viven en hierarchy/{id}/repuestos. Cubre el caso 'CINTA ACELERACION 1
  // BALANZA ESTATICA' que no está en machines pero sí en hierarchy.
  if (m?._isHierarchyOnly) return `hierarchy/${machineId}/repuestos`
  if (!m && hierarchyNodesMap?.[machineId]) return `hierarchy/${machineId}/repuestos`
  return `machines/${machineId}/repuestos`
}

function isEquipNode(node){
  return !(hierarchyChildrenMap[node.id]?.length > 0)
}

function countEquipDescendants(nodeId){
  const children = hierarchyChildrenMap[nodeId] || []
  if (!children.length) return 1
  let c = 0
  for (const ch of children) c += isEquipNode(ch) ? 1 : countEquipDescendants(ch.id)
  return c
}

function renderHierarchyLevel(){
  const el = document.getElementById('view-hierarchy')
  if (!el) return

  const currentId = hierarchyStack.length ? hierarchyStack[hierarchyStack.length-1].id : null
  const allNodes = currentId ? (hierarchyChildrenMap[currentId] || []) : hierarchyRoots

  // Breadcrumb
  const breadHtml = `
    <div class="hier-breadcrumb">
      <button class="hier-bread-item${!currentId?' active':''}" onclick="hierarchyGoTo(-1)">🌳 Planta</button>
      ${hierarchyStack.map((item,i) => `
        <span class="hier-bread-sep">›</span>
        <button class="hier-bread-item${i===hierarchyStack.length-1?' active':''}"
          onclick="hierarchyGoTo(${i})">${escHtml(item.nombre)}</button>
      `).join('')}
    </div>`

  const nodes = allNodes
  if (!nodes.length){
    el.innerHTML = breadHtml + emptyHtml('🔧','Sin elementos','Este nodo no tiene sub-elementos.')
    return
  }

  const nodesHtml = nodes.map(node => {
    const isEquip = isEquipNode(node)
    const nivel = node.nivel || 1
    const levelLabel = LEVEL_LABELS[nivel] || `N${nivel}`
    const levelColor = LEVEL_COLORS[nivel] || '#888'
    const linkedMachine = machines.find(m => m.hierarchyNodeId === node.id)
    const children = hierarchyChildrenMap[node.id] || []

    let subHtml
    if (isEquip){
      const repCount = linkedMachine && repCache[linkedMachine.id]
        ? repCache[linkedMachine.id].length : (node.repuestoCount ?? '…')
      subHtml = `${node.codigo ? escHtml(node.codigo)+' · ' : ''}${repCount} rep`
    } else {
      const equipCount = countEquipDescendants(node.id)
      subHtml = `${pl(children.length,'sub-nodo','sub-nodos')} · ${pl(equipCount,'equipo','equipos')}`
    }

    const addBtn = userRole==='admin' ? `
      <button class="cell-action-btn"
        onclick="event.stopPropagation();openHierAdminSheet('${escHtmlAttr(node.id)}',${isEquip})"
        title="Acciones admin (editar, mover, eliminar)">⋮</button>` : ''

    const onclick = isEquip
      ? `hierarchyOpenEquip('${escHtmlAttr(node.id)}','${escHtmlAttr(linkedMachine?.id||'')}')`
      : `hierarchyEnter('${escHtmlAttr(node.id)}','${escHtmlAttr(node.nombre||'')}')`

    return `
      <div class="cell" onclick="${onclick}">
        <div class="cell-icon" style="background:${levelColor}22;color:${levelColor}">
          ${isEquip?'⚙️':'📁'}
        </div>
        <div class="cell-body">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <div class="cell-title">${escHtml(node.nombre||'Sin nombre')}</div>
            <span class="level-chip" style="background:${levelColor}22;color:${levelColor}">${levelLabel}</span>
          </div>
          <div class="cell-sub">${subHtml}</div>
        </div>
        ${addBtn}
        ${isEquip?'':'<div class="cell-chevron">›</div>'}
      </div>`
  }).join('')

  const adminAddBtn = userRole==='admin' ? `
    <div style="padding:10px 16px 4px">
      <button class="btn-add-node" onclick="openAddHierNodeModal('${escHtmlAttr(currentId||'')}')">
        + Agregar nodo aquí
      </button>
    </div>` : ''

  el.innerHTML = `
    ${breadHtml}
    <div class="cell-group" style="margin-top:8px">${nodesHtml}</div>
    ${adminAddBtn}`
}

async function hierAddToList(listIdx){
  const list = prefs.favoriteLists[listIdx]
  if (!list) return
  const nodeId = hierSheetNodeId

  // Recolectar IDs a agregar
  let idsToAdd = [nodeId]
  if (!hierSheetIsEquip){
    function collectLeaves(nid){
      const ch = hierarchyChildrenMap[nid] || []
      if (!ch.length) return [nid]
      return ch.flatMap(c => isEquipNode(c) ? [c.id] : collectLeaves(c.id))
    }
    idsToAdd = collectLeaves(nodeId)
    const newCount = idsToAdd.filter(id => !_listContainsId(list, id)).length
    if (!newCount){ showToast('Todos ya están en la lista','ok'); closeSheet(); return }
    const ok = await new Promise(res => tgApp?.showConfirm(
      `¿Agregar ${pl(idsToAdd.length,'equipo','equipos')} a "${list.name}"?`, res))
    if (!ok){ closeSheet(); return }
  }

  // Si la lista tiene sub-listas → preguntar destino
  const subLists = list.subLists || []
  if (subLists.length > 0){
    hierShowSubListPicker(list, listIdx, idsToAdd)
    return
  }

  // Sin sub-listas → agregar directo al nivel raíz
  _hierDoAddToList(list, idsToAdd, null)
}

/** Devuelve true si el machineId ya está en la lista (raíz o sub-listas) */
function _listContainsId(list, id){
  if ((list.machineIds || []).includes(id)) return true
  return (list.subLists || []).some(sl =>
    (sl.machineIds || []).includes(id) ||
    (sl.subLists || []).some(ssl => (ssl.machineIds || []).includes(id))
  )
}

/** Sheet secundario: elegir sub-lista destino */
function hierShowSubListPicker(list, listIdx, idsToAdd){
  const subLists = list.subLists || []
  const title = document.getElementById('sheet-title')
  const content = document.getElementById('sheet-content')
  title.textContent = `¿En qué parte de "${list.name}"?`
  content.innerHTML = `
    <div class="cell-group" style="margin:0">
      <div class="sheet-row" onclick="hierDoAddToSubList(${listIdx},null,${JSON.stringify(idsToAdd)})">
        <div class="ico">📋</div>
        <div class="body"><div class="name">Sin categoría</div>
          <div class="sub">Nivel raíz de la lista</div></div>
      </div>
      ${subLists.map((sl, si) => `
        <div class="sheet-row" onclick="hierDoAddToSubList(${listIdx},${si},${escHtmlAttr(JSON.stringify(idsToAdd))})">
          <div class="ico">📁</div>
          <div class="body"><div class="name">${escHtml(sl.name)}</div>
            <div class="sub">${pl(sl.machineIds?.length||0,'equipo','equipos')}</div></div>
        </div>`).join('')}
    </div>`
}

async function hierDoAddToSubList(listIdx, subListIdx, idsToAdd){
  const list = prefs.favoriteLists[listIdx]
  if (!list) return
  await _hierDoAddToList(list, idsToAdd, subListIdx)
}

async function _hierDoAddToList(list, idsToAdd, subListIdx){
  if (subListIdx != null && subListIdx >= 0){
    // Agregar a una sub-lista específica
    const sl = list.subLists[subListIdx]
    if (!sl) return
    // Agregar a la sub-lista
    const existingSl = new Set(sl.machineIds || [])
    for (const id of idsToAdd) existingSl.add(id)
    sl.machineIds = [...existingSl]
    // TAMBIÉN agregar a list.machineIds (unión total → compatibilidad PWA)
    const existingTop = new Set(list.machineIds || [])
    for (const id of idsToAdd) existingTop.add(id)
    list.machineIds = [...existingTop]
    closeSheet()
    showToast(`Agregado a "${sl.name}" ✓`, 'ok')
  } else {
    // Agregar al nivel raíz (Sin categoría)
    const existing = new Set(list.machineIds || [])
    for (const id of idsToAdd) existing.add(id)
    list.machineIds = [...existing]
    closeSheet()
    showToast(`Agregado a "${list.name}" ✓`, 'ok')
  }
  tgApp?.HapticFeedback?.notificationOccurred('success')
  saveAllPrefs().catch(err => console.error('saveAllPrefs:', err))
}

function hierCreateListAndAdd(){
  closeSheet()
  showInputModal('Nueva lista de equipos','','Nombre (ej: Bombas y motores)', async name => {
    if (!name?.trim()) return
    const newList = { name: name.trim(), machineIds: [hierSheetNodeId] }
    prefs.favoriteLists = [...(prefs.favoriteLists||[]), newList]
    await saveAllPrefs()
    showToast(`Lista "${newList.name}" creada ✓`, 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    if (currentTab === 'home') renderHome()
  })
}

function openAddHierNodeModal(parentId){

    if (!name?.trim()) return
    try {

      const codigo = name.trim().toUpperCase().replace(/\s+/g,'-').slice(0,20)
      await db.collection('hierarchy').add({

    }
  })

function editHierNodeName(nodeId){
  const node = hierarchyNodesMap[nodeId]
  if (!node) return
  closeSheet()
  showInputModal('Editar nombre', node.nombre || '', 'Nuevo nombre del nodo', async (name) => {
    const trimmed = (name || '').trim()
    if (!trimmed || trimmed === node.nombre) return
    const before = { nombre: node.nombre, codigo: node.codigo }
    const newCodigo = trimmed.toUpperCase().replace(/\s+/g,'-').slice(0,40)
    try {
      await db.collection('hierarchy').doc(nodeId).update({
        nombre: trimmed,
        codigo: newCodigo,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: uid,
      })
      node.nombre = trimmed
      node.codigo = newCodigo

      __hierarchyCache = null
      await logAudit('update', 'hierarchy', nodeId, before, { nombre: trimmed, codigo: newCodigo }, `Renombrar nodo: ${before.nombre} → ${trimmed}`)
      showToast('Nombre actualizado ✓','ok')

      renderHierarchyLevel()
    } catch(err){

  })

async function deleteHierNode(nodeId){
  const node = hierarchyNodesMap[nodeId]
  if (!node) return
  closeSheet()

  // Recopilar TODOS los descendientes recursivamente
  function collectDescendants(id){
    const ids = [id]
    for (const child of (hierarchyChildrenMap[id] || [])){
      ids.push(...collectDescendants(child))
    }
    return ids
  }
  const allIds = collectDescendants(nodeId) // nodeId + todos sus descendientes

  // Contar repuestos propios del nodo raíz para el aviso
  let repCount = 0
  try {
    const fullSnap = await db.collection(`hierarchy/${nodeId}/repuestos`).get()
    repCount = fullSnap.size
  } catch {}

  const descendantCount = allIds.length - 1
  const linkedMachine = machines.find(m => m.hierarchyNodeId === nodeId)

  const partes = []
  if (descendantCount > 0) partes.push(`${descendantCount} sub-nodo(s) y sus repuestos`)
  if (repCount) partes.push(`${repCount} repuesto(s) propios`)
  if (linkedMachine) partes.push(`vinculado a "${linkedMachine.nombre}"`)

  const warning = partes.length
    ? `\n\n⚠️ Se eliminarán también: ${partes.join(' + ')}.`
    : ''
  const msg = `Eliminar nodo "${node.nombre}"?${warning}\n\nEsta acción es irreversible.`

  const ok = await new Promise(res => tgApp?.showConfirm
    ? tgApp.showConfirm(msg, res)
    : res(confirm(msg)))
  if (!ok) return

  try {
    // Borrar repuestos + doc de cada nodo en cascada (batches de 400 ops)
    const deleteOps = [] // refs a borrar
    for (const id of allIds){
      try {
        const repSnap = await db.collection(`hierarchy/${id}/repuestos`).get()
        repSnap.docs.forEach(d => deleteOps.push(d.ref))
      } catch {}
      deleteOps.push(db.collection('hierarchy').doc(id))
    }
    // Ejecutar en batches de 400 (límite Firestore: 500)
    for (let i = 0; i < deleteOps.length; i += 400){
      const b = db.batch()
      deleteOps.slice(i, i + 400).forEach(ref => b.delete(ref))
      await b.commit()
    }

    // Limpiar estado local de todos los nodos eliminados
    for (const id of allIds){
      delete hierarchyNodesMap[id]
      if (machineMap[id]?._isHierarchyOnly) delete machineMap[id]
      delete repCache[id]
      if (hierarchyChildrenMap[id]) delete hierarchyChildrenMap[id]
    }
    // Quitar nodeId de la lista de hijos de su padre
    if (node.parentId && hierarchyChildrenMap[node.parentId]){
      hierarchyChildrenMap[node.parentId] = hierarchyChildrenMap[node.parentId].filter(id => id !== nodeId)
    }
    __hierarchyCache = null
    invalidateRepuestosCache()

    await logAudit('delete', 'hierarchy', nodeId,
      { nombre: node.nombre, parentId: node.parentId, nivel: node.nivel, repCount,
        childCount: descendantCount, allDeletedIds: allIds },
      null,
      `Eliminar nodo (cascada): ${node.nombre}${descendantCount ? ` + ${descendantCount} sub-nodos` : ''}`)

    showToast(`Nodo eliminado ✓${descendantCount ? ` (+ ${descendantCount} sub-nodos)` : ''}`, 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    await renderHierarchyTab()
  } catch(err){
    showToast('Error al eliminar: '+(err.message||''),'err')
  }
}

function openMoveHierNodeSheet(nodeId){
  closeSheet()
  const node = hierarchyNodesMap[nodeId]
  if (!node) return

  // No se puede mover a sí mismo ni a un descendiente
  const descendantIds = new Set([nodeId])
  const stack = [nodeId]
  while (stack.length){
    const id = stack.pop()
    const ch = hierarchyChildrenMap[id] || []
    for (const c of ch){
      descendantIds.add(c.id)
      stack.push(c.id)
    }
  }

  setTimeout(() => showNodePickerSheet(`Mover "${node.nombre}" a:`, {
    excludeIds: descendantIds,
    allowRoot: true,
    rootLabel: '🏠 Raíz (sin padre)',
  }, async (newParentId) => {
    if (newParentId === node.parentId) {
      showToast('Mismo padre, sin cambios','err')
      return
    }
    await executeMoveHierNode(nodeId, newParentId)
  }), 50)
}

async function executeMoveHierNode(nodeId, newParentId){
  const node = hierarchyNodesMap[nodeId]
  if (!node) return
  const newParent = newParentId ? hierarchyNodesMap[newParentId] : null
  const newNivel = newParent ? ((newParent.nivel||1)+1) : 1
  const before = { parentId: node.parentId, nivel: node.nivel }
  const after = { parentId: newParentId||null, nivel: newNivel }
  try {
    await db.collection('hierarchy').doc(nodeId).update({
      parentId: newParentId||null,
      nivel: newNivel,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: uid,
    })
    node.parentId = newParentId||null
    node.nivel = newNivel
    __hierarchyCache = null
    await logAudit('update', 'hierarchy', nodeId, before, after, `Mover nodo: ${node.nombre}`)
    showToast('Nodo movido ✓','ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    await renderHierarchyTab()
  } catch(err){
    showToast('Error: '+(err.message||''),'err')
  }
}

// PICKER de nodo reutilizable (mover nodo / mover repuesto)
// ═══════════════════════════════════════════════════════════════════
let _nodePickerCb = null
let _nodePickerOpts = null

function showNodePickerSheet(title, opts, callback){
  _nodePickerCb = callback
  _nodePickerOpts = opts || {}
  const sheet = document.getElementById('sheet')
  const overlay = document.getElementById('sheet-overlay')
  const titleEl = document.getElementById('sheet-title')
  const content = document.getElementById('sheet-content')
  titleEl.textContent = title
  content.innerHTML = `
    <div style="padding:8px 12px;position:sticky;top:0;background:var(--bg2);z-index:1;border-bottom:1px solid var(--divider)">
      <input id="nodepicker-search" type="text" placeholder="Buscar nodo por nombre…"
        autocomplete="off"
        style="width:100%;padding:9px 12px;background:var(--bg);color:var(--text);
          border:1px solid var(--divider);border-radius:8px;font-size:14px;outline:none"
        oninput="renderNodePickerList()">
    </div>
    <div id="nodepicker-list"></div>`
  renderNodePickerList()
  overlay.classList.add('open')
  requestAnimationFrame(() => sheet.classList.add('open'))
  setTimeout(() => document.getElementById('nodepicker-search')?.focus(), 80)
}

function renderNodePickerList(){
  const listEl = document.getElementById('nodepicker-list')
  if (!listEl || !_nodePickerOpts) return
  const q = normalizeSearch(document.getElementById('nodepicker-search')?.value || '')
  const exclude = _nodePickerOpts.excludeIds || new Set()
  const onlyEquipos = _nodePickerOpts.onlyEquipos

  let nodes = Object.values(hierarchyNodesMap || {})
  if (onlyEquipos) nodes = nodes.filter(n => isEquipNode(n))
  if (exclude.size) nodes = nodes.filter(n => !exclude.has(n.id))
  if (q) nodes = nodes.filter(n => normalizeSearch(n.nombre || '').includes(q))
  nodes.sort((a,b) => ((a.nivel||0) - (b.nivel||0)) || (a.nombre||'').localeCompare(b.nombre||''))
  const capped = nodes.slice(0, 100)

  let html = ''
  if (_nodePickerOpts.allowRoot && !q){
    html += `<div class="sheet-row" onclick="onNodePickerSelect(null)">
      <div class="ico">🏠</div>
      <div class="body"><div class="name">${escHtml(_nodePickerOpts.rootLabel || '(Raíz)')}</div></div>
    </div>`
  }
  html += capped.map(n => {
    const path = buildHierStackForNode(n).slice(0,-1).map(s => s.nombre).join(' › ')
    const isEq = isEquipNode(n)
    const lvlLabel = LEVEL_LABELS[n.nivel] || ('N'+n.nivel)
    return `<div class="sheet-row" onclick="onNodePickerSelect('${escHtmlAttr(n.id)}')">
      <div class="ico">${isEq?'⚙️':'📁'}</div>
      <div class="body">
        <div class="name">${escHtml(n.nombre || 'Sin nombre')} <span style="font-size:10px;opacity:.6">${lvlLabel}</span></div>
        ${path ? `<div class="sub" style="font-size:11px;opacity:.7">${escHtml(path)}</div>` : ''}
      </div>
    </div>`
  }).join('')

  if (!capped.length && (!_nodePickerOpts.allowRoot || q)){
    html += `<div class="sheet-empty">Sin resultados${q?` para "${escHtml(q)}"`:''}</div>`
  } else if (nodes.length > 100){
    html += `<div style="padding:10px 16px;font-size:11px;color:var(--hint);text-align:center">
      Mostrando 100 de ${nodes.length} — refiná la búsqueda</div>`
  }
  listEl.innerHTML = html
}

function onNodePickerSelect(nodeId){
  const cb = _nodePickerCb
  closeSheet()
  _nodePickerCb = null
  _nodePickerOpts = null
  if (cb) cb(nodeId)
}

// ADMIN: Mover/Eliminar repuesto
// ═══════════════════════════════════════════════════════════════════
function openMoveRepuestoSheet(machineId, repuestoId){
  if (userRole !== 'admin') return
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  if (!r) return
  const repName = r.textoBreve || r.alias || r.codigoSAP || 'repuesto'
  const exclude = new Set([machineId])
  const m = machineMap[machineId]
  if (m?.hierarchyNodeId) exclude.add(m.hierarchyNodeId)

  showNodePickerSheet(`Mover "${repName}" a:`, {
    excludeIds: exclude,
    onlyEquipos: true,
  }, async (toNodeId) => {
    if (!toNodeId) return
    await executeMoveRepuesto(machineId, repuestoId, toNodeId)
  })
}

async function executeMoveRepuesto(fromMachineId, repuestoId, toMachineId){
  const reps = repCache[fromMachineId] || []
  const r = reps.find(x => x.id === repuestoId)
  if (!r) return

  const fromPath = getRepuestoCollPath(fromMachineId)
  const toPath = getRepuestoCollPath(toMachineId)
  if (fromPath === toPath){
    showToast('Mismo equipo, sin cambios','err')
    return
  }

  const fromName = machineMap[fromMachineId]?.nombre || hierarchyNodesMap[fromMachineId]?.nombre || fromMachineId
  const toName = machineMap[toMachineId]?.nombre || hierarchyNodesMap[toMachineId]?.nombre || toMachineId
  const repName = r.textoBreve || r.codigoSAP || repuestoId

  const ok = await new Promise(res => tgApp?.showConfirm
    ? tgApp.showConfirm(`Mover "${repName}"\nde: ${fromName}\na: ${toName}\n?`, res)
    : res(confirm(`Mover ${repName} de ${fromName} a ${toName}?`)))
  if (!ok) return

  try {
    const fromRef = db.collection(fromPath).doc(repuestoId)
    const fromSnap = await fromRef.get()
    if (!fromSnap.exists){
      showToast('Documento no encontrado en origen','err')
      return
    }
    const data = fromSnap.data()
    const toCol = db.collection(toPath)
    const existsInDest = await toCol.doc(repuestoId).get()
    let newRef
    const moveMeta = {
      movedFrom: fromPath,
      movedAt: firebase.firestore.FieldValue.serverTimestamp(),
      movedBy: uid,
    }
    if (existsInDest.exists){
      newRef = await toCol.add({ ...data, ...moveMeta })
    } else {
      newRef = toCol.doc(repuestoId)
      await newRef.set({ ...data, ...moveMeta })
    }
    await fromRef.delete()

    repCache[fromMachineId] = (repCache[fromMachineId]||[]).filter(x => x.id !== repuestoId)
    if (repCache[toMachineId]) {
      repCache[toMachineId].push({ id: newRef.id, ...data })
    }
    if (__repuestosCache){
      __repuestosCache = __repuestosCache.filter(x => !(x.repuesto.id === repuestoId && x.machineId === fromMachineId))
      __repuestosCache.push({
        repuesto: { id: newRef.id, ...data },
        machineId: toMachineId,
        machineName: toName,
      })
    }

    await logAudit('move', fromPath, repuestoId,
      { from: fromPath, to: toPath, fromName, toName },
      { newId: newRef.id },
      `Mover repuesto "${repName}": ${fromName} → ${toName}`)

    showToast('Repuesto movido ✓','ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    goBack()
  } catch(err){
    showToast('Error al mover: '+(err.message||''),'err')
  }
}

async function deleteRepuestoFromMachine(machineId, repuestoId){
  if (userRole !== 'admin') return
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  if (!r) return
  const repName = r.textoBreve || r.alias || r.codigoSAP || 'repuesto'

  const ok = await new Promise(res => tgApp?.showConfirm
    ? tgApp.showConfirm(`⚠️ Eliminar "${repName}" definitivamente?\n\nEsta acción es irreversible.`, res)
    : res(confirm(`Eliminar ${repName}?`)))
  if (!ok) return

  try {
    const collPath = getRepuestoCollPath(machineId)
    await db.collection(collPath).doc(repuestoId).delete()
    repCache[machineId] = (repCache[machineId]||[]).filter(x => x.id !== repuestoId)
    if (__repuestosCache){
      __repuestosCache = __repuestosCache.filter(x => !(x.repuesto.id === repuestoId && x.machineId === machineId))
    }
    await logAudit('delete', collPath, repuestoId, { ...r }, null, `Eliminar repuesto "${repName}"`)
    showToast('Repuesto eliminado ✓','ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    goBack()
  } catch(err){
    showToast('Error al eliminar: '+(err.message||''),'err')
  }
}

// ── F2.5 — Audit log ────────────────────────────────────────────────

async function logAudit(action, collection, documentId, before, after, label){
  try {
    await db.collection('audit_log').add({
      action, collection, documentId,
      documentLabel: label||documentId,
      userId: uid, userName: firstName||'tg_user',
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      before: before||null, after: after||null,
      metadata: { source: 'miniapp' }
    })
  } catch(e){ console.warn('audit_log fail',e) }
}
