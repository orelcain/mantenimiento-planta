<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Repuestos · Antarfood</title>
<!-- Service Worker: cachea mant.html + Firebase SDK + Telegram WebApp + PDF.js
     para que el bot CARGUE cuando no hay red. Sin esto el WebView falla al hacer
     GET de mant.html y muestra "no internet" antes de ejecutar nada. -->
<script>
if ('serviceWorker' in navigator) {
  // Path al SW: el FCM SW (ya existente) extiende su lógica para cubrir el shell del bot.
  // Se registra desde la raíz del deploy (./firebase-messaging-sw.js) con scope './'.
  // Si la PWA principal ya lo había registrado, este register() es idempotente.
  navigator.serviceWorker.register('./firebase-messaging-sw.js', { scope: './' })
    .then(reg => console.log('[sw] registered', reg.scope))
    .catch(err => console.warn('[sw] register failed', err))
}
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:      var(--tg-theme-bg-color,#17212b);
  --bg2:     var(--tg-theme-secondary-bg-color,#232e3c);
  --text:    var(--tg-theme-text-color,#f5f5f5);
  --hint:    var(--tg-theme-hint-color,#7d8b99);
  --accent:  var(--tg-theme-button-color,#5288c1);
  --acctxt:  var(--tg-theme-button-text-color,#ffffff);
  --link:    var(--tg-theme-link-color,#6ab3f3);
  --danger:  #e53935;
  --green:   #4fae4e;
  --warn:    #f5a623;
  --divider: rgba(255,255,255,.07);
  --hover:   rgba(255,255,255,.04);
  --press:   rgba(255,255,255,.08);
  --vh:      100dvh;
  /* aliases usados en HTML generado por JS */
  --border:  var(--divider);
  --card:    var(--bg2);
  --sub:     var(--hint);
}

html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.4;overflow:hidden;overscroll-behavior:none}

#app{display:flex;flex-direction:column;height:var(--vh);width:100%;overflow:hidden}

/* ── Header ─────────────────────────────────────────────────────────── */
.app-header{height:54px;min-height:54px;display:flex;align-items:center;
  padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--divider);
  flex-shrink:0;gap:6px}
.app-header .back-btn{width:40px;height:40px;border-radius:50%;border:none;
  background:transparent;color:var(--text);font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.app-header .back-btn:active{background:var(--press)}
.app-header .title-block{flex:1;min-width:0;padding:0 6px}
.app-header .title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.app-header .subtitle{font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.app-header .status{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;
  padding:3px 9px;border-radius:99px;flex-shrink:0;margin-right:6px}
.app-header .status::before{content:'';width:6px;height:6px;border-radius:50%}
.s-ok{background:rgba(79,174,78,.15);color:var(--green)}
.s-ok::before{background:var(--green)}
.s-err{background:rgba(229,57,53,.15);color:var(--danger)}
.s-err::before{background:var(--danger)}
.s-loading{background:rgba(125,139,153,.12);color:var(--hint)}
.s-loading::before{background:var(--hint);animation:blink 1s ease-in-out infinite}
.s-offline{background:rgba(245,166,35,.18);color:var(--warn)}
.s-offline::before{background:var(--warn)}
.s-syncing{background:rgba(82,136,193,.18);color:var(--accent)}
.s-syncing::before{background:var(--accent);animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes pulse-border{0%,100%{border-color:rgba(239,68,68,.3)}50%{border-color:rgba(239,68,68,.7)}}

/* ── Content ────────────────────────────────────────────────────────── */
#content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{display:none;min-height:100%;padding-bottom:24px}
.view.active{display:block}
#view-home{padding-top:2px}

/* ── Bottom nav ─────────────────────────────────────────────────────── */
.bottom-nav{height:60px;min-height:60px;display:flex;background:var(--bg2);
  border-top:1px solid var(--divider);flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
  border:none;background:none;color:var(--hint);font-size:13px;font-weight:600;
  cursor:pointer;transition:color .15s;position:relative;padding:6px 4px;
  line-height:1.18;letter-spacing:.01em;
  white-space:normal;word-break:keep-all;hyphens:none}
.nav-btn .icon{font-size:22px;line-height:1}
.nav-btn.active{color:var(--accent);font-weight:700}

/* ── Loading ────────────────────────────────────────────────────────── */
#loading{position:fixed;inset:0;background:var(--bg);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.loader{width:32px;height:32px;border:3px solid rgba(255,255,255,.1);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-msg{color:var(--hint);font-size:14px;padding:0 24px;text-align:center;max-width:340px}
#loading-retry{display:none;margin-top:10px;padding:10px 22px;background:var(--accent);
  color:var(--acctxt);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}

/* ── Search bar ─────────────────────────────────────────────────────── */
.search-bar{padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--divider)}
.search-wrap{position:relative}
.search-input{width:100%;height:38px;padding:0 36px 0 36px;background:var(--bg2);
  border:1px solid transparent;border-radius:10px;color:var(--text);
  font-size:15px;outline:none;transition:border-color .15s}
.search-input::placeholder{color:var(--hint)}
.search-input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:15px;pointer-events:none;color:var(--hint)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:none;background:rgba(255,255,255,.08);color:var(--hint);font-size:14px;
  cursor:pointer;width:22px;height:22px;border-radius:50%;
  display:none;align-items:center;justify-content:center;padding:0;line-height:1}
.search-clear.show{display:flex}
mark{background:rgba(var(--accent-rgb,82,136,193),.25);color:inherit;border-radius:2px;padding:0 1px}

/* ── Section header ─────────────────────────────────────────────────── */
.section{padding:16px 16px 6px;display:flex;align-items:center;justify-content:space-between}
.section-title{font-size:13px;font-weight:600;color:var(--hint);
  text-transform:uppercase;letter-spacing:.5px}
.section-count{font-size:12px;color:var(--hint);font-weight:500}

/* ── Cell (Telegram-style list row) ─────────────────────────────────── */
.cell{display:flex;align-items:center;padding:11px 16px;gap:12px;
  cursor:pointer;transition:background .12s;background:var(--bg2);
  position:relative}
.cell:active{background:var(--press)}
.cell + .cell::before{content:'';position:absolute;top:0;left:60px;right:0;
  height:1px;background:var(--divider)}
.cell-icon{width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.cell-body{flex:1;min-width:0}
.cell-title{font-weight:500;font-size:15px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.cell-sub{font-size:12px;color:var(--hint);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-meta{font-size:11px;color:var(--link);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
.cell-trailing{color:var(--hint);font-size:14px;flex-shrink:0;display:flex;align-items:center;gap:6px}
.cell-chevron{color:var(--hint);font-size:18px;flex-shrink:0;line-height:1;margin-left:6px}
.cell-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;
  background:rgba(82,136,193,.18);color:var(--link);flex-shrink:0;white-space:nowrap;margin-right:2px}
.cell-badge.muted{background:rgba(255,255,255,.06);color:var(--hint)}
.cell-badge.warn{background:rgba(245,166,35,.15);color:var(--warn)}

.cell-group{background:var(--bg2);margin:0 0 8px;overflow:hidden}
.cell-group + .section{padding-top:10px}

/* Card compuesta: cell + chips de subitems debajo (Repuestos guardados) */
.compound-card{background:var(--bg2);margin:0 0 8px;overflow:hidden}
.compound-card + .compound-card{margin-top:0}
.cell-chips{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap}
.cell-chip{padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:500;
  background:rgba(255,255,255,.07);color:var(--text);cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;line-height:1.3;
  border:1px solid rgba(255,255,255,.05);transition:background .12s}
.cell-chip:active{background:rgba(255,255,255,.14)}
.cell-chip .n{opacity:.6;font-size:11px;font-weight:400}

/* ── Chips ──────────────────────────────────────────────────────────── */
.chips{display:flex;gap:7px;padding:10px 12px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;background:var(--bg);
  /* fade-out a la derecha como indicador de scroll horizontal */
  mask-image:linear-gradient(to right, black calc(100% - 18px), transparent 100%);
  -webkit-mask-image:linear-gradient(to right, black calc(100% - 18px), transparent 100%)}
.chips::-webkit-scrollbar{display:none}
.chips.sticky-top{position:sticky;top:0;z-index:5;
  border-bottom:1px solid var(--divider)}
.chip{padding:7px 14px;border-radius:99px;font-size:13px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;
  border:1px solid var(--divider);color:var(--text);background:var(--bg2)}
.chip:active{background:var(--press)}
.chip.active{background:var(--accent);color:var(--acctxt);border-color:var(--accent)}
.chip .count{opacity:.65;margin-left:5px;font-weight:400}
.chip.active .count{opacity:.85}

/* ── Info card ─────────────────────────────────────────────────────── */
.info-card{background:var(--bg2);margin:0 0 8px;overflow:hidden}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;
  padding:11px 16px;gap:14px;position:relative}
.info-row + .info-row::before{content:'';position:absolute;top:0;left:16px;right:16px;
  height:1px;background:var(--divider)}
.info-label{font-size:13px;color:var(--hint);flex-shrink:0;min-width:90px}
.info-value{font-size:14px;text-align:right;word-break:break-word;font-weight:500;flex:1}
.info-value.code{font-family:ui-monospace,Menlo,monospace;color:var(--link);font-size:13px}
.info-value.obs{text-align:left;color:var(--text);font-size:13.5px;line-height:1.5;font-weight:400}

/* ── Empty / error states ───────────────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 32px;gap:10px;text-align:center;min-height:240px}
.empty-icon{font-size:54px;opacity:.35;line-height:1}
.empty-title{font-weight:600;font-size:15px}
.empty-sub{font-size:13px;color:var(--hint);line-height:1.5;max-width:280px}

/* ── Greeting ──────────────────────────────────────────────────────── */
.hello{padding:18px 16px 8px}
.hello-text{font-size:20px;font-weight:600;line-height:1.2}
.hello-sub{font-size:13px;color:var(--hint);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px}
.tag.green{background:rgba(79,174,78,.15);color:var(--green)}
.tag.warn{background:rgba(245,166,35,.15);color:var(--warn)}

/* ── Photo gallery ─────────────────────────────────────────────────── */
.gallery{display:flex;gap:8px;padding:10px 14px 14px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--bg2)}
.gallery::-webkit-scrollbar{display:none}
.gallery-img{width:130px;height:96px;border-radius:9px;object-fit:cover;
  flex-shrink:0;background:var(--bg);cursor:pointer}
.gallery-img:active{opacity:.85}

/* ── Photo hero ────────────────────────────────────────────────────── */
.photo-hero{width:100%;aspect-ratio:16/10;background:var(--bg2);
  display:flex;align-items:center;justify-content:center;
  font-size:64px;color:var(--hint);overflow:hidden;cursor:pointer}
.photo-hero img{width:100%;height:100%;object-fit:cover}

/* ── Lightbox ──────────────────────────────────────────────────────── */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:300;
  display:none;align-items:center;justify-content:center;flex-direction:column;
  padding:env(safe-area-inset-top,12px) 0 env(safe-area-inset-bottom,12px)}
#lightbox.open{display:flex}
#lightbox img{max-width:96vw;max-height:72vh;border-radius:8px;object-fit:contain}
#lightbox .lbx-close{position:absolute;top:env(safe-area-inset-top,12px);right:14px;
  color:#fff;background:rgba(0,0,0,.4);border-radius:50%;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;border:none;
  font-size:22px;cursor:pointer}
#lightbox .lbx-cap{color:rgba(255,255,255,.75);font-size:12px;margin-top:10px;padding:0 18px;text-align:center}
#lbx-actions{display:none;gap:8px;margin-top:14px;padding:0 14px}
#lbx-actions.show{display:flex}
.lbx-btn{padding:10px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:6px}
.lbx-btn:active{background:rgba(255,255,255,.16)}
.lbx-btn:disabled{opacity:.5;cursor:not-allowed}
.lbx-btn.principal{background:rgba(245,166,35,.18);border-color:#f5a623;color:#f5a623}
.lbx-btn.principal.is-active{background:#f5a623;color:#000}
.lbx-btn.danger{background:rgba(229,57,53,.15);border-color:#e53935;color:#e53935}

/* ── Skeleton ──────────────────────────────────────────────────────── */
@keyframes shimmer{0%{background-position:-300px 0}100%{background-position:300px 0}}
.skel{background:linear-gradient(90deg,var(--bg2) 0%,rgba(255,255,255,.06) 50%,var(--bg2) 100%);
  background-size:600px 100%;animation:shimmer 1.4s infinite linear;border-radius:6px}
.skel-cell{display:flex;align-items:center;padding:11px 16px;gap:12px;background:var(--bg2)}
.skel-icon{width:38px;height:38px;border-radius:9px}
.skel-line{height:13px;flex:1}
.skel-line.short{max-width:120px;margin-top:6px}

/* ── Inline notice ─────────────────────────────────────────────────── */
.notice{padding:12px 16px;font-size:13px;color:var(--hint);background:var(--bg2);
  margin:0 0 8px;border-left:3px solid var(--warn)}
.notice b{color:var(--text)}

/* ── Header action buttons (edit / fav) ────────────────────────────── */
.edit-btn{width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(82,136,193,.14);color:var(--text);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;
  margin:0 3px;padding:0;font-family:inherit}
.edit-btn:active{background:rgba(82,136,193,.28);transform:scale(.92)}
.edit-btn:disabled{opacity:.5}
.edit-btn.fav-on{background:rgba(245,166,35,.2);color:#f5a623}

/* ── Form (edición de repuesto) ─────────────────────────────────────── */
.form-card{background:var(--bg2);margin:0 0 8px;padding:0 0 4px}
.form-row{display:flex;flex-direction:column;padding:10px 16px;gap:5px;position:relative}
.form-row + .form-row::before{content:'';position:absolute;top:0;left:16px;right:16px;
  height:1px;background:var(--divider)}
.form-label{font-size:11px;color:var(--hint);font-weight:600;
  text-transform:uppercase;letter-spacing:.4px}
.form-input,.form-textarea{width:100%;background:var(--bg);
  border:1px solid var(--divider);border-radius:8px;padding:9px 11px;
  color:var(--text);font-size:14.5px;outline:none;font-family:inherit;
  transition:border-color .15s}
.form-input:focus,.form-textarea:focus{border-color:var(--accent)}
.form-input.code{font-family:ui-monospace,Menlo,monospace;color:var(--link)}
.form-textarea{resize:none;min-height:78px;line-height:1.4}
.form-actions{display:flex;gap:8px;padding:14px 14px 18px;background:var(--bg)}
.btn-save{flex:2;padding:12px;border-radius:10px;border:none;background:var(--accent);
  color:var(--acctxt);font-size:15px;font-weight:600;cursor:pointer}
.btn-save:active{opacity:.85}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.btn-cancel{flex:1;padding:12px;border-radius:10px;border:1px solid var(--divider);
  background:transparent;color:var(--text);font-size:15px;font-weight:500;cursor:pointer}
.btn-cancel:active{background:var(--press)}

/* ── Upload buttons (admin only) ────────────────────────────────────── */
.upload-row{display:flex;gap:8px;padding:10px 14px 14px;background:var(--bg2)}
.upload-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 10px;border-radius:10px;border:1px dashed rgba(82,136,193,.45);
  background:rgba(82,136,193,.08);color:var(--accent);
  font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;line-height:1}
.upload-btn:active{background:rgba(82,136,193,.16);transform:scale(.98)}
.upload-btn:disabled{opacity:.5;cursor:not-allowed}
.upload-btn .ico{font-size:18px}

/* ── Upload progress overlay ────────────────────────────────────────── */
#uploading{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:250;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#uploading.open{display:flex}
#uploading .loader{width:40px;height:40px}
#uploading-msg{color:#fff;font-size:14px;text-align:center;padding:0 24px;max-width:300px}

/* ── Bottom sheet ───────────────────────────────────────────────────── */
#sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:160;
  display:none;opacity:0;transition:opacity .22s}
#sheet-overlay.open{display:block;opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);
  border-radius:16px 16px 0 0;z-index:170;
  padding-bottom:env(safe-area-inset-bottom);transform:translateY(100%);
  transition:transform .25s ease;max-height:78vh;overflow-y:auto;
  display:flex;flex-direction:column}
#sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);
  margin:10px auto 4px;flex-shrink:0}
.sheet-title{font-size:16px;font-weight:700;padding:6px 16px 12px;
  border-bottom:1px solid var(--divider);flex-shrink:0}
.sheet-list{padding:4px 0}
.sheet-row{display:flex;align-items:center;padding:13px 16px;gap:12px;
  cursor:pointer;transition:background .12s;position:relative}
.sheet-row:active{background:var(--press)}
.sheet-row + .sheet-row::before{content:'';position:absolute;top:0;left:50px;right:16px;
  height:1px;background:var(--divider)}
.sheet-row .ico{font-size:20px;width:32px;flex-shrink:0;text-align:center;line-height:1}
.sheet-row .body{flex:1;min-width:0}
.sheet-row .name{font-size:14.5px;font-weight:500;line-height:1.3}
.sheet-row .sub{font-size:11px;color:var(--hint);margin-top:2px}
.sheet-row .check{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:transparent;transition:all .15s}
.sheet-row.on .check{background:var(--accent);border-color:var(--accent);color:var(--acctxt)}
.sheet-row.disabled{opacity:.5;pointer-events:none}
.sheet-new{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;
  color:var(--accent);font-size:14.5px;font-weight:500;
  border-top:1px solid var(--divider)}
.sheet-new:active{opacity:.7}
.sheet-empty{padding:22px 16px;text-align:center;color:var(--hint);font-size:13px}
.sheet-foot{padding:0 16px env(safe-area-inset-bottom,12px)}

/* ── Modal (input) ───────────────────────────────────────────────────── */
#input-modal{position:fixed;inset:0;z-index:230;display:none;
  align-items:center;justify-content:center;padding:24px}
#input-modal.open{display:flex}

<script>
// ═══════════════════════════════════════════════════════════════════

}

firebase.initializeApp({
  apiKey: "AIzaSyBsJSh6x3ZGEyuXsM18dSWsJKyU7--KJss",

  storageBucket: "mantenimiento-planta-771a3.firebasestorage.app",
})
const db      = firebase.firestore()
const auth    = firebase.auth()
const storage = firebase.storage()
const tgApp   = window.Telegram?.WebApp

// ─── Firestore persistence (offline support) ─────────────────────────
// Activa cache local IndexedDB: reads sin red salen del cache, writes se encolan.
// Cuando vuelve la red, Firestore SDK sincroniza solo (no necesitamos lógica custom).
// synchronizeTabs:true permite múltiples pestañas (PWA + bot abiertos a la vez).
//
// Errores manejados:
//  - failed-precondition: otra pestaña sin synchronizeTabs ya activó persistence (raro con flag true)
//  - unimplemented: navegador sin IndexedDB (Telegram WebView lo soporta universalmente)
let __firestorePersistenceReady = false
db.enablePersistence({ synchronizeTabs: true })
  .then(() => { __firestorePersistenceReady = true; console.log('✅ Firestore persistence activa') })
  .catch(err => {
    if (err.code === 'failed-precondition') console.warn('Firestore persistence: otra pestaña ya tiene exclusiva')
    else if (err.code === 'unimplemented') console.warn('Firestore persistence: navegador no soportado')
    else console.warn('Firestore persistence falló:', err)
  })

// ═══════════════════════════════════════════════════════════════════
// VIEWPORT — fix scroll en Telegram WebView
// ═══════════════════════════════════════════════════════════════════
function setVH(){
  const h = tgApp?.viewportStableHeight || tgApp?.viewportHeight || window.innerHeight

}
setVH()
tgApp?.onEvent?.('viewportChanged', setVH)
window.addEventListener('resize', setVH)

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
let uid = null, userRole = 'usuario', isAuthorized = false, isLinked = false, firstName = ''
let currentTab = 'home'
let navStack = []   // [{viewId, title, subtitle, scrollTop}]

let machines = [], machineMap = {}
let categories = [], allCategoriesMap = {}, categoryDescendants = {}
let repCache = {}              // machineId → repuesto[]
let prefs = { favoriteLists: [], repuestoFavLists: {}, insumoFavLists: [] }
let machineLinkedNodes = {}    // machineId → [hierarchyNodeId]
let nodeNameCache = {}         // nodeId → resolved name

let activeCatFilter = 'all'
let activeMachineRepFilter = null
let repSearchTimer = null
let recentIds = []
let recentsPage = 0
let searchTimer = null
let prevTabBeforeSearch = 'home'

// F3 — Global search state
let __repuestosCache = null   // flat [{repuesto, machineId, machineName}]
let __repuestosCacheTs = 0
let searchTabActive = 'repuestos'
let searchFavFilter = 'all'  // 'all' | '*' (cualquier favorito) | nombre de lista
let searchSapOnly = false
let __globalLoadInProgress = false

const SYNONYM_GROUPS = [
  ['motor','motriz','motores'],
  ['bomba','pump','bombas'],
  ['reductor','motorreductor','gearbox'],
  ['cinta','transportadora','conveyor','banda'],
  ['valvula','valvulas'],
  ['sensor','instrumento','transmisor'],
  ['rodamiento','bearing','ruleman'],
  ['sello','reten','retenedor'],
]
const SYNONYM_LOOKUP = SYNONYM_GROUPS.reduce((acc, grp) => {
  const norm = grp.map(s => normalizeSearch(s))
  for (const t of norm) acc[t] = norm.filter(x => x !== t)
  return acc
}, {})

// F2 — Hierarchy state
let hierarchyNodesMap   = {}   // nodeId → node
let hierarchyChildrenMap = {}  // parentId → node[]
let hierarchyRoots      = []   // top-level nodes
let hierarchyStack      = []   // [{id, nombre}] nav stack
let __hierarchyCache    = null // {nodes, ts}
let hierSheetNodeId     = null // nodeId being added to list
let hierSheetIsEquip    = false
let tgBackBtnHandler    = null // current Telegram BackButton handler

const HIERARCHY_CACHE_TTL = 5 * 60 * 1000
const LEVEL_LABELS = {1:'Empresa',2:'Planta',3:'Área',4:'Sub-área',5:'Sistema',6:'Sub-sistema',7:'Equipo',8:'Elemento'}
const LEVEL_COLORS = {1:'#5288c1',2:'#5288c1',3:'#4fae4e',4:'#4fae4e',5:'#e88a00',6:'#e88a00',7:'#9c6bb8',8:'#9c6bb8'}

// ─── localStorage cache (persiste entre sesiones, ahorra reads Firebase) ───
const LS_KEY_REPUESTOS = 'mant_repuestos_v2'
const LS_KEY_MANUALES  = 'mant_manuales_v2'
const LS_KEY_HIERARCHY = 'mant_hierarchy_v2'
const LS_TTL_HIER  =  6 * 60 * 60 * 1000   //  6h — jerarquía cambia raro
const LS_TTL_REP   = 24 * 60 * 60 * 1000   // 24h — listeners onSnapshot mantienen freshness con red,
                                            //       y cuando offline usamos cache aunque expire (offline-first)
const LS_TTL_MAN   = 24 * 60 * 60 * 1000   // 24h — manuales casi no cambian
const LS_TTL_CAT   = 7 * 24 * 60 * 60 * 1000   // 7d — categorías cambian rarísimo
const LS_TTL_MACH  = 24 * 60 * 60 * 1000   // 24h — listener mantiene freshness con red
const LS_TTL_PREFS = 24 * 60 * 60 * 1000   // 24h — listener mantiene freshness con red
// Claves de cache para datos críticos del bootstrap offline
const LS_KEY_CATEGORIES = 'mant_categories_v1'
const LS_KEY_MACHINES   = 'mant_machines_v1'
const LS_KEY_PREFS      = 'mant_prefs_v1'
// Prefijo de claves para cache por equipo: mant_repcache_<machineId>
const LS_PREFIX_REPCACHE = 'mant_repcache_'

function lsGet(key, maxAgeMs){
  try {
    const raw = localStorage.getItem(key)
    if (!raw) return null
    const obj = JSON.parse(raw)
    if (!obj?.ts) return null
    // Offline-first: si no hay red, usar cache aunque haya expirado (mejor datos viejos que pantalla en blanco)
    if (maxAgeMs && navigator.onLine && Date.now() - obj.ts > maxAgeMs) return null
    return obj.data ?? null
  } catch { return null }
}
function lsSet(key, data){
  try {
    localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }))
  } catch(e){
    // Cuota llena → liberar y reintentar
    try {
      localStorage.removeItem(LS_KEY_REPUESTOS)
      localStorage.removeItem(LS_KEY_MANUALES)
      localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }))
    } catch { console.warn('localStorage quota exceeded for', key) }
  }
}
function lsClearAll(){
  for (const k of [LS_KEY_REPUESTOS, LS_KEY_MANUALES, LS_KEY_HIERARCHY]) {
    try { localStorage.removeItem(k) } catch {}
  }
}
// Convierte Firestore Timestamps a millis para serialización JSON
function normalizeForCache(obj){
  if (obj == null || typeof obj !== 'object') return obj
  if (typeof obj.toDate === 'function') return obj.toDate().getTime()
  if (Array.isArray(obj)) return obj.map(normalizeForCache)
  const out = {}
  for (const [k, v] of Object.entries(obj)) out[k] = normalizeForCache(v)
  return out
}

// ─── IndexedDB cache de PDFs/imágenes de manuales (offline support) ───
// Almacena Blobs grandes (decenas de MB) que no caben en localStorage.
// Útil para abrir manuales sin internet en planta y cargar instantáneamente.
const IDB_DB_NAME      = 'mant_manuales_cache'
const IDB_DB_VER       = 1
const IDB_STORE        = 'pdfs'
const IDB_TTL_MS       = 30 * 24 * 60 * 60 * 1000   // 30 días
const IDB_MAX_BYTES    = 200 * 1024 * 1024          // 200 MB tope total
let __idbPromise       = null
let __manualCachedKeys = new Set()                  // claves cacheadas (sync, para indicador en UI)
let __currentBlobUrl   = null                       // blob URL del visor abierto (para revoke)

function idbOpen(){
  if (__idbPromise) return __idbPromise
  __idbPromise = new Promise(resolve => {
    if (!('indexedDB' in window)){ resolve(null); return }
    let req
    try { req = indexedDB.open(IDB_DB_NAME, IDB_DB_VER) }
    catch(e){ console.warn('IDB open threw', e); resolve(null); return }
    req.onupgradeneeded = () => {
      const db = req.result
      if (!db.objectStoreNames.contains(IDB_STORE)){
        const store = db.createObjectStore(IDB_STORE)
        store.createIndex('ts', 'ts')
      }
    }
    req.onsuccess = () => resolve(req.result)
    req.onerror   = () => { console.warn('IDB open failed', req.error); resolve(null) }
    req.onblocked = () => { console.warn('IDB open blocked'); resolve(null) }
  })
  return __idbPromise
}

function idbStore(mode){
  return idbOpen().then(db => {
    if (!db) return null
    try { return db.transaction(IDB_STORE, mode).objectStore(IDB_STORE) }
    catch(e){ console.warn('IDB tx failed', e); return null }
  })
}

async function idbGet(key){
  const store = await idbStore('readonly')
  if (!store) return null
  return new Promise(resolve => {
    const r = store.get(key)
    r.onsuccess = () => resolve(r.result || null)
    r.onerror   = () => resolve(null)
  })
}

async function idbSet(key, record){
  const store = await idbStore('readwrite')
  if (!store) return { ok: false, quotaExceeded: false }
  return new Promise(resolve => {
    let r
    try { r = store.put(record, key) }
    catch(e){ resolve({ ok: false, quotaExceeded: e?.name === 'QuotaExceededError' }); return }
    r.onsuccess = () => resolve({ ok: true })
    r.onerror   = () => {
      const err = r.error
      const quota = err?.name === 'QuotaExceededError' || err?.code === 22
      resolve({ ok: false, quotaExceeded: quota })
    }
  })
}

async function idbDelete(key){
  const store = await idbStore('readwrite')
  if (!store) return false
  return new Promise(resolve => {
    const r = store.delete(key)
    r.onsuccess = () => resolve(true)
    r.onerror   = () => resolve(false)
  })
}

async function idbList(){
  // → [{ key, ts, sizeBytes, url, titulo, storagePath }, …]  (sin Blobs, ligero)
  const store = await idbStore('readonly')
  if (!store) return []
  return new Promise(resolve => {
    const out = []
    const r = store.openCursor()
    r.onsuccess = () => {
      const cur = r.result
      if (cur){
        const v = cur.value || {}
        out.push({
          key: cur.key,
          ts: v.ts || 0,
          sizeBytes: v.sizeBytes || 0,
          url: v.url || '',
          titulo: v.titulo || '',
          storagePath: v.storagePath || null,
        })
        cur.continue()
      } else resolve(out)
    }
    r.onerror = () => resolve(out)
  })
}

async function idbClearAll(){
  const store = await idbStore('readwrite')
  if (!store) return false
  return new Promise(resolve => {
    const r = store.clear()
    r.onsuccess = () => resolve(true)
    r.onerror   = () => resolve(false)
  })
}

// Clave estable de cache para un manual.
// Prioridad: storagePath (legacy + nuevos) → firestore docId → URL canónica (sin token).
function manualCacheKey(m){
  if (!m) return null
  if (m.storagePath) return `sp:${m.storagePath}`
  if (m.id) return `fs:${m.id}`
  if (m.url) return `url:${m.url.split('?')[0]}`
  return null
}

async function refreshCachedKeys(){
  try {
    const list = await idbList()
    __manualCachedKeys = new Set(list.map(x => x.key))
  } catch(e){ console.warn('refreshCachedKeys failed', e) }
}

async function purgeOldManuales(){
  try {
    const list = await idbList()
    if (!list.length) return { purged: 0, totalBefore: 0 }
    const now = Date.now()
    let purged = 0
    // 1) TTL: borrar entradas > 30 días
    for (const item of list){
      if (now - (item.ts || 0) > IDB_TTL_MS){
        await idbDelete(item.key)
        __manualCachedKeys.delete(item.key)
        purged++
      }
    }
    // 2) LRU: si excede tope total, borrar más antiguos hasta caber
    const survivors = list.filter(x => __manualCachedKeys.has(x.key))
    let total = survivors.reduce((s, x) => s + (x.sizeBytes || 0), 0)
    if (total > IDB_MAX_BYTES){
      const sorted = [...survivors].sort((a, b) => (a.ts || 0) - (b.ts || 0))
      for (const item of sorted){
        if (total <= IDB_MAX_BYTES) break
        await idbDelete(item.key)
        __manualCachedKeys.delete(item.key)
        total -= (item.sizeBytes || 0)
        purged++
      }
    }
    if (purged > 0) console.log(`[manualCache] purga: ${purged} entradas eliminadas`)
    return { purged }
  } catch(e){
    console.warn('purgeOldManuales failed', e)
    return { purged: 0 }
  }
}

// Descarga un PDF a IndexedDB en background (no bloqueante).
// Devuelve true si se cacheó, false si falló (logs warn en consola).
async function backgroundCacheManual(m){
  const key = manualCacheKey(m)
  if (!key) return false
  if (__manualCachedKeys.has(key)) return true
  if (!navigator.onLine) return false
  let resp
  try { resp = await fetch(m.url) }
  catch(e){ console.warn('[manualCache] bg fetch failed', e); return false }
  if (!resp.ok){ console.warn('[manualCache] bg HTTP', resp.status); return false }
  const blob = await resp.blob()
  const record = {
    blob, ts: Date.now(), sizeBytes: blob.size,
    url: m.url, titulo: m.titulo || '', storagePath: m.storagePath || null,
  }
  let res = await idbSet(key, record)
  if (!res.ok && res.quotaExceeded){
    await purgeOldManuales()
    res = await idbSet(key, record)
  }
  if (res.ok){
    __manualCachedKeys.add(key)
    console.log(`[manualCache] cached bg: ${m.titulo} (${(blob.size/1048576).toFixed(1)} MB)`)
    return true
  }
  return false
}

// Resuelve la URL a usar para abrir un manual.
//   - Con red → URL directa del Storage (Range requests funcionan, PDFs grandes cargan completos);
//     dispara la descarga al IDB en background para futuro offline.
//   - Sin red → blob URL desde IDB si existe; si no, lanza error.
//
// Notar: el blob URL en iframe puede mostrar solo primera página de PDFs grandes en algunos
// visores (Telegram WebView, iOS Safari) por limitación de Range requests sobre blob URLs.
// Por eso priorizamos la URL directa cuando hay red — sólo recurrimos al blob si NO hay red.
async function resolveManualUrl(m){
  const key = manualCacheKey(m)
  if (!key) throw new Error('Manual sin identificador válido')

  // ── Caso offline: única opción es blob URL del IDB ──
  if (!navigator.onLine){
    const cached = await idbGet(key)
    if (cached?.blob){
      idbSet(key, { ...cached, ts: Date.now() }).catch(() => {})
      return { url: URL.createObjectURL(cached.blob), fromCache: true, mode: 'blob' }
    }
    throw new Error('Sin conexión y este manual aún no está descargado.')
  }

  // ── Caso online: usar URL directa del Storage (mejor renderizado) ──
  // En paralelo: descargar al IDB en background si no está, para futuro offline.
  if (!__manualCachedKeys.has(key)){
    backgroundCacheManual(m).then(ok => {
      // Cuando termine la descarga, refrescar lista para mostrar el badge 📥
      if (ok && currentTab === 'manuales' && __manualesCache){
        renderManualesBody(__manualesCache)
      }
    }).catch(() => {})
  } else {
    // Ya cacheado — actualizar ts (LRU touch) en background
    idbGet(key).then(rec => {
      if (rec) idbSet(key, { ...rec, ts: Date.now() }).catch(() => {})
    }).catch(() => {})
  }
  const fromCache = __manualCachedKeys.has(key)
  return { url: m.url, fromCache, mode: 'direct' }
}

// ─── PDF.js (visor robusto cross-platform: Telegram WebView, iOS, Android) ───
// El visor nativo `<iframe src="pdf">` solo carga la primera página en muchos
// WebViews (Range requests inconsistentes con blob URLs y algunos PDFs).
// PDF.js renderiza cada página en <canvas> y funciona en todas partes.
// Carga lazy desde CDN — solo cuando el usuario abre un PDF.
const PDFJS_VERSION = '3.11.174'
const PDFJS_BASE = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}`
let __pdfJsPromise = null

function loadPdfJs(){
  if (__pdfJsPromise) return __pdfJsPromise
  __pdfJsPromise = new Promise((resolve, reject) => {
    if (window.pdfjsLib){ resolve(window.pdfjsLib); return }
    const s = document.createElement('script')
    s.src = `${PDFJS_BASE}/pdf.min.js`
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/pdf.worker.min.js`
      resolve(window.pdfjsLib)
    }
    s.onerror = () => { __pdfJsPromise = null; reject(new Error('No se pudo cargar PDF.js')) }
    document.head.appendChild(s)
  })
  return __pdfJsPromise
}

// Renderiza todas las páginas del PDF dentro de `container` (vertical scroll).
// `url` puede ser URL directa (HTTP) o blob URL.
// `progressEl` (opcional) recibe textContent con "Página N/M".
async function renderPdfIntoContainer(url, container, progressEl){
  const pdfjsLib = await loadPdfJs()
  if (progressEl) progressEl.textContent = 'Abriendo PDF…'
  // pdfjs hace fetch internamente; soporta tanto URL directa como blob:
  const loadingTask = pdfjsLib.getDocument({
    url,
    // Mejorar soporte CORS para Firebase Storage URLs
    withCredentials: false,
    isEvalSupported: false,
  })
  const pdf = await loadingTask.promise
  container.innerHTML = ''
  const N = pdf.numPages
  // Escala basada en ancho del container para que el PDF se ajuste.
  const containerWidth = Math.max(280, container.clientWidth - 16)
  for (let n = 1; n <= N; n++){
    if (progressEl) progressEl.textContent = `Página ${n} / ${N}`
    const page = await pdf.getPage(n)
    const baseViewport = page.getViewport({ scale: 1 })
    const scale = containerWidth / baseViewport.width
    const viewport = page.getViewport({ scale })
    const canvas = document.createElement('canvas')
    canvas.style.cssText = 'display:block;margin:0 auto 6px;max-width:100%;height:auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);border-radius:2px'
    canvas.width = Math.floor(viewport.width)
    canvas.height = Math.floor(viewport.height)
    container.appendChild(canvas)
    const ctx = canvas.getContext('2d', { alpha: false })
    await page.render({ canvasContext: ctx, viewport }).promise
  }
  if (progressEl) progressEl.textContent = `${N} página${N === 1 ? '' : 's'}`
  return N
}

  await new Promise(resolve => {
    const unsub = auth.onAuthStateChanged(() => { unsub(); resolve() })
  })

    isAuthorized = !!cachedSession.isAuthorized
    isLinked = !!cachedSession.isLinked
    firstName = cachedSession.firstName || ''
    setLoadingMsg('Modo offline (sesión cacheada)…')
    // Cargar todo con tolerancia a errores: Firestore con persistence devolverá cache hits.

    await Promise.all([
      loadCategories().catch(e => console.warn('[offline] loadCategories falló', e?.message)),
      loadMachines().catch(e => console.warn('[offline] loadMachines falló', e?.message)),
      loadPrefs().catch(e => console.warn('[offline] loadPrefs falló', e?.message)),
    ])

  try {

      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData }),
    })
    if (!resp.ok) {

      setLoadingError(err.error || `Error ${resp.status}`)
      return
    }
    const data = await resp.json()
    setLoadingMsg('Iniciando sesión…')
    await auth.signInWithCustomToken(data.token)
    uid = data.uid
    userRole = data.role || 'usuario'
    isAuthorized = data.authorized
    isLinked = data.isLinked || false
    firstName = data.firstName || tgApp?.initDataUnsafe?.user?.first_name || ''

    if (!isAuthorized) {
      setLoadingError('Tu grupo de Telegram no está autorizado. Contactá al administrador.')
      return
    }
    // Persistir sesión para que el próximo cold-start sin red funcione
    try { lsSet('mant_user_session', { uid, userRole, isAuthorized, isLinked, firstName }) } catch {}

    setLoadingMsg('Cargando datos…')
    await Promise.all([loadCategories(), loadMachines(), loadPrefs()])
    showApp()
  } catch (err) {
    console.error('init error', err)
    // Fallback offline: si la mint falló por red pero tenemos sesión cacheada + auth válida,
    // procedemos en modo offline en vez de bloquear al usuario en pantalla de error.
    if (!navigator.onLine && cachedSession && auth.currentUser){
      console.log('[offline] mint falló, fallback a sesión cacheada')
      uid = cachedSession.uid
      userRole = cachedSession.userRole || 'usuario'
      isAuthorized = !!cachedSession.isAuthorized
      isLinked = !!cachedSession.isLinked
      firstName = cachedSession.firstName || ''
      setLoadingMsg('Modo offline (sin red)…')
      await Promise.all([
        loadCategories().catch(() => {}),
        loadMachines().catch(() => {}),
        loadPrefs().catch(() => {}),
      ])
      showApp()
      return
    }
    setLoadingError('Error de conexión: ' + (err.message || 'desconocido'))
  }
}

  //
  // Disparamos en paralelo sin esperar — cada uno llena su pedazo del cache:

  //  · loadHierarchyTree: árbol completo (jerarquía navegable offline)

  // La persistence de Firestore garantiza que estos reads quedan en IndexedDB
  // local, así futuros snapshots/getDocs leerán de ahí cuando no haya red.
  preloadAllForOffline()

}

// Hidrata repCache (memoria) desde localStorage para todos los equipos cacheados.
// Garantiza que abrir el detalle de un equipo NUNCA toque la red si tenemos datos viejos.
function hydrateRepCacheFromLocalStorage(){
  let count = 0, items = 0
  try {
    for (let i = 0; i < localStorage.length; i++){
      const key = localStorage.key(i)
      if (!key?.startsWith(LS_PREFIX_REPCACHE)) continue
      const machineId = key.slice(LS_PREFIX_REPCACHE.length)
      const data = lsGet(key, LS_TTL_REP)
      if (data?.length > 0){
        repCache[machineId] = data
        count++
        items += data.length
      }
    }
  } catch(e){ console.warn('hydrateRepCache failed', e) }
  if (count > 0) console.log(`[offline] hidratados ${count} equipos · ${items} repuestos desde localStorage`)
}

// Precarga datos clave en paralelo. Usa la cache IndexedDB de Firestore como
// almacén — los reads quedan persistidos automáticamente. No bloquea showApp.
function preloadAllForOffline(){
  // 1) Hidratar memoria desde localStorage (instantáneo, sin red)
  hydrateRepCacheFromLocalStorage()
  // 2) Disparar refresh desde Firestore en paralelo (con red llena cache; sin red usa IDB persistence)
  loadAllRepuestos()
    .then(() => { if (currentTab === 'home') renderHomeStockAlert() })
    .catch(e => console.warn('preload repuestos failed', e?.message || e))
  loadInsumos()
    .then(() => { if (currentTab === 'home') renderHomeStockAlert() })
    .catch(e => console.warn('preload insumos failed', e?.message || e))
  loadHierarchyTree()
    .catch(e => console.warn('preload hierarchy failed', e?.message || e))
}

// ── Stock real-time listeners ─────────────────────────────────────
// Escucha cambios de stock en las máquinas de las listas favoritas del usuario.
// Alcance limitado (≤15 máquinas) → sin índices compuestos, bajo costo de lectura.
const stockListeners = new Map()  // machineId → unsub fn

function startFavMachinesStockListeners(){
  // Reunir IDs únicos de las listas favoritas (raíz + sub-listas)
  const ids = new Set()
  for (const list of prefs.favoriteLists || []) {
    for (const id of list.machineIds || []) ids.add(id)
  }
  const targets = [...ids].slice(0, 15)

  // Detener listeners de máquinas que ya no están en favoritos
  for (const [id, unsub] of stockListeners) {
    if (!ids.has(id)) { try { unsub() } catch {} ; stockListeners.delete(id) }
  }

  for (const machineId of targets) {
    if (stockListeners.has(machineId)) continue
    const collPath = getRepuestoCollPath(machineId)
    const unsub = db.collection(collPath)
      .where('stockMinimo', '>=', 0)
      .onSnapshot({ includeMetadataChanges: false }, snap => {
        let changed = false
        snap.docChanges().forEach(change => {
          // Ignorar carga inicial si el repuesto ya está en cache (evita re-render masivo)
          if (change.type === 'added' && repCache[machineId]?.some(r => r.id === change.doc.id)) return
          const doc = change.doc
          const data = doc.data()
          const repId = doc.id
          const stockFields = {
            stockFisico: data.stockFisico,
            stockMinimo: data.stockMinimo,
            stockContadoEn: data.stockContadoEn,
            stockContadoPor: data.stockContadoPor,
            stockHistorial: data.stockHistorial,
          }
          // Actualizar repCache
          const arr = repCache[machineId]
          if (arr) {
            const idx = arr.findIndex(r => r.id === repId)
            if (idx >= 0) { Object.assign(arr[idx], stockFields); changed = true }
          }
          // Actualizar cache global
          const gItem = __repuestosCache?.find(x => x.repuesto.id === repId && x.machineId === machineId)
          if (gItem) { Object.assign(gItem.repuesto, stockFields); changed = true }
        })
        if (!changed) return
        renderHomeStockAlert()
        if (document.getElementById('view-stock-report')?.classList.contains('active')) renderStockReport()
        // Si el detalle del repuesto afectado está abierto, re-renderizarlo
        if (activeUploadCtx?.machineId === machineId &&
            document.getElementById('view-repuesto')?.classList.contains('active')) {
          openRepuesto(machineId, activeUploadCtx.repuestoId, { fromSave: true })
        }
      }, err => {
        console.warn(`stock listener error [${machineId}]`, err?.message || err)
        stockListeners.delete(machineId)
      })
    stockListeners.set(machineId, unsub)
  }
}

function setStatus(type, label){

  })[type] || 's-loading'

// ─── Estado de red + pendientes (para indicador del header) ──────────
let __isOnline = navigator.onLine
let __pendingWrites = 0          // counter manual: writes en vuelo

function updateNetworkStatus(){
  if (!__isOnline){
    const lbl = __pendingWrites > 0
      ? `Sin red · ${__pendingWrites} pend.`
      : 'Sin conexión'
    setStatus('offline', lbl)
    return
  }
  if (__pendingWrites > 0){
    setStatus('syncing', `Sincronizando… ${__pendingWrites}`)
    return
  }
  // Online y sin pendientes: respetar el label de auth que ya estaba puesto
  // (showApp() pone 'conectado' o 'sólo lectura' al cargar)
  setStatus('ok', isAuthorized ? 'conectado' : 'sólo lectura')
}

window.addEventListener('online',  () => { __isOnline = true;  updateNetworkStatus() })
window.addEventListener('offline', () => { __isOnline = false; updateNetworkStatus() })

// Envuelve una promesa de write para que el contador refleje "en vuelo".
// En modo offline, Firestore SDK encola la write y la promise NO resuelve
// hasta que vuelva la red — perfecto para contar pendientes reales.
function trackWrite(promise){
  __pendingWrites++
  updateNetworkStatus()
  return promise.finally(() => {
    __pendingWrites = Math.max(0, __pendingWrites - 1)
    updateNetworkStatus()
  })
}

// Helper: aplica resultados de categories a globals
function _applyCategoriesData(all){
  allCategoriesMap = Object.fromEntries(all.map(c => [c.id, c]))
  categories = all.filter(c => !c.parentId).sort((a,b) => (a.orden||0) - (b.orden||0))
  categoryDescendants = {}
  for (const top of categories) {
    const set = new Set([top.id])
    const stack = [top.id]
    while (stack.length){
      const p = stack.pop()
      for (const c of all) if (c.parentId === p && !set.has(c.id)){ set.add(c.id); stack.push(c.id) }
    }
    categoryDescendants[top.id] = set
  }
}

async function loadCategories(){
  // 1) Hidratar desde localStorage si existe (instantáneo, offline-friendly)
  const lsHit = lsGet(LS_KEY_CATEGORIES, LS_TTL_CAT)
  if (lsHit?.length > 0){
    _applyCategoriesData(lsHit)
    if (navigator.onLine){
      // Refresh en background sin bloquear
      db.collection('machineCategories').get().then(snap => {
        const all = snap.docs.map(d => ({id:d.id, ...d.data()}))
          .filter(c => c.activa !== false && c.visible !== false)
        if (all.length > 0){
          _applyCategoriesData(all)
          try { lsSet(LS_KEY_CATEGORIES, normalizeForCache(all)) } catch {}
        }
      }).catch(e => console.warn('refresh categories bg', e?.message))
    }
    return
  }
  // 2) Sin LS: fetch directo (Firestore con persistence usará IDB si offline)
  const snap = await db.collection('machineCategories').get()
  const all = snap.docs.map(d => ({id:d.id, ...d.data()}))
    .filter(c => c.activa !== false && c.visible !== false)
  _applyCategoriesData(all)
  if (all.length > 0){
    try { lsSet(LS_KEY_CATEGORIES, normalizeForCache(all)) } catch {}
  }
}

  machineMap = Object.fromEntries(machines.map(m => [m.id, m]))
  if (machines.length > 0){
    try { lsSet(LS_KEY_MACHINES, normalizeForCache(machines)) } catch {}
  }
}

async function loadRepuestos(machineId){
  // Solo cachear arrays NO vacíos: un cache vacío puede venir de una resolución
  // de path incorrecta (ej: hierarchy aún no cargado) y bloquear ediciones futuras.
  if (repCache[machineId]?.length > 0) return repCache[machineId]
  // 1) Hidratar desde localStorage si existe (offline-friendly: TTL 24h, ignora TTL si offline)
  const lsKey = LS_PREFIX_REPCACHE + machineId
  const lsHit = lsGet(lsKey, LS_TTL_REP)
  if (lsHit?.length > 0){
    repCache[machineId] = lsHit
    // Si hay red, refrescar en background sin bloquear (best-effort)
    if (navigator.onLine){
      _refreshRepuestosFromServer(machineId).catch(() => {})
    }
    return repCache[machineId]
  }
  // 2) Sin cache: fetch a Firestore. Si offline, Firestore SDK leerá de su IDB persistence.
  const m = machineMap[machineId]
  const collPath = getRepuestoCollPath(machineId)
  let docs = []
  try {
    const snap = await db.collection(collPath).orderBy('codigoSAP').get()
    docs = snap.docs
  } catch(e){
    // Algunos repuestos en hierarchy/ pueden no tener codigoSAP — fallback sin orderBy
    const snap = await db.collection(collPath).get()
    docs = snap.docs
  }
  let results = docs.map(d => ({id:d.id, ...d.data()}))
  // Si la máquina tiene hierarchyNodeId, también cargar repuestos propios del nodo jerarquía.
  // Esto cubre el caso "máquina en machines/ vinculada a hierarchy/ donde los repuestos se
  // registraron via vista de jerarquía" — los repuestos viven en hierarchy/{nodeId}/repuestos
  // pero la lista fav apunta al machineId de machines/.
  const hierNodeId = m?.hierarchyNodeId
  if (hierNodeId && collPath !== `hierarchy/${hierNodeId}/repuestos`){
    try {
      const hierSnap = await db.collection(`hierarchy/${hierNodeId}/repuestos`).get()
      const existingIds  = new Set(results.map(r => r.id))
      const existingSAPs = new Set(results.map(r => r.codigoSAP).filter(Boolean))
      for (const d of hierSnap.docs){
        const hr = {id: d.id, ...d.data()}
        if (!existingIds.has(hr.id) && !(hr.codigoSAP && existingSAPs.has(hr.codigoSAP))){
          results.push(hr)
          existingIds.add(hr.id)
          if (hr.codigoSAP) existingSAPs.add(hr.codigoSAP)
        }
      }
    } catch(e){ /* nodo sin repuestos propios, ignorar */ }
  }
  repCache[machineId] = results
  // Persistir en localStorage para sobrevivir reinicios sin red
  if (results.length > 0){
    try { lsSet(lsKey, normalizeForCache(results)) } catch {}
  }
  return repCache[machineId]
}

// Refresca repuestos de un equipo desde server y actualiza cache (memoria + localStorage).
// Usado cuando lsHit ya devolvió datos: actualizamos en background sin bloquear UI.
async function _refreshRepuestosFromServer(machineId){
  const m = machineMap[machineId]
  if (!m) return
  const collPath = getRepuestoCollPath(machineId)
  const lsKey = LS_PREFIX_REPCACHE + machineId
  let docs = []
  try {
    const snap = await db.collection(collPath).orderBy('codigoSAP').get({ source: 'server' })
    docs = snap.docs
  } catch(e){
    try { docs = (await db.collection(collPath).get({ source: 'server' })).docs }
    catch { return }  // sin server, mantener cache
  }
  let results = docs.map(d => ({id:d.id, ...d.data()}))
  const hierNodeId = m.hierarchyNodeId
  if (hierNodeId && collPath !== `hierarchy/${hierNodeId}/repuestos`){
    try {
      const hierSnap = await db.collection(`hierarchy/${hierNodeId}/repuestos`).get({ source: 'server' })
      const existingIds  = new Set(results.map(r => r.id))
      const existingSAPs = new Set(results.map(r => r.codigoSAP).filter(Boolean))
      for (const d of hierSnap.docs){
        const hr = {id: d.id, ...d.data()}
        if (!existingIds.has(hr.id) && !(hr.codigoSAP && existingSAPs.has(hr.codigoSAP))){
          results.push(hr)
          existingIds.add(hr.id)
          if (hr.codigoSAP) existingSAPs.add(hr.codigoSAP)
        }
      }
    } catch {}
  }
  if (results.length > 0){
    repCache[machineId] = results
    try { lsSet(lsKey, normalizeForCache(results)) } catch {}
  }
}

/**
 * Normaliza favoriteLists para que list.machineIds sea siempre la UNIÓN
 * de todos los equipos de la lista (raíz + sub-listas + sub-sub-listas).
 * Esto garantiza compatibilidad con la PWA que solo lee list.machineIds.
 * Retorna true si se realizó algún cambio.
 */
function _normalizeFavLists(lists){
  let changed = false
  for (const list of lists || []) {
    const allIds = new Set(list.machineIds || [])
    for (const sl of list.subLists || []) {
      for (const id of sl.machineIds || []) {
        if (!allIds.has(id)){ allIds.add(id); changed = true }
      }
      for (const ssl of sl.subLists || []) {
        for (const id of ssl.machineIds || []) {
          if (!allIds.has(id)){ allIds.add(id); changed = true }
        }
      }
    }
    if (changed) list.machineIds = [...allIds]
  }
  return changed
}

async function loadPrefs(){
  if (!uid) return
  // 1) Hidratar desde localStorage si existe (instantáneo, offline-friendly)
  const lsKey = `${LS_KEY_PREFS}_${uid}`  // por usuario
  const lsHit = lsGet(lsKey, LS_TTL_PREFS)
  if (lsHit){
    prefs = {
      favoriteLists:    lsHit.favoriteLists    || [],
      repuestoFavLists: lsHit.repuestoFavLists || {},
      insumoFavLists:   lsHit.insumoFavLists   || [],
    }
    _normalizeFavLists(prefs.favoriteLists)
    // El listener startPrefsListener se encargará del refresh con red
    return
  }
  // 2) Sin LS: fetch directo
  const doc = await db.collection('user_preferences').doc(uid).get()
  if (doc.exists) {
    const d = doc.data()
    prefs = {
      favoriteLists:    d.favoriteLists    || [],
      repuestoFavLists: d.repuestoFavLists || {},
      insumoFavLists:   d.insumoFavLists   || [],
    }
    // Persistir
    try { lsSet(lsKey, normalizeForCache(prefs)) } catch {}
    // Fix one-shot: restaurar list.machineIds si datos fueron corrompidos
    const fixed = _normalizeFavLists(prefs.favoriteLists)
    if (fixed) saveAllPrefs().catch(() => {})  // fire-and-forget
  }
}

/** Listener real-time: cambios hechos en la PWA o desde otro dispositivo se reflejan acá */
let prefsUnsub = null
let _ignoreNextPrefsUpdate = false  // flag para evitar re-render circular tras savePrefs local
function startPrefsListener(){
  if (!uid || prefsUnsub) return
  prefsUnsub = db.collection('user_preferences').doc(uid).onSnapshot(snap => {
    if (!snap.exists) return
    const d = snap.data()
    const next = {
      favoriteLists:    d.favoriteLists    || [],
      repuestoFavLists: d.repuestoFavLists || {},
      insumoFavLists:   d.insumoFavLists   || [],
    }
    // Normalizar: asegurar list.machineIds = unión de todos los equipos
    _normalizeFavLists(next.favoriteLists)
    // Persistir en localStorage para sobrevivir reinicios sin red
    try { lsSet(`${LS_KEY_PREFS}_${uid}`, normalizeForCache(next)) } catch {}
    // Si las prefs no cambiaron (mismo writer somos nosotros), evitar re-render
    if (JSON.stringify(next) === JSON.stringify(prefs)) return
    prefs = next
    // Re-renderear home si está activa
    if (currentTab === 'home') renderHome()
    // Refresh fav button si estamos en detalle
    const repView = document.getElementById('view-repuesto')
    if (repView?.classList.contains('active') && activeUploadCtx){
      updateFavBtnState(activeUploadCtx.machineId, activeUploadCtx.repuestoId)
    }
    // Si el sheet de favoritos está abierto, re-renderearlo
    if (favSheetCtx){
      openFavListsSheet(favSheetCtx.machineId, favSheetCtx.repuestoId)
    }
    // Ajustar listeners de stock para las nuevas listas favoritas
    startFavMachinesStockListeners()
  }, err => console.warn('prefs listener error', err))
}

async function getLinkedNodeIds(machineId){
  if (machineLinkedNodes[machineId]) return machineLinkedNodes[machineId]
  try {
    const snap = await db.collection('hierarchy').where('linkedMachineId','==',machineId).get()
    const ids = snap.docs.map(d => d.id)
    machineLinkedNodes[machineId] = ids
    return ids
  } catch(e){ machineLinkedNodes[machineId] = []; return [] }
}

async function getMachineFavListsMerged(machineId){
  const repFavLists = prefs.repuestoFavLists || {}
  const nodeIds = await getLinkedNodeIds(machineId)
  const keys = [...nodeIds, machineId]
  const merged = new Map()
  for (const k of keys){
    for (const l of (repFavLists[k] || [])) {
      if (!merged.has(l.name)) merged.set(l.name, new Set())
      ;(l.repuestoIds || []).forEach(id => merged.get(l.name).add(id))
    }
  }
  return Array.from(merged.entries()).map(([name, set]) => ({name, repuestoIds: Array.from(set)}))
}

function matchesRepFavList(rep, idSet){
  if (idSet.has(rep.id)) return true
  if (rep.codigoSAP && idSet.has(`inv-${rep.codigoSAP}`)) return true
  if (rep.codigoSAP && idSet.has(rep.codigoSAP)) return true
  return false
}

async function resolveNodeName(nodeId){
  if (nodeNameCache[nodeId]) return nodeNameCache[nodeId]
  try {
    const snap = await db.collection('hierarchy').doc(nodeId).get()
    if (snap.exists){
      const d = snap.data()
      const name = (d.linkedMachineId && machineMap[d.linkedMachineId]?.nombre)
        || d.nombre || d.name || nodeId
      nodeNameCache[nodeId] = name
      return name
    }
  } catch {}
  nodeNameCache[nodeId] = nodeId
  return nodeId
}

async function loadManuales(){
  if (__manualesCache && Date.now() - __manualesCacheTs < HIERARCHY_CACHE_TTL) return __manualesCache

  // 1) localStorage hit (TTL 24h — los manuales casi no cambian)
  if (!__manualesCache){
    const cached = lsGet(LS_KEY_MANUALES, LS_TTL_MAN)
    if (cached){
      __manualesCache = cached
      __manualesCacheTs = Date.now()
      return cached
    }
  }

  const results = []
  const setManualesProgress = (msg, loaded, total) => {
    const el = document.getElementById('manuales-progress')
    if (!el) return
    if (!msg){ el.style.display = 'none'; return }
    el.style.display = 'block'
    const pct = (total && loaded != null) ? Math.round((loaded/total)*100) : null
    el.innerHTML = `
      <div style="font-size:12px;color:var(--sub)">${escHtml(msg)}${pct!=null?` · ${pct}%`:''}</div>
      ${pct!=null?`<div style="height:3px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:var(--accent);transition:width .25s"></div>
      </div>`:''}`
  }

  // 2) Firestore manuales/ (rápido, single query)
  try {
    const snap = await db.collection('manuales').orderBy('createdAt','desc').limit(100).get()
    snap.docs.forEach(d => results.push({ id: d.id, source: 'firestore', ...d.data() }))
  } catch(e){ console.warn('manuales firestore failed', e) }

  // 3) Legacy Storage paths del PWA — escaneo paralelo con progress
  await loadHierarchyTree().catch(() => {})
  const eqNodes = Object.values(hierarchyNodesMap || {}).filter(n => isEquipNode(n))
  const total = machines.length + eqNodes.length
  let done = 0
  setManualesProgress(`Buscando manuales del PWA… 0 / ${total}`, 0, total)

  const BATCH = 12  // listAll es más rápido que getDocs, podemos paralelizar más

  // 3a) Por máquina legacy
  for (let i = 0; i < machines.length; i += BATCH){
    const batch = machines.slice(i, i + BATCH)
    await Promise.all(batch.map(async m => {
      try {
        const list = await storage.ref(`machines/${m.id}/manuales`).listAll()
        for (const item of list.items){
          const url = await item.getDownloadURL().catch(() => null)
          if (!url) continue
          results.push({
            id: `legacy_m_${m.id}_${item.name}`,
            source: 'storage_legacy',
            ownerType: 'equipo', ownerId: m.id,
            ownerPath: [m.nombre || m.id],
            titulo: item.name.replace(/^\d+_/,'').replace(/_\d+\.pdf$/i,'.pdf').replace(/_/g,' ').replace(/\.pdf$/i,''),
            tipo: 'pdf', url,
            storagePath: item.fullPath,
            createdAt: null,
          })
        }
      } catch { /* carpeta no existe — OK */ }
    }))
    done += batch.length
    setManualesProgress(`Buscando manuales del PWA… ${done} / ${total}`, done, total)
  }

  // 3b) Por nodo equipo SAP (hierarchy)
  for (let i = 0; i < eqNodes.length; i += BATCH){
    const batch = eqNodes.slice(i, i + BATCH)
    await Promise.all(batch.map(async n => {
      try {
        const list = await storage.ref(`equipment/${n.id}/manuales`).listAll()
        for (const item of list.items){
          const url = await item.getDownloadURL().catch(() => null)
          if (!url) continue
          results.push({
            id: `legacy_e_${n.id}_${item.name}`,
            source: 'storage_legacy',
            ownerType: 'equipo', ownerId: n.id,
            ownerPath: [n.nombre || n.id],
            titulo: item.name.replace(/^\d+_/,'').replace(/_\d+\.pdf$/i,'.pdf').replace(/_/g,' ').replace(/\.pdf$/i,''),
            tipo: 'pdf', url,
            storagePath: item.fullPath,
            createdAt: null,
          })
        }
      } catch { /* carpeta no existe — OK */ }
    }))
    done += batch.length
    setManualesProgress(`Buscando manuales del PWA… ${done} / ${total}`, done, total)
  }

  setManualesProgress(null)
  __manualesCache   = results
  __manualesCacheTs = Date.now()
  lsSet(LS_KEY_MANUALES, normalizeForCache(results))
  return results
}

function renderManualesBody(manuales){
  const listEl  = document.getElementById('manuales-list')
  const chipsEl = document.getElementById('manuales-type-chips')
  if (!listEl) return

  if (manuales.length === 0){
    if (chipsEl) chipsEl.innerHTML = ''
    listEl.innerHTML = emptyHtml('📚','Sin documentos',
      (userRole==='admin'||userRole==='supervisor')
        ? 'Sube el primer manual con el botón + Subir'
        : 'Aún no hay documentos cargados')
    return
  }

  const tipos = [...new Set(manuales.map(m => m.tipo).filter(Boolean))]
  if (chipsEl && tipos.length > 1){
    chipsEl.innerHTML = `<div class="chips" style="padding:0 12px 6px">
      <div class="chip ${manualesTypeFilter===null?'active':''}" onclick="setManualesTypeFilter(null)">
        Todos <span class="count">${manuales.length}</span></div>
      ${tipos.map(t => {
        const cnt = manuales.filter(m => m.tipo===t).length
        return `<div class="chip ${manualesTypeFilter===t?'active':''}"
                     onclick="setManualesTypeFilter('${escHtmlAttr(t)}')">
          ${manualIcon(t)} ${escHtml(t[0].toUpperCase()+t.slice(1))}
          <span class="count">${cnt}</span></div>`
      }).join('')}
    </div>`
  } else if (chipsEl){ chipsEl.innerHTML = '' }

  const searchQ = normalizeSearch(document.getElementById('manuales-search')?.value || '')
  let filtered = manualesTypeFilter ? manuales.filter(m => m.tipo===manualesTypeFilter) : manuales
  if (searchQ){
    filtered = filtered.filter(m =>
      normalizeSearch(m.titulo).includes(searchQ)
      || normalizeSearch((m.ownerPath||[]).join(' ')).includes(searchQ)
      || normalizeSearch(m.descripcion).includes(searchQ)
    )
  }
  if (filtered.length === 0){
    listEl.innerHTML = emptyHtml('🔍','Sin resultados','Ningún documento coincide con el filtro')
    return
  }

  // Agrupar por equipo (ownerId) — secciones alfabéticas
  const groups = {}
  for (const m of filtered){
    const key = m.ownerId || '__sin'
    const name = (m.ownerPath && m.ownerPath[0]) || m.ownerId || 'Sin equipo asociado'
    if (!groups[key]) groups[key] = { name, items: [] }
    groups[key].items.push(m)
  }
  const sorted = Object.entries(groups).sort(([,a],[,b]) => a.name.localeCompare(b.name, 'es'))

  listEl.innerHTML = sorted.map(([key, g]) => `
    <div class="section">
      <span class="section-title">${escHtml(g.name)}</span>
      <span class="section-count">${g.items.length}</span>
    </div>
    <div class="cell-group">${g.items.map(manualCellHtml).join('')}</div>
  `).join('')
}

function manualCellHtml(m){
  const owner = (m.ownerPath||[]).join(' › ') || m.ownerId || ''
  const size  = m.fileSize ? ` · ${(m.fileSize/1048576).toFixed(1)} MB` : ''
  // createdAt puede ser Timestamp Firestore o millis (cuando viene de localStorage)
  const ts = typeof m.createdAt === 'number'
    ? m.createdAt
    : (m.createdAt?.toDate ? m.createdAt.toDate().getTime() : null)
  const when = ts ? relativeTime(ts) : ''
  // storagePath se incluye para que openManualViewer pueda construir la cache key correcta
  const mData = escHtmlAttr(JSON.stringify({
    id:m.id, url:m.url, tipo:m.tipo, titulo:m.titulo, storagePath:m.storagePath || null,
  }))
  // 📥 verde si el manual ya está descargado offline
  const cached = __manualCachedKeys.has(manualCacheKey(m))
  const cachedBadge = cached
    ? `<span style="font-size:11px;color:var(--green);margin-left:6px" title="Descargado para offline">📥</span>`
    : ''
  return `<div class="cell" onclick="openManualViewer(${mData})">
    <div class="cell-icon" style="font-size:20px">${manualIcon(m.tipo)}</div>
    <div class="cell-body">
      <div class="cell-title">${escHtml(m.titulo||'Sin título')}${cachedBadge}</div>
      ${owner ? `<div class="cell-meta">${escHtml(owner)}</div>` : ''}
      <div class="cell-sub">${escHtml((m.tipo||'').toUpperCase())}${size}${when?` · ${when}`:''}</div>
    </div>
    <div class="cell-chevron">›</div>
  </div>`
}

async function openManualViewer(mData){
  const m = typeof mData === 'string' ? JSON.parse(mData) : mData
  if (!m?.url) return
  tgApp?.HapticFeedback?.selectionChanged?.()
  // PDF e imagen → visor inline; link/video → externo
  if (m.tipo === 'pdf' || m.tipo === 'imagen'){
    // Online: URL directa (Range requests OK, PDFs grandes cargan todas las páginas).
    // Offline: blob URL desde IDB si existe.
    showInlineDocOverlay(null, m.titulo, m.tipo, { state: 'loading', externalUrl: m.url })
    try {
      const { url, fromCache, mode } = await resolveManualUrl(m)
      showInlineDocOverlay(url, m.titulo, m.tipo, {
        state: 'ready',
        externalUrl: m.url,           // siempre el original para "↗ Externo"
        fromCache,                     // muestra badge "📥 offline" si ya estaba cacheado
        offlineMode: mode === 'blob',  // visor de blob solo en modo offline
      })
    } catch(e){
      console.warn('[manualCache] open failed', e)
      const offline = !navigator.onLine
      showInlineDocOverlay(null, m.titulo, m.tipo, {
        state: 'error',
        errorMsg: e?.message || 'No pude abrir el manual',
        externalUrl: offline ? null : m.url,
      })
    }
    return
  }
  if (tgApp?.openLink) tgApp.openLink(m.url)
  else window.open(m.url, '_blank')
}

// Visor inline PDF/imagen con fallback "Abrir externo".
// state: 'loading' | 'ready' | 'error'  (default: 'ready' si url presente)
function showInlineDocOverlay(url, title, tipo, opts){
  opts = opts || {}
  const state = opts.state || (url ? 'ready' : 'loading')
  const externalUrl = opts.externalUrl || (state === 'ready' ? url : '')

  // Liberar blob URL anterior si vamos a reemplazarlo
  if (__currentBlobUrl && __currentBlobUrl !== url){
    try { URL.revokeObjectURL(__currentBlobUrl) } catch {}
    __currentBlobUrl = null
  }
  if (url && typeof url === 'string' && url.startsWith('blob:')) __currentBlobUrl = url

  let ov = document.getElementById('doc-overlay')
  if (!ov){
    ov = document.createElement('div')
    ov.id = 'doc-overlay'
    ov.style.cssText = 'position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column'
    document.body.appendChild(ov)
  }
  const isPdf = tipo === 'pdf'
  const cacheBadge = (state === 'ready' && opts.fromCache)
    ? `<span style="font-size:10px;color:var(--green);background:rgba(79,174,78,.15);padding:2px 6px;border-radius:8px;margin-left:6px;font-weight:600">📥 offline</span>`
    : ''
  const headerExtBtn = externalUrl
    ? `<button onclick="openDocExternal('${escHtmlAttr(externalUrl)}')"
         style="background:none;border:none;color:var(--accent);font-size:13px;
         padding:4px 8px;cursor:pointer;font-weight:600">↗ Externo</button>`
    : ''

  let body = ''
  if (state === 'loading'){
    body = `<div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px">
      <div style="width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite"></div>
      <div style="font-size:13px;color:var(--hint)">Descargando manual…</div>
    </div>`
  } else if (state === 'error'){
    body = `<div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center">
      <div style="font-size:36px">${!navigator.onLine ? '📡' : '⚠️'}</div>
      <div style="font-size:14px;color:var(--text);max-width:280px;line-height:1.4">${escHtml(opts.errorMsg || 'Error al abrir')}</div>
      ${externalUrl ? `<button onclick="openDocExternal('${escHtmlAttr(externalUrl)}')"
        style="background:var(--accent);border:none;color:var(--acctxt);padding:8px 18px;
        border-radius:14px;font-size:13px;font-weight:600;cursor:pointer">↗ Abrir online</button>`:''}
    </div>`
  } else if (isPdf){
    // Contenedor scrollable donde PDF.js renderizará las páginas como canvas.
    body = `<div id="pdf-canvas-container" style="flex:1;overflow:auto;background:#1a1a1a;
      padding:8px;-webkit-overflow-scrolling:touch">
      <div style="display:flex;align-items:center;justify-content:center;flex-direction:column;
        gap:10px;color:var(--hint);font-size:13px;padding:40px 20px">
        <div style="width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite"></div>
        <span id="pdf-render-progress">Abriendo PDF…</span>
      </div>
    </div>`
  } else {
    body = `<div style="flex:1;overflow:auto;background:#000;display:flex;align-items:center;justify-content:center">
      <img src="${escHtmlAttr(url)}" style="max-width:100%;max-height:100%;object-fit:contain">
    </div>`
  }

  ov.innerHTML = `
    <div style="padding:8px 12px;border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:8px;background:var(--card)">
      <button onclick="closeInlineDocOverlay()" style="background:none;border:none;
        color:var(--text);font-size:18px;padding:4px 8px;cursor:pointer">✕</button>
      <div style="flex:1;font-size:14px;font-weight:600;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis">${escHtml(title || 'Documento')}${cacheBadge}</div>
      ${headerExtBtn}
    </div>
    ${body}
    ${(isPdf && state === 'ready') ? `<div id="pdf-status-bar" style="padding:6px 12px;font-size:11px;color:var(--hint);
      text-align:center;background:var(--card);border-top:1px solid var(--border)">
      ${opts.offlineMode ? '📡 Modo offline · ' : ''}<span id="pdf-page-count">renderizando…</span>
    </div>` : ''}`
  ov.style.display = 'flex'
  setTgBack(closeInlineDocOverlay)

  // Render PDF con PDF.js (async, no bloquea UI)
  if (isPdf && state === 'ready' && url){
    const container = ov.querySelector('#pdf-canvas-container')
    const progressEl = ov.querySelector('#pdf-page-count')
    if (container){
      // Pequeño delay para que el browser pinte el spinner antes del trabajo pesado
      setTimeout(() => {
        renderPdfIntoContainer(url, container, progressEl)
          .catch(err => {
            console.warn('[pdfjs] render falló', err)
            container.innerHTML = `<div style="color:#ddd;text-align:center;padding:30px 20px;font-size:13px;line-height:1.5">
              <div style="font-size:32px;margin-bottom:10px">⚠️</div>
              <div>No se pudo renderizar el PDF.<br>${escHtml(err?.message || '')}</div>
              ${externalUrl ? `<button onclick="openDocExternal('${escHtmlAttr(externalUrl)}')"
                style="margin-top:14px;background:var(--accent);border:none;color:var(--acctxt);
                padding:8px 18px;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer">↗ Abrir online</button>` : ''}
            </div>`
            if (progressEl) progressEl.textContent = 'error'
          })
      }, 30)
    }
  }
}

  if (ov){ ov.style.display = 'none'; ov.innerHTML = '' }
  if (__currentBlobUrl){

  }
  setTgBack(null)
}

function mupOwnerSearch(){
  const q = normalizeSearch(document.getElementById('mup-owner-search')?.value || '')
  const ownerType = document.getElementById('mup-owner-type')?.value
  const results   = document.getElementById('mup-owner-results')
  if (!q || !results) return

  let candidates = []
  if (ownerType === 'equipo'){
    machines.filter(m => normalizeSearch(m.nombre).includes(q)).slice(0,5)
      .forEach(m => candidates.push({ id: m.id, name: m.nombre }))
    Object.values(hierarchyNodesMap)
      .filter(n => isEquipNode(n) && normalizeSearch(n.nombre).includes(q)).slice(0,4)
      .forEach(n => candidates.push({ id: n.id, name: n.nombre }))
  } else {
    const levelMap = { planta: 2, area: 3 }
    const lvl = levelMap[ownerType]
    Object.values(hierarchyNodesMap)
      .filter(n => (!lvl || n.nivel===lvl) && normalizeSearch(n.nombre).includes(q)).slice(0,8)
      .forEach(n => candidates.push({ id: n.id, name: n.nombre }))
  }

  results.innerHTML = candidates.length === 0
    ? `<div style="font-size:12px;color:var(--hint);padding:4px 0">Sin resultados</div>`
    : `<div class="cell-group" style="margin-top:4px">
        ${candidates.map(c => `
          <div class="cell" style="padding:6px 12px"
               onclick="mupSelectOwner('${escHtmlAttr(c.id)}','${escHtmlAttr(c.name)}')">

}
