function repCellHtml(r, machineId, machineName){
  const icon = repIcon(r.tipo)
  const name = r.textoBreve || r.descripcion || r.alias || 'Sin nombre'
  const sub = [r.tipo, machineName].filter(Boolean).join(' · ')
  return `<div class="cell" onclick="openRepuesto('${escHtmlAttr(machineId)}','${escHtmlAttr(r.id)}')">
    <div class="cell-icon">${icon}</div>
    <div class="cell-body">
      <div class="cell-title">${escHtml(name)}</div>
      ${r.codigoSAP ? `<div class="cell-meta">SAP ${escHtml(r.codigoSAP)}</div>` : ''}
      ${sub ? `<div class="cell-sub">${escHtml(sub)}</div>` : ''}
    </div>
    <div class="cell-chevron">›</div>
  </div>`
}

function repIcon(tipo){
  const map = {
    'RODAMIENTO':'⚙️','SELLO':'🔵','JUNTA':'🔵','SENSOR':'📡','MOTOR':'⚡',
    'CORREA':'〰️','CADENA':'🔗','VALVULA':'🔧','FILTRO':'🔳','CUCHILLA':'🔪',
    'CUCHILLO':'🔪','RESORTE':'🌀','ENGRANAJE':'⚙️','BOMBA':'💧',
  }
  if (!tipo) return '🔩'
  const u = tipo.toUpperCase()
  for (const [k,v] of Object.entries(map)) if (u.includes(k)) return v
  return '🔩'
}

async function openRepuesto(machineId, repuestoId, opts = {}){
  let reps = repCache[machineId]
  if (!reps) reps = await loadRepuestos(machineId).catch(() => [])
  const r = reps.find(x => x.id === repuestoId)
  if (!r) return
  const m = machineMap[machineId]
  const title = r.textoBreve || r.alias || r.descripcion || 'Repuesto'
  const subtitle = r.codigoSAP ? `SAP ${r.codigoSAP}` : (r.tipo || '')

  // Si vinimos de un upload o save, no apilamos vista nueva — solo re-renderizamos
  if (!opts.fromUpload && !opts.fromSave){
    tgApp?.HapticFeedback?.selectionChanged?.()
    pushView('view-repuesto', title, subtitle)
    saveRecent(machineId, repuestoId, title, r.codigoSAP)
  } else {
    setHeader(title, subtitle, true)
  }
  activeUploadCtx = { machineId, repuestoId }

  // Botón ⭐ favorito — disponible para cualquier usuario autenticado
  const favBtn = document.getElementById('hdr-fav')
  favBtn.style.display = 'flex'
  favBtn.onclick = () => openFavListsSheet(machineId, repuestoId)
  updateFavBtnState(machineId, repuestoId)

function renderRepEquipoManuales(machineId, equipoName){
  const el = document.getElementById('rep-equipo-manuales')
  if (!el) return
  if (!__manualesCache){
    loadManuales().then(() => {
      const still = document.getElementById('rep-equipo-manuales')
      if (still) renderRepEquipoManuales(machineId, equipoName)
    }).catch(() => {})
    return
  }
  const matches = __manualesCache.filter(x =>
    x.ownerId === machineId
    || (equipoName && (x.ownerPath || []).some(p => normalizeSearch(p) === normalizeSearch(equipoName)))
  )
  if (matches.length === 0){ el.innerHTML = ''; return }
  el.innerHTML = `
    <div id="rep-manuales-anchor" class="section">
      <span class="section-title">📖 Manuales del equipo</span>
      <span class="section-count">${matches.length}</span>
    </div>
    <div class="cell-group">${matches.map(manualCellHtml).join('')}</div>`
}

function copyRepSap(sap){
  navigator.clipboard?.writeText(String(sap)).then(() => {
    showToast(`SAP ${sap} copiado ✓`, 'ok')
    tgApp?.HapticFeedback?.notificationOccurred?.('success')
  }).catch(() => showToast('No se pudo copiar', 'err'))
}

function shareRepuesto(machineId, repuestoId){
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  if (!r) return
  const title = r.textoBreve || r.alias || 'Repuesto'
  const sap = r.codigoSAP ? `\nSAP: ${r.codigoSAP}` : ''
  const fab = r.codigoFabricante ? `\nCód. fab: ${r.codigoFabricante}` : ''
  const ubi = r.ubicacionEnPlanta ? `\nUbicación: ${r.ubicacionEnPlanta}` : ''
  const text = `🔧 ${title}${sap}${fab}${ubi}`
  // En Telegram WebApp: switchInlineQuery copia para reenviar
  if (tgApp?.switchInlineQuery){
    tgApp.switchInlineQuery(text, ['users','groups'])
    return
  }
  navigator.clipboard?.writeText(text).then(() => {
    showToast('Datos del repuesto copiados ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred?.('success')
  }).catch(() => showToast('No se pudo copiar', 'err'))
}

function scrollToRepManuales(){
  const el = document.getElementById('rep-manuales-anchor')
  if (el){
    el.scrollIntoView({ behavior: 'smooth', block: 'start' })
  } else {
    showToast('Sin manuales para este equipo', 'err')
  }
}

function navigateToEquipoFromRep(nodeId, machineId){

  } else {

}

function renderRepCrossEquipo(codigoSAP, currentMachineId){
  if (!__repuestosCache) return
  const norm = normalizeSearch(codigoSAP)
  const matches = __repuestosCache.filter(x =>
    normalizeSearch(x.repuesto.codigoSAP) === norm && x.machineId !== currentMachineId
  )
  if (matches.length === 0) return
  const el = document.getElementById('rep-cross-equipo')
  if (!el) return
  el.innerHTML = `
    <div class="section">
      <span class="section-title">En otros equipos</span>
      <span class="section-count">${matches.length}</span>
    </div>
    <div class="cell-group">
      ${matches.slice(0,5).map(x => `
        <div class="cell" onclick="openRepuesto('${escHtmlAttr(x.machineId)}','${escHtmlAttr(x.repuesto.id)}')">
          <div class="cell-icon">🏭</div>
          <div class="cell-body">
            <div class="cell-title">${escHtml(x.machineName)}</div>
            ${x.repuesto.ubicacionEnPlanta
              ? `<div class="cell-sub">${escHtml(x.repuesto.ubicacionEnPlanta)}</div>` : ''}

}

async function updateFavBtnState(machineId, repuestoId){
  const favBtn = document.getElementById('hdr-fav')
  if (!favBtn) return
  const lists = await getMachineFavListsMerged(machineId)
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  const isInAny = lists.some(l => {
    const set = new Set(l.repuestoIds || [])
    return r ? matchesRepFavList(r, set) : set.has(repuestoId)
  })
  favBtn.classList.toggle('fav-on', isInAny)
}

let lbxPhotoCtx = null  // {machineId, repuestoId, photoId, isPrincipal}

function openLightboxRep(machineId, repuestoId, photoId){
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  if (!r) return
  const photos = [...(r.fotosReales || []), ...(r.imagenesManual || [])]
  const ph = photos.find(p => p.id === photoId)
  if (!ph) return
  // Solo permitir editar fotos reales (no las del manual original)
  const isReal = (r.fotosReales || []).some(p => p.id === photoId)
  const ctx = isReal ? { machineId, repuestoId, photoId, isPrincipal: !!ph.esPrincipal } : null
  openLightbox(ph.url, ph.descripcion || ph.tipo || '', ctx)
}

function openLightbox(url, caption, ctx){
  document.getElementById('lbx-img').src = url
  document.getElementById('lbx-cap').textContent = caption || ''
  const actions = document.getElementById('lbx-actions')
  if (userRole === 'admin' && ctx){
    lbxPhotoCtx = ctx
    actions.classList.add('show')
    const pBtn = document.getElementById('lbx-principal')
    if (ctx.isPrincipal){
      pBtn.classList.add('is-active')
      pBtn.textContent = '⭐ Principal'
      pBtn.disabled = true
    } else {
      pBtn.classList.remove('is-active')
      pBtn.textContent = '⭐ Hacer principal'
      pBtn.disabled = false
    }
  } else {
    lbxPhotoCtx = null
    actions.classList.remove('show')
  }
  document.getElementById('lightbox').classList.add('open')
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open')
  document.getElementById('lbx-img').src = ''
  lbxPhotoCtx = null
}

async function onLbxMarkPrincipal(){
  if (!lbxPhotoCtx || userRole !== 'admin') return
  const { machineId, repuestoId, photoId } = lbxPhotoCtx
  const btn = document.getElementById('lbx-principal')
  btn.disabled = true; btn.textContent = '⭐ Aplicando…'
  try {
    const docRef = db.collection(getRepuestoCollPath(machineId)).doc(repuestoId)
    const snap = await docRef.get()
    const fotos = (snap.exists ? snap.data().fotosReales : []) || []
    const newFotos = fotos.map(f => ({ ...f, esPrincipal: f.id === photoId }))
    await docRef.update({
      fotosReales: newFotos,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    })
    // Actualizar cache
    const reps = repCache[machineId] || []
    const idx = reps.findIndex(x => x.id === repuestoId)
    if (idx >= 0) reps[idx] = { ...reps[idx], fotosReales: newFotos }

    showToast('Foto principal actualizada ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    closeLightbox()
    openRepuesto(machineId, repuestoId, { fromSave: true })
  } catch(err){
    console.error('mark principal error', err)
    showToast('Error: ' + (err.message || 'No se pudo aplicar'), 'err')
    btn.disabled = false; btn.textContent = '⭐ Hacer principal'
  }
}

async function onLbxDelete(){
  if (!lbxPhotoCtx || userRole !== 'admin') return
  const ok = confirm('¿Borrar esta foto? No se puede deshacer.')
  if (!ok) return
  const { machineId, repuestoId, photoId } = lbxPhotoCtx
  const btn = document.getElementById('lbx-delete')
  btn.disabled = true; btn.textContent = '🗑️ Borrando…'
  try {
    const docRef = db.collection(getRepuestoCollPath(machineId)).doc(repuestoId)
    const snap = await docRef.get()
    const fotos = (snap.exists ? snap.data().fotosReales : []) || []
    const target = fotos.find(f => f.id === photoId)
    const newFotos = fotos.filter(f => f.id !== photoId)
    await docRef.update({
      fotosReales: newFotos,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    })
    // Borrar el archivo de Storage (best-effort)
    if (target?.url){
      try {
        await storage.refFromURL(target.url).delete()
      } catch(e){
        console.warn('no se pudo borrar storage object (puede no existir)', e)
      }
    }
    // Actualizar cache
    const reps = repCache[machineId] || []
    const idx = reps.findIndex(x => x.id === repuestoId)
    if (idx >= 0) reps[idx] = { ...reps[idx], fotosReales: newFotos }

    showToast('Foto borrada ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    closeLightbox()
    openRepuesto(machineId, repuestoId, { fromSave: true })
  } catch(err){
    console.error('delete photo error', err)
    showToast('Error: ' + (err.message || 'No se pudo borrar'), 'err')
    btn.disabled = false; btn.textContent = '🗑️ Borrar'
  }
}

/** Key canónico para escribir las listas de un equipo:
 *  primer hierarchy nodeId vinculado, o machineId si no hay vinculación. */
async function getCanonicalRepFavKey(machineId){
  const nodeIds = await getLinkedNodeIds(machineId)
  return nodeIds[0] || machineId
}

/** Devuelve los keys posibles donde puede haber listas para esa máquina */
async function getRelatedRepFavKeys(machineId){
  const nodeIds = await getLinkedNodeIds(machineId)
  return Array.from(new Set([...nodeIds, machineId]))
}

/** Persiste prefs.repuestoFavLists (y favoriteLists) en Firestore. */
async function saveAllPrefs(){
  // En IS_PREVIEW no escribir en Firestore: el SDK haría un optimistic-write que
  // dispararía el onSnapshot listener y revertiría prefs con los datos del servidor.
  if (IS_PREVIEW) return
  if (!uid) throw new Error('No hay sesión')
  await db.collection('user_preferences').doc(uid).set({
    favoriteLists:    prefs.favoriteLists    || [],
    repuestoFavLists: prefs.repuestoFavLists || {},
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  }, { merge: true })
}

/** Abre el sheet para gestionar listas de favoritos del repuesto */
async function openFavListsSheet(machineId, repuestoId){
  favSheetCtx = { machineId, repuestoId }
  const lists = await getMachineFavListsMerged(machineId)

  const sheet = document.getElementById('sheet')

    content.innerHTML = `<div class="sheet-empty">Aún no tenés listas para este equipo.<br>Creá la primera abajo.</div>`
  } else {
    content.innerHTML = lists.map(l => {
      const set = new Set(l.repuestoIds)
      const reps = repCache[machineId] || []
      const r = reps.find(x => x.id === repuestoId)
      const isIn = r ? matchesRepFavList(r, set) : set.has(repuestoId)
      return `<div class="sheet-row ${isIn ? 'on' : ''}" onclick="toggleRepInFavList(${escHtmlAttr(JSON.stringify(l.name))})">

          onclick="event.stopPropagation();renameRepFavList(${escHtmlAttr(JSON.stringify(l.name))})" aria-label="Renombrar">✏️</button>
        <button class="edit-btn" style="display:flex;width:30px;height:30px;font-size:13px;background:rgba(229,57,53,.14)"
          onclick="event.stopPropagation();deleteRepFavList(${escHtmlAttr(JSON.stringify(l.name))})" aria-label="Borrar">🗑️</button>

function closeSheet(){
  const ctx = favSheetCtx
  document.getElementById('sheet-overlay').classList.remove('open')
  document.getElementById('sheet').classList.remove('open')

  if (ctx) updateFavBtnState(ctx.machineId, ctx.repuestoId)

async function toggleRepInFavList(listName){
  if (!favSheetCtx) return
  const { machineId, repuestoId } = favSheetCtx
  const canonicalKey = await getCanonicalRepFavKey(machineId)
  const relatedKeys = await getRelatedRepFavKeys(machineId)
  const allLists = prefs.repuestoFavLists || {}

  // ¿Está actualmente?
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  let alreadyIn = false
  for (const k of relatedKeys){
    const list = (allLists[k] || []).find(l => l.name === listName)
    if (list){
      const set = new Set(list.repuestoIds || [])
      if (r ? matchesRepFavList(r, set) : set.has(repuestoId)){ alreadyIn = true; break }
    }
  }

  // Trabajar sobre el canonical: traer/crear la lista ahí
  if (!allLists[canonicalKey]) allLists[canonicalKey] = []
  let list = allLists[canonicalKey].find(l => l.name === listName)
  if (!list){
    // Si existe en otro key, mover al canonical (consolida)
    for (const k of relatedKeys){
      if (k === canonicalKey) continue
      const idx = (allLists[k] || []).findIndex(l => l.name === listName)
      if (idx >= 0){
        list = allLists[k][idx]
        allLists[k].splice(idx, 1)
        if (allLists[k].length === 0) delete allLists[k]
        allLists[canonicalKey].push(list)
        break
      }
    }
    if (!list){
      list = { name: listName, repuestoIds: [] }
      allLists[canonicalKey].push(list)
    }
  }
  list.repuestoIds = list.repuestoIds || []

  if (alreadyIn){
    // Quitar de TODAS las apariciones (consolidación)
    for (const k of relatedKeys){
      const lst = (allLists[k] || []).find(l => l.name === listName)
      if (!lst) continue
      lst.repuestoIds = (lst.repuestoIds || []).filter(id => {
        if (id === repuestoId) return false
        if (r?.codigoSAP && (id === `inv-${r.codigoSAP}` || id === r.codigoSAP)) return false
        return true
      })
    }
  } else {
    if (!list.repuestoIds.includes(repuestoId)) list.repuestoIds.push(repuestoId)
  }

  prefs.repuestoFavLists = allLists
  try {
    await saveAllPrefs()
    showToast(alreadyIn ? 'Quitado de la lista' : 'Agregado ✓', 'ok')
    tgApp?.HapticFeedback?.selectionChanged?.()
    // Re-render sheet (refresh estado)
    openFavListsSheet(machineId, repuestoId)
    // Re-render machine view si está visible (chips de fav)
    refreshMachineDetailIfActive(machineId)
  } catch(err){
    console.error('toggle fav error', err)
    showToast('Error: ' + (err.message || ''), 'err')
  }
}

async function createRepFavList(){
  if (!favSheetCtx) return
  const { machineId, repuestoId } = favSheetCtx
  showInputModal('Nueva lista', '', 'Ej. Cuchillos, Sensores, Resortes…', async (name) => {
    name = (name || '').trim()
    if (!name) return
    const canonicalKey = await getCanonicalRepFavKey(machineId)
    const allLists = prefs.repuestoFavLists || {}
    if (!allLists[canonicalKey]) allLists[canonicalKey] = []
    if (allLists[canonicalKey].some(l => l.name === name)){
      showToast('Ya existe una lista con ese nombre', 'err')
      return
    }
    allLists[canonicalKey].push({ name, repuestoIds: repuestoId ? [repuestoId] : [] })
    prefs.repuestoFavLists = allLists
    try {
      await saveAllPrefs()
      showToast('Lista creada ✓', 'ok')
      tgApp?.HapticFeedback?.notificationOccurred('success')
      openFavListsSheet(machineId, repuestoId)
      refreshMachineDetailIfActive(machineId)
    } catch(err){
      showToast('Error: ' + (err.message || ''), 'err')
    }
  })
}

async function renameRepFavList(listName){
  if (!favSheetCtx) return
  const { machineId, repuestoId } = favSheetCtx
  showInputModal('Renombrar lista', listName, 'Nuevo nombre', async (newName) => {
    newName = (newName || '').trim()
    if (!newName || newName === listName) return
    const relatedKeys = await getRelatedRepFavKeys(machineId)
    const allLists = prefs.repuestoFavLists || {}
    // Verificar que el nuevo nombre no exista en ninguno de los keys
    for (const k of relatedKeys){
      if ((allLists[k] || []).some(l => l.name === newName)){
        showToast('Ya existe una lista con ese nombre', 'err')
        return
      }
    }
    // Renombrar en TODOS los keys (consolidación silenciosa)
    let renamed = false
    for (const k of relatedKeys){
      const list = (allLists[k] || []).find(l => l.name === listName)
      if (list){ list.name = newName; renamed = true }
    }
    if (!renamed) return
    prefs.repuestoFavLists = allLists
    try {
      await saveAllPrefs()
      showToast('Lista renombrada ✓', 'ok')
      openFavListsSheet(machineId, repuestoId)
      refreshMachineDetailIfActive(machineId)
    } catch(err){
      showToast('Error: ' + (err.message || ''), 'err')
    }
  })
}

async function deleteRepFavList(listName){
  if (!favSheetCtx) return
  const ok = confirm(`¿Borrar la lista "${listName}"? Los repuestos seguirán existiendo.`)
  if (!ok) return
  const { machineId, repuestoId } = favSheetCtx
  const relatedKeys = await getRelatedRepFavKeys(machineId)
  const allLists = prefs.repuestoFavLists || {}
  for (const k of relatedKeys){
    if (!allLists[k]) continue
    allLists[k] = allLists[k].filter(l => l.name !== listName)
    if (allLists[k].length === 0) delete allLists[k]
  }
  prefs.repuestoFavLists = allLists
  try {
    await saveAllPrefs()
    showToast('Lista borrada ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('warning')
    openFavListsSheet(machineId, repuestoId)
    refreshMachineDetailIfActive(machineId)
  } catch(err){
    showToast('Error: ' + (err.message || ''), 'err')
  }
}

function openStockConteoModal(machineId, repuestoId){
  const reps = repCache[machineId] || []
  const r = reps.find(x => x.id === repuestoId)
  if (!r) return
  const current = r.stockFisico != null ? String(r.stockFisico) : ''
  showInputModal(
    `Stock físico — ${r.textoBreve || 'Repuesto'}`,
    current,
    'Cantidad en bodega',
    async (val) => {
      if (val == null || val === '') return
      const n = Number(String(val).replace(',', '.'))
      if (!Number.isFinite(n) || n < 0){
        showToast('Cantidad inválida', 'err'); return
      }
      await saveStockConteo(machineId, repuestoId, Math.round(n))
    }
  )

  if (inp){ inp.type = 'number'; inp.inputMode = 'numeric'; inp.min = '0'; inp.step = '1' }

async function saveStockConteo(machineId, repuestoId, cantidad){
  const path = getRepuestoCollPath(machineId)
  const who = firstName || tgApp?.initDataUnsafe?.user?.first_name || 'usuario'
  const ts = Date.now()
  const update = { stockFisico: cantidad, stockContadoEn: ts, stockContadoPor: who }
  // Optimista: actualizar cache + render
  const r = (repCache[machineId] || []).find(x => x.id === repuestoId)
  if (r) Object.assign(r, update)
  const inGlobal = __repuestosCache?.find(x => x.repuesto.id === repuestoId && x.machineId === machineId)
  if (inGlobal) Object.assign(inGlobal.repuesto, update)
  openRepuesto(machineId, repuestoId, { fromSave: true })
  tgApp?.HapticFeedback?.notificationOccurred?.('success')
  try {
    await db.doc(`${path}/${repuestoId}`).update(update)
    showToast('Stock actualizado ✓', 'ok')
  } catch (err) {
    if (IS_PREVIEW){ showToast('Stock guardado (solo preview)', 'ok'); return }
    showToast('Error: ' + (err.message || ''), 'err')
  }
}

async function saveRepuestoEdit(machineId, repuestoId){
  if (userRole !== 'admin') return
  const btn = document.getElementById('btn-save-rep')
  btn.disabled = true
  btn.textContent = 'Guardando…'

  const updates = {}
  for (const [key, label, type] of EDIT_FIELDS){
    const inp = document.getElementById(`ef-${key}`)
    if (!inp) continue
    let v = inp.value
    if (type === 'number'){
      if (v === '' || v == null){ updates[key] = null; continue }
      const n = Number(v)
      if (Number.isNaN(n)){
        showToast(`${label}: número inválido`, 'err')
        btn.disabled = false; btn.textContent = 'Guardar'
        return
      }
      updates[key] = n
    } else {
      updates[key] = v.trim()
    }
  }

  // Validación mínima
  if (!updates.textoBreve){
    showToast('El nombre no puede estar vacío', 'err')
    btn.disabled = false; btn.textContent = 'Guardar'
    return
  }

  try {
    const docRef = db.collection(getRepuestoCollPath(machineId)).doc(repuestoId)
    const reps = repCache[machineId] || []
    const idx = reps.findIndex(x => x.id === repuestoId)
    const before = idx >= 0 ? { ...reps[idx] } : null

    await docRef.update({
      ...updates,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    })

    // Actualizar cache local + invalidar búsqueda global
    if (idx >= 0) reps[idx] = { ...reps[idx], ...updates }
    invalidateRepuestosCache()

    await logAudit('update', getRepuestoCollPath(machineId), repuestoId, before, updates,
      `Editar repuesto ${updates.textoBreve || repuestoId}`)

    showToast('Cambios guardados ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')

    // Volver al detalle (in-place, sin apilar)
    editingRepuestoCtx = null
    openRepuesto(machineId, repuestoId, { fromSave: true })
  } catch(err){
    console.error('save error', err)
    showToast('Error al guardar: ' + (err.message || ''), 'err')
    tgApp?.HapticFeedback?.notificationOccurred('error')
    btn.disabled = false; btn.textContent = 'Guardar'
  }
}

async function saveNewRepuesto(machineId){
  if (userRole !== 'admin') return
  const btn = document.getElementById('btn-save-rep')
  btn.disabled = true; btn.textContent = 'Creando…'

  const updates = {}
  for (const [key, label, type] of EDIT_FIELDS){
    const inp = document.getElementById(`ef-${key}`)
    if (!inp) continue
    let v = inp.value
    if (type === 'number'){
      if (v === '' || v == null) continue   // skip vacíos en creación
      const n = Number(v)
      if (Number.isNaN(n)){
        showToast(`${label}: número inválido`, 'err')
        btn.disabled = false; btn.textContent = 'Crear'
        return
      }
      updates[key] = n
    } else {
      const trimmed = v.trim()
      if (trimmed) updates[key] = trimmed
    }
  }

  if (!updates.textoBreve){
    showToast('El nombre es obligatorio', 'err')
    btn.disabled = false; btn.textContent = 'Crear'
    return
  }
  if (!updates.codigoSAP){
    showToast('El código SAP es obligatorio', 'err')
    btn.disabled = false; btn.textContent = 'Crear'
    return
  }
  // Validar SAP único en este equipo
  const reps = repCache[machineId] || []
  if (reps.some(r => r.codigoSAP === updates.codigoSAP)){
    showToast(`SAP ${updates.codigoSAP} ya existe en este equipo`, 'err')
    btn.disabled = false; btn.textContent = 'Crear'
    return
  }

  try {
    const collPath = getRepuestoCollPath(machineId)
    const doc = {
      ...updates,
      createdBy: uid || '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      source: 'miniapp',
    }
    const ref = await db.collection(collPath).add(doc)
    if (!repCache[machineId]) repCache[machineId] = []
    repCache[machineId].push({ id: ref.id, ...updates })
    invalidateRepuestosCache()
    await logAudit('create', collPath, ref.id, null, doc, `Crear repuesto ${updates.textoBreve}`)

    tgApp?.HapticFeedback?.notificationOccurred('error')
    btn.disabled = false; btn.textContent = 'Crear'
  }

function compressImage(file, maxW = 1200, maxH = 1200, quality = 0.85){
  return new Promise((resolve, reject) => {
    const img = new Image()
    img.onload = () => {
      let { width, height } = img
      const ratio = Math.min(maxW/width, maxH/height, 1)
      width  = Math.round(width  * ratio)
      height = Math.round(height * ratio)
      const canvas = document.createElement('canvas')
      canvas.width = width
      canvas.height = height
      const ctx = canvas.getContext('2d')
      ctx.drawImage(img, 0, 0, width, height)
      canvas.toBlob(blob => {
        if (!blob) return reject(new Error('Compresión falló'))
        resolve({ blob, width, height })
      }, 'image/jpeg', quality)
    }
    img.onerror = () => reject(new Error('No se pudo leer la imagen'))
    const reader = new FileReader()
    reader.onload = e => { img.src = e.target.result }
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'))
    reader.readAsDataURL(file)
  })
}

async function uploadRepuestoPhoto(file, machineId, repuestoId){
  if (userRole !== 'admin') throw new Error('Solo admin puede subir fotos')
  if (!file.type.startsWith('image/')) throw new Error('Solo imágenes')
  if (file.size > 15 * 1024 * 1024) throw new Error('Imagen demasiado grande (>15MB)')

  showUploading('Optimizando imagen…')

  // Comprimir (skip GIF/SVG)
  let blob = file, width, height
  const skipOpt = ['image/gif','image/svg+xml'].includes(file.type)
  if (!skipOpt){
    try {
      const r = await compressImage(file, 1200, 1200, 0.85)
      blob = r.blob; width = r.width; height = r.height
    } catch(e){ console.warn('compress failed, using original', e) }
  }

  showUploading('Subiendo foto…')

  const timestamp = Date.now()
  const safeName = (file.name || 'photo.jpg').replace(/[^\w.\-]+/g, '_')
  const fileName = `${timestamp}_${safeName.endsWith('.jpg') || safeName.endsWith('.jpeg') ? safeName : safeName.replace(/\.[^.]+$/,'') + '.jpg'}`
  const path = `machines/${machineId}/repuestos/${repuestoId}/real/${fileName}`

  const ref = storage.ref(path)
  await ref.put(blob, { contentType: 'image/jpeg' })
  const url = await ref.getDownloadURL()

  const newImg = {
    id: String(timestamp),
    url,
    descripcion: '',
    orden: 0,
    esPrincipal: false,
    tipo: 'real',
    createdAt: new Date(),
    sizeOriginal: file.size,
    sizeFinal: blob.size,
    formatFinal: skipOpt ? 'original' : 'jpeg',
    qualityFinal: skipOpt ? undefined : 0.85,
    width, height,
  }

  showUploading('Guardando…')

  // Re-leer doc + escribir array completo (consistente con la PWA)
  const docRef = db.collection(`machines/${machineId}/repuestos`).doc(repuestoId)
  const snap = await docRef.get()
  const cur = snap.exists ? (snap.data().fotosReales || []) : []
  await docRef.update({
    fotosReales: [...cur, newImg],
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  })

  // Actualizar cache local
  const reps = repCache[machineId] || []
  const idx = reps.findIndex(x => x.id === repuestoId)
  if (idx >= 0){
    reps[idx] = { ...reps[idx], fotosReales: [...(reps[idx].fotosReales || []), newImg] }
  }

  return newImg
}

function setTgBack(handler){

  tgBackBtnHandler = handler

async function loadHierarchyTree(){
  const now = Date.now()
  if (__hierarchyCache && (now - __hierarchyCache.ts) < HIERARCHY_CACHE_TTL) return

  // 1) localStorage (sobrevive sesiones, evita read Firebase en cada apertura)
  const cached = lsGet(LS_KEY_HIERARCHY, LS_TTL_HIER)
  if (cached){
    rebuildHierarchyFromNodes(cached)
    __hierarchyCache = { ts: now }
    return
  }

  // 2) Firestore (con índice activo+nivel+orden)
  const snap = await db.collection('hierarchy')
    .where('activo','==',true)
    .orderBy('nivel','asc')
    .orderBy('orden','asc')
    .get()
  const nodes = snap.docs.map(d => ({ id: d.id, ...d.data() }))
  rebuildHierarchyFromNodes(nodes)
  lsSet(LS_KEY_HIERARCHY, normalizeForCache(nodes))
  __hierarchyCache = { ts: now }
}

function rebuildHierarchyFromNodes(nodes){
  hierarchyNodesMap = {}
  hierarchyChildrenMap = {}
  hierarchyRoots = []

  for (const n of nodes) hierarchyNodesMap[n.id] = n
  for (const n of nodes){
    const pid = n.parentId
    if (!pid || !hierarchyNodesMap[pid]) hierarchyRoots.push(n)
    else {
      if (!hierarchyChildrenMap[pid]) hierarchyChildrenMap[pid] = []
      hierarchyChildrenMap[pid].push(n)
    }
  }

  // Sintetizar machineMap para hojas sin máquina vinculada
  for (const n of nodes){
    const isLeaf = !(hierarchyChildrenMap[n.id]?.length > 0)
    if (!isLeaf || n.linkedMachineId || machineMap[n.id]) continue
    machineMap[n.id] = {
      id: n.id,
      nombre: n.nombre || 'Equipo',
      seccion: LEVEL_LABELS[n.nivel||7] || 'Equipo',
      hierarchyPath: Array.isArray(n.path) ? n.path.join(' › ') : '',
      descripcion: n.descripcion || '',
      _isHierarchyOnly: true,
      activa: true,
    }
  }
}

// Expande IDs de lista de favoritos hacia descendientes hierarchy.
// Si la lista contiene un machine con hierarchyNodeId, agrega también sus
// descendientes. Si contiene un nodo hierarchy, agrega sus descendientes.
function expandListIdsHierarchically(ids){
  const out = new Set(ids || [])
  if (!hierarchyNodesMap || !hierarchyChildrenMap) return out
  const seedNodeIds = []
  for (const id of ids || []){
    if (hierarchyNodesMap[id]) seedNodeIds.push(id)
    const m = machineMap[id]
    if (m?.hierarchyNodeId && hierarchyNodesMap[m.hierarchyNodeId]){
      seedNodeIds.push(m.hierarchyNodeId)
      out.add(m.hierarchyNodeId)
    }
  }
  // BFS desde cada seed: agrega todos los descendientes y los machines vinculados
  const queue = [...seedNodeIds]
  const visited = new Set(seedNodeIds)
  while (queue.length){
    const nodeId = queue.shift()
    out.add(nodeId)
    // Machines vinculadas al nodeId
    for (const mid of Object.keys(machineMap)){
      if (machineMap[mid]?.hierarchyNodeId === nodeId) out.add(mid)
    }
    const children = hierarchyChildrenMap[nodeId] || []
    for (const child of children){
      if (visited.has(child.id)) continue
      visited.add(child.id)
      queue.push(child.id)
    }
  }
  return out
}

// Path jerárquico de un equipo: "PROCESO › EVISCERADO › CINTAS PP › ..."
// Retorna { path: string, nodeId: string|null } — nodeId solo si está en hierarchy
function getEquipoPath(machineId){
  const m = machineMap[machineId]
  // Caso 1: machine con hierarchyPath cacheado
  if (m?.hierarchyPath){
    return { path: m.hierarchyPath, nodeId: m.hierarchyNodeId || null, name: m.nombre }
  }
  // Caso 2: nodo hierarchy puro
  const node = hierarchyNodesMap?.[machineId]
  if (node){
    const stack = buildHierStackForNode(node)
    return { path: stack.map(s => s.nombre).join(' › '), nodeId: node.id, name: node.nombre }
  }
  // Caso 3: machine vinculada a hierarchy via hierarchyNodeId
  if (m?.hierarchyNodeId && hierarchyNodesMap?.[m.hierarchyNodeId]){
    const stack = buildHierStackForNode(hierarchyNodesMap[m.hierarchyNodeId])
    return { path: stack.map(s => s.nombre).join(' › '), nodeId: m.hierarchyNodeId, name: m.nombre }
  }
  return { path: m?.nombre || '', nodeId: null, name: m?.nombre || '' }
}

function getRepuestoCollPath(machineId){
  const m = machineMap[machineId]
  // Si el id corresponde a un nodo hierarchy (puro o vinculado), los repuestos
  // propios viven en hierarchy/{id}/repuestos. Cubre el caso 'CINTA ACELERACION 1
  // BALANZA ESTATICA' que no está en machines pero sí en hierarchy.
  if (m?._isHierarchyOnly) return `hierarchy/${machineId}/repuestos`
  if (!m && hierarchyNodesMap?.[machineId]) return `hierarchy/${machineId}/repuestos`
  return `machines/${machineId}/repuestos`
}

function isEquipNode(node){
  return !(hierarchyChildrenMap[node.id]?.length > 0)
}

function countEquipDescendants(nodeId){
  const children = hierarchyChildrenMap[nodeId] || []
  if (!children.length) return 1
  let c = 0
  for (const ch of children) c += isEquipNode(ch) ? 1 : countEquipDescendants(ch.id)
  return c
}

async function renderHierarchyTab(){
  const el = document.getElementById('view-hierarchy')
  if (!el) return
  el.innerHTML = skeletonCells(6)
  try {
    await loadHierarchyTree()
  } catch(err){
    console.error('hierarchy load failed', err)
    const msg = err?.code === 'failed-precondition'
      ? 'Falta un índice en Firestore. Avisá a un admin.'
      : (err?.message || 'No se pudo cargar la jerarquía. Revisá tu conexión.')
    el.innerHTML = `
      <div style="padding:32px 20px;text-align:center">
        ${emptyHtml('⚠️','Error al cargar', escHtml(msg))}
        <button class="upload-btn" style="margin-top:16px;max-width:200px"
          onclick="renderHierarchyTab()">↻ Reintentar</button>
      </div>`
    return
  }
  if (hierarchyRoots.length === 0){
    el.innerHTML = `<div style="padding:32px 20px;text-align:center">
      ${emptyHtml('🌳','Jerarquía vacía','Aún no hay nodos cargados. Pídele al admin que cargue planta/áreas/equipos en la PWA.')}
    </div>`
    return
  }
  renderHierarchyLevel()
}

function renderHierarchyLevel(){
  const el = document.getElementById('view-hierarchy')
  if (!el) return

  const currentId = hierarchyStack.length ? hierarchyStack[hierarchyStack.length-1].id : null
  const allNodes = currentId ? (hierarchyChildrenMap[currentId] || []) : hierarchyRoots

  // Breadcrumb
  const breadHtml = `
    <div class="hier-breadcrumb">
      <button class="hier-bread-item${!currentId?' active':''}" onclick="hierarchyGoTo(-1)">🌳 Planta</button>
      ${hierarchyStack.map((item,i) => `
        <span class="hier-bread-sep">›</span>
        <button class="hier-bread-item${i===hierarchyStack.length-1?' active':''}"
          onclick="hierarchyGoTo(${i})">${escHtml(item.nombre)}</button>
      `).join('')}
    </div>`

  const nodes = allNodes
  if (!nodes.length){
    el.innerHTML = breadHtml + emptyHtml('🔧','Sin elementos','Este nodo no tiene sub-elementos.')
    return
  }

  const nodesHtml = nodes.map(node => {
    const isEquip = isEquipNode(node)
    const nivel = node.nivel || 1
    const levelLabel = LEVEL_LABELS[nivel] || `N${nivel}`
    const levelColor = LEVEL_COLORS[nivel] || '#888'
    const linkedMachine = machines.find(m => m.hierarchyNodeId === node.id)
    const children = hierarchyChildrenMap[node.id] || []

    let subHtml
    if (isEquip){
      const repCount = linkedMachine && repCache[linkedMachine.id]
        ? repCache[linkedMachine.id].length : (node.repuestoCount ?? '…')
      subHtml = `${node.codigo ? escHtml(node.codigo)+' · ' : ''}${repCount} rep`
    } else {
      const equipCount = countEquipDescendants(node.id)
      subHtml = `${pl(children.length,'sub-nodo','sub-nodos')} · ${pl(equipCount,'equipo','equipos')}`
    }

    const addBtn = userRole==='admin' ? `
      <button class="cell-action-btn"
        onclick="event.stopPropagation();openHierAddToListSheet('${escHtmlAttr(node.id)}',${isEquip})"
        title="Agregar a lista">＋</button>` : ''

    const onclick = isEquip
      ? `hierarchyOpenEquip('${escHtmlAttr(node.id)}','${escHtmlAttr(linkedMachine?.id||'')}')`
      : `hierarchyEnter('${escHtmlAttr(node.id)}','${escHtmlAttr(node.nombre||'')}')`

    return `
      <div class="cell" onclick="${onclick}">
        <div class="cell-icon" style="background:${levelColor}22;color:${levelColor}">
          ${isEquip?'⚙️':'📁'}
        </div>
        <div class="cell-body">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <div class="cell-title">${escHtml(node.nombre||'Sin nombre')}</div>
            <span class="level-chip" style="background:${levelColor}22;color:${levelColor}">${levelLabel}</span>
          </div>
          <div class="cell-sub">${subHtml}</div>
        </div>
        ${addBtn}
        ${isEquip?'':'<div class="cell-chevron">›</div>'}
      </div>`
  }).join('')

  const adminAddBtn = userRole==='admin' ? `
    <div style="padding:10px 16px 4px">
      <button class="btn-add-node" onclick="openAddHierNodeModal('${escHtmlAttr(currentId||'')}')">
        + Agregar nodo aquí
      </button>
    </div>` : ''

  el.innerHTML = `
    ${breadHtml}
    <div class="cell-group" style="margin-top:8px">${nodesHtml}</div>
    ${adminAddBtn}`
}

function hierarchyEnter(nodeId, nombre){
  hierarchyStack.push({id:nodeId, nombre})
  tgApp?.HapticFeedback?.selectionChanged?.()
  setTgBack(hierarchyGoBack)
  renderHierarchyLevel()
  getContent().scrollTop = 0
}

function hierarchyGoBack(){
  hierarchyStack.pop()
  tgApp?.HapticFeedback?.selectionChanged?.()
  if (!hierarchyStack.length) setTgBack(null)
  renderHierarchyLevel()
  getContent().scrollTop = 0
}

function hierarchyGoTo(stackIdx){
  hierarchyStack = stackIdx < 0 ? [] : hierarchyStack.slice(0, stackIdx+1)
  tgApp?.HapticFeedback?.selectionChanged?.()
  setTgBack(hierarchyStack.length ? hierarchyGoBack : null)
  renderHierarchyLevel()
  getContent().scrollTop = 0
}

// Refrescar datos manualmente — invalida todas las caches y recarga
async function refreshAllData(){
  if (!await new Promise(res => tgApp?.showConfirm
    ? tgApp.showConfirm('¿Refrescar datos? Volverá a leer todo de Firebase.', res)
    : res(confirm('¿Refrescar datos? Volverá a leer todo de Firebase.')))) return
  invalidateRepuestosCache()
  __manualesCache = null; __manualesCacheTs = 0
  __hierarchyCache = null
  hierarchyNodesMap = {}; hierarchyChildrenMap = {}; hierarchyRoots = []
  // Limpiar entries sintéticas (las que tenían _isHierarchyOnly)
  for (const k of Object.keys(machineMap)){
    if (machineMap[k]?._isHierarchyOnly) delete machineMap[k]
  }
  repCache = {}
  lsClearAll()
  showToast('Datos refrescados ✓', 'ok')
  tgApp?.HapticFeedback?.notificationOccurred('success')
  // Re-renderizar el tab actual
  if (currentTab === 'hierarchy') renderHierarchyTab()
  else if (currentTab === 'manuales') renderManualesTab()
  else renderHome()
}

function hierarchyOpenEquip(nodeId, machineId){
  tgApp?.HapticFeedback?.selectionChanged?.()
  if (machineId && machineMap[machineId]) openMachine(machineId)
  else openHierarchyEquipment(nodeId)
}

async function openHierarchyEquipment(nodeId){
  const node = hierarchyNodesMap[nodeId]
  if (!node) return
  // Asegurar entry sintética en machineMap (loadHierarchyTree ya la crea, pero
  // por si esta función se llama antes de cargar el árbol completo)
  if (!machineMap[nodeId]){
    machineMap[nodeId] = {
      id: nodeId,
      nombre: node.nombre || 'Equipo',
      seccion: LEVEL_LABELS[node.nivel||7] || 'Equipo',
      hierarchyPath: Array.isArray(node.path) ? node.path.join(' › ') : '',
      descripcion: node.descripcion || '',
      _isHierarchyOnly: true,
      activa: true,
    }
  }
  return openMachine(nodeId)
}

// ── F2.3 — Agregar nodo a lista de equipos ──────────────────────────

function openHierAddToListSheet(nodeId, isEquip){
  if (userRole !== 'admin') return
  hierSheetNodeId = nodeId
  hierSheetIsEquip = isEquip

  const title = document.getElementById('sheet-title')
  const content = document.getElementById('sheet-content')
  const node = hierarchyNodesMap[nodeId]

  title.textContent = isEquip ? `Agregar "${node?.nombre||'equipo'}" a lista` : `Agregar área a lista de equipos`

  const lists = prefs.favoriteLists || []
  const listsHtml = lists.map((list,i) => {
    const inList = list.machineIds?.includes(nodeId)
    return `
      <div class="sheet-row${inList?' on':''}" onclick="hierAddToList(${i})">
        <div class="ico">${inList?'✅':'📋'}</div>
        <div class="body">
          <div class="name">${escHtml(list.name)}</div>
          <div class="sub">${pl(list.machineIds?.length||0,'equipo','equipos')}</div>
        </div>
        ${inList?'<div class="check">✓</div>':''}
      </div>`
  }).join('')

  content.innerHTML = (lists.length ? listsHtml : '<div class="sheet-empty">Aún no tenés listas de equipos. Creá la primera.</div>') + `
    <div class="sheet-new" onclick="hierCreateListAndAdd()">
      <span style="font-size:20px">＋</span> Nueva lista de equipos
    </div>`

  favSheetCtx = null  // limpiamos ctx de repuestos para que closeSheet no confunda
  document.getElementById('sheet-overlay').classList.add('open')
  requestAnimationFrame(() => document.getElementById('sheet').classList.add('open'))
  tgApp?.HapticFeedback?.impactOccurred('light')
}

async function hierAddToList(listIdx){
  const list = prefs.favoriteLists[listIdx]
  if (!list) return
  const nodeId = hierSheetNodeId

  // Recolectar IDs a agregar
  let idsToAdd = [nodeId]
  if (!hierSheetIsEquip){
    function collectLeaves(nid){
      const ch = hierarchyChildrenMap[nid] || []
      if (!ch.length) return [nid]
      return ch.flatMap(c => isEquipNode(c) ? [c.id] : collectLeaves(c.id))
    }
    idsToAdd = collectLeaves(nodeId)
    const newCount = idsToAdd.filter(id => !_listContainsId(list, id)).length
    if (!newCount){ showToast('Todos ya están en la lista','ok'); closeSheet(); return }
    const ok = await new Promise(res => tgApp?.showConfirm(
      `¿Agregar ${pl(idsToAdd.length,'equipo','equipos')} a "${list.name}"?`, res))
    if (!ok){ closeSheet(); return }
  }

  // Si la lista tiene sub-listas → preguntar destino
  const subLists = list.subLists || []
  if (subLists.length > 0){
    hierShowSubListPicker(list, listIdx, idsToAdd)
    return
  }

  // Sin sub-listas → agregar directo al nivel raíz
  _hierDoAddToList(list, idsToAdd, null)
}

/** Devuelve true si el machineId ya está en la lista (raíz o sub-listas) */
function _listContainsId(list, id){
  if ((list.machineIds || []).includes(id)) return true
  return (list.subLists || []).some(sl =>
    (sl.machineIds || []).includes(id) ||
    (sl.subLists || []).some(ssl => (ssl.machineIds || []).includes(id))
  )
}

/** Sheet secundario: elegir sub-lista destino */
function hierShowSubListPicker(list, listIdx, idsToAdd){
  const subLists = list.subLists || []
  const title = document.getElementById('sheet-title')
  const content = document.getElementById('sheet-content')
  title.textContent = `¿En qué parte de "${list.name}"?`
  content.innerHTML = `
    <div class="cell-group" style="margin:0">
      <div class="sheet-row" onclick="hierDoAddToSubList(${listIdx},null,${JSON.stringify(idsToAdd)})">
        <div class="ico">📋</div>
        <div class="body"><div class="name">Sin categoría</div>
          <div class="sub">Nivel raíz de la lista</div></div>
      </div>
      ${subLists.map((sl, si) => `
        <div class="sheet-row" onclick="hierDoAddToSubList(${listIdx},${si},${escHtmlAttr(JSON.stringify(idsToAdd))})">
          <div class="ico">📁</div>
          <div class="body"><div class="name">${escHtml(sl.name)}</div>
            <div class="sub">${pl(sl.machineIds?.length||0,'equipo','equipos')}</div></div>
        </div>`).join('')}
    </div>`
}

async function hierDoAddToSubList(listIdx, subListIdx, idsToAdd){
  const list = prefs.favoriteLists[listIdx]
  if (!list) return
  await _hierDoAddToList(list, idsToAdd, subListIdx)
}

async function _hierDoAddToList(list, idsToAdd, subListIdx){
  if (subListIdx != null && subListIdx >= 0){
    // Agregar a una sub-lista específica
    const sl = list.subLists[subListIdx]
    if (!sl) return
    // Agregar a la sub-lista
    const existingSl = new Set(sl.machineIds || [])
    for (const id of idsToAdd) existingSl.add(id)
    sl.machineIds = [...existingSl]
    // TAMBIÉN agregar a list.machineIds (unión total → compatibilidad PWA)
    const existingTop = new Set(list.machineIds || [])
    for (const id of idsToAdd) existingTop.add(id)
    list.machineIds = [...existingTop]
    closeSheet()
    showToast(`Agregado a "${sl.name}" ✓`, 'ok')
  } else {
    // Agregar al nivel raíz (Sin categoría)
    const existing = new Set(list.machineIds || [])
    for (const id of idsToAdd) existing.add(id)
    list.machineIds = [...existing]
    closeSheet()
    showToast(`Agregado a "${list.name}" ✓`, 'ok')
  }
  tgApp?.HapticFeedback?.notificationOccurred('success')
  saveAllPrefs().catch(err => console.error('saveAllPrefs:', err))
}

function hierCreateListAndAdd(){
  closeSheet()
  showInputModal('Nueva lista de equipos','','Nombre (ej: Bombas y motores)', async name => {
    if (!name?.trim()) return
    const newList = { name: name.trim(), machineIds: [hierSheetNodeId] }
    prefs.favoriteLists = [...(prefs.favoriteLists||[]), newList]
    await saveAllPrefs()
    showToast(`Lista "${newList.name}" creada ✓`, 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    if (currentTab === 'home') renderHome()
  })
}

function openAddHierNodeModal(parentId){
  if (userRole !== 'admin') return
  showInputModal('Nuevo nodo','','Nombre del área o equipo', async name => {
    if (!name?.trim()) return
    try {
      const parent = parentId ? hierarchyNodesMap[parentId] : null
      const nivel = parent ? ((parent.nivel||1)+1) : 1
      const codigo = name.trim().toUpperCase().replace(/\s+/g,'-').slice(0,20)
      await db.collection('hierarchy').add({
        nombre: name.trim(), codigo, nivel,
        parentId: parentId||null, activo: true, orden: 999,
        creadoPor: uid, creadoEn: firebase.firestore.FieldValue.serverTimestamp()
      })
      __hierarchyCache = null
      showToast('Nodo creado ✓','ok')
      tgApp?.HapticFeedback?.notificationOccurred('success')
      await renderHierarchyTab()
    } catch(err){
      showToast('Error al crear: '+(err.message||''),'err')
    }
  })
}

// ── F2.5 — Audit log ────────────────────────────────────────────────

async function logAudit(action, collection, documentId, before, after, label){
  try {
    await db.collection('audit_log').add({
      action, collection, documentId,
      documentLabel: label||documentId,
      userId: uid, userName: firstName||'tg_user',
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      before: before||null, after: after||null,
      metadata: { source: 'miniapp' }
    })
  } catch(e){ console.warn('audit_log fail',e) }
}
