async function saveManual(){
  const btn      = document.getElementById('btn-save-manual')
  const titulo   = document.getElementById('mup-titulo')?.value?.trim()
  const ownerType= document.getElementById('mup-owner-type')?.value
  const ownerId  = document.getElementById('mup-owner-id')?.value?.trim()
  const ownerName= document.getElementById('mup-owner-name')?.value?.trim()
  const tipo     = document.getElementById('mup-tipo')?.value
  const desc     = document.getElementById('mup-desc')?.value?.trim()

  if (!titulo)  { showToast('El título es obligatorio', 'err'); return }
  if (!ownerId) { showToast('Seleccioná un propietario', 'err'); return }

  btn.disabled = true; btn.textContent = 'Subiendo…'

  const isFile = tipo === 'pdf' || tipo === 'imagen'
  let url = '', storagePath = null, fileSize = null, mimeType = null

  if (isFile){
    const file = document.getElementById('mup-file')?.files?.[0]
    if (!file){ showToast('Seleccioná un archivo', 'err'); btn.disabled=false; btn.textContent='Subir'; return }
    if (file.size > 50*1024*1024){ showToast('Archivo demasiado grande (máx. 50 MB)', 'err'); btn.disabled=false; btn.textContent='Subir'; return }
    fileSize = file.size; mimeType = file.type
    const fname = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`
    storagePath = `manuales/${ownerType}/${ownerId}/${fname}`
    document.getElementById('mup-progress').style.display = 'block'
    try {
      const ref = storage.ref(storagePath)
      const task = ref.put(file)
      await new Promise((res, rej) => {
        task.on('state_changed',
          s => {
            const pct = Math.round(s.bytesTransferred / s.totalBytes * 100)
            const bar = document.getElementById('mup-progress-bar')
            const txt = document.getElementById('mup-progress-text')
            if (bar) bar.style.width = pct + '%'
            if (txt) txt.textContent = `Subiendo… ${pct}%`
          },
          rej, res)
      })
      url = await ref.getDownloadURL()
    } catch(e){
      showToast('Error al subir: ' + (e.message||''), 'err')
      btn.disabled=false; btn.textContent='Subir'
      document.getElementById('mup-progress').style.display='none'
      return
    }
  } else {
    url = document.getElementById('mup-url')?.value?.trim()
    if (!url){ showToast('Ingresá una URL válida', 'err'); btn.disabled=false; btn.textContent='Subir'; return }
  }

  try {
    const doc = {
      ownerType, ownerId,
      ownerPath: ownerName ? [ownerName] : [],
      titulo, tipo, url,
      ...(storagePath && { storagePath }),
      ...(fileSize   && { fileSize }),
      ...(mimeType   && { mimeType }),
      descripcion: desc || '',
      createdBy: uid || '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      source: 'miniapp',
    }
    const ref = await db.collection('manuales').add(doc)
    await logAudit('create','manuales',ref.id,null,doc,`Subir manual: ${titulo}`)
    __manualesCache = null; __manualesCacheTs = 0
    try { localStorage.removeItem(LS_KEY_MANUALES) } catch {}
    showToast(`"${titulo}" subido ✓`, 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
    setTgBack(null)
    renderManualesTab()
  } catch(e){
    showToast('Error al guardar: ' + (e.message||''), 'err')
    btn.disabled=false; btn.textContent='Subir'
  }
}

function pushView(viewId, title, subtitle){
  const c = getContent()
  const prevId = document.querySelector('.view.active')?.id || `view-${currentTab}`
  // Si vamos de view-machine a view-machine (listas anidadas), guardamos snapshot
  // del HTML + header para restaurarlo correctamente al volver
  let snapshot = null
  if (prevId === 'view-machine' && viewId === 'view-machine'){
    const prevEl = document.getElementById('view-machine')
    snapshot = {
      html:     prevEl?.innerHTML || '',
      title:    document.getElementById('hdr-title')?.textContent || '',
      subtitle: document.getElementById('hdr-sub')?.textContent  || '',
    }
  }
  navStack.push({viewId: prevId, scrollTop: c.scrollTop, snapshot})
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'))
  document.getElementById(viewId).classList.add('active')
  setHeader(title, subtitle, true)
  c.scrollTop = 0
}

function goBack(){
  // Si estamos editando un repuesto, back = cancelar edición (no salir del detalle)
  if (editingRepuestoCtx){
    const { machineId, repuestoId } = editingRepuestoCtx
    editingRepuestoCtx = null
    openRepuesto(machineId, repuestoId, { fromSave: true })
    return
  }
  if (navStack.length === 0) return
  const prev = navStack.pop()
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'))
  document.getElementById(prev.viewId).classList.add('active')
  // Si hay snapshot guardado, restaurar HTML + header de view-machine
  if (prev.snapshot && prev.viewId === 'view-machine'){
    document.getElementById('view-machine').innerHTML = prev.snapshot.html
    setHeader(prev.snapshot.title, prev.snapshot.subtitle, navStack.length > 0)
  } else if (navStack.length === 0){
    tabHeader(currentTab)
  }
  activeUploadCtx = null
  // Ocultar botones ✏️ ⭐ si volvemos a una vista que no es de repuesto
  if (prev.viewId !== 'view-repuesto'){
    document.getElementById('hdr-edit').style.display = 'none'
    document.getElementById('hdr-fav').style.display = 'none'
  }
  // Restore scroll
  requestAnimationFrame(() => { getContent().scrollTop = prev.scrollTop || 0 })
}

tgApp?.BackButton?.onClick(() => { if (!tgBackBtnHandler && navStack.length) goBack() })

async function loadInsumos(){
  if (__insumosCache && Date.now() - __insumosCacheTs < INSUMOS_CACHE_TTL) return __insumosCache
  // localStorage hit
  if (!__insumosCache){
    const cached = lsGet(LS_KEY_INSUMOS, INSUMOS_LS_TTL)
    if (cached){
      __insumosCache = cached
      __insumosCacheTs = Date.now()
      return cached
    }
  }
  const snap = await db.collection('insumos').get()
  const out = snap.docs.map(d => ({ id: d.id, ...d.data() }))
  __insumosCache   = out
  __insumosCacheTs = Date.now()
  try { lsSet(LS_KEY_INSUMOS, normalizeForCache(out)) } catch {}
  return out
}

        ${emptyHtml('⚠️','Error al cargar', escHtml(e?.message || 'Verifica tu conexión'))}
        <button class="upload-btn" style="margin-top:16px;max-width:200px"
          onclick="renderInsumosTab()">↻ Reintentar</button>
      </div>`
  }
}

function insumosSearchInput(){
  clearTimeout(insumosSearchTimer)
  insumosSearchTimer = setTimeout(() => {
    if (__insumosCache) renderInsumosBody(__insumosCache)
  }, 150)
}

function setInsumosFamiliaFilter(fam){
  insumosFamiliaFilter = (insumosFamiliaFilter === fam) ? null : fam
  if (__insumosCache) renderInsumosBody(__insumosCache)
}

function setInsumosStatusFilter(st){
  insumosStatusFilter = st
  if (__insumosCache) renderInsumosBody(__insumosCache)
}

function toggleInsumosStockOnly(){
  insumosStockOnly = !insumosStockOnly
  if (__insumosCache) renderInsumosBody(__insumosCache)
}

function toggleInsumosBajoOnly(){
  insumosBajoOnly = !insumosBajoOnly
  if (__insumosCache) renderInsumosBody(__insumosCache)
}

function renderInsumosBody(items){
  const listEl = document.getElementById('insumos-list')
  const famEl  = document.getElementById('insumos-fam-chips')
  const stEl   = document.getElementById('insumos-status-chips')
  const cntEl  = document.getElementById('insumos-count')
  if (!listEl) return

  // Familia chips (top 6 + Más…)
  if (famEl){
    const fams = {}
    items.forEach(i => { fams[i.familia] = (fams[i.familia]||0) + 1 })
    const top = Object.entries(fams).sort((a,b) => b[1]-a[1])
    famEl.innerHTML = `<div class="chips" style="padding:0 12px 6px">
      <div class="chip ${insumosFamiliaFilter===null?'active':''}" onclick="setInsumosFamiliaFilter(null)">
        Todas <span class="count">${items.length}</span></div>
      ${top.map(([f,n]) =>
        `<div class="chip ${insumosFamiliaFilter===f?'active':''}" onclick="setInsumosFamiliaFilter('${escHtmlAttr(f)}')">
          ${escHtml(FAMILIA_LABELS_INS[f] || f)} <span class="count">${n}</span></div>`).join('')}
    </div>`
  }

  // Status chips + stock toggle + bajo mínimo
  if (stEl){
    // Bajo-mínimo coherente con status actual: cuenta lo que va a quedar visible
    const bajoCount = items.filter(i =>
      i.stockFisico != null && i.stockMinimo != null && i.stockFisico < i.stockMinimo
      && (insumosStatusFilter === 'all' || i.status === insumosStatusFilter),
    ).length
    stEl.innerHTML = `<div class="chips" style="padding:0 12px 6px">
      <div class="chip ${insumosStatusFilter==='all'?'active':''}" onclick="setInsumosStatusFilter('all')">Todos</div>
      <div class="chip ${insumosStatusFilter==='activo'?'active':''}" onclick="setInsumosStatusFilter('activo')">Activos</div>
      <div class="chip ${insumosStatusFilter==='obsoleto'?'active':''}" onclick="setInsumosStatusFilter('obsoleto')">Obsoletos</div>
      <div class="chip ${insumosStockOnly?'active':''}" onclick="toggleInsumosStockOnly()">Con stock</div>
      ${bajoCount ? `<div class="chip ${insumosBajoOnly?'active':''}" onclick="toggleInsumosBajoOnly()" style="border-color:${insumosBajoOnly?'#ef4444':'rgba(239,68,68,.4)'};color:${insumosBajoOnly?'#fff':'#ef4444'};${insumosBajoOnly?'background:#ef4444':''}">⚠️ Bajo mín. <span class="count">${bajoCount}</span></div>` : ''}
    </div>`
  }

  // Listas favoritas chips (solo si hay listas)
  const listasEl = document.getElementById('insumos-listas-chips')
  const listas = getInsumoFavLists()
  if (listasEl){
    if (listas.length){
      listasEl.innerHTML = `<div class="chips" style="padding:0 12px 6px">
        ${listas.map(l => `
          <div class="chip ${insumosListaFilter===l.name?'active':''}" onclick="setInsumosListaFilter(${escHtmlAttr(JSON.stringify(l.name))})">
            ⭐ ${escHtml(l.name)} <span class="count">${(l.codigosSAP||[]).length}</span>
          </div>`).join('')}
      </div>`
    } else {
      listasEl.innerHTML = ''
    }
  }

  // Filtrado
  const q = normalizeSearch(document.getElementById('insumos-search')?.value || '')
  let filtered = items
  if (insumosFamiliaFilter) filtered = filtered.filter(i => i.familia === insumosFamiliaFilter)
  if (insumosStatusFilter !== 'all') filtered = filtered.filter(i => i.status === insumosStatusFilter)
  if (insumosStockOnly) filtered = filtered.filter(i => (i.stockFisico ?? 0) > 0)
  if (insumosBajoOnly) filtered = filtered.filter(i => i.stockFisico != null && i.stockMinimo != null && i.stockFisico < i.stockMinimo)
  if (insumosListaFilter){
    const list = listas.find(l => l.name === insumosListaFilter)
    const set = new Set(list?.codigosSAP || [])
    filtered = filtered.filter(i => set.has(i.codigoSAP))
  }
  if (q){
    filtered = filtered.filter(i =>
      normalizeSearch(i.codigoSAP).includes(q)
      || normalizeSearch(i.textoBreve).includes(q)
      || normalizeSearch(i.subFamilia).includes(q)
      || normalizeSearch(i.ubicacion).includes(q),
    )
  }

  if (cntEl) cntEl.textContent = `${filtered.length.toLocaleString('es-CL')} de ${items.length.toLocaleString('es-CL')}`

  if (filtered.length === 0){
    listEl.innerHTML = emptyHtml('🔍','Sin resultados','Ajusta los filtros o búsqueda')
    return
  }

  // Render — primeros 200 para evitar lag (3431 items)
  const LIMIT = 200
  const slice = filtered.slice(0, LIMIT)
  listEl.innerHTML = `
    <div style="padding:0 8px">
      ${slice.map(i => insumoRowHtml(i)).join('')}
    </div>
    ${filtered.length > LIMIT ? `
      <div style="padding:12px;text-align:center;color:var(--sub);font-size:12px">
        Mostrando primeros ${LIMIT}. Refina la búsqueda para ver más específicos.
      </div>` : ''}`
}

  const stockReal = i.stockFisico
  const bajoMin = stockReal != null && i.stockMinimo != null && stockReal < i.stockMinimo
  const stockBadge = stockReal != null
    ? `<span style="font-weight:700;color:${bajoMin?'#ef4444':'var(--text)'}">${stockReal}</span> ${i.unidadMedida || ''}`
    : `<span style="color:var(--sub);font-size:11px">—</span>`
  const obsoletoBadge = i.status === 'obsoleto'
    ? `<span style="font-size:9px;background:#ef4444;color:#fff;padding:1px 5px;border-radius:3px;font-weight:700;letter-spacing:.3px">OBSOLETO</span>`
    : ''
  const trasladarBadge = i.status === 'trasladar'
    ? `<span style="font-size:9px;background:var(--sub);color:#fff;padding:1px 5px;border-radius:3px;font-weight:700;letter-spacing:.3px">TRASLADAR</span>`
    : ''
  const bajoBadge = bajoMin
    ? `<span style="font-size:9px;background:#f59e0b;color:#fff;padding:1px 5px;border-radius:3px;font-weight:700;letter-spacing:.3px">BAJO</span>`
    : ''
  const ubic = i.ubicacion ? `<span style="font-family:monospace;font-size:11px;color:var(--sub)">📍 ${escHtml(i.ubicacion)}</span>` : ''
  const alm = i.almacen ? `<span style="font-family:monospace;font-size:11px;color:var(--sub)">🏬 ${escHtml(i.almacen)}</span>` : ''

  return `
    <div onclick="openInsumoDetail('${escHtmlAttr(i.id)}')"
         style="padding:10px 12px;margin:4px 0;background:var(--card);border:1px solid var(--border);
                border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:flex-start">
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:2px">
          <code style="font-size:11px;font-weight:700;color:var(--accent)">${escHtml(i.codigoSAP)}</code>
          <span style="font-size:10px;color:var(--sub)">${escHtml(FAMILIA_LABELS_INS[i.familia] || i.familia)}</span>
          ${i.subFamilia ? `<span style="font-size:10px;background:var(--border);padding:1px 6px;border-radius:3px">${escHtml(i.subFamilia)}</span>` : ''}
          ${obsoletoBadge}${trasladarBadge}${bajoBadge}
        </div>
        <div style="font-size:13px;line-height:1.3">${escHtml(i.textoBreve)}</div>
        <div style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap">${ubic}${alm}</div>
      </div>
      <div style="text-align:right;min-width:60px">${stockBadge}</div>
    </div>`
}

        ${item.existeEnRepuestos ? `<span style="font-size:10px;background:var(--border);padding:2px 8px;border-radius:4px">también en Repuestos</span>` : ''}
      </div>
      <h3 style="font-size:15px;margin:0 0 4px;line-height:1.3">${escHtml(item.textoBreve)}</h3>

        ${detailRow('Sub-familia', item.subFamilia || '—')}

        ${detailRow('Ubicación física', item.ubicacionFisica || '—')}
        ${detailRow('Almacén', item.almacen || '—', true)}
        ${detailRow('Unidad', item.unidadMedida || '—', true)}

function detailRow(label, value, mono){

// ── F5b — Listas de favoritos transversales ───────────────────────────
// Modelo: prefs.insumoFavLists = [{name: string, codigosSAP: string[]}]
// Sin machineId/nodeId — los insumos son transversales a toda la planta.

let insumoFavSheetCtx = null   // { codigoSAP } cuando abrimos el sheet de listas
let insumosListaFilter = null  // nombre de lista activa como filtro en el tab

function getInsumoFavLists(){
  return Array.isArray(prefs.insumoFavLists) ? prefs.insumoFavLists : []
}

function isInsumoInList(list, codigoSAP){
  return Array.isArray(list?.codigosSAP) && list.codigosSAP.includes(codigoSAP)
}

async function openInsumoFavListsSheet(codigoSAP){
  // codigoSAP === null → modo gestión (ver/crear/renombrar/borrar sin toggle)
  // codigoSAP === string → modo guardado (toggle ese SAP en cada lista)
  insumoFavSheetCtx = { codigoSAP }
  const lists = getInsumoFavLists()
  const sheet = document.getElementById('sheet')
  const overlay = document.getElementById('sheet-overlay')
  const isManageMode = codigoSAP == null
  document.getElementById('sheet-title').textContent = isManageMode ? 'Mis listas de insumos' : 'Guardar en lista'

  const content = document.getElementById('sheet-content')
  if (lists.length === 0){
    content.innerHTML = `<div class="sheet-empty">Aún no tenés listas de insumos.<br>Creá la primera abajo.</div>`
  } else {
    content.innerHTML = lists.map(l => {
      const isIn = isManageMode ? false : isInsumoInList(l, codigoSAP)
      const rowOnclick = isManageMode
        ? `onclick="closeSheet();setTimeout(()=>{setInsumosListaFilter(${escHtmlAttr(JSON.stringify(l.name))})},250)"`
        : `onclick="toggleInsumoInFavList(${escHtmlAttr(JSON.stringify(l.name))})"`
      return `<div class="sheet-row ${isIn ? 'on' : ''}" ${rowOnclick}>
        <div class="ico">📋</div>
        <div class="body">
          <div class="name">${escHtml(l.name)}</div>
          <div class="sub">${(l.codigosSAP || []).length} insumo(s)${isManageMode ? ' · tocá para filtrar' : ''}</div>
        </div>
        <button class="edit-btn" style="display:flex;width:30px;height:30px;font-size:13px"
          onclick="event.stopPropagation();renameInsumoFavList(${escHtmlAttr(JSON.stringify(l.name))})" aria-label="Renombrar">✏️</button>
        <button class="edit-btn" style="display:flex;width:30px;height:30px;font-size:13px;background:rgba(229,57,53,.14)"
          onclick="event.stopPropagation();deleteInsumoFavList(${escHtmlAttr(JSON.stringify(l.name))})" aria-label="Borrar">🗑️</button>
        ${isManageMode ? '' : '<div class="check">✓</div>'}
      </div>`
    }).join('')
  }
  content.innerHTML += `<div class="sheet-new" onclick="createInsumoFavList()">
    <span style="font-size:20px">＋</span> Nueva lista de insumos${isManageMode ? ' (vacía)' : ''}
  </div>`

  overlay.classList.add('open')
  requestAnimationFrame(() => sheet.classList.add('open'))
}

async function toggleInsumoInFavList(listName){
  if (!insumoFavSheetCtx) return
  const { codigoSAP } = insumoFavSheetCtx
  const lists = getInsumoFavLists()
  let list = lists.find(l => l.name === listName)
  if (!list){
    list = { name: listName, codigosSAP: [] }
    lists.push(list)
  }
  if (!Array.isArray(list.codigosSAP)) list.codigosSAP = []
  const idx = list.codigosSAP.indexOf(codigoSAP)
  if (idx >= 0) list.codigosSAP.splice(idx, 1)
  else          list.codigosSAP.push(codigoSAP)
  prefs.insumoFavLists = lists
  try {
    await saveAllPrefs()
    tgApp?.HapticFeedback?.selectionChanged?.()
    openInsumoFavListsSheet(codigoSAP)
    if (__insumosCache) renderInsumosBody(__insumosCache)
  } catch(err){
    showToast('Error: ' + (err.message || ''), 'err')
  }
}

async function createInsumoFavList(){
  if (!insumoFavSheetCtx) return
  const { codigoSAP } = insumoFavSheetCtx
  showInputModal('Nueva lista de insumos', '', 'Ej. EPP turno noche, Ferretería rápida…', async (name) => {
    name = (name || '').trim()
    if (!name) return
    const lists = getInsumoFavLists()
    if (lists.some(l => l.name === name)){
      showToast('Ya existe una lista con ese nombre', 'err')
      return
    }
    lists.push({ name, codigosSAP: codigoSAP ? [codigoSAP] : [] })
    prefs.insumoFavLists = lists
    try {
      await saveAllPrefs()
      showToast('Lista creada ✓', 'ok')
      tgApp?.HapticFeedback?.notificationOccurred?.('success')
      openInsumoFavListsSheet(codigoSAP)
      if (__insumosCache) renderInsumosBody(__insumosCache)
    } catch(err){
      showToast('Error: ' + (err.message || ''), 'err')
    }
  })
}

async function renameInsumoFavList(oldName){
  if (!insumoFavSheetCtx) return
  const { codigoSAP } = insumoFavSheetCtx
  showInputModal('Renombrar lista', oldName, 'Nuevo nombre', async (newName) => {
    newName = (newName || '').trim()
    if (!newName || newName === oldName) return
    const lists = getInsumoFavLists()
    if (lists.some(l => l.name === newName)){
      showToast('Ya existe una lista con ese nombre', 'err')
      return
    }
    const list = lists.find(l => l.name === oldName)
    if (!list) return
    list.name = newName
    if (insumosListaFilter === oldName) insumosListaFilter = newName
    prefs.insumoFavLists = lists
    try {
      await saveAllPrefs()
      showToast('Lista renombrada ✓', 'ok')
      openInsumoFavListsSheet(codigoSAP)
      if (__insumosCache) renderInsumosBody(__insumosCache)
    } catch(err){
      showToast('Error: ' + (err.message || ''), 'err')
    }
  })
}

async function deleteInsumoFavList(name){
  if (!insumoFavSheetCtx) return
  const ok = confirm(`¿Borrar la lista "${name}"? Los insumos seguirán existiendo.`)
  if (!ok) return
  const { codigoSAP } = insumoFavSheetCtx
  const lists = getInsumoFavLists().filter(l => l.name !== name)
  if (insumosListaFilter === name) insumosListaFilter = null
  prefs.insumoFavLists = lists
  try {
    await saveAllPrefs()
    showToast('Lista borrada ✓', 'ok')
    tgApp?.HapticFeedback?.notificationOccurred?.('warning')
    openInsumoFavListsSheet(codigoSAP)
    if (__insumosCache) renderInsumosBody(__insumosCache)
  } catch(err){
    showToast('Error: ' + (err.message || ''), 'err')
  }
}

function setInsumosListaFilter(name){
  insumosListaFilter = (insumosListaFilter === name) ? null : name
  if (__insumosCache) renderInsumosBody(__insumosCache)
}

// ── F5c — Conteo rápido de stock para insumos ──────────────────────────
function openInsumoConteoModal(codigoSAP){
  const item = (__insumosCache || []).find(i => i.codigoSAP === codigoSAP)
  if (!item) return
  const current = item.stockFisico != null ? String(item.stockFisico) : ''
  showInputModal(
    `Contar stock — ${item.textoBreve || codigoSAP}`,
    current,
    `Cantidad actual${item.unidadMedida ? ` (${item.unidadMedida})` : ''}`,
    async (val, obs) => {
      if (val == null) return
      const trimmed = String(val).trim()
      if (trimmed === ''){ showToast('Ingresa una cantidad', 'err'); return }
      const n = Number(trimmed.replace(',', '.'))
      if (!Number.isFinite(n) || n < 0){ showToast('Cantidad inválida', 'err'); return }
      await saveInsumoStockConteo(codigoSAP, Math.round(n), { observaciones: (obs || '').trim() })
    },
    { withObs: true }
  )
  const inp = document.getElementById('modal-input')
  if (inp){ inp.type = 'number'; inp.inputMode = 'numeric'; inp.min = '0'; inp.step = '1' }
}

async function saveInsumoStockConteo(codigoSAP, cantidad, { observaciones = '' } = {}){
  const item = (__insumosCache || []).find(i => i.codigoSAP === codigoSAP)
  if (!item){ showToast('Insumo no encontrado', 'err'); return }
  const who = firstName || tgApp?.initDataUnsafe?.user?.first_name || 'usuario'
  const ts = Date.now()
  const prevHist = Array.isArray(item.stockHistorial) ? item.stockHistorial : []
  const newEntry = { cantidad, ts, por: who, ...(observaciones ? { obs: observaciones } : {}) }
  const stockHistorial = [newEntry, ...prevHist].slice(0, 10)
  const update = {
    stockFisico: cantidad,
    stockContadoEn: ts,
    stockContadoPor: who,
    stockHistorial,
  }
  Object.assign(item, update)
  if (__insumosCache) renderInsumosBody(__insumosCache)
  tgApp?.HapticFeedback?.notificationOccurred?.('success')
  logInsumoStockConteo(item, cantidad, observaciones)
  try {
    await trackWrite(db.collection('insumos').doc(codigoSAP).update(update))
    showToast('Stock actualizado ✓', 'ok')
    openInsumoDetail(codigoSAP)
  } catch (err) {

// Panel de diagnóstico para el usuario: muestra si el SW está activo, qué está
// cacheado, estado de auth/red, etc. Útil para reportar problemas de offline.
async function showOfflineDiagnostic(){
  const lines = []
  lines.push(`📡 Red: ${navigator.onLine ? '🟢 Online' : '🔴 Offline'}`)

  // Service Worker
  if ('serviceWorker' in navigator){
    try {
      const reg = await navigator.serviceWorker.getRegistration('./')
      if (reg){
        const states = {
          installing: !!reg.installing,
          waiting: !!reg.waiting,
          active: !!reg.active,
          controller: !!navigator.serviceWorker.controller,
        }
        lines.push(`⚙️ SW: ${reg.active ? '🟢 activo' : '🟡 ' + JSON.stringify(states)}`)
        lines.push(`   scope: ${reg.scope}`)
        lines.push(`   controller: ${navigator.serviceWorker.controller ? 'sí' : 'NO (recargá página)'}`)
      } else {
        lines.push(`⚙️ SW: 🔴 NO REGISTRADO — la app no abrirá offline`)
      }
    } catch(e){ lines.push(`⚙️ SW: error ${e?.message}`) }
  } else {
    lines.push(`⚙️ SW: 🔴 navegador no soporta Service Worker`)
  }

  // Caches
  if ('caches' in window){
    try {
      const keys = await caches.keys()
      for (const k of keys){
        const c = await caches.open(k)
        const all = await c.keys()
        lines.push(`📦 ${k}: ${all.length} entradas`)
      }
    } catch(e){ lines.push(`📦 caches: error ${e?.message}`) }
  }

  // Sesión auth
  const session = lsGet('mant_user_session', null)
  lines.push(`🔐 Sesión LS: ${session ? `✓ ${session.userRole}` : '🔴 vacía'}`)
  lines.push(`🔐 Auth user: ${auth.currentUser?.uid ? '✓' : '🔴 sin user'}`)

  // Datos cacheados
  const cats = lsGet(LS_KEY_CATEGORIES, null)
  const machs = lsGet(LS_KEY_MACHINES, null)
  lines.push(`📂 Categorías LS: ${cats?.length || 0}`)
  lines.push(`🔧 Máquinas LS: ${machs?.length || 0}`)

  // Repuestos por equipo
  let repCount = 0, repItems = 0
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i)
      if (k?.startsWith(LS_PREFIX_REPCACHE)){
        const data = lsGet(k, null)
        if (data?.length){ repCount++; repItems += data.length }
      }
    }
  } catch {}
  lines.push(`⚙️ Repuestos LS: ${repCount} equipos · ${repItems} reps`)

  // Manuales
  let manuales = []
  try { manuales = await idbList() } catch {}
  lines.push(`📚 Manuales IDB: ${manuales.length}`)
  lines.push(`🌐 Insumos memoria: ${(__insumosCache || []).length}`)

  // Render
  const text = lines.join('\n')
  if (tgApp?.showAlert){
    tgApp.showAlert(text)
  } else {
    alert(text)
  }
}

function relativeTime(ts){
  if (!ts) return ''
  const diff = Date.now() - ts
  const min = Math.floor(diff / 60000)
  if (min < 1) return 'ahora mismo'
  if (min < 60) return `hace ${min} min`
  const h = Math.floor(min / 60)
  if (h < 24) return `hace ${h} h`
  const d = Math.floor(h / 24)
  if (d < 7) return `hace ${d} día${d > 1 ? 's' : ''}`
  return new Date(ts).toLocaleDateString('es-CL', {day:'numeric', month:'short'})
}

    return
  }
  qcSearchTimer = setTimeout(() => qcSearch(val.trim()), 180)

function qcSearch(query){
  const resultEl = document.getElementById('qc-result')
  if (!resultEl) return

  if (!__repuestosCache){
    resultEl.innerHTML = `<div style="text-align:center;padding:16px;color:var(--hint);font-size:13px">
      Catálogo no cargado — ve a Buscar primero</div>`
    return
  }

  const norm = normalizeSearch(query)
  const bySAP = __repuestosCache.filter(x =>
    normalizeSearch(x.repuesto.codigoSAP || '').includes(norm)
  )
  const byName = bySAP.length === 0
    ? __repuestosCache.filter(x =>
        normalizeSearch(x.repuesto.textoBreve || '').includes(norm) ||
        normalizeSearch(x.repuesto.alias || '').includes(norm)
      ).slice(0, 6)
    : []

  const hits = bySAP.length > 0 ? bySAP : byName

  if (hits.length === 0){
    resultEl.innerHTML = `<div style="text-align:center;padding:20px;color:var(--hint)">
      <div style="font-size:28px;margin-bottom:6px">❓</div>
      <div style="font-size:13px">SAP no encontrado en el catálogo</div>
    </div>`
    return
  }

  // Si hay exactamente una máquina para el SAP → selección automática
  if (bySAP.length === 1){
    qcSelectItem(bySAP[0])
    return
  }

  // Varios resultados → mostrar lista para seleccionar
  resultEl.innerHTML = `
    <div style="font-size:12px;color:var(--hint);margin-bottom:6px">${hits.length} resultado${hits.length>1?'s':''} — seleccioná el equipo:</div>
    <div class="cell-group">
      ${hits.slice(0, 8).map(item => {
        const r = item.repuesto
        return `<div class="cell" onclick="qcSelectItem(${escHtmlAttr(JSON.stringify({repuesto:r, machineId:item.machineId, machineName:item.machineName}))})">
          <div class="cell-body">
            <div class="cell-title" style="font-size:13px">${escHtml(r.textoBreve || r.descripcion || 'Sin nombre')}</div>
            <div class="cell-sub">${r.codigoSAP ? `SAP ${escHtml(r.codigoSAP)} · ` : ''}${escHtml(item.machineName || '')}</div>
          </div>
          <div class="cell-chevron">›</div>
        </div>`
      }).join('')}
    </div>`
}

function qcSelectItem(item){
  // item puede venir como objeto JS o como string JSON desde onclick
  if (typeof item === 'string') item = JSON.parse(item)
  qcSelectedItem = item
  const r = item.repuesto
  const resultEl = document.getElementById('qc-result')
  const qtyArea  = document.getElementById('qc-qty-area')
  if (!resultEl || !qtyArea) return

  const hasStock = r.stockFisico != null
  const isLow = hasStock && r.stockMinimo != null && r.stockFisico < r.stockMinimo

  resultEl.innerHTML = `
    <div style="background:var(--bg2);border-radius:10px;padding:12px;margin-bottom:10px;
      border:1px solid ${isLow?'rgba(239,68,68,.4)':'var(--border)'}">
      <div style="font-size:14px;font-weight:600">${escHtml(r.textoBreve || r.descripcion || 'Sin nombre')}</div>
      <div style="font-size:12px;color:var(--hint);margin-top:3px">${r.codigoSAP ? `SAP ${escHtml(r.codigoSAP)} · ` : ''}${escHtml(item.machineName || '')}</div>
      ${hasStock ? `<div style="font-size:12px;margin-top:6px;color:${isLow?'#ef4444':'var(--green)'}">
        ${isLow?'⚠️':'✅'} Stock actual: <b>${r.stockFisico}</b>${r.stockMinimo!=null?` / mín ${r.stockMinimo}`:''}
      </div>` : `<div style="font-size:12px;color:var(--hint);margin-top:6px">Sin contar aún</div>`}
    </div>`

  qtyArea.style.display = 'block'
  const qtyInput = document.getElementById('qc-qty-input')
  if (qtyInput){
    qtyInput.value = hasStock ? String(r.stockFisico) : '0'
    setTimeout(() => { qtyInput.focus(); qtyInput.select() }, 60)

function qcAdjustQty(delta){
  const inp = document.getElementById('qc-qty-input')
  if (!inp) return
  const v = Math.max(0, (parseInt(inp.value, 10) || 0) + delta)
  inp.value = String(v)
  tgApp?.HapticFeedback?.selectionChanged?.()

async function qcSave(){
  if (!qcSelectedItem) return
  const inp = document.getElementById('qc-qty-input')
  const cantidad = parseInt(inp?.value ?? '0', 10)
  if (!Number.isFinite(cantidad) || cantidad < 0){
    showToast('Cantidad inválida', 'err'); return
  }
  const btn = document.getElementById('qc-save-btn')
  if (btn){ btn.disabled = true; btn.textContent = '…' }

  const { repuesto: r, machineId, machineName } = qcSelectedItem
  // Asegurar que repCache tenga el repuesto (viene de __repuestosCache, puede no estar en repCache)
  // Esto es necesario para que saveStockConteo actualice el cache local correctamente
  if (!repCache[machineId]) repCache[machineId] = []
  if (!repCache[machineId].find(x => x.id === r.id)) repCache[machineId].push({ ...r })
  // Guardar sin navegar (silent=true mantiene la vista de conteo)
  await saveStockConteo(machineId, r.id, cantidad, { silent: true })

  // Registrar en sesión local
  quickCountSession.unshift({
    machineId, machineName, repId: r.id,
    name: r.textoBreve || r.descripcion || 'Sin nombre',
    sap: r.codigoSAP || '',
    cantidad, ts: Date.now(),
  })

  // Reset para el próximo item
  qcSelectedItem = null
  document.getElementById('qc-result').innerHTML = ''
  document.getElementById('qc-qty-area').style.display = 'none'
  const sapInp = document.getElementById('qc-sap-input')
  if (sapInp){ sapInp.value = ''; sapInp.focus() }
  if (btn){ btn.disabled = false; btn.textContent = '✓ Guardar y siguiente' }

  qcRenderSession()
  tgApp?.HapticFeedback?.notificationOccurred?.('success')
}

function qcClearInput(){
  const inp = document.getElementById('qc-sap-input')
  if (inp){ inp.value = ''; inp.focus() }
  qcSelectedItem = null
  document.getElementById('qc-result').innerHTML = ''

}

function getStockBajoItems(){
  if (!__repuestosCache) return []
  return __repuestosCache.filter(item => {
    const r = item.repuesto
    return r.stockFisico != null && r.stockMinimo != null && Number(r.stockFisico) < Number(r.stockMinimo)
  }).sort((a, b) => {
    // más crítico primero: mayor % de déficit
    const defA = (a.repuesto.stockMinimo - a.repuesto.stockFisico) / (a.repuesto.stockMinimo || 1)
    const defB = (b.repuesto.stockMinimo - b.repuesto.stockFisico) / (b.repuesto.stockMinimo || 1)
    return defB - defA
  })
}

function getInsumosBajoMinimo(){
  if (!__insumosCache) return []
  return __insumosCache.filter(i =>
    i.stockFisico != null && i.stockMinimo != null && Number(i.stockFisico) < Number(i.stockMinimo)
  ).sort((a, b) => {
    const defA = (a.stockMinimo - a.stockFisico) / (a.stockMinimo || 1)
    const defB = (b.stockMinimo - b.stockFisico) / (b.stockMinimo || 1)
    return defB - defA
  })
}

function exportStockBajoText(){
  const items = getStockBajoItems()
  if (items.length === 0) return
  const lines = items.map(item => {
    const r = item.repuesto

    const sap = r.codigoSAP ? ` (SAP ${r.codigoSAP})` : ''
    return `• ${name}${sap} — tiene ${r.stockFisico}, mínimo ${r.stockMinimo} [${item.machineName}]`
  })
  const text = `⚠️ Stock Bajo — ${new Date().toLocaleDateString('es-CL')}\n\n${lines.join('\n')}`
  if (navigator.clipboard?.writeText){
    navigator.clipboard.writeText(text).then(() => {
      tgApp?.HapticFeedback?.notificationOccurred?.('success')
      showToast('Lista copiada ✓', 'ok')
    }).catch(() => tgApp?.showAlert?.(text))
  } else {
    tgApp?.showAlert?.(text)
  }
}

function exportStockBajoCSV(){
  const items = getStockBajoItems()
  if (items.length === 0) return

  const fecha = new Date().toLocaleDateString('es-CL').replace(/\//g, '-')
  const BOM = '﻿' // UTF-8 BOM para Excel
  const header = ['Nombre', 'SAP', 'Cod Fabricante', 'Stock Físico', 'Stock Mínimo', 'Déficit', 'Déficit %', 'Ubicación', 'Equipo']
  const rows = items.map(item => {
    const r = item.repuesto
    const name = (r.textoBreve || r.descripcion || 'Sin nombre').replace(/"/g, '""')
    const deficit = (r.stockMinimo || 0) - (r.stockFisico || 0)
    const pct = r.stockMinimo ? Math.round((deficit / r.stockMinimo) * 100) : ''
    const equipo = (item.machineName || '').replace(/"/g, '""')
    const ubicacion = (r.ubicacionEnPlanta || '').replace(/"/g, '""')
    return [
      `"${name}"`,
      r.codigoSAP || '',
      r.codigoFabricante || '',
      r.stockFisico ?? '',
      r.stockMinimo ?? '',
      deficit,
      pct ? `${pct}%` : '',
      `"${ubicacion}"`,
      `"${equipo}"`,
    ].join(',')
  })

  const csv = BOM + [header.join(','), ...rows].join('\r\n')

  try {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = `stock-bajo-${fecha}.csv`
    document.body.appendChild(a)
    a.click()
    document.body.removeChild(a)
    URL.revokeObjectURL(url)
    tgApp?.HapticFeedback?.notificationOccurred?.('success')
    showToast('CSV descargado ✓', 'ok')
  } catch {
    // Fallback: copiar CSV al clipboard
    navigator.clipboard?.writeText(csv).then(() => showToast('CSV copiado al portapapeles ✓', 'ok'))
      .catch(() => showToast('Error al exportar', 'err'))
  }
}

function editStockMinimoInline(machineId, repId, currentMin){
  if (userRole !== 'admin' && userRole !== 'supervisor') return
  const current = currentMin ?? ''
  showInputModal('Editar mínimo de stock', String(current), 'Cantidad mínima (0 = sin mínimo)', async (val) => {
    const parsed = parseInt(val, 10)
    if (isNaN(parsed) || parsed < 0) { showToast('Valor inválido', 'err'); return }
    if (parsed === currentMin) return

    const collPath = getRepuestoCollPath(machineId)
    try {
      await db.doc(`${collPath}/${repId}`).update({
        stockMinimo: parsed,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: uid,
      })
      // Actualizar caches locales
      if (repCache[machineId]){
        const rep = repCache[machineId].find(r => r.id === repId)
        if (rep) rep.stockMinimo = parsed
      }
      if (__repuestosCache){
        const item = __repuestosCache.find(i => i.machineId === machineId && i.repuesto.id === repId)
        if (item) item.repuesto.stockMinimo = parsed
      }
      tgApp?.HapticFeedback?.notificationOccurred?.('success')
      showToast(`Mínimo actualizado a ${parsed} ✓`, 'ok')
      renderStockReport()
      renderHomeStockAlert()
    } catch(err){
      showToast('Error: ' + (err.message || ''), 'err')
    }
  })
}

async function renderHomeRepFav(){
  const el = document.getElementById('home-repfav')
  if (!el) return
  const { repuestoFavLists } = prefs
  const repKeys = Object.keys(repuestoFavLists || {}).filter(k => repuestoFavLists[k]?.length > 0)
  if (repKeys.length === 0){ el.innerHTML = ''; return }

  // Resolver cada key a su machineId destino y consolidar duplicados.
  // Múltiples hierarchy nodeIds pueden apuntar al mismo equipo (linkedMachineId)
  // → mergear en una sola card por equipo.
  await Promise.all(repKeys.filter(k => !machineMap[k]).map(resolveNodeName))
  const machineIdsSet = new Set()
  for (const k of repKeys){
    if (machineMap[k]) machineIdsSet.add(k)
    else {
      const mid = await getMachineIdFromNode(k)
      machineIdsSet.add(mid && machineMap[mid] ? mid : k)
    }
  }
  const machineIds = Array.from(machineIdsSet)

  // Para cada machineId, calcular listas mergeadas (merge by name across keys)
  const cards = []
  for (const mid of machineIds){
    const m = machineMap[mid]
    const machineName = m?.nombre || nodeNameCache[mid] || mid
    const lists = m
      ? await getMachineFavListsMerged(mid)
      : (repuestoFavLists[mid] || [])
    const total = lists.reduce((s,l) => s + (l.repuestoIds?.length || 0), 0)
    if (total > 0) cards.push({ mid, machineName, m, lists, total })
  }

  if (cards.length === 0){ el.innerHTML = ''; return }

  el.innerHTML = `
    <div class="section">
      <span class="section-title">Repuestos guardados</span>
      <span class="section-count">${cards.length}</span>
    </div>
    ${cards.map(({mid, machineName, m, lists, total}) => `
      <div class="compound-card">
        <div class="cell" onclick="openMachine('${escHtmlAttr(mid)}')">
          <div class="cell-icon" style="background:${m?.color || '#5288c1'}22;color:${m?.color || '#5288c1'}">🔩</div>
          <div class="cell-body">
            <div class="cell-title">${escHtml(machineName)}</div>
            <div class="cell-sub">${pl(total, 'repuesto', 'repuestos')} · ${pl(lists.length, 'lista', 'listas')}</div>
          </div>
          <div class="cell-chevron">›</div>
        </div>
        ${lists.length > 0 ? `
          <div class="cell-chips">
            ${lists.map(l => `
              <span class="cell-chip" onclick="event.stopPropagation();openMachineWithFilter('${escHtmlAttr(mid)}', ${escHtmlAttr(JSON.stringify(l.name))})">
                📋 ${escHtml(l.name)} <span class="n">${l.repuestoIds.length}</span>
              </span>`).join('')}
          </div>` : ''}
      </div>`).join('')}`
}

function renderHomeCatalog(){
  const el = document.getElementById('home-catalog')
  if (!el) return
  // Chips: Todos + categorías con count > 0
  const visibleCats = categories
    .map(c => {
      const desc = categoryDescendants[c.id] || new Set([c.id])
      return { ...c, _count: machines.filter(m => m.categoryId && desc.has(m.categoryId)).length }
    })
    .filter(c => c._count > 0)

  const chipsHtml = `
    <div class="chips sticky-top">
      <div class="chip ${activeCatFilter==='all'?'active':''}" onclick="setCatFilter('all')">Todos <span class="count">${machines.length}</span></div>
      ${visibleCats.map(c => `
        <div class="chip ${activeCatFilter===c.id?'active':''}" onclick="setCatFilter('${escHtmlAttr(c.id)}')">
          ${escHtml(c.nombre)} <span class="count">${c._count}</span>
        </div>`).join('')}
    </div>`

  let filtered
  if (activeCatFilter === 'all') filtered = machines
  else {
    const desc = categoryDescendants[activeCatFilter] || new Set([activeCatFilter])
    filtered = machines.filter(m => m.categoryId && desc.has(m.categoryId))
  }

  const list = filtered.length === 0
    ? emptyHtml('🏭','Sin equipos','No hay equipos en esta categoría')
    : `<div class="cell-group">${filtered.map(machineCellHtml).join('')}</div>`

  el.innerHTML = `
    <div class="section">
      <span class="section-title">Todos los equipos</span>
      <span class="section-count">${pl(filtered.length, 'equipo', 'equipos')}</span>
    </div>
    ${chipsHtml}
    ${list}`
}

  activeCatFilter = id

}

async function getMachineIdFromNode(nodeId){
  try {
    const snap = await db.collection('hierarchy').doc(nodeId).get()
    if (snap.exists) return snap.data().linkedMachineId || null
  } catch {}
  return null
}

// Dispatcher: el bar persistente cambia de comportamiento según dónde estás
function onPersistentSearchTap(){
  const activeViewId = document.querySelector('.view.active')?.id
  // 1) Estás en un equipo abierto → focusear su búsqueda interna
  if (activeViewId === 'view-machine'){
    const inp = document.getElementById('rep-search-input')
    if (inp){ inp.focus(); inp.scrollIntoView({behavior:'smooth', block:'center'}); return }
  }
  // 2) Estás en Manuales (no en sub-vista) → focusear su búsqueda interna
  if (activeViewId === 'view-manuales'){
    const inp = document.getElementById('manuales-search')
    if (inp){ inp.focus(); inp.scrollIntoView({behavior:'smooth', block:'center'}); return }
  }
  // 3) Estás en Jerarquía → overlay tree-wide
  if (activeViewId === 'view-hierarchy'){
    openHierSearchOverlay()
    return
  }
  // 4) Estás en una sub-vista profunda (repuesto, etc) → overlay global
  // (no usamos switchTab porque perdería la pila de navegación)
  if (navStack.length > 0){
    openSearchOverlay()
    return
  }
  // 5) Default (Home a nivel raíz) → ir a la pestaña Buscar
  switchTab('search')
}

let hierSearchTimer = null

  let ov = document.getElementById('hier-search-overlay')

    ov.style.cssText = 'position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column'

  }
  ov.innerHTML = `
    <div style="padding:8px 12px;border-bottom:1px solid var(--border);

      <div class="search-wrap" style="flex:1">
        <span class="search-icon">🔍</span>
        <input id="hier-search-input" class="search-input" type="search"
          autocomplete="off" autocorrect="off" spellcheck="false"

  ov.style.display = 'flex'
  setTimeout(() => document.getElementById('hier-search-input')?.focus(), 80)

  setTgBack(null)
}

function hierSearchInput(){
  clearTimeout(hierSearchTimer)
  hierSearchTimer = setTimeout(renderHierSearchBody, 180)
}

function renderHierSearchBody(){
  const inp = document.getElementById('hier-search-input')
  const body = document.getElementById('hier-search-body')
  if (!body) return
  const raw = inp?.value || ''
  const q = normalizeSearch(raw).trim()

  if (!q){
    body.innerHTML = `<div style="padding:24px 16px;text-align:center;color:var(--hint);font-size:13px">
      Escribí el nombre o código de un nodo, equipo o área.<br>
      Buscamos en todos los niveles de la jerarquía.
    </div>`
    return
  }
  if (q.length < 2) return

  // Búsqueda in-memory sobre hierarchyNodesMap (ya cargado y cacheado)
  const matches = []
  for (const n of Object.values(hierarchyNodesMap)){
    if (n.activo === false) continue
    if (normalizeSearch(n.nombre).includes(q) || normalizeSearch(n.codigo).includes(q)){
      matches.push(n)
    }
    if (matches.length >= 80) break
  }
  // Orden: primero hojas (equipos), luego por nivel
  matches.sort((a, b) => {
    const aLeaf = isEquipNode(a), bLeaf = isEquipNode(b)
    if (aLeaf !== bLeaf) return aLeaf ? -1 : 1
    return (a.nivel || 0) - (b.nivel || 0)
  })

  if (matches.length === 0){
    body.innerHTML = `<div style="padding:24px 16px">
      ${emptyHtml('🔍','Sin coincidencias',`Ningún nodo coincide con "<b>${escHtml(raw)}</b>"`)}
    </div>`
    return
  }

  body.innerHTML = `<div class="cell-group" style="margin:8px 0">
    ${matches.slice(0, 50).map(n => {
      const isEquip = isEquipNode(n)
      const lvl = n.nivel || 1
      const lvlLabel = LEVEL_LABELS[lvl] || `N${lvl}`
      const lvlColor = LEVEL_COLORS[lvl] || '#888'
      const linkedMachine = machines.find(m => m.hierarchyNodeId === n.id)
      const path = (n.path || []).slice(0, -1).join(' › ')
      const handler = isEquip
        ? `hierSearchOpenEquip('${escHtmlAttr(n.id)}','${escHtmlAttr(linkedMachine?.id||'')}')`
        : `hierSearchNavigate('${escHtmlAttr(n.id)}')`
      return `<div class="cell" onclick="${handler}">
        <div class="cell-icon" style="background:${lvlColor}22;color:${lvlColor}">
          ${isEquip?'⚙️':'📁'}
        </div>
        <div class="cell-body">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <div class="cell-title">${highlightMatch(n.nombre || 'Sin nombre', raw)}</div>
            <span class="level-chip" style="background:${lvlColor}22;color:${lvlColor}">${lvlLabel}</span>
          </div>
          ${path ? `<div class="cell-sub" style="opacity:.7">${escHtml(path)}</div>` : ''}
        </div>
        <div class="cell-chevron">›</div>
      </div>`
    }).join('')}
    ${matches.length > 50 ? `<div style="padding:10px 16px;font-size:11px;color:var(--hint);text-align:center">+${matches.length-50} más — refiná la búsqueda</div>` : ''}
  </div>`
}

// Helper: reconstruye el stack desde un nodo cualquiera (vía parentId)
function buildHierStackForNode(node){
  const stack = []
  let cur = node
  while (cur){
    stack.unshift({ id: cur.id, nombre: cur.nombre })
    cur = cur.parentId ? hierarchyNodesMap[cur.parentId] : null
  }
  return stack
}

function hierSearchNavigate(nodeId){
  const node = hierarchyNodesMap[nodeId]
  if (!node) return
  closeHierSearchOverlay()
  if (currentTab !== 'hierarchy') switchTab('hierarchy')
  hierarchyStack = buildHierStackForNode(node)
  setTgBack(hierarchyStack.length ? hierarchyGoBack : null)
  renderHierarchyLevel()
  getContent().scrollTop = 0
}

function hierSearchOpenEquip(nodeId, machineId){
  const node = hierarchyNodesMap[nodeId]
  if (!node) return
  closeHierSearchOverlay()
  if (currentTab !== 'hierarchy') switchTab('hierarchy')
  // Stack = ancestros (sin incluir el equipo, que se abre como vista)
  const stack = []
  let cur = node.parentId ? hierarchyNodesMap[node.parentId] : null
  while (cur){
    stack.unshift({ id: cur.id, nombre: cur.nombre })
    cur = cur.parentId ? hierarchyNodesMap[cur.parentId] : null
  }
  hierarchyStack = stack
  setTgBack(hierarchyStack.length ? hierarchyGoBack : null)
  renderHierarchyLevel()
  hierarchyOpenEquip(nodeId, machineId)
}

// F3 — GLOBAL SEARCH ALGORITHMS
// ═══════════════════════════════════════════════════════════════════
function editDistanceAtMostOne(a, b){
  if (a === b) return true
  const la = a.length, lb = b.length
  if (Math.abs(la - lb) > 1) return false
  let i = 0, j = 0, edits = 0
  while (i < la && j < lb){
    if (a[i] === b[j]){ i++; j++; continue }
    if (++edits > 1) return false
    if (la > lb) i++; else if (lb > la) j++; else { i++; j++ }
  }
  if (i < la || j < lb) edits++
  return edits <= 1
}

function tokenMatchesText(token, searchable, words){
  if (searchable.includes(token)) return true
  const syns = SYNONYM_LOOKUP[token]
  if (syns?.some(s => searchable.includes(s))) return true
  if (token.length >= 4 && words.some(w => w.length >= 4 && editDistanceAtMostOne(token, w))) return true
  return false
}

function scoreRepResult(r, machineName, nq, tokens){
  const name    = normalizeSearch(r.textoBreve || '')
  const alias   = normalizeSearch(r.alias || '')
  const sap     = normalizeSearch(r.codigoSAP || '')
  const fab     = normalizeSearch(r.codigoFabricante || r.codigoBaader || '')
  const desc    = normalizeSearch(r.descripcion || '')
  const ubic    = normalizeSearch(r.ubicacionEnPlanta || '')
  const mname   = normalizeSearch(machineName || '')
  const searchable = `${name} ${alias} ${sap} ${fab} ${desc} ${ubic} ${mname}`
  const words = searchable.split(' ').filter(Boolean)

  for (const t of tokens) if (t && !tokenMatchesText(t, searchable, words)) return 0

  let score = 1
  if (sap === nq)  score += 220
  if (fab === nq)  score += 180
  if (name === nq) score += 170
  if (sap.startsWith(nq))  score += 120
  if (fab.startsWith(nq))  score += 95
  if (name.startsWith(nq)) score += 90
  if (name.includes(nq))   score += 65
  if (alias.includes(nq))  score += 80
  if (fab.includes(nq))    score += 50
  if (desc.includes(nq))   score += 35
  if (mname.includes(nq))  score += 25
  if (ubic.includes(nq))   score += 20
  for (const t of tokens){
    if (!t) continue
    if (name.includes(t))  score += 25
    if (alias.includes(t)) score += 30
    if (sap.includes(t))   score += 22
    if (fab.includes(t))   score += 18
    if (desc.includes(t))  score += 10
    if (mname.includes(t)) score += 9
  }
  return score
}

async function loadAllRepuestos(){
  if (__repuestosCache && Date.now() - __repuestosCacheTs < HIERARCHY_CACHE_TTL) return
  // 1) localStorage hit → no Firestore reads (sólo para búsqueda global,
  // repCache por equipo se llena on-demand vía loadRepuestos para evitar
  // problemas con la dedup global por SAP)
  if (!__repuestosCache){
    const cached = lsGet(LS_KEY_REPUESTOS, LS_TTL_REP)
    if (cached){
      __repuestosCache = cached
      __repuestosCacheTs = Date.now()
      return
    }
  }
  if (__globalLoadInProgress) return
  __globalLoadInProgress = true
  if (currentTab === 'home') renderHomeSync()

  const results = []
  const existingKeys = new Set()
  function addRep(r, machineId, machineName){
    const k = `${r.codigoSAP||''}|${r.codigoFabricante||r.codigoBaader||''}|${r.textoBreve||''}`
    if (k !== '||' && existingKeys.has(k)) return
    existingKeys.add(k)
    results.push({ repuesto: {...r, codigoFabricante: r.codigoFabricante || r.codigoBaader || ''}, machineId, machineName })
  }

  try {
    // Asegurar jerarquía cargada para conocer total de unidades a escanear
    await loadHierarchyTree()
    // No filtramos por activa: equipos archivados igual contienen repuestos válidos.
    // En hierarchy escaneamos TODOS los nodos activos (no solo leaf): un nodo
    // intermedio puede tener repuestos propios (ej: 'CINTA ACELERACION 1 GRADER'
    // tiene un MOTOREDUCTOR como subnodo y aún así tiene su propio repuesto SAP).
    const activeMachines = machines
    const leafNodes = Object.values(hierarchyNodesMap).filter(n => n.activo !== false)
    const totalUnits = activeMachines.length + leafNodes.length
    let done = 0
    const BATCH = 16

    updateSearchProgress(`Cargando repuestos… 0 / ${totalUnits}`, 0, totalUnits)

    // FASE 1: máquinas legacy
    for (let i = 0; i < activeMachines.length; i += BATCH){
      const batch = activeMachines.slice(i, i + BATCH)
      await Promise.all(batch.map(async m => {
        const reps = await loadRepuestos(m.id).catch(() => [])
        for (const r of reps) addRep(r, m.id, m.nombre)
      }))
      done += batch.length
      updateSearchProgress(`Cargando repuestos… ${done} / ${totalUnits}`, done, totalUnits)
    }

    // FASE 2: hierarchy own-repuestos
    for (let i = 0; i < leafNodes.length; i += BATCH){
      const batch = leafNodes.slice(i, i + BATCH)
      await Promise.all(batch.map(async node => {
        const snap = await db.collection('hierarchy').doc(node.id).collection('repuestos').get().catch(() => null)
        if (!snap) return
        snap.docs.forEach(d => addRep({id: d.id, ...d.data()}, node.id, node.nombre))
      }))
      done += batch.length
      updateSearchProgress(`Cargando repuestos… ${done} / ${totalUnits}`, done, totalUnits)
    }
  } catch(e){ console.warn('loadAllRepuestos error', e) }

  __repuestosCache = results
  __repuestosCacheTs = Date.now()
  lsSet(LS_KEY_REPUESTOS, normalizeForCache(results))
  __globalLoadInProgress = false
  updateSearchProgress(null)
  // Refrescar Home si está visible
  if (currentTab === 'home'){
    renderHomeSync()
    renderHomeStockAlert()
  }
}

function invalidateRepuestosCache(){
  __repuestosCache = null
  __repuestosCacheTs = 0
  try { localStorage.removeItem(LS_KEY_REPUESTOS) } catch {}
}

function updateSearchProgress(msg, loaded, total){
  const el = document.getElementById('search-progress')
  if (!el) return
  // Carga terminada → mostrar resumen del catálogo cargado
  if (!msg){ renderSearchStats(); return }
  el.style.display = 'block'
  const pct = (total && loaded != null) ? Math.round((loaded / total) * 100) : null
  el.innerHTML = `
    <div style="font-size:12px;color:var(--sub)">${escHtml(msg)}${pct != null ? ` · ${pct}%` : ''}</div>
    ${pct != null ? `<div style="height:3px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:var(--accent);transition:width .25s"></div>
    </div>` : ''}`
}

function renderSearchStats(){
  const el = document.getElementById('search-progress')
  if (!el) return
  const repCount = __repuestosCache?.length || 0
  if (repCount === 0){
    el.style.display = 'block'
    el.innerHTML = `<div style="font-size:12px;color:var(--sub)">Cargando catálogo de repuestos…</div>`
    return
  }
  const eqCount = machines.length + Object.values(hierarchyNodesMap || {}).filter(n => n.activo !== false).length
  const ageMs = Date.now() - (__repuestosCacheTs || Date.now())
  const ageMin = Math.floor(ageMs / 60000)
  const ageTxt = ageMin < 1 ? 'recién' : ageMin === 1 ? 'hace 1 min' : `hace ${ageMin} min`
  // Stale = más de 5min sin refrescar → alerta amarilla y botón destacado
  const isStale = ageMin >= 5
  el.style.display = 'block'
  el.innerHTML = `<div style="font-size:12px;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap">
    <span>📊 <b>${repCount.toLocaleString('es')}</b> repuestos · <b>${eqCount}</b> equipos ·
      <span style="${isStale?'color:#f59e0b;font-weight:600':'opacity:.7'}">${isStale?'⚠️ ':''}${ageTxt}</span>
    </span>
    <button onclick="refreshSearchCatalog()" id="search-refresh-btn"
      style="background:${isStale?'#f59e0b':'none'};border:1px solid ${isStale?'#f59e0b':'var(--border)'};border-radius:6px;color:${isStale?'#000':'var(--accent)'};font-size:11px;font-weight:${isStale?600:400};cursor:pointer;padding:2px 10px"
      title="Refrescar catálogo desde Firestore">🔄${isStale?' Sincronizar':''}</button>
  </div>`
  // Auto-refresh suave si está muy stale (>15min) y la pestaña está activa
  if (ageMin >= 15 && currentTab === 'search' && !__globalLoadInProgress){
    refreshSearchCatalog()
  }
}

async function refreshSearchCatalog(){
  const btn = document.getElementById('search-refresh-btn')
  if (btn){ btn.disabled = true; btn.textContent = '…' }
  invalidateRepuestosCache()
  await loadAllRepuestos()
  ensureSearchableHaystacks()
  const inp = document.getElementById('search-input')
  renderSearchBody(inp?.value?.trim() || '')
  renderSearchStats()
  tgApp?.HapticFeedback?.notificationOccurred?.('success')
  showToast('Catálogo actualizado ✓', 'ok')
}

// Pre-calcula campos normalizados una sola vez para evitar normalizar en cada keystroke
function ensureSearchableHaystacks(){
  if (!__repuestosCache) return
  for (const item of __repuestosCache){
    if (item._hay) continue
    const r = item.repuesto
    item._hay = ' '
      + normalizeSearch(r.codigoSAP || '') + ' '
      + normalizeSearch(r.textoBreve || '') + ' '
      + normalizeSearch(r.alias || '') + ' '
      + normalizeSearch(r.codigoFabricante || r.codigoBaader || '') + ' '
      + normalizeSearch(r.descripcion || '') + ' '
      + normalizeSearch(r.nombreManual || '') + ' '
      + normalizeSearch(r.tipo || '') + ' '
      + normalizeSearch(r.ubicacionEnPlanta || '') + ' '
      + normalizeSearch(item.machineName || '') + ' '
  }
}

function searchGlobal(queryText){
  if (!__repuestosCache) return { repHits: [], machHits: [] }
  ensureSearchableHaystacks()
  const nq = normalizeSearch(queryText)
  if (!nq) return { repHits: [], machHits: [] }
  const tokens = nq.split(' ').filter(Boolean)

  // FASE 1: filtro rápido — descartar items donde NINGÚN token aparece como
  // substring (incluyendo sinónimos). Bajamos de ~4684 → ~50-300 candidatos.
  const candidates = []
  outer: for (const item of __repuestosCache){
    const hay = item._hay
    for (const t of tokens){
      if (hay.includes(t)) continue
      const syns = SYNONYM_LOOKUP[t]
      if (syns && syns.some(s => hay.includes(s))) continue
      // Token no encontrado y sin sinónimo → descartar (edit-distance fallback luego)
      continue outer
    }
    candidates.push(item)
  }

  // FASE 2 (fallback): si hay pocos candidatos, expandir con edit-distance
  // Esto es caro pero solo se hace cuando hay <3 matches y hay tokens largos
  if (candidates.length < 3 && tokens.some(t => t.length >= 4)){
    const seen = new Set(candidates)
    for (const item of __repuestosCache){
      if (seen.has(item)) continue
      const words = item._hay.split(' ').filter(w => w.length >= 4)
      const allMatch = tokens.every(t => {
        if (item._hay.includes(t)) return true
        if (t.length < 4) return false
        return words.some(w => editDistanceAtMostOne(t, w))
      })
      if (allMatch){
        candidates.push(item)
        if (candidates.length >= 30) break
      }
    }
  }

  // FASE 3: scoring solo de candidatos (fast)
  const repHits = candidates
    .map(item => ({ item, score: scoreRepResult(item.repuesto, item.machineName, nq, tokens) }))
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 50)
    .map(x => x.item)

  const machHits = machines.filter(m => matchesMachine(m, nq)).slice(0, 20)
  return { repHits, machHits }
}

function highlightMatch(text, rawQuery){
  if (!rawQuery || !text) return escHtml(String(text || ''))
  const norm = normalizeSearch(text)
  const nq   = normalizeSearch(rawQuery)
  const idx  = norm.indexOf(nq)
  if (idx === -1 || nq.length === 0) return escHtml(String(text))
  return escHtml(text.slice(0, idx))
    + '<mark>' + escHtml(text.slice(idx, idx + nq.length)) + '</mark>'
    + escHtml(text.slice(idx + nq.length))
}

function saveSearchHistory(query){
  if (!query?.trim()) return
  let hist = JSON.parse(localStorage.getItem('mant_search_history') || '[]')
  hist = [query.trim(), ...hist.filter(q => q !== query.trim())].slice(0, 20)
  localStorage.setItem('mant_search_history', JSON.stringify(hist))
}

function getSearchHistory(){
  return JSON.parse(localStorage.getItem('mant_search_history') || '[]')
}

function renderSearchBody(query){
  const body   = document.getElementById('search-body')
  const tabsEl = document.getElementById('search-sub-tabs')
  if (!body) return

  if (!query){
    if (tabsEl) tabsEl.innerHTML = ''
    body.innerHTML = renderSearchHistoryHtml()
    return
  }

  let repHits, machHits

  if (__repuestosCache){
    // Global scored search
    const res = searchGlobal(query)
    repHits  = res.repHits
    machHits = res.machHits
  } else {
    // Fallback: repuestos ya en repCache, carga el resto en background
    const q = normalizeSearch(query)
    machHits = machines.filter(m => matchesMachine(m, q))
    repHits  = []
    for (const [mId, reps] of Object.entries(repCache)){
      for (const r of reps)
        if (matchesRepuesto(r, q))
          repHits.push({ repuesto: r, machineId: mId, machineName: machineMap[mId]?.nombre || '' })
    }
    loadAllRepuestos().then(() => {
      const cur = document.getElementById('search-input')?.value?.trim()
      if (cur === query) renderSearchBody(query)
    })
  }

  // Filtro por lista de favoritos
  if (searchFavFilter === '*'){
    repHits  = repHits.filter(isRepuestoFavorite)
    machHits = machHits.filter(m => isMachineFavorite(m.id))
  } else if (searchFavFilter !== 'all'){
    const list = (prefs.favoriteLists || []).find(l => l.name === searchFavFilter)
    // Expansión jerárquica: si la lista tiene un nodo padre, matchear también
    // todos sus descendientes (ej: lista 'Cintas' con 'Eviscerado' debe traer
    // repuestos de cualquier cinta dentro de esa rama).
    const idSet = expandListIdsHierarchically(list?.machineIds || [])
    repHits  = repHits.filter(it => idSet.has(it.machineId))
    machHits = machHits.filter(m => idSet.has(m.id))
  }

  // Filtro "Solo con SAP" (aplica solo a repuestos)
  if (searchSapOnly){
    repHits = repHits.filter(it => (it.repuesto.codigoSAP || '').trim().length > 0)
  }

  if (repHits.length === 0 && machHits.length === 0){
    if (tabsEl) tabsEl.innerHTML = ''
    const filterHint = (searchFavFilter !== 'all' || searchSapOnly)
      ? ` con los filtros activos. Probá quitar filtros.` : ''
    body.innerHTML = emptyHtml('🔍','Sin resultados',
      `Sin coincidencias para "<b>${escHtml(query)}</b>"${filterHint}`)
    return
  }

  // Sub-tabs con conteos
  if (tabsEl){
    tabsEl.innerHTML = `<div class="chips" style="padding:6px 12px 2px">
      <div class="chip ${searchTabActive==='repuestos'?'active':''}"
           onclick="setSearchTab('repuestos','${escHtmlAttr(query)}')">
        Repuestos <span class="count">${repHits.length}</span>
      </div>
      <div class="chip ${searchTabActive==='equipos'?'active':''}"
           onclick="setSearchTab('equipos','${escHtmlAttr(query)}')">
        Equipos <span class="count">${machHits.length}</span>
      </div>
    </div>`
  }

  if (searchTabActive === 'repuestos'){
    if (repHits.length === 0){
      body.innerHTML = emptyHtml('📦','Sin repuestos','Prueba la pestaña Equipos')
      return
    }
    body.innerHTML = `<div class="cell-group">
      ${repHits.map(({repuesto: r, machineId, machineName}) => `
        <div class="cell" onclick="openRepuesto('${escHtmlAttr(machineId)}','${escHtmlAttr(r.id)}')">
          <div class="cell-icon">${repIcon(r.tipo)}</div>
          <div class="cell-body">
            <div class="cell-title">${highlightMatch(r.textoBreve || r.alias || 'Sin nombre', query)}</div>
            ${r.codigoSAP
              ? `<div class="cell-meta">SAP ${highlightMatch(r.codigoSAP, query)}</div>` : ''}
            <div class="cell-sub">${escHtml(machineName || '')}${r.tipo
              ? ` · <span style="color:var(--accent-dim,var(--accent))">${escHtml(r.tipo)}</span>` : ''}</div>
          </div>
          <div class="cell-chevron">›</div>
        </div>`).join('')}
    </div>`
  } else {
    if (machHits.length === 0){
      body.innerHTML = emptyHtml('🏭','Sin equipos','Prueba la pestaña Repuestos')
      return
    }
    body.innerHTML = `<div class="cell-group">
      ${machHits.map(m => machineCellHtml(m)).join('')}
    </div>`
  }
}

function renderSearchFilterChips(){
  const lists = prefs.favoriteLists || []
  const chip = (key, label, active) =>
    `<div class="chip ${active?'active':''}" onclick="setSearchFavFilter('${escHtmlAttr(key)}')">${label}</div>`
  let html = chip('all', 'Todos', searchFavFilter === 'all')
  if (lists.length > 0){
    html += chip('*', '★ Cualquier favorito', searchFavFilter === '*')
    for (const l of lists){
      html += chip(l.name, escHtml(l.name), searchFavFilter === l.name)
    }
  }
  html += `<div class="chip ${searchSapOnly?'active':''}" onclick="toggleSearchSapOnly()" style="margin-left:6px">
    🏷️ Solo con SAP</div>`
  return html
}

function setSearchFavFilter(key){
  searchFavFilter = key
  const chipsEl = document.getElementById('search-filter-chips')

}

function isRepuestoFavorite(item){
  if (isMachineFavorite(item.machineId)) return true
  const subLists = prefs.repuestoFavLists?.[item.machineId] || []
  if (subLists.length === 0) return false
  for (const l of subLists){
    const idSet = new Set(l.repuestoIds || [])
    if (idSet.has(item.repuesto.id)) return true
    if (matchesRepFavList(item.repuesto, idSet)) return true

  return false
}

function matchesMachine(m, normQ){
  return normalizeSearch(m.nombre).includes(normQ)
    || normalizeSearch(m.marca).includes(normQ)
    || normalizeSearch(m.modelo).includes(normQ)
    || normalizeSearch(m.descripcion).includes(normQ)
    || normalizeSearch(m.seccion).includes(normQ)
}


function normalizeSearch(s){
  if (!s) return ''
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()
}

function matchesRepuesto(r, normQ){
  return normalizeSearch(r.codigoSAP).includes(normQ)
    || normalizeSearch(r.textoBreve).includes(normQ)
    || normalizeSearch(r.descripcion).includes(normQ)
    || normalizeSearch(r.alias).includes(normQ)
    || normalizeSearch(r.codigoFabricante).includes(normQ)
    || normalizeSearch(r.nombreManual).includes(normQ)
    || normalizeSearch(r.tipo).includes(normQ)
    || normalizeSearch(r.ubicacionEnPlanta).includes(normQ)
}

function renderMachineManuales(machineId){
  const el = document.getElementById('machine-manuales')
  if (!el) return
  // Si el cache global no está, dispará carga lazy y vuelvé a renderizar
  if (!__manualesCache){
    el.innerHTML = ''
    loadManuales().then(() => {
      const stillThere = document.getElementById('machine-manuales')
      if (stillThere) renderMachineManuales(machineId)
    }).catch(() => {})
    return
  }
  const m = machineMap[machineId]
  const ownerName = m?.nombre || ''
  // Match por ownerId exacto OR por ownerPath que contenga el nombre del equipo
  const matches = __manualesCache.filter(x =>
    x.ownerId === machineId
    || (ownerName && (x.ownerPath || []).some(p => normalizeSearch(p) === normalizeSearch(ownerName)))
  )
  if (matches.length === 0){ el.innerHTML = ''; return }
  el.innerHTML = `
    <div class="section">
      <span class="section-title">Manuales</span>
      <span class="section-count">${matches.length}</span>
    </div>
    <div class="cell-group">${matches.map(manualCellHtml).join('')}</div>`
}

function renderMachineBody(machineId, reps, favLists){
  const m = machineMap[machineId]
  const countEl    = document.getElementById('rep-count')
  const chipsEl    = document.getElementById('rep-chips')
  const listEl     = document.getElementById('rep-list')
  if (!listEl) return  // user navigated away

  if (reps.length === 0){
    if (countEl)   countEl.textContent = '0'
    if (chipsEl)   chipsEl.innerHTML = ''
    listEl.innerHTML = emptyHtml('📭','Sin repuestos','Este equipo no tiene repuestos cargados aún')
    return
  }

  // Search query from DOM
  const searchQ = normalizeSearch(document.getElementById('rep-search-input')?.value || '')

  // Filter chain: favList → search
  let filtered = reps
  if (activeMachineRepFilter){
    const list = favLists.find(l => l.name === activeMachineRepFilter)
    if (list){
      const idSet = new Set(list.repuestoIds)
      filtered = filtered.filter(r => matchesRepFavList(r, idSet))
    }
  }
  if (searchQ){
    filtered = filtered.filter(r =>
      normalizeSearch(r.textoBreve || '').includes(searchQ) ||
      normalizeSearch(r.codigoSAP || '').includes(searchQ) ||
      normalizeSearch(r.alias || '').includes(searchQ) ||
      normalizeSearch(r.descripcion || '').includes(searchQ)
    )
  }

  // FavList chips
  if (chipsEl){
    if (favLists.length > 0){
      chipsEl.innerHTML = `<div class="chips">
        <div class="chip ${activeMachineRepFilter===null?'active':''}"
             onclick="setMachineRepFilter('${escHtmlAttr(machineId)}', null)">
          Todos <span class="count">${reps.length}</span>
        </div>
        ${favLists.map(l => {
          const cnt = reps.filter(r => matchesRepFavList(r, new Set(l.repuestoIds))).length
          return `<div class="chip ${activeMachineRepFilter===l.name?'active':''}"
                   onclick="setMachineRepFilter('${escHtmlAttr(machineId)}', ${escHtmlAttr(JSON.stringify(l.name))})">
            ${escHtml(l.name)} <span class="count">${cnt}</span>
          </div>`
        }).join('')}
      </div>`
    } else {
      chipsEl.innerHTML = ''
    }
  }

  if (countEl) countEl.textContent = filtered.length < reps.length ? `${filtered.length}/${reps.length}` : `${reps.length}`

  if (filtered.length === 0){
    listEl.innerHTML = emptyHtml('🔍','Sin resultados','Ningún repuesto coincide con el filtro')
  } else {
    listEl.innerHTML = `<div class="cell-group">
      ${filtered.map(r => repCellHtml(r, machineId, m.nombre)).join('')}
    </div>`
  }
}

function setMachineRepFilter(machineId, listName){
  activeMachineRepFilter = listName
  Promise.all([
    Promise.resolve(repCache[machineId] || []),
    getMachineFavListsMerged(machineId),

}

async function addMachineToList(machineId, listIdx){
  closeSheet()
  const list = prefs.favoriteLists[listIdx]
  if (!list) return
  if ((list.equipmentIds || []).includes(machineId)){
    showToast('Ya está en esta lista', 'info'); return
  }
  const updated = [...(list.equipmentIds || []), machineId]
  prefs.favoriteLists[listIdx].equipmentIds = updated
  try {
    await trackWrite(db.collection('user_preferences').doc(uid).update({
      [`favoriteLists.${listIdx}.equipmentIds`]: updated,
    }))
    showToast(`Agregado a "${list.name}" ✓`, 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
  } catch(err){
    prefs.favoriteLists[listIdx].equipmentIds = updated.slice(0,-1)
    showToast('Error al guardar', 'err')
  }
}

        favoriteLists: prefs.favoriteLists,

    } catch(err){
      prefs.favoriteLists.pop()
      showToast('Error al crear lista', 'err')
    }
  })
}

  const sl   = list?.subLists?.[subListIdx]
  if (!sl) return
  const msg = `¿Borrar sub-lista "${sl.name}"?${sl.machineIds?.length ? ` Los ${sl.machineIds.length} equipos pasarán a Sin categoría.` : ''}`
  tgApp?.showConfirm(msg, async ok => {
    if (!ok) return
    // Devolver al nivel raíz TODOS los equipos: los de la sub-lista + los de sus sub-sub-listas
    const returning = [
      ...(sl.machineIds || []),
      ...(sl.subLists || []).flatMap(ssl => ssl.machineIds || [])
    ]
    const existingTop = new Set(list.machineIds || [])
    for (const id of returning) existingTop.add(id)
    list.machineIds = [...existingTop]
    list.subLists.splice(subListIdx, 1)
    _renderMachineListView(list, { push: false })
    tgApp?.HapticFeedback?.notificationOccurred('success')
    saveAllPrefs().then(() => {
      showToast('Sub-lista borrada ✓', 'ok')
    }).catch(err => {
      if (IS_PREVIEW) { showToast('Borrada (solo preview)', 'ok'); return }
      list.subLists.splice(subListIdx, 0, sl)
      list.machineIds = [...(list.machineIds||[])].filter(id => !returning.includes(id) || existingTop.has(id))
      _renderMachineListView(list, { push: false })
      showToast('Error: ' + (err.message || ''), 'err')
    })
  })
}

// toIdx:   -1 = Sin categoría  |  ≥0 = índice de sub-lista destino
// ──────────────────────────────────────────────────────────────────────
function showMoveToSubListSheet(listName, machineId, fromIdx){
  const list = prefs.favoriteLists.find(l => l.name === listName)
  if (!list) return
  const subLists = list.subLists || []
  const m = machineMap[machineId] || {}
  const machineName = m.nombre || machineId

  // Opciones: "Sin categoría" + todas las sub-listas excepto la actual
  const options = []
  if (fromIdx >= 0) options.push({ label: '📋 Sin categoría', toIdx: -1 })
  subLists.forEach((sl, i) => {
    if (i !== fromIdx) options.push({ label: `📁 ${sl.name}`, toIdx: i })
  })

  if (options.length === 0){
    showToast('No hay otras sub-listas disponibles', 'info'); return
  }

  const lnAttr  = escHtmlAttr(JSON.stringify(listName))
  const midAttr = escHtmlAttr(machineId)

  document.getElementById('sheet-title').textContent = `Mover "${machineName}" a…`
  document.getElementById('sheet-content').innerHTML = `
    <div class="cell-group" style="margin:0">
      ${options.map(o => `
        <div class="sheet-row" onclick="executeMoveToSubList(${lnAttr},'${midAttr}',${fromIdx},${o.toIdx})">
          <div class="ico">${o.toIdx === -1 ? '📋' : '📁'}</div>
          <div class="body"><div class="name">${escHtml(o.label.replace(/^📋 |^📁 /,''))}</div></div>
        </div>`).join('')}
    </div>`

  favSheetCtx = null
  document.getElementById('sheet-overlay').classList.add('open')
  requestAnimationFrame(() => document.getElementById('sheet').classList.add('open'))
  tgApp?.HapticFeedback?.impactOccurred('light')
}

async function executeMoveToSubList(listName, machineId, fromIdx, toIdx){
  closeSheet()
  const list = prefs.favoriteLists.find(l => l.name === listName)
  if (!list) return
  const subLists = list.subLists || []

  // list.machineIds es la UNIÓN de todos los equipos: no se toca aquí.
  // Solo gestionamos la membresía en sl.machineIds (dentro de qué sub-lista cae).

  // 1. Quitar de la sub-lista origen (si venía de una sub-lista)
  if (fromIdx >= 0){
    const src = subLists[fromIdx]
    if (src) src.machineIds = (src.machineIds || []).filter(id => id !== machineId)
  }
  // Si fromIdx === -1 el equipo estaba "sin categoría" (no en ninguna sl.machineIds) → nada que quitar

  // 2. Agregar a la sub-lista destino (si va a una sub-lista)
  if (toIdx >= 0){
    const dst = subLists[toIdx]
    if (dst && !(dst.machineIds || []).includes(machineId)){
      dst.machineIds = [...(dst.machineIds || []), machineId]
    }
  }
  // Si toIdx === -1 el equipo queda "sin categoría" → ya está en list.machineIds, no hay sl destino

  // Siempre re-renderizar en memoria (datos ya actualizados)
  const destName = toIdx === -1 ? 'Sin categoría' : subLists[toIdx]?.name || ''
  if (fromIdx >= 0){
    openSubList(listName, fromIdx, { push: false })
  } else {
    _renderMachineListView(list, { push: false })
  }

  // Persistir en Firestore (falla silenciosamente en preview)
  saveAllPrefs().then(() => {
    showToast(`Movido a "${destName}" ✓`, 'ok')
    tgApp?.HapticFeedback?.notificationOccurred('success')
  }).catch(err => {
    if (IS_PREVIEW) showToast(`Movido a "${destName}" (preview)`, 'ok')
    else showToast('Error al guardar: ' + (err.message || ''), 'err')
  })
}

// CRUD SUB-SUB-LISTAS

function createSubSubList(listName, subListIdx){
  showInputModal('Nueva sub-sub-lista', '', 'Ej: Zona A, Turno mañana…', async name => {
    if (!name?.trim()) return
    const trimmed = name.trim()
    const list = prefs.favoriteLists.find(l => l.name === listName)
    const sl   = list?.subLists?.[subListIdx]
    if (!sl) return
    if (!sl.subLists) sl.subLists = []
    if (sl.subLists.some(ssl => ssl.name === trimmed)){
      showToast('Ya existe una sub-sub-lista con ese nombre', 'err'); return
    }
    sl.subLists.push({ name: trimmed, machineIds: [] })
    openSubList(listName, subListIdx, { push: false })
    tgApp?.HapticFeedback?.notificationOccurred('success')
    saveAllPrefs().then(() => {
      showToast(`"${trimmed}" creada ✓`, 'ok')
    }).catch(err => {
      if (IS_PREVIEW) { showToast(`"${trimmed}" creada (solo preview)`, 'ok'); return }
      sl.subLists.pop()
      openSubList(listName, subListIdx, { push: false })
      showToast('Error: ' + (err.message || ''), 'err')
    })
  })
}

function renameSubSubList(listName, subListIdx, subSubIdx){
  const list = prefs.favoriteLists.find(l => l.name === listName)
  const sl   = list?.subLists?.[subListIdx]
  const ssl  = sl?.subLists?.[subSubIdx]
  if (!ssl) return
  showInputModal('Renombrar', ssl.name, 'Nuevo nombre', async newName => {
    if (!newName?.trim()) return
    const trimmed = newName.trim()
    if (trimmed === ssl.name) return
    if (sl.subLists.some(s => s.name === trimmed)){
      showToast('Nombre ya usado', 'err'); return
    }
    const prev = ssl.name
    ssl.name = trimmed
    openSubList(listName, subListIdx, { push: false })
    saveAllPrefs().then(() => showToast('Renombrada ✓', 'ok')).catch(err => {
      if (IS_PREVIEW) { showToast('Renombrada (solo preview)', 'ok'); return }
      ssl.name = prev
      openSubList(listName, subListIdx, { push: false })
      showToast('Error: ' + (err.message || ''), 'err')
    })
  })
}

function deleteSubSubList(listName, subListIdx, subSubIdx){
  const list = prefs.favoriteLists.find(l => l.name === listName)
  const sl   = list?.subLists?.[subListIdx]
  const ssl  = sl?.subLists?.[subSubIdx]
  if (!ssl) return
  const msg = `¿Borrar "${ssl.name}"?${ssl.machineIds?.length
    ? ` Los ${ssl.machineIds.length} equipos pasarán a Sin categoría.` : ''}`
  tgApp?.showConfirm(msg, async ok => {
    if (!ok) return
    // Devolver equipos al nivel raíz de la sub-lista
    const returning = ssl.machineIds || []
    const existingIds = new Set(sl.machineIds || [])
    for (const id of returning) existingIds.add(id)
    sl.machineIds = [...existingIds]
    sl.subLists.splice(subSubIdx, 1)
    openSubList(listName, subListIdx, { push: false })
    tgApp?.HapticFeedback?.notificationOccurred('success')
    saveAllPrefs().then(() => showToast('Borrada ✓', 'ok')).catch(err => {
      if (IS_PREVIEW) { showToast('Borrada (solo preview)', 'ok'); return }
      sl.subLists.splice(subSubIdx, 0, ssl)
      sl.machineIds = [...(sl.machineIds||[])].filter(id => !returning.includes(id) || existingIds.has(id))
      openSubList(listName, subListIdx, { push: false })
      showToast('Error: ' + (err.message || ''), 'err')
    })
  })
}
