<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d1722" />
    <meta name="description" content="Sistema de gestión de mantenimiento industrial y levantamiento de incidencias" />
    <!-- CSP conservador: el sitio canónico es GitHub Pages, que NO soporta headers HTTP
         custom (los de firebase.json solo aplican al hosting secundario, casi sin uso —
         confirmado con curl: GitHub Pages hoy no manda NINGÚN header de seguridad). Un
         <meta> CSP es la única vía disponible aquí, pero el spec IGNORA frame-ancestors/
         sandbox/report-uri en <meta> — la protección contra clickjacking (embeber esta
         app en un iframe ajeno) NO es alcanzable así; requeriría mover el hosting.
         Deliberadamente permisivo en connect-src/img-src/frame-src (https: genérico) para
         no romper embeds/mapas/APIs externas que no se pudieron probar todas en esta
         sesión — bloquea lo más peligroso: script-src fuera de https:, object-src,
         base-uri y form-action a dominios ajenos. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;
      style-src 'self' 'unsafe-inline' https:;
      img-src 'self' data: blob: https:;
      font-src 'self' data: https:;
      media-src 'self' data: blob: https:;
      connect-src 'self' https: wss: http://localhost:* http://127.0.0.1:*;
      frame-src 'self' https:;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="icon" type="image/svg+xml" href="/mantenimiento-planta/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/mantenimiento-planta/icons/icon-192.svg" />
    <link rel="manifest" href="/mantenimiento-planta/manifest.json" />
    <title>Mantenimiento Industrial</title>
    <!-- SPA redirect: restaurar la URL original guardada por 404.html (GitHub Pages) -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          window.history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <!-- Script inline para aplicar tema antes de que React cargue (evita flash) -->
    <script>
      (function() {
        const theme = localStorage.getItem('app-theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
        // theme-color del chrome móvil acorde al tema, antes de que cargue React
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', theme === 'dark' ? '#0d1722' : '#d7e5f2');
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
