<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Sistema de gestión de mantenimiento industrial y levantamiento de incidencias" />
    <!--
      Content Security Policy — defensa en profundidad contra XSS.
      script-src ya NO incluye 'unsafe-inline' para el documento principal:
      el único bootstrap pre-React vive en /boot.js (no inline). style-src
      mantiene 'unsafe-inline' porque Tailwind/React generan style attrs
      inline pervasivos; endurecer eso requiere refactor mayor.
        object-src 'none' — bloquea <object>, <embed>, <applet> (vectores legacy).
        base-uri 'self'   — bloquea <base href="evil.com"> que reescribe URLs relativas.
        form-action 'self' — evita formularios que se exfiltren a otros dominios.
        frame-ancestors 'none' — bloquea iframes externos (clickjacking).
      Nota: las ventanas de impresión (window.open('') + document.write con
      <script> inline en BodegaView.tsx / pdfExport.ts) heredan este CSP en
      algunos navegadores. Si fallan tras este cambio, mover a Blob URL o
      srcdoc en lugar de document.write.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://accounts.google.com https://www.gstatic.com https://www.google.com https://www.recaptcha.net;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: https:;
      font-src 'self' data:;
      connect-src 'self' https: wss:;
      frame-src 'self' https://accounts.google.com https://www.google.com https://www.recaptcha.net;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests
    " />
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="icon" type="image/svg+xml" href="/mantenimiento-planta/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/mantenimiento-planta/icons/icon-192.svg" />
    <link rel="manifest" href="/mantenimiento-planta/manifest.json" />
    <title>Mantenimiento Industrial</title>
    <!-- Bootstrap pre-React (SPA redirect + tema) — extraído de inline para CSP estricta -->
    <script src="/mantenimiento-planta/boot.js"></script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
