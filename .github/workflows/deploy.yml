name: Deploy PWA to GitHub Pages
# Version: v2.2.31 - Updated: 2026-02-16

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate SPA route collisions (GitHub Pages)
        run: node scripts/validate-gh-pages-route-collisions.mjs

      - name: Type check
        working-directory: apps/pwa
        run: pnpm exec tsc --noEmit

      - name: Lint
        working-directory: apps/pwa
        run: pnpm exec eslint . --max-warnings 30

      - name: Build PWA
        working-directory: apps/pwa
        env:
          # Firebase config (pública por diseño — seguridad via Firestore rules + App Check)
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: mantenimiento-planta-771a3.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL: https://mantenimiento-planta-771a3-default-rtdb.firebaseio.com
          VITE_FIREBASE_PROJECT_ID: mantenimiento-planta-771a3
          VITE_FIREBASE_STORAGE_BUCKET: mantenimiento-planta-771a3.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1019421112530"
          VITE_FIREBASE_APP_ID: "1:1019421112530:web:9afd9962e0b53152f8d50b"
          # App Check (reCAPTCHA Enterprise site key — pública por diseño, valida origen)
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          # NO inyectar API keys de IA en el bundle. Toda llamada a Groq/Gemini/Deepseek
          # va por Cloud Functions proxy (groqProxy/geminiProxy/deepseekProxy) que leen
          # las keys desde GCP Secret Manager y validan request.auth + App Check.
        run: pnpm build

      - name: Include Chonchi weather demo
        run: |
          mkdir -p apps/pwa/dist/demo/assets
          cp docs/DEMO_CLIMA_PUERTO_CHONCHI.html apps/pwa/dist/demo/clima-puerto-chonchi.html
          cp -R docs/assets/. apps/pwa/dist/demo/assets/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/pwa/dist'

  deploy:
    timeout-minutes: 20
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment_attempt_1.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment_attempt_1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
          error_count: 5
          reporting_interval: 5000

      - name: Wait before retry
        if: steps.deployment_attempt_1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment
        if: steps.deployment_attempt_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
          error_count: 5
          reporting_interval: 5000

      - name: Fail if both attempts failed
        if: steps.deployment_attempt_1.outcome == 'failure' && steps.deployment.outcome == 'failure'
        run: |
          echo "Deploy a GitHub Pages falló en ambos intentos."
          exit 1

      - name: Notificar deploy exitoso (ntfy)
        if: success()
        run: |
          curl -s -X POST \
            -H "Title: ✅ Deploy completado" \
            -H "Tags: rocket" \
            -H "Priority: default" \
            -d "GitHub Pages actualizado correctamente 🚀" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true

      - name: Notificar deploy fallido (ntfy)
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: ❌ Deploy falló" \
            -H "Tags: warning" \
            -H "Priority: high" \
            -d "El deploy a GitHub Pages falló. Revisa los logs." \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true
