name: Deploy PWA to GitHub Pages
# Version: v2.2.31 - Updated: 2026-02-16

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@9.15.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        working-directory: apps/pwa
        run: pnpm exec tsc --noEmit

      - name: Lint
        working-directory: apps/pwa
        run: pnpm lint

      - name: Build PWA
        working-directory: apps/pwa
        env: 
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: pnpm build
        # Firebase config está hardcodeada en el código (segura para cliente)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/pwa/dist'

  deploy:
    timeout-minutes: 20
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment_attempt_1.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment_attempt_1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
          error_count: 5
          reporting_interval: 5000

      - name: Wait before retry
        if: steps.deployment_attempt_1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment
        if: steps.deployment_attempt_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
          error_count: 5
          reporting_interval: 5000

      - name: Fail if both attempts failed
        if: steps.deployment_attempt_1.outcome == 'failure' && steps.deployment.outcome == 'failure'
        run: |
          echo "Deploy a GitHub Pages falló en ambos intentos."
          exit 1
