name: Deploy Firebase Functions
# Se ejecuta automáticamente cuando hay cambios en functions/ en la rama main.
# Requiere el secret FIREBASE_TOKEN configurado en el repositorio.
# Para obtener el token: ejecutar "firebase login:ci" en tu computador.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'          # Solo cuando cambia algo en functions/
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:            # Permite dispararlo manualmente desde GitHub

# Permisos mínimos necesarios (solo lectura del repo)
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        working-directory: functions
        run: npm ci                  # Instalación limpia y reproducible desde lockfile

      - name: Install Firebase CLI
        # Versión fija para evitar cambios inesperados
        run: npm install -g firebase-tools@15.11.0

      - name: Write functions .env (secrets → archivo)
        env:
          FUNCTIONS_ENV: ${{ secrets.FUNCTIONS_ENV }}
        run: |
          # Si el secret FUNCTIONS_ENV existe, escribirlo como functions/.env
          # Esto asegura que las funciones nuevas tengan acceso a TELEGRAM_BOT_TOKEN, etc.
          if [ -n "$FUNCTIONS_ENV" ]; then
            printf '%s\n' "$FUNCTIONS_ENV" > functions/.env
            echo "✅ functions/.env escrito desde FUNCTIONS_ENV secret"
          else
            echo "⚠️  FUNCTIONS_ENV secret no configurado — funciones nuevas pueden no tener env vars"
          fi

      - name: Deploy Cloud Functions
        working-directory: .
        # El service account se pasa por env (NO interpolar `${{ secrets }}` inline:
        # eso mangla el JSON y rompe la auth). `printf '%s'` preserva el contenido exacto.
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only functions --project mantenimiento-planta-771a3 --non-interactive
          rm -f /tmp/sa.json

      - name: Notificar deploy exitoso
        if: success()
        run: |
          curl -s -X POST \
            -H "Title: ✅ Functions desplegadas" \
            -H "Tags: rocket" \
            -H "Priority: default" \
            -d "Firebase Functions actualizadas correctamente en main 🚀" \
            https://ntfy.sh/mis-notificaciones-claude || true

      - name: Notificar deploy fallido
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: ❌ Deploy Functions falló" \
            -H "Tags: warning" \
            -H "Priority: high" \
            -d "El deploy de Firebase Functions falló. Revisa los logs en GitHub Actions." \
            https://ntfy.sh/mis-notificaciones-claude || true
