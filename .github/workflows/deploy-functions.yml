name: Deploy Firebase Functions
# Se ejecuta automáticamente cuando hay cambios en functions/ en la rama main.
# Requiere el secret FIREBASE_TOKEN configurado en el repositorio.
# Para obtener el token: ejecutar "firebase login:ci" en tu computador.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'          # Solo cuando cambia algo en functions/
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:            # Permite dispararlo manualmente desde GitHub

# Permisos mínimos necesarios (solo lectura del repo)
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        working-directory: functions
        run: npm ci                  # Instalación limpia y reproducible desde lockfile

      - name: Install Firebase CLI
        # Versión fija para evitar cambios inesperados
        run: npm install -g firebase-tools@15.11.0

      # NOTA: Las scheduled functions (checkClimaPortoAlert, purgeSensorReadings)
      # estan excluidas porque el service account del CI no tiene el rol
      # "Cloud Scheduler Admin" necesario para actualizar los jobs de Cloud Scheduler.
      # Para re-habilitarlas:
      #   1. Firebase Console -> IAM -> SA del CI -> agregar rol
      #      "Cloud Scheduler Admin" (roles/cloudscheduler.admin)
      #   2. Eliminar el flag --only de esta linea y volver a "--only functions"
      - name: Deploy Cloud Functions (excluye scheduled sin permisos IAM)
        working-directory: .
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy \
            --only "functions:sendGanttAlert,functions:onIncidentCreated,functions:onIncidentUpdated,functions:sendTestNotification,functions:onPreventiveTaskCreated,functions:onPreventiveExecutionCreated,functions:groqProxy,functions:geminiProxy,functions:deepseekProxy,functions:purgeSensorReadingsManual,functions:cacheDmStatus,functions:runClimaPortoCheck,functions:scheduleClimaPortoTestNotification,functions:sitportProxy" \
            --non-interactive
          rm -f /tmp/sa.json
          echo "::warning title=Scheduled functions omitidas::checkClimaPortoAlert y purgeSensorReadings no se deployaron. Requiere rol 'Cloud Scheduler Admin' en el SA del CI."

      - name: Notificar deploy exitoso
        if: success()
        run: |
          curl -s -X POST \
            -H "Title: ✅ Functions desplegadas" \
            -H "Tags: rocket" \
            -H "Priority: default" \
            -d "Firebase Functions actualizadas correctamente en main 🚀" \
            https://ntfy.sh/mis-notificaciones-claude || true

      - name: Notificar deploy fallido
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: ❌ Deploy Functions falló" \
            -H "Tags: warning" \
            -H "Priority: high" \
            -d "El deploy de Firebase Functions falló. Revisa los logs en GitHub Actions." \
            https://ntfy.sh/mis-notificaciones-claude || true
