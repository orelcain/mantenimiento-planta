name: Deploy Firestore + Storage Rules & Indexes

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Firebase CLI
        # 15.22.3: 15.11.0 fallaba auth con service account vía ADC en runner Linux.
        run: npm install -g firebase-tools@15.22.3

      - name: Deploy Firestore + Storage Rules & Indexes
        # SA por env + printf (no interpolar `${{ secrets }}` inline, que mangla el JSON).
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only firestore:rules,firestore:indexes,storage --project mantenimiento-planta-771a3 --non-interactive
          rm -f /tmp/sa.json

      - name: Notificar deploy exitoso
        if: success()
        run: |
          curl -s -X POST \
            -H "Title: Firestore Rules desplegadas" \
            -H "Tags: shield" \
            -H "Priority: default" \
            -d "Firestore rules e indexes actualizados en main" \
            https://ntfy.sh/mis-notificaciones-claude || true

      - name: Notificar deploy fallido
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: Deploy Firestore Rules fallo" \
            -H "Tags: warning" \
            -H "Priority: high" \
            -d "El deploy de Firestore rules fallo. Revisa los logs." \
            https://ntfy.sh/mis-notificaciones-claude || true
