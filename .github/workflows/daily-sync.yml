name: Daily Sync (versions)

on:
  schedule:
    # Diario 03:15 hora Chile (America/Santiago).
    # GitHub Actions usa cron en UTC, por eso programamos 06:15 UTC.
    # Nota: si cambia el horario de verano, puede correrse 1h.
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  TZ: 'America/Santiago'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run version sync
        run: pnpm sync:version:pwa

      - name: Commit and push (if changed)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: daily sync $(date +%F)"
          git push
