<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipos Pro - Test Completo</title>

        * { transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease; }

        .view-list .equipment-card > div { flex: 1; }

            body { padding: 0 !important; }
            body > div { display: none !important; }
            #modal { position: static !important; inset: auto !important; display: block !important; background: transparent !important; padding: 0 !important; }
            #modal > div { box-shadow: none !important; max-height: none !important; }
            #closeModal { display: none !important; }
        }
    </style>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>

                    </div>

                <div class="flex items-center justify-between">

                    <option value="en_mantenimiento">En Mantenimiento</option>
                    <option value="fuera_servicio">Fuera de Servicio</option>

                    <option value="alta">Alta</option>

            <div class="flex items-center justify-between text-sm">

                    <button id="btnClearFilters" class="text-gray-600 dark:text-gray-400 hover:underline">Limpiar filtros</button>

            </div>
        </div>

        <!-- Equipment Grid/List -->
        <div id="equipmentContainer" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Se llena con JS -->
        </div>

        <!-- Pagination -->
        <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow flex items-center justify-between">
            <div class="text-sm text-gray-600 dark:text-gray-400" id="pageInfo">Página 1 de 2</div>
            <div class="flex gap-2" id="pagination"></div>
        </div>

    </div>

    <!-- Modal Detalle -->

            <div class="p-6 border-b dark:border-gray-700 flex justify-between items-start">
                <div>
                    <div class="flex items-center gap-3">
                        <h2 id="modalTitle" class="text-2xl font-bold">Equipo</h2>
                        <button id="modalFav" class="text-yellow-500 hover:scale-110">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                        </button>
                    </div>
                    <div class="flex gap-2 mt-2">

                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div class="p-6">
                <div class="flex gap-4 border-b dark:border-gray-700 mb-4">

                    <button class="tab-btn pb-2" data-tab="notes">Notas</button>
                    <button class="tab-btn pb-2" data-tab="qr">QR</button>
                </div>

                <div id="tabInfo" class="tab-content">
                    <div id="modalInfo" class="space-y-4"></div>
                </div>

                <div id="tabHistory" class="tab-content hidden">
                    <div id="modalHistory" class="space-y-3"></div>
                </div>

                <div id="tabNotes" class="tab-content hidden">
                    <div class="space-y-3">
                        <textarea id="noteInput" class="w-full p-3 border dark:border-gray-700 dark:bg-gray-900 rounded-lg" rows="4" placeholder="Escribe una nota rápida..."></textarea>
                        <button id="btnAddNote" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Guardar Nota</button>

                </div>
            </div>

            <div class="p-4 border-t dark:border-gray-700 flex gap-2 justify-end">
                <button class="px-4 py-2 border dark:border-gray-700 rounded hover:bg-gray-100 dark:hover:bg-gray-700">Ver Jerarquía</button>
                <button id="btnPrint" class="px-4 py-2 border dark:border-gray-700 rounded hover:bg-gray-100 dark:hover:bg-gray-700">Imprimir ficha</button>
                <button id="btnShare" class="px-4 py-2 border dark:border-gray-700 rounded hover:bg-gray-100 dark:hover:bg-gray-700">Compartir</button>
                <button class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Editar</button>
            </div>
        </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        // Mock Data
        const equipos = Array.from({length: 24}, (_, i) => ({
            id: i + 1,
            codigo: `EQ-${String(i + 1).padStart(3, '0')}`,
            nombre: ['Bomba Centrífuga', 'Motor Eléctrico', 'Compresor', 'Válvula Control', 'Sensor Temperatura'][i % 5] + ` ${i + 1}`,
            ubicacion: ['Planta A', 'Planta B', 'Almacén'][i % 3],
            estado: ['operativo', 'en_mantenimiento', 'fuera_servicio'][i % 3],
            criticidad: ['alta', 'media', 'baja'][i % 3],
            marca: ['Siemens', 'ABB', 'Schneider'][i % 3],
            modelo: `MOD-${i}`,
            tags: [],
            notes: []
        }));

        // Historial mock (determinístico) por equipo
        const incidentTypes = ['Correctivo', 'Preventivo', 'Predictivo'];
        const incidentStatus = ['abierta', 'en_proceso', 'cerrada'];
        const incidentPriority = ['alta', 'media', 'baja'];

        function buildIncidentsForEquipo(equipoId) {
            const count = (equipoId % 4) + 1;
            const list = [];
            for (let idx = 0; idx < count; idx++) {
                const daysAgo = (equipoId * 7 + idx * 11) % 120;
                const date = new Date(Date.now() - daysAgo * 24 * 60 * 60 * 1000);
                const tipo = incidentTypes[(equipoId + idx) % incidentTypes.length];
                const estado = incidentStatus[(equipoId + idx * 2) % incidentStatus.length];
                const prioridad = incidentPriority[(equipoId + idx * 3) % incidentPriority.length];
                list.push({
                    id: `${equipoId}-${idx}`,
                    fecha: date.toISOString().slice(0, 10),
                    tipo,
                    estado,
                    prioridad,
                    titulo: `${tipo}: Evento ${idx + 1} (${ensureTitleCase(prioridad)})`
                });
            }
            return list.sort((a, b) => b.fecha.localeCompare(a.fecha));
        }

        const incidentsByEquipo = new Map(equipos.map(e => [e.id, buildIncidentsForEquipo(e.id)]));

        const state = {
            darkMode: false,
            viewMode: 'grid',
            compact: false,
            favorites: new Set([1, 5, 10]),
            selected: new Set(),
            filters: { search: '', status: '', criticality: '', favOnly: false },
            sort: 'nombre',
            page: 1,
            perPage: 12,
            currentEquipo: null
        };

        const STORAGE_KEY = 'equipos_test_v2_state_v1';

        // Utils
        const $ = id => document.getElementById(id);
        const $$ = sel => document.querySelectorAll(sel);

        function ensureTitleCase(value) {
            if (!value) return '';
            return value.charAt(0).toUpperCase() + value.slice(1);
        }

        function persistState() {
            const data = {
                darkMode: document.documentElement.classList.contains('dark'),
                viewMode: state.viewMode,
                compact: state.compact,
                favorites: [...state.favorites],
                filters: state.filters,
                sort: state.sort,
                perPage: state.perPage
            };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch {
                // ignore
            }
        }

        function restoreState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);

                if (data.darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                state.viewMode = data.viewMode ?? state.viewMode;
                state.compact = !!data.compact;
                state.favorites = new Set(Array.isArray(data.favorites) ? data.favorites : [...state.favorites]);
                state.filters = data.filters ?? state.filters;
                state.sort = data.sort ?? state.sort;
                state.perPage = typeof data.perPage === 'number' ? data.perPage : state.perPage;

                $('search').value = state.filters.search ?? '';
                $('filterStatus').value = state.filters.status ?? '';
                $('filterCriticality').value = state.filters.criticality ?? '';
                $('sortBy').value = state.sort ?? 'nombre';

                if (state.filters.favOnly) {
                    $('btnFavs').classList.add('bg-yellow-100', 'dark:bg-yellow-900');
                }
            } catch {
                // ignore
            }
        }

        function closeSuggestions() {
            $('suggestions').classList.add('hidden');
            $('suggestions').innerHTML = '';
        }

        function renderSuggestions(query) {
            const el = $('suggestions');
            const q = (query ?? '').trim().toLowerCase();
            if (!q) return closeSuggestions();

            const matches = equipos
                .map(e => {
                    const haystack = `${e.nombre} ${e.codigo} ${e.ubicacion}`.toLowerCase();
                    const score = haystack.includes(q) ? (e.nombre.toLowerCase().startsWith(q) ? 0 : 1) : 99;
                    return { e, score };
                })
                .filter(x => x.score !== 99)
                .sort((a, b) => a.score - b.score || a.e.nombre.localeCompare(b.e.nombre))
                .slice(0, 8)
                .map(x => x.e);

            if (matches.length === 0) return closeSuggestions();

            el.innerHTML = matches.map(e => `
                <button type="button" class="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700">
                    <div class="text-sm font-medium">${e.nombre}</div>
                    <div class="text-xs text-gray-600 dark:text-gray-400 font-mono">${e.codigo} · ${e.ubicacion}</div>
                </button>
            `).join('');

            [...el.querySelectorAll('button')].forEach((btn, idx) => {
                btn.addEventListener('click', () => {
                    const chosen = matches[idx];
                    state.filters.search = chosen.codigo;
                    $('search').value = chosen.codigo;
                    state.page = 1;
                    closeSuggestions();
                    persistState();
                    render();
                });
            });

            el.classList.remove('hidden');
        }

        function applyFilters() {
            let filtered = [...equipos];
            
            if (state.filters.search) {
                const s = state.filters.search.toLowerCase();
                filtered = filtered.filter(e => 
                    e.nombre.toLowerCase().includes(s) || 
                    e.codigo.toLowerCase().includes(s) ||
                    e.ubicacion.toLowerCase().includes(s)
                );
            }
            
            if (state.filters.status) filtered = filtered.filter(e => e.estado === state.filters.status);
            if (state.filters.criticality) filtered = filtered.filter(e => e.criticidad === state.filters.criticality);
            if (state.filters.favOnly) filtered = filtered.filter(e => state.favorites.has(e.id));
            
            // Sort
            filtered.sort((a, b) => {
                if (state.sort === 'nombre') return a.nombre.localeCompare(b.nombre);
                if (state.sort === 'codigo') return a.codigo.localeCompare(b.codigo);
                if (state.sort === 'criticidad') {
                    const order = { alta: 0, media: 1, baja: 2 };
                    return order[a.criticidad] - order[b.criticidad];
                }
                if (state.sort === 'estado') return a.estado.localeCompare(b.estado);
            });
            
            return filtered;
        }

        function clampPage(totalPages) {
            if (totalPages <= 0) {
                state.page = 1;
                return;
            }
            if (state.page < 1) state.page = 1;
            if (state.page > totalPages) state.page = totalPages;
        }

        function renderPagination(totalPages) {
            const container = $('pagination');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            const parts = [];
            const page = state.page;

            const addBtn = (label, target, disabled, active) => {
                const cls = active
                    ? 'bg-blue-600 text-white'
                    : 'bg-white dark:bg-gray-800 border dark:border-gray-700';
                const dis = disabled ? 'opacity-50 pointer-events-none' : '';
                parts.push(`<button onclick="state.page=${target};persistState();render()" class="px-3 py-1 ${cls} rounded ${dis}">${label}</button>`);
            };

            addBtn('◀', Math.max(1, page - 1), page === 1, false);

            const windowPages = new Set([1, totalPages, page - 1, page, page + 1].filter(n => n >= 1 && n <= totalPages));
            const sorted = [...windowPages].sort((a, b) => a - b);
            for (let i = 0; i < sorted.length; i++) {
                const p = sorted[i];
                const prev = sorted[i - 1];
                if (i > 0 && p - prev > 1) {
                    parts.push('<span class="px-2 text-gray-500">…</span>');
                }
                addBtn(String(p), p, false, p === page);
            }

            addBtn('▶', Math.min(totalPages, page + 1), page === totalPages, false);
            container.innerHTML = parts.join('');
        }

        function render() {
            const filtered = applyFilters();
            const total = filtered.length;
            const pages = Math.ceil(total / state.perPage);
            clampPage(pages);
            const start = (state.page - 1) * state.perPage;
            const items = filtered.slice(start, start + state.perPage);
            
            // Stats
            $('statTotal').textContent = equipos.length;
            $('statOk').textContent = equipos.filter(e => e.estado === 'operativo').length;
            $('resultCount').textContent = `${total} equipos encontrados`;
            $('pageInfo').textContent = `Página ${state.page} de ${pages}`;
            
            // Equipment Cards
            const container = $('equipmentContainer');
            container.className = state.viewMode === 'grid' 
                ? `grid ${state.compact ? 'md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6' : 'md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4'} gap-4`
                : 'space-y-2 view-list';
                
            container.innerHTML = items.map(e => `
                <div class="equipment-card bg-white dark:bg-gray-800 rounded-lg shadow hover:shadow-lg transition border-2 ${state.selected.has(e.id) ? 'border-blue-500' : 'border-transparent'} cursor-pointer p-4">
                    <div class="flex items-start justify-between mb-3">
                        <input type="checkbox" ${state.selected.has(e.id) ? 'checked' : ''} onchange="toggleSelect(${e.id})" onclick="event.stopPropagation()" class="mr-2">
                        <div class="flex-1 min-w-0" onclick="showDetail(${e.id})">
                            <h3 class="font-semibold truncate">${e.nombre}</h3>
                            <p class="text-xs text-gray-600 dark:text-gray-400 font-mono">${e.codigo}</p>
                        </div>
                        <button onclick="event.stopPropagation(); toggleFav(${e.id})" class="ml-2">
                            <svg class="w-5 h-5 ${state.favorites.has(e.id) ? 'text-yellow-500 fill-current' : 'text-gray-400'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                        </button>
                    </div>
                    <div onclick="showDetail(${e.id})" class="space-y-2">
                        <div class="flex gap-2 flex-wrap">
                            <span class="px-2 py-1 text-xs rounded ${e.estado === 'operativo' ? 'bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200' : e.estado === 'en_mantenimiento' ? 'bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200' : 'bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200'}">${e.estado}</span>
                            <span class="px-2 py-1 text-xs rounded ${e.criticidad === 'alta' ? 'bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200' : e.criticidad === 'media' ? 'bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200' : 'bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200'}">${e.criticidad}</span>
                        </div>
                        <p class="text-xs text-gray-600 dark:text-gray-400">${e.ubicacion}</p>
                    </div>
                </div>
            `).join('');
            
            // Pagination
            renderPagination(pages);
            
            updateChart();
        }

        function updateChart() {
            const ctx = $('statsChart').getContext('2d');
            if (window.chart) window.chart.destroy();
            const isDark = document.documentElement.classList.contains('dark');
            window.chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Operativo', 'Mantenimiento', 'Fuera Servicio'],
                    datasets: [{
                        data: [
                            equipos.filter(e => e.estado === 'operativo').length,
                            equipos.filter(e => e.estado === 'en_mantenimiento').length,
                            equipos.filter(e => e.estado === 'fuera_servicio').length
                        ],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                        borderColor: isDark ? '#111827' : '#ffffff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: { legend: { display: false } }
                }
            });
        }

        function showDetail(id) {
            const equipo = equipos.find(e => e.id === id);
            state.currentEquipo = equipo;
            
            $('modalTitle').textContent = equipo.nombre;
            $('modalCode').textContent = equipo.codigo;
            $('modalStatus').textContent = equipo.estado;
            $('modalCrit').textContent = equipo.criticidad;
            const incidents = incidentsByEquipo.get(id) || [];
            $('histCount').textContent = incidents.length;
            
            $('modalInfo').innerHTML = `
                <div class="grid md:grid-cols-2 gap-4">
                    <div><strong>Marca:</strong> ${equipo.marca}</div>
                    <div><strong>Modelo:</strong> ${equipo.modelo}</div>
                    <div><strong>Ubicación:</strong> ${equipo.ubicacion}</div>
                    <div><strong>Criticidad:</strong> ${equipo.criticidad}</div>
                </div>
            `;
            
            // QR Code
            $('qrcode').innerHTML = '';
            new QRCode($('qrcode'), {
                text: `EQUIPO:${equipo.codigo}`,
                width: 200,
                height: 200
            });
            
            // Notes
            $('notesList').innerHTML = (equipo.notes || []).map(note => 
                `<div class="p-3 bg-gray-50 dark:bg-gray-900 rounded"><p class="text-sm">${note.text}</p><span class="text-xs text-gray-500">${note.date}</span></div>`
            ).join('');

            // History (timeline simple)
            const historyEl = $('modalHistory');
            if (!historyEl) {
                // nothing
            } else if (incidents.length === 0) {
                historyEl.innerHTML = `<div class="text-sm text-gray-600 dark:text-gray-400">Sin incidencias registradas.</div>`;
            } else {
                historyEl.innerHTML = incidents.map((inc, index) => {
                    const tipoClass = inc.tipo === 'Correctivo'
                        ? 'bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200'
                        : inc.tipo === 'Preventivo'
                            ? 'bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200'
                            : 'bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200';
                    const priClass = inc.prioridad === 'alta'
                        ? 'bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200'
                        : inc.prioridad === 'media'
                            ? 'bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200'
                            : 'bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200';
                    const statusClass = inc.estado === 'cerrada'
                        ? 'bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200'
                        : inc.estado === 'en_proceso'
                            ? 'bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200'
                            : 'bg-purple-100 dark:bg-purple-900 text-purple-800 dark:text-purple-200';
                    return `
                        <div class="flex gap-3">
                            <div class="flex flex-col items-center">
                                <div class="w-3 h-3 rounded-full bg-blue-600"></div>
                                ${index === incidents.length - 1 ? '' : '<div class="w-px flex-1 bg-gray-300 dark:bg-gray-700" style="min-height: 24px"></div>'}
                            </div>
                            <div class="flex-1 p-3 border dark:border-gray-700 rounded-lg">
                                <div class="flex items-start justify-between gap-2">
                                    <div>
                                        <div class="font-medium">${inc.titulo}</div>
                                        <div class="text-xs text-gray-600 dark:text-gray-400">${inc.fecha}</div>
                                    </div>
                                    <span class="px-2 py-1 text-xs rounded ${statusClass}">${ensureTitleCase(inc.estado.replace('_', ' '))}</span>
                                </div>
                                <div class="flex gap-2 mt-2 flex-wrap">
                                    <span class="px-2 py-1 text-xs rounded ${tipoClass}">${inc.tipo}</span>
                                    <span class="px-2 py-1 text-xs rounded ${priClass}">${ensureTitleCase(inc.prioridad)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            $('modal').classList.remove('hidden');
            $('modal').classList.add('flex');
        }

        function toggleFav(id) {
            state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
            render();
        }

        function toggleSelect(id) {
            state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
            render();
        }

        function exportToExcel() {
            const filtered = applyFilters();
            const selectedIds = [...state.selected];
            const rows = selectedIds.length > 0
                ? filtered.filter(e => state.selected.has(e.id))
                : filtered;
            const fileName = selectedIds.length > 0 ? 'equipos_seleccionados.xlsx' : 'equipos.xlsx';
            const data = rows.map(e => ({
                Código: e.codigo,
                Nombre: e.nombre,
                Ubicación: e.ubicacion,
                Estado: e.estado,
                Criticidad: e.criticidad,
                Marca: e.marca,
                Modelo: e.modelo
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Equipos');
            XLSX.writeFile(wb, fileName);
        }

        // Event Listeners
        $('btnDarkMode').onclick = () => {
            state.darkMode = !state.darkMode;
            document.documentElement.classList.toggle('dark');
            persistState();
            updateChart();
        };
        
        $('btnViewMode').onclick = () => {
            state.viewMode = state.viewMode === 'grid' ? 'list' : 'grid';
            persistState();
            render();
        };
        
        $('btnCompact').onclick = () => {
            state.compact = !state.compact;
            persistState();
            render();
        };
        
        $('btnFavs').onclick = () => {
            state.filters.favOnly = !state.filters.favOnly;
            $('btnFavs').classList.toggle('bg-yellow-100');
            $('btnFavs').classList.toggle('dark:bg-yellow-900');
            persistState();
            render();
        };
        
        $('btnExport').onclick = exportToExcel;
        
        $('search').oninput = e => {
            state.filters.search = e.target.value;
            state.page = 1;
            renderSuggestions(state.filters.search);
            persistState();
            render();
        };
        
        $('filterStatus').onchange = e => {
            state.filters.status = e.target.value;
            state.page = 1;
            persistState();
            render();
        };
        
        $('filterCriticality').onchange = e => {
            state.filters.criticality = e.target.value;
            state.page = 1;
            persistState();
            render();
        };
        
        $('sortBy').onchange = e => {
            state.sort = e.target.value;
            persistState();
            render();
        };
        
        $('btnSelectAll').onclick = () => {
            const filtered = applyFilters();
            filtered.forEach(e => state.selected.add(e.id));
            render();
        };

        $('btnClearSelection').onclick = () => {
            state.selected.clear();
            render();
        };
        
        $('btnClearFilters').onclick = () => {
            state.filters = { search: '', status: '', criticality: '', favOnly: false };
            $('search').value = '';
            $('filterStatus').value = '';
            $('filterCriticality').value = '';
            closeSuggestions();
            $('btnFavs').classList.remove('bg-yellow-100', 'dark:bg-yellow-900');
            persistState();
            render();
        };
        
        $('closeModal').onclick = () => {
            $('modal').classList.add('hidden');
            $('modal').classList.remove('flex');
        };

        $('btnPrint').onclick = () => window.print();

        $('btnShare').onclick = async () => {
            const eq = state.currentEquipo;
            if (!eq) return;
            const text = `${eq.nombre} (${eq.codigo})\nUbicación: ${eq.ubicacion}\nEstado: ${eq.estado}\nCriticidad: ${eq.criticidad}`;
            try {
                if (navigator.share) {
                    await navigator.share({ title: 'Equipo', text });
                } else if (navigator.clipboard) {
                    await navigator.clipboard.writeText(text);
                    alert('Copiado al portapapeles');
                } else {
                    alert(text);
                }
            } catch {
                // ignore
            }
        };

        $('modalFav').onclick = () => {
            if (!state.currentEquipo) return;
            toggleFav(state.currentEquipo.id);
        };
        
        $('btnAddNote').onclick = () => {
            const text = $('noteInput').value.trim();
            if (text && state.currentEquipo) {
                if (!state.currentEquipo.notes) state.currentEquipo.notes = [];
                state.currentEquipo.notes.push({ text, date: new Date().toLocaleString() });
                $('noteInput').value = '';
                showDetail(state.currentEquipo.id);
            }
        };

        document.addEventListener('click', (e) => {
            const s = $('suggestions');
            if (!s) return;
            if (s.classList.contains('hidden')) return;
            const wrap = $('search')?.parentElement;
            if (wrap && !wrap.contains(e.target)) closeSuggestions();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeSuggestions();
                $('modal').classList.add('hidden');
                $('modal').classList.remove('flex');
                return;
            }
            if (e.key === '/' && document.activeElement !== $('search')) {
                e.preventDefault();
                $('search').focus();
                return;
            }
            if (e.key === 'd' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                $('btnDarkMode').click();
                return;
            }
            if (e.key === 'ArrowLeft') {
                const filtered = applyFilters();
                const pages = Math.ceil(filtered.length / state.perPage);
                if (pages > 1 && state.page > 1) {
                    state.page -= 1;
                    persistState();
                    render();
                }
                return;
            }
            if (e.key === 'ArrowRight') {
                const filtered = applyFilters();
                const pages = Math.ceil(filtered.length / state.perPage);
                if (pages > 1 && state.page < pages) {
                    state.page += 1;
                    persistState();
                    render();
                }
            }
        });
        
        $$('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                $$('.tab-btn').forEach(b => b.classList.remove('active', 'border-blue-600'));
                $$('.tab-content').forEach(c => c.classList.add('hidden'));
                btn.classList.add('active', 'border-blue-600');
                $('tab' + btn.dataset.tab.charAt(0).toUpperCase() + btn.dataset.tab.slice(1)).classList.remove('hidden');
            };
        });

        // Init
        restoreState();
        persistState();
        render();
    </script>
</body>
</html>
